<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>🎬 움직이는 이모티콘 툴</title>
<style>
  :root { color-scheme: dark;
    --ground: #10151c; --ink: #e2e9f0; --soft: #93a3b5;
    --surface: #171f2b; --line: #263140; --accent: #7ea3ec; --warn: #e8a86a; --ok: #7ec98f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; background: var(--ground); color: var(--ink);
         font-family: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Consolas, monospace;
         line-height: 1.7; word-break: keep-all; }
  main { max-width: 900px; margin: 0 auto; padding: 2rem 1rem 6rem; }
  h1 { font-size: 1.3rem; } h1 small { color: var(--soft); font-weight: 400; font-size: .8rem; display: block; }
  section { background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
            padding: 1.1rem 1.2rem; margin: 1rem 0; }
  h2 { font-size: 1rem; margin: 0 0 .6rem; }
  label { display: block; font-size: .8rem; color: var(--soft); margin: .5rem 0 .15rem; }
  input, textarea { width: 100%; background: var(--ground); color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; padding: .5rem .6rem; font: inherit; font-size: .9rem; }
  textarea { min-height: 3.2rem; resize: vertical; }
  .row { display: flex; gap: .6rem; flex-wrap: wrap; align-items: end; }
  .row > div { flex: 1; min-width: 7rem; }
  button { background: var(--accent); color: #0d131c; border: 0; border-radius: 8px;
    padding: .55rem 1rem; font: inherit; font-weight: 700; cursor: pointer; margin-top: .6rem; }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); font-weight: 400; }
  button:disabled { opacity: .45; cursor: wait; }
  .status { font-size: .82rem; color: var(--soft); margin-top: .5rem; white-space: pre-wrap; }
  .status.err { color: var(--warn); }
  .status.ok { color: var(--ok); }
  .frames { display: flex; gap: .35rem; flex-wrap: wrap; margin-top: .6rem; }
  .frames img { width: 56px; height: 56px; object-fit: contain; border: 1px solid var(--line);
    border-radius: 6px; background: repeating-conic-gradient(#1c2530 0% 25%, #10151c 0% 50%) 0 0/12px 12px; }
  #sheet-img, .result img { max-width: 240px; border: 1px solid var(--line); border-radius: 10px; margin-top: .6rem;
    background: repeating-conic-gradient(#1c2530 0% 25%, #10151c 0% 50%) 0 0/16px 16px; }
  .cutlist { display: flex; flex-direction: column; gap: .5rem; }
  .cutitem { display: flex; gap: .7rem; align-items: center; border: 1px solid var(--line);
    border-radius: 10px; padding: .5rem .7rem; }
  .cutitem img { width: 64px; height: 64px; object-fit: contain; }
  .cutitem .meta { flex: 1; font-size: .82rem; color: var(--soft); }
  .cutitem .meta b { color: var(--ink); }
  .cutitem button { margin: 0; padding: .35rem .7rem; font-size: .8rem; }
  a.dl { color: var(--accent); font-size: .85rem; display: inline-block; margin: .4rem 1rem 0 0; }
  .cost { position: fixed; right: .8rem; bottom: .8rem; background: var(--surface); border: 1px solid var(--line);
    border-radius: 999px; padding: .3rem .8rem; font-size: .78rem; color: var(--soft); }
</style>
</head>
<body>
<main>
  <h1>🎬 움직이는 이모티콘 툴
    <small>시트 → 컷(프레임 생성+누끼) → APNG. 호출은 work 마스터 세션으로 <code>/_emoticon/generate</code>를 탄다.
    지금까지의 산출물은 <a href="history/" style="color:var(--accent)">히스토리</a>,
    방법론은 <a href="SKILL.md" style="color:var(--accent)">SKILL.md</a>, 완료 조건은 goal.md.</small>
  </h1>

  <section id="s-sheet">
    <h2>① 캐릭터 시트 <span style="font-weight:400;color:var(--soft);font-size:.8rem">— 모든 생성의 기준. 마음에 들 때까지 다시 뽑기</span></h2>
    <label for="sheet-prompt">캐릭터 설명</label>
    <textarea id="sheet-prompt" placeholder="예: 동그란 흰 토끼, 분홍 볼, 짧은 팔다리"></textarea>
    <div class="row">
      <button id="sheet-gen">시트 생성 ($0.04)</button>
      <button id="sheet-upload" class="ghost">파일 업로드</button>
      <input id="sheet-file" type="file" accept="image/png,image/jpeg" hidden>
    </div>
    <div class="status" id="sheet-status"></div>
    <img id="sheet-img" alt="" hidden>
  </section>

  <section id="s-cut">
    <h2>② 컷 생성 <span style="font-weight:400;color:var(--soft);font-size:.8rem">— 초록 배경으로 생성 후 자동 투명화</span></h2>
    <div class="row">
      <div><label for="cut-id">컷 이름 (영소문자·숫자·하이픈)</label><input id="cut-id" placeholder="hello"></div>
      <div><label for="cut-frames">프레임 수 (2–24)</label><input id="cut-frames" type="number" value="12" min="2" max="24"></div>
      <div><label for="cut-fps">fps</label><input id="cut-fps" type="number" value="12" min="2" max="24"></div>
    </div>
    <label for="cut-motion">동작 설명</label>
    <textarea id="cut-motion" placeholder="예: 두 팔을 들고 신나게 손을 흔들며 인사"></textarea>
    <label for="cut-poses">포즈 스크립트 (선택 — 줄당 1개 = 프레임당 1개, 프레임 간 튐을 크게 줄임)</label>
    <textarea id="cut-poses" placeholder="예:&#10;양팔을 몸 옆에 두고 정면 미소&#10;오른팔을 어깨 높이까지 올림&#10;…(프레임 수만큼)"></textarea>
    <button id="cut-gen">컷 생성</button>
    <div class="status" id="cut-status"></div>
    <div class="frames" id="cut-frames-view"></div>
  </section>

  <section id="s-cuts">
    <h2>③ 저장된 컷 → APNG 빌드</h2>
    <div class="cutlist" id="cutlist"><span class="status">아직 저장된 컷이 없습니다.</span></div>
    <div class="result" id="build-result"></div>
  </section>

  <div class="cost" id="cost">이번 세션 호출 0회 ≈ $0.00</div>
</main>
<script>
"use strict";
/* 파이프라인은 _infra/emoticon.mjs(CLI)와 동일한 알고리즘의 브라우저 포팅이다.
   숫자(크로마키 임계값·패딩·규격)는 CLI와 맞춰 유지한다. */
const MAX_FRAMES = 24, LINE_SIZE = 270, LINE_MAX = 300 * 1024, PAD = 8;
const $ = (id) => document.getElementById(id);
let calls = 0;
const bumpCost = () => { calls++; $("cost").textContent = `이번 세션 호출 ${calls}회 ≈ $${(calls * 0.039).toFixed(2)}`; };

/* ── IndexedDB kv (시트·컷 프레임 보존 — 새로고침으로 과금 낭비 방지) ── */
const db = new Promise((ok, no) => {
  const req = indexedDB.open("emoticon-tool", 1);
  req.onupgradeneeded = () => req.result.createObjectStore("kv");
  req.onsuccess = () => ok(req.result); req.onerror = () => no(req.error);
});
const kv = {
  async get(key) { const d = await db; return new Promise((ok, no) => {
    const r = d.transaction("kv").objectStore("kv").get(key); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); }); },
  async set(key, value) { const d = await db; return new Promise((ok, no) => {
    const t = d.transaction("kv", "readwrite"); t.objectStore("kv").put(value, key); t.oncomplete = ok; t.onerror = () => no(t.error); }); },
  async del(key) { const d = await db; return new Promise((ok, no) => {
    const t = d.transaction("kv", "readwrite"); t.objectStore("kv").delete(key); t.oncomplete = ok; t.onerror = () => no(t.error); }); },
  async keys() { const d = await db; return new Promise((ok, no) => {
    const r = d.transaction("kv").objectStore("kv").getAllKeys(); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); }); },
};

/* ── 생성 API ── */
function b64(bytes) {
  let s = ""; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(s);
}
async function generate(prompt, references = []) {
  const res = await fetch("/_emoticon/generate", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ prompt, references }),
  });
  if (res.status === 401) throw new Error("인증 만료 — work 마스터로 다시 로그인하세요 (/login)");
  if (res.status === 503) throw new Error("서버에 GEMINI_STICKER_KEY 또는 WORK_PASSWORD가 설정되지 않았습니다");
  if (!res.ok) throw new Error(`생성 실패 (${res.status}): ${(await res.text()).slice(0, 2000)}`);
  bumpCost();
  return new Uint8Array(await res.arrayBuffer());
}
// 오류 표시 + 전체 메시지 복사 버튼 (실패 코드를 그대로 전달받기 위함)
function fail(el, message) {
  el.className = "status err";
  el.textContent = message;
  const btn = document.createElement("button");
  btn.textContent = "오류 복사";
  btn.className = "ghost";
  btn.style.cssText = "margin:.3rem 0 0;padding:.15rem .6rem;font-size:.72rem;display:block";
  btn.onclick = () => navigator.clipboard.writeText(message)
    .then(() => { btn.textContent = "복사됨 ✓"; })
    .catch(() => { btn.textContent = "복사 실패 — 직접 드래그"; });
  el.append(btn);
}

/* ── 픽셀 유틸 (CLI와 동일 알고리즘) ── */
async function toImageData(bytes) {
  const bitmap = await createImageBitmap(new Blob([bytes]));
  const canvas = new OffscreenCanvas(bitmap.width, bitmap.height);
  const c = canvas.getContext("2d");
  c.drawImage(bitmap, 0, 0);
  return c.getImageData(0, 0, bitmap.width, bitmap.height);
}
function chromaKeyGreen(img, full = 120, soft = 48) {
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const spill = Math.max(d[i], d[i + 2]);
    const keyness = d[i + 1] - spill;
    if (keyness <= soft) continue;
    d[i + 3] = keyness >= full ? 0 : Math.round((1 - (keyness - soft) / (full - soft)) * d[i + 3]);
    d[i + 1] = spill;
  }
  return img;
}
// 흰 배경 플러드필 누끼 (_infra/sticker-pack.mjs cutoutBackground 포팅)
function cutoutBackground(img, full = 248, soft = 235) {
  const { width, height, data } = img;
  const visited = new Uint8Array(width * height);
  const queue = [];
  for (let x = 0; x < width; x++) queue.push(x, (height - 1) * width + x);
  for (let y = 0; y < height; y++) queue.push(y * width, y * width + width - 1);
  while (queue.length) {
    const p = queue.pop();
    if (visited[p]) continue;
    visited[p] = 1;
    const i = p * 4;
    const whiteness = Math.min(data[i], data[i + 1], data[i + 2]);
    if (whiteness < soft) continue;
    data[i + 3] = whiteness >= full ? 0 : Math.round(((full - whiteness) / (full - soft)) * 255);
    const x = p % width, y = (p / width) | 0;
    if (x > 0) queue.push(p - 1);
    if (x < width - 1) queue.push(p + 1);
    if (y > 0) queue.push(p - width);
    if (y < height - 1) queue.push(p + width);
  }
  return img;
}
// 모서리 색으로 배경 판별: 초록이면 크로마키, 아니면 흰 배경 플러드필 (CLI autoCutout과 동일)
function autoCutout(img) {
  const { width, height, data } = img;
  let r = 0, g = 0, b = 0;
  for (const i of [0, (width - 1) * 4, (height - 1) * width * 4, (width * height - 1) * 4]) {
    r += data[i]; g += data[i + 1]; b += data[i + 2];
  }
  return g / 4 - Math.max(r / 4, b / 4) > 60 ? chromaKeyGreen(img) : cutoutBackground(img);
}
const transparencyRatio = (img) => {
  let t = 0; for (let i = 3; i < img.data.length; i += 4) if (img.data[i] === 0) t++;
  return t / (img.width * img.height);
};
function unionBounds(frames) {
  let l = Infinity, t = Infinity, r = -1, b = -1;
  for (const f of frames) for (let y = 0; y < f.height; y++) for (let x = 0; x < f.width; x++) {
    if (f.data[(y * f.width + x) * 4 + 3] === 0) continue;
    if (x < l) l = x; if (x > r) r = x; if (y < t) t = y; if (y > b) b = y;
  }
  return r < 0 ? null : { l, t, r, b };
}
function fitFrames(frames, size) {
  const bd = unionBounds(frames);
  if (!bd) throw new Error("모든 프레임이 비었습니다 — 크로마키 결과 확인");
  const x = Math.max(0, bd.l - PAD), y = Math.max(0, bd.t - PAD);
  const w = Math.min(frames[0].width - 1, bd.r + PAD) - x + 1;
  const h = Math.min(frames[0].height - 1, bd.b + PAD) - y + 1;
  const scale = Math.min(size / w, size / h);
  const dw = Math.max(1, Math.round(w * scale)), dh = Math.max(1, Math.round(h * scale));
  const ox = (size - dw) >> 1, oy = (size - dh) >> 1;
  return frames.map((f) => {
    const src = new OffscreenCanvas(f.width, f.height);
    src.getContext("2d").putImageData(f, 0, 0);
    const dst = new OffscreenCanvas(size, size);
    const c = dst.getContext("2d");
    c.imageSmoothingQuality = "high";
    c.drawImage(src, x, y, w, h, ox, oy, dw, dh);
    return c.getImageData(0, 0, size, size);
  });
}
function loopDiff(a, b) {
  let sum = 0, n = 0;
  for (let i = 0; i < a.data.length; i += 4) {
    if (a.data[i + 3] === 0 && b.data[i + 3] === 0) continue;
    n++; for (let c = 0; c < 4; c++) sum += Math.abs(a.data[i + c] - b.data[i + c]);
  }
  return n ? sum / (n * 4 * 255) : 0;
}

/* ── APNG 인코더 (_infra/apng.mjs 포팅 — CompressionStream deflate) ── */
const CRC_TABLE = new Uint32Array(256).map((_, n) => {
  let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; return c >>> 0;
});
function crc32(...bufs) {
  let c = 0xffffffff;
  for (const buf of bufs) for (const byte of buf) c = CRC_TABLE[(c ^ byte) & 0xff] ^ (c >>> 8);
  return (c ^ 0xffffffff) >>> 0;
}
function chunk(type, data) {
  const out = new Uint8Array(12 + data.length);
  const v = new DataView(out.buffer);
  v.setUint32(0, data.length);
  for (let i = 0; i < 4; i++) out[4 + i] = type.charCodeAt(i);
  out.set(data, 8);
  v.setUint32(8 + data.length, crc32(out.subarray(4, 8), data));
  return out;
}
async function deflate(bytes) {
  const stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate"));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
const paeth = (a, b, c) => {
  const p = a + b - c, pa = Math.abs(p - a), pb = Math.abs(p - b), pc = Math.abs(p - c);
  return pa <= pb && pa <= pc ? a : pb <= pc ? b : c;
};
function filterFrame({ width, height, data }) {
  const stride = width * 4;
  const raw = new Uint8Array((stride + 1) * height);
  for (let y = 0; y < height; y++) {
    raw[y * (stride + 1)] = 4;
    const out = y * (stride + 1) + 1, cur = y * stride, prev = cur - stride;
    for (let x = 0; x < stride; x++) {
      const a = x >= 4 ? data[cur + x - 4] : 0;
      const b = y > 0 ? data[prev + x] : 0;
      const c = y > 0 && x >= 4 ? data[prev + x - 4] : 0;
      raw[out + x] = (data[cur + x] - paeth(a, b, c)) & 0xff;
    }
  }
  return raw;
}
async function encodeApng(frames, fps, loops = 0) {
  const { width, height } = frames[0];
  const delay = Math.max(1, Math.round(1000 / fps));
  const ihdr = new Uint8Array(13);
  new DataView(ihdr.buffer).setUint32(0, width);
  new DataView(ihdr.buffer).setUint32(4, height);
  ihdr[8] = 8; ihdr[9] = 6;
  const actl = new Uint8Array(8);
  new DataView(actl.buffer).setUint32(0, frames.length);
  new DataView(actl.buffer).setUint32(4, loops);
  let seq = 0;
  const fctl = () => {
    const f = new Uint8Array(26); const v = new DataView(f.buffer);
    v.setUint32(0, seq++); v.setUint32(4, width); v.setUint32(8, height);
    v.setUint16(20, delay); v.setUint16(22, 1000);
    return f;
  };
  const parts = [new Uint8Array([0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a]), chunk("IHDR", ihdr), chunk("acTL", actl)];
  for (const [i, frame] of frames.entries()) {
    parts.push(chunk("fcTL", fctl()));
    const z = await deflate(filterFrame(frame));
    if (i === 0) parts.push(chunk("IDAT", z));
    else {
      const fdat = new Uint8Array(4 + z.length);
      new DataView(fdat.buffer).setUint32(0, seq++);
      fdat.set(z, 4);
      parts.push(chunk("fdAT", fdat));
    }
  }
  parts.push(chunk("IEND", new Uint8Array(0)));
  return new Blob(parts, { type: "image/png" });
}
async function pngBlob(img) {
  const canvas = new OffscreenCanvas(img.width, img.height);
  canvas.getContext("2d").putImageData(img, 0, 0);
  return canvas.convertToBlob({ type: "image/png" });
}

/* ── 프롬프트 (CLI _infra/emoticon.mjs와 동일 — 함께 다듬는다)
   지시 골격은 영어(지시 추종이 더 정확), 사용자 입력 문장은 그대로 삽입 ── */
const SHEET_PROMPT = (desc) =>
  `Draw a character reference sheet for a sticker/emoticon character. Character: ${desc}\n` +
  "Layout: one large full-body front view + smaller side and back views + 4 key expressions (happy / sad / angry / surprised).\n" +
  "Style: flat sticker illustration with clean thick outlines, pure white background, no text.\n" +
  "This sheet is the reference for all future frames, so colors, proportions and accessories must be clear and consistent.";
const FRAME_PROMPT = (motion, index, total, pose = "") =>
  `The attached images are this character's reference sheet (first image) and previous frames. ` +
  `Draw frame ${index}/${total} of a ${total}-frame looping animation of this exact same character ` +
  `(same colors, proportions, accessories) performing: ${motion}.\n` +
  (pose ? `Pose for this frame (follow exactly): ${pose}\n` : "") +
  "Rules: the last frame must flow naturally back into the first frame. " +
  "Keep the character centered at the same size and position, moving only slightly from the previous frame. " +
  "Pure solid white background; outlines must be fully closed. No shadows, props, or text.";

/* ── ① 시트 ── */
async function setSheet(bytes, prompt) {
  await kv.set("sheet", { bytes, prompt });
  $("sheet-img").src = URL.createObjectURL(new Blob([bytes]));
  $("sheet-img").hidden = false;
}
$("sheet-gen").onclick = async () => {
  const prompt = $("sheet-prompt").value.trim();
  const st = $("sheet-status");
  if (!prompt) { st.textContent = "캐릭터 설명을 입력하세요"; st.className = "status err"; return; }
  $("sheet-gen").disabled = true; st.className = "status"; st.textContent = "시트 생성 중…";
  try {
    const bytes = await generate(SHEET_PROMPT(prompt));
    await setSheet(bytes, prompt);
    st.textContent = "완료 — 마음에 안 들면 설명을 다듬어 다시 생성하세요 (기존 컷과의 일관성은 시트 교체 시 깨짐)";
    st.className = "status ok";
  } catch (e) { fail(st, e.message); }
  $("sheet-gen").disabled = false;
};
$("sheet-upload").onclick = () => $("sheet-file").click();
$("sheet-file").onchange = async () => {
  const file = $("sheet-file").files[0];
  if (!file) return;
  await setSheet(new Uint8Array(await file.arrayBuffer()), "(업로드)");
  $("sheet-status").textContent = "업로드한 시트를 사용합니다";
  $("sheet-status").className = "status ok";
};

/* ── ② 컷 생성 ── */
$("cut-gen").onclick = async () => {
  const id = $("cut-id").value.trim();
  const motion = $("cut-motion").value.trim();
  const total = Number($("cut-frames").value);
  const fps = Number($("cut-fps").value);
  const st = $("cut-status");
  const view = $("cut-frames-view");
  st.className = "status";
  try {
    if (!/^[a-z0-9][a-z0-9-]*$/.test(id)) throw new Error("컷 이름은 영소문자·숫자·하이픈만");
    if (!motion) throw new Error("동작 설명을 입력하세요");
    if (!Number.isInteger(total) || total < 2 || total > MAX_FRAMES) throw new Error(`프레임 수는 2~${MAX_FRAMES}`);
    const poses = $("cut-poses").value.split("\n").map((l) => l.trim()).filter(Boolean);
    if (poses.length && poses.length !== total) throw new Error(`포즈 스크립트는 프레임 수와 같아야 합니다 (${poses.length}줄 ≠ ${total})`);
    const sheet = await kv.get("sheet");
    if (!sheet) throw new Error("먼저 ① 캐릭터 시트를 준비하세요");
    $("cut-gen").disabled = true;
    view.innerHTML = "";
    const sheetB64 = b64(sheet.bytes);
    const rawB64 = [];
    const keyedBlobs = [];
    for (let i = 1; i <= total; i++) {
      st.textContent = `프레임 ${i}/${total} 생성 중… (예상 잔여 비용 $${((total - i + 1) * 0.039).toFixed(2)})`;
      const refs = [sheetB64, ...(rawB64.length ? [rawB64[0]] : []), ...(rawB64.length > 1 ? [rawB64[rawB64.length - 1]] : [])];
      const bytes = await generate(FRAME_PROMPT(motion, i, total, poses[i - 1] ?? ""), refs);
      const keyed = autoCutout(await toImageData(bytes));
      const ratio = transparencyRatio(keyed);
      if (ratio < 0.05) throw new Error(`프레임 ${i} 누끼 실패(투명 ${Math.round(ratio * 100)}%) — 다시 생성하세요`);
      rawB64.push(b64(bytes));
      const blob = await pngBlob(keyed);
      keyedBlobs.push(blob);
      const img = document.createElement("img");
      img.src = URL.createObjectURL(blob);
      view.append(img);
    }
    await kv.set(`cut:${id}`, { motion, fps, frames: keyedBlobs });
    st.textContent = `완료 — ③에서 APNG로 구우세요`;
    st.className = "status ok";
    renderCuts();
  } catch (e) { fail(st, e.message); }
  $("cut-gen").disabled = false;
};

/* ── ③ 컷 목록 + 빌드 ── */
async function renderCuts() {
  const keys = (await kv.keys()).filter((k) => String(k).startsWith("cut:"));
  const list = $("cutlist");
  list.innerHTML = "";
  if (!keys.length) { list.innerHTML = '<span class="status">아직 저장된 컷이 없습니다.</span>'; return; }
  for (const key of keys) {
    const id = String(key).slice(4);
    const cut = await kv.get(key);
    const item = document.createElement("div");
    item.className = "cutitem";
    const thumb = document.createElement("img");
    thumb.src = URL.createObjectURL(cut.frames[0]);
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.innerHTML = `<b>${id}</b> — ${cut.motion}<br>${cut.frames.length}프레임 @${cut.fps}fps`;
    const build = document.createElement("button");
    build.textContent = "APNG 굽기";
    build.onclick = () => buildCut(id, cut, build);
    const del = document.createElement("button");
    del.textContent = "삭제"; del.className = "ghost";
    del.onclick = async () => { await kv.del(key); renderCuts(); };
    item.append(thumb, meta, build, del);
    list.append(item);
  }
}
async function buildCut(id, cut, button) {
  const out = $("build-result");
  button.disabled = true;
  out.innerHTML = `<div class="status">${id} 굽는 중…</div>`;
  try {
    const frames = [];
    for (const blob of cut.frames) frames.push(await toImageData(new Uint8Array(await blob.arrayBuffer())));
    const fitted = fitFrames(frames, 360);
    const master = await encodeApng(fitted, cut.fps, 0);
    const diff = loopDiff(fitted[0], fitted[fitted.length - 1]);
    let html = "";
    const masterUrl = URL.createObjectURL(master);
    html += `<div class="status ${diff > 0.12 ? "err" : "ok"}">360² · ${frames.length}프레임 · ${(master.size / 1024).toFixed(0)}KB · 루프 diff ${(diff * 100).toFixed(1)}%${diff > 0.12 ? " ⚠ 루프 확인" : ""}</div>`;
    html += `<img src="${masterUrl}" alt="${id}">`;
    html += `<br><a class="dl" href="${masterUrl}" download="${id}.png">${id}.png (카카오·duri 360²)</a>`;
    if (frames.length >= 5 && frames.length <= 20) {
      const line = await encodeApng(fitFrames(frames, LINE_SIZE), cut.fps, 4);
      const ok = line.size <= LINE_MAX;
      html += `<a class="dl" href="${URL.createObjectURL(line)}" download="${id}-line.png">${id}-line.png (LINE 270², ${(line.size / 1024).toFixed(0)}KB${ok ? " ✓" : " ⚠ 300KB 초과"})</a>`;
    } else {
      html += `<span class="status">LINE 변환은 5~20프레임에서만 (현재 ${frames.length})</span>`;
    }
    out.innerHTML = html;
  } catch (e) {
    out.innerHTML = "";
    const div = document.createElement("div");
    out.append(div);
    fail(div, e.message);
  }
  button.disabled = false;
}

/* ── 복원 ── */
(async () => {
  const sheet = await kv.get("sheet");
  if (sheet) {
    $("sheet-img").src = URL.createObjectURL(new Blob([sheet.bytes]));
    $("sheet-img").hidden = false;
    if (sheet.prompt && sheet.prompt !== "(업로드)") $("sheet-prompt").value = sheet.prompt;
  }
  renderCuts();
})();
</script>
