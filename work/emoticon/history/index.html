<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>🎬 이모티콘 히스토리</title>
<style>
  :root { color-scheme: dark;
    --ground: #10151c; --ink: #e2e9f0; --soft: #93a3b5;
    --surface: #171f2b; --line: #263140; --accent: #7ea3ec; --warn: #e8a86a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; background: var(--ground); color: var(--ink);
         font-family: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Consolas, monospace;
         line-height: 1.7; word-break: keep-all; }
  main { max-width: 980px; margin: 0 auto; padding: 2rem 1rem 5rem; }
  h1 { font-size: 1.3rem; } h1 small { color: var(--soft); font-weight: 400; font-size: .8rem; display: block; }
  h1 a { color: var(--accent); }
  section { background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
            padding: 1.1rem 1.2rem; margin: 1rem 0; }
  h2 { font-size: 1.05rem; margin: 0 0 .3rem; }
  .prompt { font-size: .8rem; color: var(--soft); margin: 0 0 .8rem; }
  .sheet { max-width: 260px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
  .cut { border-top: 1px dashed var(--line); margin-top: 1rem; padding-top: 1rem; }
  .cut h3 { font-size: .95rem; margin: 0 0 .4rem; }
  .cut .meta { font-size: .8rem; color: var(--soft); margin: 0 0 .6rem; }
  .media { display: flex; gap: .9rem; flex-wrap: wrap; align-items: flex-start; }
  .media figure { margin: 0; }
  .media figcaption { font-size: .72rem; color: var(--soft); margin-top: .25rem; }
  .media img.apng { width: 180px; height: 180px; border: 1px solid var(--line); border-radius: 10px;
    background: repeating-conic-gradient(#1c2530 0% 25%, #10151c 0% 50%) 0 0/16px 16px; }
  .media a.grid img { max-width: 420px; width: 100%; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
  details { font-size: .8rem; color: var(--soft); margin-top: .4rem; }
  details ol { margin: .3rem 0 0 1.2rem; padding: 0; }
  .status { color: var(--soft); font-size: .85rem; }
  .status.err { color: var(--warn); }
  .gate { font-size: .72rem; border: 1px solid var(--line); border-radius: 999px;
          padding: .05rem .5rem; margin-left: .4rem; vertical-align: middle; }
  .gate.pass { color: #7fd6a2; border-color: #2f5c44; }
  .gate.review { color: var(--warn); border-color: #5c4a2f; }
  .gate.fail { color: #e88a8a; border-color: #5c3333; }
  .gate.none { color: var(--soft); }
  details.rest > summary { cursor: pointer; color: var(--accent); font-size: .85rem;
                           padding: .5rem 0; margin-top: .6rem; border-top: 1px dashed var(--line); }
  .band { border: 1px solid #5c4a2f; border-radius: 10px; padding: .2rem .8rem .8rem;
          margin: .8rem 0 1.2rem; background: rgba(200, 150, 60, .06); }
  .bandtitle { color: var(--warn); font-size: .9rem; margin: .7rem 0 .2rem; }
  .bandtitle small { color: var(--soft); font-weight: 400; font-size: .78rem; }
  .fb { border-top: 1px dashed var(--line); margin-top: .7rem; padding-top: .6rem; }
  .fb ul { list-style: none; padding: 0; margin: 0 0 .5rem; }
  .fb li { font-size: .85rem; padding: .35rem .5rem; border-left: 3px solid var(--line);
           margin-bottom: .35rem; background: rgba(128,128,128,.08); border-radius: 0 6px 6px 0; }
  .fb li select.v { font: inherit; font-size: .78rem; font-weight: 700; margin-right: .4rem;
                    background: rgba(128,128,128,.12); border: 1px solid var(--line);
                    border-radius: 5px; padding: 0 .2rem; cursor: pointer; }
  .fb li .when { color: var(--soft); font-size: .74rem; margin-left: .35rem; }
  .fb li button { float: right; background: none; border: 0; color: var(--soft); cursor: pointer; font-size: .8rem; }
  .v-good { color: #7fd6a2; } .v-revise { color: var(--warn); }
  .v-reject { color: #e88a8a; } .v-note { color: var(--accent); }
  .fb form { display: flex; gap: .4rem; flex-wrap: wrap; align-items: flex-start; }
  .fb select, .fb textarea, .fb button[type=submit] {
    font: inherit; font-size: .85rem; background: rgba(128,128,128,.1);
    color: inherit; border: 1px solid var(--line); border-radius: 6px; padding: .35rem .5rem; }
  .fb textarea { flex: 1 1 14rem; min-height: 2.2rem; max-height: 40vh; resize: vertical;
                 overflow-y: hidden; line-height: 1.5; }
  .fb button[type=submit] { cursor: pointer; }
  .fb .say { font-size: .78rem; color: var(--soft); margin: .3rem 0 0; }
  .fb .say.err { color: var(--warn); }
</style>
</head>
<body>
<main>
  <h1>🎬 이모티콘 히스토리
    <small><b>사람 검수가 필요한 컷이 맨 위</b>, 그 아래는 게이트 성적순 상위 3개만 펼칩니다 (빌드 시점의 <code>_src/emoticon</code> 스냅샷) — <a href="/emoticon/">← 생성 툴로</a><br>공유·전달은 <b>GIF</b>를 쓰세요. APNG는 첫 프레임이 평범한 PNG라 메신저가 재인코딩하면 정지 이미지가 됩니다.</small>
  </h1>
  <div id="list"><p class="status">불러오는 중…</p></div>
</main>
<script>
"use strict";
(async () => {
  const list = document.getElementById("list");
  let manifest;
  try {
    const res = await fetch("manifest.json");
    if (!res.ok) throw new Error(`manifest.json ${res.status}`);
    manifest = await res.json();
  } catch (e) {
    list.innerHTML = `<p class="status err">히스토리를 불러오지 못했습니다: ${e.message}</p>`;
    return;
  }
  if (!manifest.characters?.length) {
    list.innerHTML = '<p class="status">아직 생성된 산출물이 없습니다.</p>';
    return;
  }
  // 게이트 성적순: pass → review → fail → 판정 없음. 동급이면 hard·soft가 적은
  // 쪽, 그다음 최신순. 상위 TOP개만 펼치고 나머지는 <details>로 접는다.
  const TOP = 3;
  const RANK = { pass: 0, review: 1, fail: 2 };
  const score = (c) => [
    c.gate ? RANK[c.gate.verdict] ?? 3 : 3,
    c.gate ? c.gate.hard : 99,
    c.gate ? c.gate.soft : 99,
  ];
  const byGate = (a, b) => {
    const [sa, sb] = [score(a), score(b)];
    for (let i = 0; i < sa.length; i++) if (sa[i] !== sb[i]) return sa[i] - sb[i];
    return String(b.createdAt ?? "").localeCompare(String(a.createdAt ?? "")) || a.id.localeCompare(b.id);
  };

  const pct = (v) => (typeof v === "number" ? `${(v * 100).toFixed(1)}%` : "—");
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // 컷별 검수 댓글. 읽기는 공개, 쓰기는 work 마스터 세션(이 페이지가 이미 그 뒤).
  const VERDICTS = { good: "좋음", revise: "수정 필요", reject: "불합격", note: "메모" };
  let reviews = [];
  try {
    const res = await fetch("/_emoticon/review", { headers: { Accept: "application/json" } });
    if (res.ok) reviews = (await res.json()).items ?? [];
  } catch { /* 댓글은 없어도 히스토리는 보여준다 */ }
  const reviewsOf = (ch, cut) => reviews.filter((r) => r.character === ch && r.cut === cut);

  function renderFeedback(chId, cut) {
    const box = document.createElement("div");
    box.className = "fb";
    const mine = reviewsOf(chId, cut.id);
    box.innerHTML = `
      <ul>${mine.map((r) => `<li data-id="${r.id}"><button title="삭제">✕</button>`
        + `<select class="v v-${r.verdict}" title="판정 바꾸기">${Object.entries(VERDICTS)
            .map(([k, v]) => `<option value="${k}"${k === r.verdict ? " selected" : ""}>${v}</option>`).join("")}</select>`
        + `${esc(r.note)}<span class="when">${esc((r.at ?? "").slice(0, 16).replace("T", " "))}`
        + `${r.editedAt ? " (수정됨)" : ""}</span></li>`).join("")}</ul>
      <form>
        <select name="verdict">${Object.entries(VERDICTS)
          .map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select>
        <textarea name="note" rows="1" placeholder="이 컷에 대한 피드백 (예: 귀가 세 개, 끄덕임이 아니라 갸우뚱)"></textarea>
        <button type="submit">남기기</button>
      </form>
      <p class="say"></p>`;

    const say = box.querySelector(".say");
    const post = async (body, action = "") => {
      const res = await fetch(`/_emoticon/review${action}`, {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
      });
      if (!res.ok) throw new Error(`${res.status} ${(await res.text()).slice(0, 120)}`);
      return res.json();
    };

    // 줄이 늘면 입력창도 같이 자란다 (scrollHeight로 재측정 — 먼저 높이를 비워야
    // 줄어들 때도 따라온다). max-height를 넘으면 그때부터 스크롤.
    const note = box.querySelector("textarea");
    const grow = () => {
      note.style.height = "auto";
      note.style.height = `${note.scrollHeight}px`;
      note.style.overflowY = note.scrollHeight > window.innerHeight * 0.4 ? "auto" : "hidden";
    };
    note.addEventListener("input", grow);

    box.querySelector("form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const form = event.target;
      const note = form.note.value.trim();
      say.className = "say"; say.textContent = "저장 중…";
      try {
        const { item } = await post({ character: chId, cut: cut.id, verdict: form.verdict.value, note });
        reviews.unshift(item);
        box.replaceWith(renderFeedback(chId, cut));
      } catch (error) {
        say.className = "say err";
        say.textContent = `저장 실패: ${error.message}`;
      }
    });

    // 판정만 바꾸기 — 다시 보면 판단이 달라진다. 메모와 남긴 시각은 그대로 둔다.
    box.querySelectorAll("li select").forEach((select) => {
      select.addEventListener("change", async () => {
        const id = select.closest("li").dataset.id;
        const previous = reviews.find((r) => r.id === id)?.verdict;
        say.className = "say"; say.textContent = "판정 저장 중…";
        try {
          const { item } = await post({ id, verdict: select.value }, "?action=verdict");
          reviews = reviews.map((r) => (r.id === id ? item : r));
          box.replaceWith(renderFeedback(chId, cut));
        } catch (error) {
          select.value = previous ?? select.value;
          say.className = "say err";
          say.textContent = `판정 저장 실패: ${error.message}`;
        }
      });
    });

    box.querySelectorAll("li button").forEach((button) => {
      button.addEventListener("click", async () => {
        const id = button.closest("li").dataset.id;
        try {
          await post({ id }, "?action=delete");
          reviews = reviews.filter((r) => r.id !== id);
          box.replaceWith(renderFeedback(chId, cut));
        } catch (error) {
          say.className = "say err";
          say.textContent = `삭제 실패: ${error.message}`;
        }
      });
    });
    return box;
  }

  function renderCut(cut, chId) {
    const div = document.createElement("div");
    div.className = "cut";
    const meta = [
      cut.motion,
      cut.frameCount ? `${cut.frameCount}프레임` : null,
      cut.fps ? `@${cut.fps}fps` : null,
      cut.gate ? `드리프트 ${pct(cut.gate.drift)} · 움직임 ${pct(cut.gate.motion)}` : null,
      cut.provider, cut.createdAt,
    ].filter(Boolean).join(" · ");
    const g = cut.gate;
    const badge = g
      ? `<span class="gate ${g.verdict}">${{ pass: "✓ PASS", review: "△ REVIEW", fail: "✗ FAIL" }[g.verdict]}${g.hard ? ` ·${g.hard}` : ""}</span>`
      : '<span class="gate none">판정 없음</span>';
    div.innerHTML = `
        <h3>${cut.id}${badge}</h3>
        <p class="meta">${meta}</p>
        <div class="media">
          ${cut.apng ? `<figure><img class="apng" src="${cut.apng}" alt="${cut.id} APNG"><figcaption><a href="${cut.apng}" download style="color:inherit">${cut.id}.png (APNG)</a>${cut.gif ? ` · <a href="${cut.gif}" download style="color:inherit"><b>GIF (공유용)</b></a>` : ""}${cut.line ? ` · <a href="${cut.line}" download style="color:inherit">LINE</a>` : ""}</figcaption></figure>` : ""}
          ${cut.grid ? `<a class="grid" href="${cut.grid}" target="_blank" rel="noopener"><img src="${cut.grid}" alt="${cut.id} 프레임 그리드" loading="lazy"></a>` : ""}
        </div>
        ${Array.isArray(cut.poses) && cut.poses.length ? `<details><summary>포즈 스크립트 (${cut.poses.length})</summary><ol>${cut.poses.map((p) => `<li>${p}</li>`).join("")}</ol></details>` : ""}
      `;
    div.append(renderFeedback(chId, cut));
    return div;
  }

  list.innerHTML = "";
  for (const ch of manifest.characters) {
    const section = document.createElement("section");
    const cuts = [...ch.cuts].sort(byGate);
    // 사람 검수가 필요한 컷을 맨 위로. △ REVIEW는 자동 게이트가 판정을 못 내린
    // 것이라 정의상 사람이 봐야 하고, 판정 없는 옛 컷도 같이 올린다. 최신순.
    // 검수 대기 = 아직 댓글이 없는 컷. 자동 게이트가 PASS를 줘도 사람 눈은
    // 따로 필요하다 — nod2(귀 3개)·nod7(갸우뚱) 둘 다 PASS였다 (§31).
    const needsReview = cuts
      .filter((c) => reviewsOf(ch.id, c.id).length === 0)
      .sort((a, b) => String(b.createdAt ?? "").localeCompare(String(a.createdAt ?? "")) || a.id.localeCompare(b.id));
    const pinned = new Set(needsReview.map((c) => c.id));
    section.innerHTML = `
      <h2>${ch.id}</h2>
      ${ch.sheetPrompt ? `<p class="prompt">시트 프롬프트: ${ch.sheetPrompt}</p>` : ""}
      ${ch.sheet ? `<img class="sheet" src="${ch.sheet}" alt="${ch.id} 캐릭터 시트">` : '<p class="status">시트 없음</p>'}
    `;
    if (needsReview.length) {
      const band = document.createElement("div");
      band.className = "band";
      band.innerHTML = `<h3 class="bandtitle">사람 검수 필요 · ${needsReview.length}개`
        + ` <small>아직 댓글이 없는 컷 — 최신순. 댓글을 남기면 아래로 내려갑니다</small></h3>`;
      for (const cut of needsReview) band.append(renderCut(cut, ch.id));
      section.append(band);
    }
    // 검수 대기 컷은 이미 위에 있으니 상위 3개에서는 뺀다
    const ranked = cuts.filter((c) => !pinned.has(c.id));
    for (const cut of ranked.slice(0, TOP)) section.append(renderCut(cut, ch.id));
    const rest = ranked.slice(TOP);
    if (rest.length) {
      const details = document.createElement("details");
      details.className = "rest";
      const summary = document.createElement("summary");
      summary.textContent = `나머지 ${rest.length}개 펼치기 (게이트 성적순)`;
      details.append(summary);
      for (const cut of rest) details.append(renderCut(cut, ch.id));
      section.append(details);
    }
    list.append(section);
  }
})();
</script>
</body>
</html>
