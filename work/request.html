<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>신규 의뢰 — bubblelab works</title>
<style>
  :root { color-scheme: dark;
    --ground: light-dark(#fafbfc, #10151c);
    --ink: light-dark(#1c2733, #e2e9f0);
    --soft: light-dark(#5d6b7a, #93a3b5);
    --surface: light-dark(#fff, #171f2b);
    --line: light-dark(#e3e8ee, #263140);
    --bubble: light-dark(#4f7fdd, #7ea3ec);
    --bubble-ink: light-dark(#fff, #0d131c);
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100dvh; display: flex; flex-direction: column;
         background: var(--ground); color: var(--ink);
         font-family: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Consolas, monospace;
         line-height: 1.7; word-break: keep-all; }

  header { flex: none; display: flex; align-items: center; gap: .8rem;
           padding: .7rem 1.1rem; border-bottom: 1px solid var(--line);
           background: color-mix(in srgb, var(--ground) 88%, transparent); }
  header a.back { text-decoration: none; color: var(--soft); font-size: 1.1rem; }
  header .title { font-weight: 700; font-size: .92rem; }
  header .sub { margin-left: auto; font-size: .72rem; color: var(--soft); }

  .chat { flex: 1; overflow-y: auto; padding: 1.2rem 1.1rem 1rem; }
  .chat .inner { max-width: 34rem; margin: 0 auto; display: flex; flex-direction: column; gap: .55rem; }
  .msg { max-width: 85%; padding: .65rem .9rem; border-radius: 1rem; font-size: .88rem;
         white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.bot { align-self: flex-start; background: var(--surface); border: 1px solid var(--line);
             border-bottom-left-radius: .3rem; }
  .msg.bot .q { color: var(--bubble); font-weight: 700; font-size: .7rem; letter-spacing: .1em;
                display: block; margin-bottom: .15rem; }
  .msg.me { align-self: flex-end; background: var(--bubble); color: var(--bubble-ink);
            border-bottom-right-radius: .3rem; }
  .typing { align-self: flex-start; padding: .7rem .95rem; }
  .typing i { display: inline-block; width: .32rem; height: .32rem; margin: 0 .08rem;
              border-radius: 50%; background: var(--soft); animation: b 1.1s infinite; }
  .typing i:nth-child(2) { animation-delay: .18s; } .typing i:nth-child(3) { animation-delay: .36s; }
  @keyframes b { 0%,60%,100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-.22rem); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .typing i { animation: none; } }

  .chips { align-self: flex-start; display: flex; flex-wrap: wrap; gap: .45rem; padding: .15rem 0 .3rem; }
  .chips button { font: inherit; font-size: .82rem; padding: .5rem .95rem; border-radius: 2rem;
                  border: 1px solid var(--bubble); background: none; color: var(--bubble); cursor: pointer; }
  .chips button:hover { background: var(--bubble); color: var(--bubble-ink); }
  .chips button.primary { background: var(--bubble); color: var(--bubble-ink); font-weight: 700; }

  form.bar { flex: none; display: flex; gap: .6rem; padding: .8rem 1.1rem calc(.8rem + env(safe-area-inset-bottom));
             border-top: 1px solid var(--line); }
  form.bar .inner { display: flex; gap: .6rem; width: 100%; max-width: 34rem; margin: 0 auto; }
  form.bar input { flex: 1; min-width: 0; font: inherit; color: inherit; padding: .7rem .9rem;
                   border-radius: .7rem; border: 1px solid var(--line); background: var(--surface); }
  form.bar input:focus { outline: 1px solid var(--bubble); }
  form.bar button { font: inherit; font-weight: 700; padding: .7rem 1.1rem; border: 0;
                    border-radius: .7rem; background: var(--bubble); color: var(--bubble-ink); cursor: pointer; }
  form.bar button:disabled, form.bar input:disabled { opacity: .45; }
</style>
</head>
<body>
<header>
  <a class="back" href="./" aria-label="홈으로">←</a>
  <span class="title">신규 의뢰</span>
  <span class="sub" id="progress"></span>
</header>

<div class="chat" id="chat"><div class="inner" id="log" aria-live="polite"></div></div>

<form class="bar" id="bar">
  <div class="inner">
    <input id="input" autocomplete="off" maxlength="450" placeholder="메시지 입력…" aria-label="답변 입력" disabled>
    <button id="send" type="submit" disabled>보내기</button>
  </div>
</form>

<script>
(function(){
  var log = document.getElementById('log');
  var chat = document.getElementById('chat');
  var input = document.getElementById('input');
  var send = document.getElementById('send');
  var bar = document.getElementById('bar');
  var progress = document.getElementById('progress');
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  var answers = { what: '', when: '', budget: '', note: '', name: '', contact: '' };

  function scrollDown(){ chat.scrollTop = chat.scrollHeight; }
  function addMe(text){
    var el = document.createElement('div');
    el.className = 'msg me'; el.textContent = text;
    log.appendChild(el); scrollDown();
  }
  function addBot(text, tag){
    return new Promise(function(done){
      var typing = document.createElement('div');
      typing.className = 'typing'; typing.innerHTML = '<i></i><i></i><i></i>';
      log.appendChild(typing); scrollDown();
      setTimeout(function(){
        typing.remove();
        var el = document.createElement('div');
        el.className = 'msg bot';
        if(tag){ var q = document.createElement('span'); q.className = 'q'; q.textContent = tag; el.appendChild(q); }
        el.appendChild(document.createTextNode(text));
        log.appendChild(el); scrollDown(); done();
      }, reduce ? 0 : 500 + Math.min(650, text.length * 12));
    });
  }
  function clearChips(){
    Array.prototype.forEach.call(document.querySelectorAll('.chips'), function(c){ c.remove(); });
  }
  function addChips(items){ // {label, value, primary}
    return new Promise(function(pick){
      var wrap = document.createElement('div'); wrap.className = 'chips';
      items.forEach(function(item){
        var b = document.createElement('button');
        b.type = 'button'; b.textContent = item.label;
        if(item.primary) b.className = 'primary';
        b.addEventListener('click', function(){ wrap.remove(); pick(item); });
        wrap.appendChild(b);
      });
      log.appendChild(wrap); scrollDown();
    });
  }
  function ask(placeholder, allowEmpty, max){
    return new Promise(function(answer){
      input.disabled = false; send.disabled = false;
      input.maxLength = max || 450;
      input.placeholder = placeholder; input.value = '';
      input.focus();
      bar.onsubmit = function(e){
        e.preventDefault();
        var v = input.value.trim();
        if(!v && !allowEmpty) return;
        input.disabled = true; send.disabled = true; bar.onsubmit = null;
        input.placeholder = '메시지 입력…';
        if(v) addMe(v);
        answer(v);
      };
    });
  }
  function lockInput(){
    input.disabled = true; send.disabled = true; bar.onsubmit = null;
    input.placeholder = '메시지 입력…';
  }
  function step(n){ progress.textContent = n; }

  async function run(){
    await addBot('안녕하세요, bubblelab works입니다. 세 가지만 여쭤보면 접수가 끝나요 — 편하게 답해주세요.');

    step('1 / 3');
    await addBot('어떤 것을 만들고 싶으세요? 한두 문장이면 충분합니다.\n(예: "우리 브랜드 소개 랜딩페이지가 필요해요")', 'Q1 · 무엇을');
    answers.what = await ask('만들고 싶은 것을 적어주세요', false, 450);

    step('2 / 3');
    await addBot('언제까지 필요하세요?', 'Q2 · 일정');
    var when = await addChips([
      { label: '여유 있어요', value: '여유 있음' },
      { label: '1개월 안', value: '1개월 안' },
      { label: '2주 안', value: '2주 안 (급함)' },
      { label: '직접 입력', value: null },
    ]);
    if(when.value === null){ answers.when = await ask('희망 일정을 적어주세요 (예: 9월 초 오픈)', false, 60); }
    else { addMe(when.label); answers.when = when.value; }

    step('3 / 3');
    await addBot('생각하시는 예산 규모가 있을까요? 미정이어도 괜찮습니다 — 규모에 맞는 안을 제안드리는 용도예요.', 'Q3 · 예산');
    var budget = await addChips([
      { label: '아직 미정', value: '미정' },
      { label: '~100만원', value: '~100만원' },
      { label: '100~300만원', value: '100~300만원' },
      { label: '300만원 이상', value: '300만원 이상' },
      { label: '직접 입력', value: null },
    ]);
    if(budget.value === null){ answers.budget = await ask('예산 범위를 적어주세요', false, 60); }
    else { addMe(budget.label); answers.budget = budget.value; }

    step('마무리');
    await addBot('세 가지 끝! 이제 회신받을 곳만 남았어요. 어떻게 불러드리면 될까요? (성함 또는 호칭)');
    answers.name = await ask('예: 홍길동', false, 20);

    await addBot('회신받으실 연락처를 남겨주세요. 이메일·전화·인스타 어느 것이든 좋습니다.');
    answers.contact = await ask('예: hello@example.com', false, 80);

    await addBot('마지막으로, 기타 하고 싶은 말이 있다면 남겨주세요. (참고 링크, 원하는 분위기 등)', '+ 하고 싶은 말');
    var skipped = false;
    var noteResult = await Promise.race([
      addChips([{ label: '건너뛰기', value: '__skip__' }]).then(function(){ skipped = true; return ''; }),
      ask('하고 싶은 말 (선택)', true, 200),
    ]);
    if(skipped){ addMe('건너뛰기'); lockInput(); }
    else { clearChips(); }
    answers.note = skipped ? '' : noteResult;

    await addBot('접수 내용을 확인해주세요.\n\n' +
      '📦 만들고 싶은 것: ' + answers.what + '\n' +
      '🗓️ 일정: ' + (answers.when || '미정') + '\n' +
      '💰 예산: ' + (answers.budget || '미정') + '\n' +
      (answers.note ? '💬 하고 싶은 말: ' + answers.note + '\n' : '') +
      '👤 ' + answers.name + ' · 📮 ' + answers.contact);
    var confirm = await addChips([
      { label: '접수하기', value: 'submit', primary: true },
      { label: '처음부터 다시', value: 'reset' },
    ]);
    if(confirm.value === 'reset'){ location.reload(); return; }
    addMe('접수하기');

    try {
      var res = await fetch('/_workintake', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(answers),
      });
      if(!res.ok) throw new Error(res.status);
      step('완료');
      await addBot('접수됐습니다! 영업일 기준 1~2일 안에 남겨주신 연락처로 회신드릴게요. 감사합니다 🫧');
      await addChips([{ label: '홈으로', value: 'home', primary: true }]);
      location.href = './';
    } catch (err) {
      await addBot(String(err.message) === '429'
        ? '접수가 너무 잦아요. 잠시 후 다시 시도해주세요.'
        : '전송에 실패했습니다. 잠시 후 다시 시도하거나 boson95@gmail.com 으로 보내주세요.');
      await addChips([{ label: '다시 시도', value: 'retry', primary: true }]);
      location.reload();
    }
  }
  run();
})();
</script>
</body>
</html>
