name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            _src/avalon/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test infra
        run: node --test _infra/*.test.mjs

      - name: Build
        run: node _infra/build.mjs

      # 이 리포는 main에 직접 push하고 배포한다 — PR에서만 도는 CI는 아발론을
      # 사실상 검사하지 못했다. 배포 경로에서도 시뮬레이션·불변조건·빌드를 돌리고,
      # 커밋된 games/avalon 이 그 빌드와 같은지까지 확인한다.
      - name: Install Avalon dependencies
        run: npm ci --prefix _src/avalon

      - name: Test and build Avalon
        run: npm run test:ci --prefix _src/avalon

      - name: Verify games/avalon matches the source build
        run: node _infra/check-avalon-sync.mjs

      # 방문의 대부분이 휴대폰이다 — 배포 전에 핵심 화면이 모바일 폭에서
      # 깨지지 않는지(예외·가로 넘침·빈 화면) 한 번 본다.
      # 브라우저를 매번 새로 받으면 배포마다 20초가 그냥 나간다. package-lock 이
      # 그대로면 캐시를 쓴다(플레이라이트 버전이 바뀌면 키가 달라져 다시 받는다).
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium for smoke tests
        run: npx playwright install --with-deps chromium

      - name: Mobile smoke test
        run: npx playwright test

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 기본값(3.x)은 wrangler.jsonc를 못 읽는다.
          # **package.json 의 devDependencies.wrangler 와 같은 버전이어야 한다** —
          # 같아야 위의 npm ci 가 깔아 둔 것을 action 이 찾아 쓰고, 다르면 여기서
          # 매번 새로 받느라 4분 가까이 쓴다(_infra/wrangler-pin.test.mjs 가 묶어 둔다).
          wranglerVersion: "4.111.0"
