name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Finish publication and recovery before the next deployment starts.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PLAYWRIGHT_CHANNEL: chrome
      WRANGLER_SEND_METRICS: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          fetch-depth: 2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Plan changes since the live deployment
        id: scope
        env:
          DEPLOY_FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' }}
        run: node _infra/deploy-prepare.mjs

      - name: node_modules cache
        if: steps.scope.outputs.mode != 'none'
        id: node-modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.scope.outputs.mode != 'none' && steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Validate changed scope and build once
        if: steps.scope.outputs.mode != 'none'
        run: node _infra/deploy-check.mjs .deploy-plan.json unit

      - name: Check previously verified Avalon content
        if: steps.scope.outputs.avalon == 'true'
        id: avalon
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .avalon-verified
          key: avalon-${{ hashFiles('_src/avalon/**', 'games/avalon/**') }}

      - name: Cache Avalon node_modules
        if: steps.scope.outputs.avalon == 'true' && steps.avalon.outputs.cache-hit != 'true'
        id: avalon-modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: _src/avalon/node_modules
          key: nm-avalon-${{ runner.os }}-node22-${{ hashFiles('_src/avalon/package-lock.json') }}

      - name: Install Avalon dependencies
        if: steps.scope.outputs.avalon == 'true' && steps.avalon.outputs.cache-hit != 'true' && steps.avalon-modules.outputs.cache-hit != 'true'
        run: npm ci --prefix _src/avalon --prefer-offline --no-audit --no-fund

      - name: Test and build Avalon
        if: steps.scope.outputs.avalon == 'true' && steps.avalon.outputs.cache-hit != 'true'
        run: npm run test:ci --prefix _src/avalon

      - name: Verify games/avalon matches the source build
        if: steps.scope.outputs.avalon == 'true' && steps.avalon.outputs.cache-hit != 'true'
        run: node _infra/check-avalon-sync.mjs

      - name: Record verified Avalon content
        if: steps.scope.outputs.avalon == 'true' && steps.avalon.outputs.cache-hit != 'true'
        run: git rev-parse HEAD > .avalon-verified

      # Ubuntu already includes Chrome and its system dependencies.
      - name: Browser tests for changed scope
        if: steps.scope.outputs.mode != 'none'
        run: node _infra/deploy-check.mjs .deploy-plan.json e2e

      - name: Publish, verify live commit, restore previous version on failure
        if: steps.scope.outputs.mode != 'none'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node _infra/deploy-release.mjs .deploy-plan.json
