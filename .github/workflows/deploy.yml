name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            _src/avalon/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test infra
        run: node --test _infra/*.test.mjs

      - name: Build
        run: node _infra/build.mjs

      # 이 리포는 main에 직접 push하고 배포한다 — PR에서만 도는 CI는 아발론을
      # 사실상 검사하지 못했다. 배포 경로에서도 시뮬레이션·불변조건·빌드를 돌리고,
      # 커밋된 games/avalon 이 그 빌드와 같은지까지 확인한다.
      - name: Install Avalon dependencies
        run: npm ci --prefix _src/avalon

      - name: Test and build Avalon
        run: npm run test:ci --prefix _src/avalon

      - name: Verify games/avalon matches the source build
        run: node _infra/check-avalon-sync.mjs

      # 방문의 대부분이 휴대폰이다 — 배포 전에 핵심 화면이 모바일 폭에서
      # 깨지지 않는지(예외·가로 넘침·빈 화면) 한 번 본다.
      - name: Install Chromium for smoke tests
        run: npx playwright install --with-deps chromium

      - name: Mobile smoke test
        run: npx playwright test

      - name: Ensure image bucket exists
        continue-on-error: true
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.111.0"
          command: r2 bucket create bubblelab-assets

      - name: Ensure podcast bucket exists
        continue-on-error: true
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.111.0"
          command: r2 bucket create bubblelab-podcast

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.111.0" # 기본값(3.x)은 wrangler.jsonc를 못 읽음
