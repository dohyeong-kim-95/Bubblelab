name: CI

# 배포 판정의 원본은 deploy.yml 이다(main 직접 push → 변경 범위만큼 검증·배포).
# 이 워크플로는 PR·수동 실행용 전체 검사다. main push 에는 돌지 않는다.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            _src/avalon/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Lint (syntax)
        run: bash scripts/lint.sh

      # 데이터랩 모범답안 체인 테스트(_src/tests/datalab.test.mjs)는 이 패키지가
      # 없으면 건너뛴다 — PR 검사에서는 실제로 돌게 깔아 둔다.
      - name: Install Python packages for datalab tests
        run: python3 -m pip install --quiet numpy pandas scipy scikit-learn statsmodels matplotlib

      # package.json 의 npm test 와 같은 범위(sink·공용 테스트 포함)를 본다.
      - name: Test
        run: npm test

      - name: Build Bubblelab
        run: node _infra/build.mjs

      - name: Install Avalon dependencies
        run: npm ci --prefix _src/avalon

      - name: Test and build Avalon
        run: npm run test:ci --prefix _src/avalon

      - name: Verify games/avalon matches the source build
        run: node _infra/check-avalon-sync.mjs

      - name: Install Chromium for smoke tests
        run: npx playwright install --with-deps chromium

      - name: Mobile smoke test
        run: npx playwright test
