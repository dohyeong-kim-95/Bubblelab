# AI 이모티콘 생성 잡 (work/emoticon).
# Cloudflare Workers의 이그레스 IP는 Gemini API 미지원 지역으로 잡히는 경우가
# 있어("User location is not supported") 생성은 GitHub Actions 러너(지원 지역)
# 에서 돌린다. 산출물(시트·프레임·APNG)은 _src/emoticon/에 커밋되어 에이전트가
# 리포에서 직접 리뷰할 수 있다.
#
# 트리거 두 가지:
#  - _src/emoticon/job.json 커밋(push) — 에이전트용. 예:
#    {"character":"rabbit","step":"sheet","prompt":"..."} (cut이면 cut_id·frames·fps·force 추가)
#    잡 완료 시 job.json은 삭제 커밋된다(그 삭제 push로 한 번 더 뜨는 런은 잡이 없어 조용히 종료).
#  - workflow_dispatch — 사람이 Actions 탭에서 직접 실행.
# 필요 secret: GEMINI_STICKER_KEY (Actions secret — Cloudflare secret과 같은 값)
name: Emoticon

on:
  workflow_dispatch:
    inputs:
      character:
        description: "캐릭터(작업폴더) 이름 — _src/emoticon/<이름>"
        required: true
      step:
        description: "실행 단계"
        required: true
        type: choice
        options: [sheet, cut, redo]
      prompt:
        description: "sheet: 캐릭터 설명 / cut: 동작 설명"
        required: true
      cut_id:
        description: "cut 단계의 컷 이름 (영소문자·숫자·하이픈)"
        required: false
        default: ""
      frames:
        description: "cut 프레임 수 (2–24) / redo에서는 재생성할 프레임 번호"
        required: false
        default: "12"
      fps:
        description: "cut fps"
        required: false
        default: "12"
      force:
        description: "기존 시트/컷 덮어쓰기"
        required: false
        type: boolean
        default: false
      resume:
        description: "중단된 컷의 검증된 frames-raw를 재사용"
        required: false
        type: boolean
        default: false
      max_calls:
        description: "이번 실행의 이미지 API 최대 호출 수 (비우면 제한 없음)"
        required: false
        default: ""
      max_cost:
        description: "이번 실행의 예상 최대 비용 USD (비우면 제한 없음)"
        required: false
        default: ""
      profile:
        description: "품질 판정 프로필 (draft | master-2s | line)"
        required: false
        default: "draft"
  push:
    branches: [main]
    paths: ["_src/emoticon/job.json"]

concurrency:
  group: emoticon-generate
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate repository
        run: |
          node --test _infra/*.test.mjs
          node _infra/build.mjs

      - name: Generate
        env:
          EMOTICON_IMAGE_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_STICKER_KEY }}
          IN_CHARACTER: ${{ inputs.character }}
          IN_STEP: ${{ inputs.step }}
          IN_PROMPT: ${{ inputs.prompt }}
          IN_CUT_ID: ${{ inputs.cut_id }}
          IN_FRAMES: ${{ inputs.frames }}
          IN_FPS: ${{ inputs.fps }}
          IN_FORCE: ${{ inputs.force }}
          IN_RESUME: ${{ inputs.resume }}
          IN_MAX_CALLS: ${{ inputs.max_calls }}
          IN_MAX_COST: ${{ inputs.max_cost }}
          IN_PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          JOB=_src/emoticon/job.json
          if [[ -f "$JOB" ]]; then
            read_job() { node -p "require('./$JOB').$1 ?? '$2'"; }
            CHARACTER=$(read_job character "")
            STEP=$(read_job step "")
            PROMPT=$(read_job prompt "")
            CUT_ID=$(read_job cut_id "")
            FRAMES=$(read_job frames "12")
            FPS=$(read_job fps "12")
            FORCE=$(read_job force "false")
            RESUME=$(read_job resume "false")
            MAX_CALLS=$(read_job max_calls "")
            MAX_COST=$(read_job max_cost "")
            PROFILE=$(read_job profile "draft")
          elif [[ -n "$IN_CHARACTER" ]]; then
            CHARACTER="$IN_CHARACTER"; STEP="$IN_STEP"; PROMPT="$IN_PROMPT"
            CUT_ID="$IN_CUT_ID"; FRAMES="$IN_FRAMES"; FPS="$IN_FPS"; FORCE="$IN_FORCE"
            RESUME="$IN_RESUME"; MAX_CALLS="$IN_MAX_CALLS"; MAX_COST="$IN_MAX_COST"
            PROFILE="${IN_PROFILE:-draft}"
          else
            echo "잡 파일도 입력도 없음 — 종료 (job.json 삭제 커밋의 후속 런)"; exit 0
          fi
          [[ "$CHARACTER" =~ ^[a-z0-9-]{1,32}$ ]] || { echo "캐릭터 이름은 영소문자·숫자·하이픈"; exit 1; }
          WORKDIR="_src/emoticon/$CHARACTER"
          FORCE_FLAG=""; [[ "$FORCE" == "true" ]] && FORCE_FLAG="--force"
          RESUME_FLAG=""; [[ "$RESUME" == "true" ]] && RESUME_FLAG="--resume"
          BUDGET_FLAGS=()
          [[ -n "$MAX_CALLS" ]] && BUDGET_FLAGS+=(--max-calls "$MAX_CALLS")
          [[ -n "$MAX_COST" ]] && BUDGET_FLAGS+=(--max-cost "$MAX_COST")
          if [[ "$STEP" == "sheet" ]]; then
            node _infra/emoticon.mjs sheet "$WORKDIR" --prompt "$PROMPT" $FORCE_FLAG
          elif [[ "$STEP" == "cut" ]]; then
            [[ -n "$CUT_ID" ]] || { echo "cut 단계에는 cut_id가 필요합니다"; exit 1; }
            if [[ -f "$JOB" ]] && node -e "process.exit(require('./$JOB').skeletons ? 0 : 1)"; then
              # 스켈레톤 조건화: job.json의 skeletons = 포즈 시퀀스 경로, grid = 단일 호출
              SEQ=$(node -p "require('./$JOB').skeletons")
              GRID_FLAG=""
              node -e "process.exit(require('./$JOB').grid ? 0 : 1)" && GRID_FLAG="--grid"
              REF_FLAG=""
              node -e "process.exit(require('./$JOB').ref ? 0 : 1)" \
                && REF_FLAG="--ref $(node -p "require('./$JOB').ref || ''")"
              node _infra/emoticon.mjs cut "$WORKDIR" "$CUT_ID" --skeletons "$SEQ" \
                --fps "$FPS" $GRID_FLAG $REF_FLAG $FORCE_FLAG $RESUME_FLAG "${BUDGET_FLAGS[@]}"
            elif [[ -f "$JOB" ]] && node -e "process.exit(Array.isArray(require('./$JOB').keys) ? 0 : 1)"; then
              # pose-to-pose 모드 (권장): job.json의 keys/breakdowns/assembly를 spec으로
              node -e "const j = require('./$JOB'); require('fs').writeFileSync('/tmp/keys.json', JSON.stringify({ motion: j.prompt, keys: j.keys, breakdowns: j.breakdowns, assembly: j.assembly, invariants: j.invariants, repeat: j.repeat }))"
              KEYS_REF_FLAG=""
              node -e "process.exit(require('./$JOB').ref ? 0 : 1)" \
                && KEYS_REF_FLAG="--ref $(node -p "require('./$JOB').ref || ''")"
              node _infra/emoticon.mjs cut "$WORKDIR" "$CUT_ID" --keys /tmp/keys.json --fps "$FPS" \
                $KEYS_REF_FLAG $FORCE_FLAG $RESUME_FLAG "${BUDGET_FLAGS[@]}"
            else
              POSES_FLAG=""
              if [[ -f "$JOB" ]] && node -e "process.exit(Array.isArray(require('./$JOB').poses) ? 0 : 1)"; then
                node -e "require('fs').writeFileSync('/tmp/poses.txt', require('./$JOB').poses.join('\n'))"
                POSES_FLAG="--poses /tmp/poses.txt"
              fi
              node _infra/emoticon.mjs cut "$WORKDIR" "$CUT_ID" --motion "$PROMPT" \
                --frames "$FRAMES" --fps "$FPS" $POSES_FLAG $FORCE_FLAG $RESUME_FLAG "${BUDGET_FLAGS[@]}"
            fi
            node _infra/emoticon.mjs build "$WORKDIR" "$CUT_ID"
            node _infra/emoticon.mjs check "$WORKDIR" "$CUT_ID" --profile "${PROFILE:-draft}"
          elif [[ "$STEP" == "redo" ]]; then
            # 선별 재작업: 튄 프레임(frames = 프레임 번호) 하나만 재생성 후 다시 굽는다
            [[ -n "$CUT_ID" ]] || { echo "redo 단계에는 cut_id가 필요합니다"; exit 1; }
            node _infra/emoticon.mjs redo "$WORKDIR" "$CUT_ID" "$FRAMES"
            node _infra/emoticon.mjs build "$WORKDIR" "$CUT_ID"
            node _infra/emoticon.mjs check "$WORKDIR" "$CUT_ID" --profile "${PROFILE:-draft}"
          else
            echo "알 수 없는 step: $STEP"; exit 1
          fi
          rm -f "$JOB"

      - name: Commit outputs
        if: always()   # 실패해도 frames-raw 등 부분 산출물을 커밋해 디버깅 근거를 남긴다
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A _src/emoticon
          git diff --cached --quiet && { echo "변경 없음"; exit 0; }
          git commit -m "emoticon: 생성 산출물 (actions)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep $((i * 2))
          done
