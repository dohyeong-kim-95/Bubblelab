# AI 이모티콘 생성 잡 (work/emoticon).
# Cloudflare Workers의 이그레스 IP는 Gemini API 미지원 지역으로 잡히는 경우가
# 있어("User location is not supported") 생성은 GitHub Actions 러너(지원 지역)
# 에서 돌린다. 산출물(시트·프레임·APNG)은 _src/emoticon/에 커밋되어 에이전트가
# 리포에서 직접 리뷰할 수 있다.
#
# 트리거 두 가지:
#  - _src/emoticon/job.json 커밋(push) — 에이전트용. 예:
#    {"character":"rabbit","step":"sheet","prompt":"..."} (cut이면 cut_id·frames·fps·force 추가)
#    잡 완료 시 job.json은 삭제 커밋된다(그 삭제 push로 한 번 더 뜨는 런은 잡이 없어 조용히 종료).
#  - workflow_dispatch — 사람이 Actions 탭에서 직접 실행.
# 필요 secret: GEMINI_STICKER_KEY (Actions secret — Cloudflare secret과 같은 값)
name: Emoticon

on:
  workflow_dispatch:
    inputs:
      character:
        description: "캐릭터(작업폴더) 이름 — _src/emoticon/<이름>"
        required: true
      step:
        description: "실행 단계"
        required: true
        type: choice
        options: [sheet, cut, redo]
      prompt:
        description: "sheet: 캐릭터 설명 / cut: 동작 설명"
        required: true
      cut_id:
        description: "cut 단계의 컷 이름 (영소문자·숫자·하이픈)"
        required: false
        default: ""
      frames:
        description: "cut 프레임 수 (2–24) / redo에서는 재생성할 프레임 번호"
        required: false
        default: "12"
      fps:
        description: "cut fps"
        required: false
        default: "12"
      force:
        description: "기존 시트/컷 덮어쓰기"
        required: false
        type: boolean
        default: false
      resume:
        description: "중단된 컷의 검증된 frames-raw를 재사용"
        required: false
        type: boolean
        default: false
      max_calls:
        description: "이번 실행의 이미지 API 최대 호출 수 (비우면 제한 없음)"
        required: false
        default: ""
      max_cost:
        description: "이번 실행의 예상 최대 비용 USD (비우면 제한 없음)"
        required: false
        default: ""
      profile:
        description: "품질 판정 프로필 (draft | master-2s | line)"
        required: false
        default: "draft"
  push:
    branches: [main]
    paths: ["_src/emoticon/job.json"]

concurrency:
  group: emoticon-generate
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # 산출물 커밋 후 Deploy를 workflow_dispatch로 직접 부른다

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate repository
        run: |
          node --test _infra/*.test.mjs
          node _infra/build.mjs

      # 사람 검수 댓글을 리포로 끌어온다. 에이전트는 배포 사이트에 직접 접근할 수
      # 없으므로(프록시 차단) 이 파일이 피드백을 읽는 유일한 경로다. 읽기는 공개라
      # secret이 필요 없고, 실패해도 생성은 계속한다.
      - name: Pull review notes
        continue-on-error: true
        run: |
          set -uo pipefail
          curl -fsS --max-time 20 https://work.bubblelab.dev/_emoticon/review \
            -o /tmp/reviews.json && node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('/tmp/reviews.json', 'utf8'));
            fs.writeFileSync('_src/emoticon/reviews.json', JSON.stringify(data, null, 2) + '\n');
            console.log(\`검수 댓글 \${data.items?.length ?? 0}개\`);
          "

      - name: Generate
        env:
          EMOTICON_IMAGE_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_STICKER_KEY }}
          IN_CHARACTER: ${{ inputs.character }}
          IN_STEP: ${{ inputs.step }}
          IN_PROMPT: ${{ inputs.prompt }}
          IN_CUT_ID: ${{ inputs.cut_id }}
          IN_FRAMES: ${{ inputs.frames }}
          IN_FPS: ${{ inputs.fps }}
          IN_FORCE: ${{ inputs.force }}
          IN_RESUME: ${{ inputs.resume }}
          IN_MAX_CALLS: ${{ inputs.max_calls }}
          IN_MAX_COST: ${{ inputs.max_cost }}
          IN_PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          JOB=_src/emoticon/job.json
          if [[ -f "$JOB" ]]; then
            read_job() { node -p "require('./$JOB').$1 ?? '$2'"; }
            CHARACTER=$(read_job character "")
            STEP=$(read_job step "")
            PROMPT=$(read_job prompt "")
            CUT_ID=$(read_job cut_id "")
            FRAMES=$(read_job frames "12")
            FPS=$(read_job fps "12")
            FORCE=$(read_job force "false")
            RESUME=$(read_job resume "false")
            MAX_CALLS=$(read_job max_calls "")
            MAX_COST=$(read_job max_cost "")
            PROFILE=$(read_job profile "draft")
            FORCE_REDO=$(read_job force_redo "false")
          elif [[ -n "$IN_CHARACTER" ]]; then
            CHARACTER="$IN_CHARACTER"; STEP="$IN_STEP"; PROMPT="$IN_PROMPT"
            CUT_ID="$IN_CUT_ID"; FRAMES="$IN_FRAMES"; FPS="$IN_FPS"; FORCE="$IN_FORCE"
            RESUME="$IN_RESUME"; MAX_CALLS="$IN_MAX_CALLS"; MAX_COST="$IN_MAX_COST"
            PROFILE="${IN_PROFILE:-draft}"; FORCE_REDO="false"
          else
            echo "잡 파일도 입력도 없음 — 종료 (job.json 삭제 커밋의 후속 런)"; exit 0
          fi
          [[ "$CHARACTER" =~ ^[a-z0-9-]{1,32}$ ]] || { echo "캐릭터 이름은 영소문자·숫자·하이픈"; exit 1; }
          WORKDIR="_src/emoticon/$CHARACTER"
          FORCE_FLAG=""; [[ "$FORCE" == "true" ]] && FORCE_FLAG="--force"
          RESUME_FLAG=""; [[ "$RESUME" == "true" ]] && RESUME_FLAG="--resume"
          # 프레임당 2회 상한을 넘겨 다시 굽는 경우 — 포즈 문장을 고친 뒤에만 쓴다
          FORCE_REDO_FLAG=""; [[ "${FORCE_REDO:-false}" == "true" ]] && FORCE_REDO_FLAG="--force-redo"
          BUDGET_FLAGS=()
          [[ -n "$MAX_CALLS" ]] && BUDGET_FLAGS+=(--max-calls "$MAX_CALLS")
          [[ -n "$MAX_COST" ]] && BUDGET_FLAGS+=(--max-cost "$MAX_COST")
          if [[ "$STEP" == "sheet" ]]; then
            node _infra/emoticon.mjs sheet "$WORKDIR" --prompt "$PROMPT" $FORCE_FLAG
          elif [[ "$STEP" == "cut" ]]; then
            [[ -n "$CUT_ID" ]] || { echo "cut 단계에는 cut_id가 필요합니다"; exit 1; }
            if [[ -f "$JOB" ]] && node -e "process.exit(require('./$JOB').skeletons ? 0 : 1)"; then
              # 스켈레톤 조건화: job.json의 skeletons = 포즈 시퀀스 경로, grid = 단일 호출
              SEQ=$(node -p "require('./$JOB').skeletons")
              GRID_FLAG=""
              node -e "process.exit(require('./$JOB').grid ? 0 : 1)" && GRID_FLAG="--grid"
              REF_FLAG=""
              node -e "process.exit(require('./$JOB').ref ? 0 : 1)" \
                && REF_FLAG="--ref $(node -p "require('./$JOB').ref || ''")"
              node _infra/emoticon.mjs cut "$WORKDIR" "$CUT_ID" --skeletons "$SEQ" \
                --fps "$FPS" $GRID_FLAG $REF_FLAG $FORCE_FLAG $RESUME_FLAG "${BUDGET_FLAGS[@]}"
            elif [[ -f "$JOB" ]] && node -e "process.exit(Array.isArray(require('./$JOB').keys) ? 0 : 1)"; then
              # pose-to-pose 모드 (권장): job.json의 keys/breakdowns/assembly를 spec으로
              node -e "const j = require('./$JOB'); require('fs').writeFileSync('/tmp/keys.json', JSON.stringify({ motion: j.prompt, keys: j.keys, breakdowns: j.breakdowns, assembly: j.assembly, invariants: j.invariants, poseConstants: j.poseConstants, breakdownNote: j.breakdownNote, repeat: j.repeat }))"
              KEYS_REF_FLAG=""
              node -e "process.exit(require('./$JOB').ref ? 0 : 1)" \
                && KEYS_REF_FLAG="--ref $(node -p "require('./$JOB').ref || ''")"
              node _infra/emoticon.mjs cut "$WORKDIR" "$CUT_ID" --keys /tmp/keys.json --fps "$FPS" \
                $KEYS_REF_FLAG $FORCE_FLAG $RESUME_FLAG "${BUDGET_FLAGS[@]}"
            else
              POSES_FLAG=""
              if [[ -f "$JOB" ]] && node -e "process.exit(Array.isArray(require('./$JOB').poses) ? 0 : 1)"; then
                node -e "require('fs').writeFileSync('/tmp/poses.txt', require('./$JOB').poses.join('\n'))"
                POSES_FLAG="--poses /tmp/poses.txt"
              fi
              node _infra/emoticon.mjs cut "$WORKDIR" "$CUT_ID" --motion "$PROMPT" \
                --frames "$FRAMES" --fps "$FPS" $POSES_FLAG $FORCE_FLAG $RESUME_FLAG "${BUDGET_FLAGS[@]}"
            fi
            node _infra/emoticon.mjs build "$WORKDIR" "$CUT_ID"
            # 부품 검사(여분 사지)를 판정 전에 돌려 report.json에 싣는다 —
            # 사람 검수 불합격의 최다 원인이고 픽셀 지표로는 안 잡힌다.
            node _infra/emoticon.mjs parts "$WORKDIR" "$CUT_ID" || true
            node _infra/emoticon.mjs check "$WORKDIR" "$CUT_ID" --profile "${PROFILE:-draft}"
          elif [[ "$STEP" == "redo" ]]; then
            # 선별 재작업: 튄 프레임(frames = 프레임 번호) 하나만 재생성 후 다시 굽는다
            [[ -n "$CUT_ID" ]] || { echo "redo 단계에는 cut_id가 필요합니다"; exit 1; }
            node _infra/emoticon.mjs redo "$WORKDIR" "$CUT_ID" "$FRAMES" $FORCE_REDO_FLAG
            node _infra/emoticon.mjs build "$WORKDIR" "$CUT_ID"
            node _infra/emoticon.mjs parts "$WORKDIR" "$CUT_ID" || true
            node _infra/emoticon.mjs check "$WORKDIR" "$CUT_ID" --profile "${PROFILE:-draft}"
          else
            echo "알 수 없는 step: $STEP"; exit 1
          fi
          rm -f "$JOB"

      # 이번 실행이 만든 파일을 통째로 artifact로 남긴다 (보존 14일).
      # ① 실패했을 때의 디버깅 근거이자, ② 저장소에 두지 않는 누끼 전 원본
      # (cuts/*/frames-raw — .gitignore 대상)을 다시 꺼내 쓸 수 있는 유일한 경로다.
      # --exclude-standard 를 붙이지 않는 이유가 그것 — 무시된 raw까지 담아야 한다.
      - name: Collect run outputs
        if: always()
        run: |
          set -uo pipefail
          # 추적 안 되는 새 파일(무시 대상 포함) + 수정된 파일 = 이번 실행이 만든 것
          git ls-files --others --modified -- _src/emoticon > /tmp/outputs.txt
          if [[ ! -s /tmp/outputs.txt ]]; then echo "산출물 없음"; exit 0; fi
          while IFS= read -r f; do
            [[ -f "$f" ]] || continue                       # 삭제된 경로는 건너뛴다
            mkdir -p "/tmp/emoticon-run/$(dirname "$f")"
            cp "$f" "/tmp/emoticon-run/$f"
          done < /tmp/outputs.txt
          echo "산출물 $(wc -l < /tmp/outputs.txt)개 · $(du -sh /tmp/emoticon-run | cut -f1)"

      - name: Upload run outputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emoticon-run-${{ github.run_id }}
          path: /tmp/emoticon-run
          retention-days: 14
          if-no-files-found: ignore

      # 실패한 산출물은 main에 커밋하지 않는다. 예전에는 if: always()로 부분
      # 산출물까지 밀어 넣어서 ① 저장소가 불량 프레임으로 계속 불어나고
      # ② 합격 산출물과 구분되지 않았다. 여기까지 왔다는 것은 check가 exit 0으로
      # 끝났다는 뜻 — 합격 산출물만, 그중에서도 추적 대상만 커밋된다.
      - name: Commit outputs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A _src/emoticon
          git diff --cached --quiet && { echo "변경 없음"; exit 0; }
          git commit -m "emoticon: 생성 산출물 (actions)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep $((i * 2))
          done
          # GITHUB_TOKEN으로 만든 push는 다른 워크플로의 push 트리거를 **발동시키지
          # 않는다**(재귀 방지). 그래서 생성 산출물만 커밋되면 Deploy가 안 돌아
          # history 페이지가 한 세대씩 뒤처졌다. workflow_dispatch는 같은 토큰으로도
          # 발동하므로 여기서 직접 부른다.
          curl -sS -X POST -o /dev/null -w "deploy dispatch: %{http_code}\n" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/dispatches" \
            -d '{"ref":"main"}'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
