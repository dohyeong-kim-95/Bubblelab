<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>4분할 반응속도 테스트</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overscroll-behavior: none; }
  body {
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Consolas, monospace;
    background: light-dark(#dce5ed, #090d13);
    color: light-dark(#17202b, #dbe5ef);
    user-select: none;
    -webkit-user-select: none;
  }
  #app {
    position: relative;
    z-index: 1;
    width: min(100%, 34rem);
    height: 100svh;
    margin: auto;
    padding: .9rem .9rem 4.7rem;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
    gap: .8rem;
    background: light-dark(#eef2f6, #10161f);
    box-shadow: 0 0 1.5rem light-dark(rgba(30,50,70,.14), rgba(0,0,0,.5));
  }
  header {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: .35rem .8rem;
    align-items: center;
  }
  h1 { margin: 0; font-size: 1.15rem; }
  #summary {
    grid-column: 1 / -1;
    min-height: 2.6em;
    margin: 0;
    opacity: .7;
    font-size: .78rem;
    line-height: 1.4;
  }
  #start {
    grid-column: 2;
    grid-row: 1;
    font: inherit;
    font-size: .85rem;
    font-weight: bold;
    padding: .55rem .9rem;
    border: 1.5px solid currentColor;
    border-radius: 999px;
    background: light-dark(#fff, #1c2735);
    color: inherit;
    cursor: pointer;
  }
  #start:active { transform: scale(.96); }
  #start:disabled { cursor: default; opacity: .45; transform: none; }
  #grid {
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-template-rows: repeat(2, minmax(0, 1fr));
    gap: .65rem;
  }
  .zone {
    min-width: 0;
    min-height: 0;
    padding: .5rem;
    border: 2px solid light-dark(rgba(23,32,43,.16), rgba(219,229,239,.18));
    border-radius: 1rem;
    display: grid;
    place-content: center;
    gap: .35rem;
    text-align: center;
    touch-action: manipulation;
    font: inherit;
    color: inherit;
    cursor: pointer;
    transition: background .12s, transform .12s, border-color .12s;
  }
  .zone:active { transform: scale(.98); }
  .zone.idle {
    background: light-dark(#dde5ec, #1c2735);
    cursor: default;
  }
  .zone.wait {
    background: light-dark(#d94f58, #762128);
    border-color: transparent;
    color: #fff;
  }
  .zone.go {
    background: light-dark(#35a85b, #1c6d39);
    border-color: light-dark(#147e38, #68e38d);
    color: #fff;
    transform: scale(1.015);
  }
  .zone.done {
    background: light-dark(#d9e8f5, #21344a);
    cursor: default;
  }
  .zone.early {
    background: light-dark(#f1c76e, #735515);
    color: light-dark(#3d2a00, #fff3c4);
    cursor: default;
  }
  .zone strong {
    font-size: clamp(1.25rem, 7vw, 2.25rem);
    font-variant-numeric: tabular-nums;
  }
  .zone span { min-height: 1.2em; font-size: .75rem; opacity: .72; }
  #result-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 1.2rem 1.2rem 5rem;
    background: light-dark(rgba(222,230,238,.82), rgba(7,11,17,.82));
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  #result-overlay.hidden { display: none; }
  #result-card {
    width: min(86vw, 20rem);
    padding: 1.5rem 1.35rem;
    border: 1.5px solid light-dark(rgba(30,50,70,.22), rgba(200,215,235,.22));
    border-radius: 1.25rem;
    background: light-dark(rgba(255,255,255,.9), rgba(20,28,39,.92));
    box-shadow: 0 1rem 3rem rgba(0,0,0,.2);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: .75rem;
    text-align: center;
  }
  #result-icon { font-size: 2.2rem; }
  #result-title { margin: 0; font-size: 1.1rem; opacity: .78; }
  #result-average {
    font-size: 2.35rem;
    font-weight: bold;
    font-variant-numeric: tabular-nums;
  }
  #result-grade { margin: -.2rem 0 .1rem; font-size: .85rem; opacity: .72; }
  #result-breakdown {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: .45rem;
  }
  .result-item {
    padding: .6rem .4rem;
    border-radius: .7rem;
    background: light-dark(#e9eef3, #182331);
    display: flex;
    flex-direction: column;
    gap: .15rem;
  }
  .result-item.penalty { background: light-dark(#f5dfad, #5f4819); }
  .result-item small { opacity: .55; }
  .result-item b { font-variant-numeric: tabular-nums; }
  #result-best { margin: 0; min-height: 1.2em; font-size: .8rem; opacity: .58; }
  #retry {
    font: inherit;
    font-size: 1.05rem;
    font-weight: bold;
    padding: .78rem 2rem;
    border: 2px solid currentColor;
    border-radius: 2rem;
    background: none;
    color: inherit;
    cursor: pointer;
  }
  #retry:active { transform: scale(.96); }
  #retry:disabled { opacity: .4; cursor: default; transform: none; }
  @media (max-height: 570px) {
    #app { padding-top: .55rem; gap: .5rem; }
    #summary { min-height: 1.2em; }
    #result-card { padding: 1rem 1.1rem; gap: .5rem; }
    #result-icon { font-size: 1.6rem; }
    #result-average { font-size: 1.8rem; }
  }
</style>
</head>
<body>
<main id="app">
  <header>
    <h1>⚡ 4분할 반응속도</h1>
    <button id="start" type="button">시작</button>
    <p id="summary">네 칸이 각각 초록색으로 바뀌는 순간 누르세요.<br>미리 누른 칸은 1000ms로 계산됩니다.</p>
  </header>
  <section id="grid" aria-label="반응속도 측정 영역">
    <button class="zone idle" type="button" aria-label="1번 반응속도 영역">
      <strong>1</strong><span>대기</span>
    </button>
    <button class="zone idle" type="button" aria-label="2번 반응속도 영역">
      <strong>2</strong><span>대기</span>
    </button>
    <button class="zone idle" type="button" aria-label="3번 반응속도 영역">
      <strong>3</strong><span>대기</span>
    </button>
    <button class="zone idle" type="button" aria-label="4번 반응속도 영역">
      <strong>4</strong><span>대기</span>
    </button>
  </section>
</main>
<div id="result-overlay" class="hidden" role="dialog" aria-modal="true" aria-labelledby="result-title">
  <section id="result-card">
    <div id="result-icon">⚡</div>
    <h2 id="result-title">측정 완료!</h2>
    <div id="result-average">평균 0ms</div>
    <p id="result-grade"></p>
    <div id="result-breakdown"></div>
    <p id="result-best"></p>
    <button id="retry" type="button">다시 도전</button>
  </section>
</div>
<script>
const zones = [...document.querySelectorAll(".zone")];
const startBtn = document.getElementById("start");
const summary = document.getElementById("summary");
const resultOverlay = document.getElementById("result-overlay");
const resultTitle = document.getElementById("result-title");
const resultAverage = document.getElementById("result-average");
const resultGrade = document.getElementById("result-grade");
const resultBreakdown = document.getElementById("result-breakdown");
const resultBest = document.getElementById("result-best");
const retryBtn = document.getElementById("retry");
const bestKey = "bl-reactiontime-4-best";

let running = false;
let completed = 0;
let lastAverage = null;
let bestAverage = +localStorage.getItem(bestKey) || null;
let round = [];
let previousOrder = "";

const fmt = (v) => `${Math.round(v)}ms`;

window.blWeekly = { game: "reactiontime", dir: "min", fmt };
window.blShareText = () => {
  const score = bestAverage ?? lastAverage;
  return score
    ? `4분할 반응속도 평균 ${fmt(score)}! ⚡ 도전해보세요`
    : "⚡ 4분할 반응속도 테스트 — 도전해보세요!";
};

function randomActivationPlan() {
  let order;
  do {
    order = zones.map((_, index) => index);
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
  } while (order.join("") === previousOrder);
  previousOrder = order.join("");

  let delay = 1200 + Math.random() * 800;
  return order.map((zoneIndex) => {
    const item = { zoneIndex, delay };
    delay += 650 + Math.random() * 700;
    return item;
  });
}

function renderZone(index, className, mainText, detail) {
  const zone = zones[index];
  zone.className = `zone ${className}`;
  zone.querySelector("strong").textContent = mainText;
  zone.querySelector("span").textContent = detail;
}

function activate(index) {
  const item = round[index];
  if (!running || item.state !== "wait") return;
  item.state = "go";
  item.goAt = performance.now();
  renderZone(index, "go", "지금!", "클릭");
}

function finishZone(index, score, early) {
  const item = round[index];
  item.state = "done";
  item.score = score;
  item.early = early;
  completed++;
  renderZone(index, early ? "early" : "done", fmt(score), early ? "조기 클릭" : "완료");
  if (completed === zones.length) finishRound();
}

function respond(index) {
  if (!running) return;
  const item = round[index];
  if (item.state === "wait") {
    clearTimeout(item.timer);
    finishZone(index, 1000, true);
    return;
  }
  if (item.state === "go") {
    finishZone(index, Math.round(performance.now() - item.goAt), false);
  }
}

function grade(score) {
  return score < 200 ? "⚡ 번개보다 빠른 손" :
         score < 250 ? "🔥 아주 빠른데요" :
         score < 320 ? "👍 평균 이상" :
         score < 500 ? "🙂 조금만 더 집중!" : "🐢 초록색을 기다려보세요";
}

function finishRound() {
  running = false;
  const scores = round.map((item) => item.score);
  lastAverage = Math.round(scores.reduce((sum, score) => sum + score, 0) / scores.length);
  const isBest = bestAverage === null || lastAverage < bestAverage;
  if (isBest) {
    bestAverage = lastAverage;
    localStorage.setItem(bestKey, bestAverage);
  }
  summary.textContent =
    `평균 ${fmt(lastAverage)} · 최고 평균 ${fmt(bestAverage)} · ` +
    scores.map((score, index) => `${index + 1}번 ${fmt(score)}`).join(" / ");
  startBtn.disabled = false;
  startBtn.textContent = "다시";
  resultTitle.textContent = isBest ? "🎉 최고 기록!" : "측정 완료!";
  resultAverage.textContent = `평균 ${fmt(lastAverage)}`;
  resultGrade.textContent = grade(lastAverage);
  resultBest.textContent = `최고 평균 ${fmt(bestAverage)}`;
  resultBreakdown.replaceChildren();
  round.forEach((item, index) => {
    const box = document.createElement("div");
    box.className = "result-item" + (item.early ? " penalty" : "");
    const label = document.createElement("small");
    label.textContent = `${index + 1}번${item.early ? " · 조기" : ""}`;
    const value = document.createElement("b");
    value.textContent = fmt(item.score);
    box.append(label, value);
    resultBreakdown.append(box);
  });
  resultOverlay.classList.remove("hidden");
  retryBtn.disabled = true;
  setTimeout(() => { retryBtn.disabled = false; }, 800);
  window.blWeeklyReport?.(lastAverage);
}

function startRound() {
  if (running) return;
  running = true;
  completed = 0;
  round.forEach((item) => clearTimeout(item.timer));
  round = zones.map(() => ({ state: "wait", timer: null, goAt: 0, score: null, early: false }));
  resultOverlay.classList.add("hidden");
  summary.textContent = "빨간 칸은 기다리고, 초록색으로 바뀐 칸만 누르세요.";
  startBtn.disabled = true;
  startBtn.textContent = "진행 중";

  round.forEach((item, index) => {
    renderZone(index, "wait", "기다려…", `${index + 1}번`);
  });
  for (const { zoneIndex, delay } of randomActivationPlan()) {
    round[zoneIndex].timer = setTimeout(() => activate(zoneIndex), delay);
  }
}

zones.forEach((zone, index) => {
  zone.addEventListener("pointerdown", (event) => {
    event.preventDefault();
    respond(index);
  });
  zone.addEventListener("keydown", (event) => {
    if (event.key !== "Enter" && event.key !== " ") return;
    event.preventDefault();
    respond(index);
  });
});
startBtn.addEventListener("click", startRound);
retryBtn.addEventListener("click", startRound);
for (const eventName of ["pointerdown", "click", "keydown"]) {
  resultOverlay.addEventListener(eventName, (event) => event.stopPropagation());
}
</script>
<script defer src="/_shared/records.js"></script>
<script defer src="/_shared/share.js"></script>
</body>
</html>
