<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>💎 얼음 러시 — 한 번 틀리면 끝</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>💎</text></svg>">
<link rel="stylesheet" href="/_shared/bubble.css">
<style>
  /* 재료는 공용 bubble.css(토큰·bl- 부품). 판(캔버스)은 게임 내용이라 그대로 둔다. */
  :root { color-scheme: light dark; --accent-h: 35; }
  html, body { height: 100%; }
  body { margin: 0; overflow: hidden; user-select: none; -webkit-user-select: none;
         touch-action: manipulation; }
  canvas { display: block; touch-action: none; }

  /* HUD — 이름 방울 + 숫자 칩. 판 위에 떠 있으니 칩은 반투명 종이면 */
  #hud { position: fixed; top: 0; left: 0; right: 0; display: flex; gap: .45rem;
         align-items: center; padding: .5rem .7rem; font-size: var(--t-caption); z-index: 3;
         pointer-events: none; white-space: nowrap; color: var(--ink); }
  #hud .sp { flex: 1; }
  #hud > span:first-child { flex: 0 1 auto; min-width: 0; overflow: hidden;
                            text-overflow: ellipsis; display: inline-flex; align-items: center;
                            gap: .4rem; font-size: var(--t-small); }
  #hud b { font-weight: 800; letter-spacing: -.01em; }
  .hud-bubble { width: 1.75rem; font-size: .95rem; flex: none; }
  .hud-chip { padding: .22rem .6rem; border-radius: var(--pill); font-weight: 600;
              background: color-mix(in srgb, var(--field) 86%, transparent);
              border: 1px solid var(--line); }
  .hud-chip:empty { display: none; }
  .hud-btn { pointer-events: auto; min-height: 2rem; padding: .2rem .75rem; }

  /* 시작·결과 카드 — 재료는 bl-glass, 위치·크기만 여기서. 방울·제목·설명·주 버튼 */
  #overlay { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
             display: flex; flex-direction: column; align-items: center; gap: .85rem;
             width: min(84vw, 21rem); box-sizing: border-box; padding: 1.6rem 1.5rem 1.4rem;
             text-align: center; z-index: 5; }
  #overlay.hide { display: none; }
  #overlay .big { width: 4rem; font-size: 2rem; margin: 0 0 .1rem; }
  #overlay h1 { margin: 0; font-size: var(--t-h1); font-weight: 800; letter-spacing: -.02em;
                line-height: 1.25; }
  #overlay p { margin: 0; font-size: var(--t-small); line-height: 1.6; color: var(--muted);
               white-space: pre-line; }
  #btn { font-size: 1.05rem; padding: .75rem 2.2rem; min-height: 3rem; }
  #overlay #best { margin: 0; font-size: var(--t-caption); min-height: 1.1em; }
</style>
</head>
<body>
<div id="hud">
  <span><span class="bl-bubble hud-bubble" aria-hidden="true">💎</span> <b>얼음 러시</b></span>
  <span class="sp"></span>
  <span id="hStage" class="hud-chip bl-num"></span>
</div>
<div id="overlay" class="bl-glass">
  <p class="big bl-bubble" id="oEmoji">💎</p>
  <h1 id="oTitle">얼음 러시</h1>
  <p id="oMsg">얼음 깨기, 목숨은 하나.
한 번이라도 실패하면 거기서 끝!
연속으로 클리어한 판 수가 점수예요.

곡괭이는 찍은 칸에 2, 옆 칸에 1 데미지.
보석은 전부 캐고, 폭탄 위 얼음은
깨지 않게 조심하세요. 곡괭이는 한정판!</p>
  <button id="btn" class="bl-btn bl-btn--primary">시작</button>
  <p id="best" class="bl-note bl-num"></p>
</div>
<canvas id="cv"></canvas>
<script src="../canvas-kit.js"></script>
<script>
// 콘솔 디버그 훅(정답·스테이지 점프·강제 승리)은 ?debug 주소에서만 붙인다 — 기록 조작을 쉽게 만들지 않게.
const DEBUG = new URLSearchParams(location.search).has("debug");
"use strict";
// 정적 난이도(0~100)와 별점 — DIFFICULTY.md Phase 1
const clamp01 = (x) => Math.max(0, Math.min(1, x));
const starsOf = (d) => "\u2605".repeat(Math.max(1, Math.min(5, Math.ceil(d / 20))));
let dScore = 0;
const targetD = (s) => Math.min(90, 5 + 4.7 * s);

// roundRect 폴리필은 ../canvas-kit.js
/* ── 상수/난수 ────────────────────────────────────────── */
const W = 360, H = 640, COLS = 6, ROWS = 7, CELL = 48, GX = 36, GY = 140;
const dark = matchMedia("(prefers-color-scheme: dark)");
const mulberry32 = (a) => () => {
  a |= 0; a = (a + 0x6D2B79F5) | 0;
  let t = Math.imul(a ^ (a >>> 15), 1 | a);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};
const NB = [[1, 0], [-1, 0], [0, 1], [0, -1]];
const inGrid = (c, r) => c >= 0 && c < COLS && r >= 0 && r < ROWS;

/* ── 스테이지 생성 ────────────────────────────────────── */
// 보장: 모든 폭탄에 대해 (인접 보석들의 직격 필요 횟수 합) < 폭탄 얼음 3
// → 보석 칸만 정확히 직격하는 플레이는 절대 폭탄을 안 터뜨린다.
// 곡괭이 = 그 전략의 필요 횟수 + 약간의 여유.
function gen(stage, salt = 0) {
  for (let attempt = 0; attempt < 200; attempt++) {
    const rnd = mulberry32(stage * 26041 + attempt * 379 + salt * 68111 + 11);
    const grid = [];
    for (let r = 0; r < ROWS; r++) {
      grid.push([]);
      for (let c = 0; c < COLS; c++) {
        grid[r].push({ c, r, hp: 2 + (rnd() < 0.5 ? 1 : 0), max: 0, what: null });
      }
    }
    const nGems = 3 + Math.min(stage - 1, 6);
    const nBombs = Math.min(2 + stage, 12);
    const cells = grid.flat();
    const freeCells = () => cells.filter((k) => !k.what);
    let bad = false;
    for (let i = 0; i < nGems; i++) {
      const f = freeCells();
      if (!f.length) { bad = true; break; }
      const cell = f[(rnd() * f.length) | 0];
      cell.what = "gem";
      cell.hp = 2 + (rnd() < 0.4 ? 1 : 0);
    }
    if (bad) continue;
    const gemCost = (cell) => Math.ceil(cell.hp / 2);
    for (let i = 0; i < nBombs; i++) {
      const ok = freeCells().filter((cell) => {
        let splash = 0;
        for (const [dc, dr] of NB) {
          if (!inGrid(cell.c + dc, cell.r + dr)) continue;
          const nb = grid[cell.r + dr][cell.c + dc];
          if (nb.what === "gem") splash += gemCost(nb);
        }
        return splash <= 2;                      // 폭탄 얼음 3 > 스플래시 합
      });
      if (!ok.length) { bad = true; break; }
      const cell = ok[(rnd() * ok.length) | 0];
      cell.what = "bomb"; cell.hp = 3;
    }
    if (bad) continue;
    for (const cell of cells) cell.max = cell.hp;
    const gems = cells.filter((k) => k.what === "gem");
    const picks = gems.reduce((s, k) => s + gemCost(k), 0) + 1 + Math.floor(nGems / 4);
    const solution = gems.flatMap((k) => Array(gemCost(k)).fill([k.c, k.r]));
    return { grid, picks, gems: nGems, solution };
  }
  return null; // 도달 불가(제약이 느슨함)
}

function diffOf(g) {
  let bombs = 0, gems = 0, adj = 0;
  for (const row of g.grid) for (const cell of row) {
    if (cell.what === "bomb") bombs++;
    if (cell.what === "gem") gems++;
  }
  for (const row of g.grid) for (const cell of row) {
    if (cell.what !== "bomb") continue;
    for (const [dc, dr] of NB) {
      if (inGrid(cell.c + dc, cell.r + dr) &&
          g.grid[cell.r + dr][cell.c + dc].what === "gem") adj++;
    }
  }
  return 100 * clamp01((gems - 3) / 6 * 0.45 + (bombs - 3) / 9 * 0.25 + adj / 6 * 0.3);
}

// 유사도 지문: 보석·폭탄 칸 좌표 토큰 — 인접 스테이지와 겹칠수록 페널티
const fpOf = (g) => {
  const out = [];
  for (const row of g.grid) for (const cell of row) {
    if (cell.what) out.push(`${cell.what === "gem" ? "g" : "b"}:${cell.c},${cell.r}`);
  }
  return out;
};
const simFp = (a, b) => {
  const A = new Set(a), B = new Set(b);
  let hit = 0;
  for (const x of A) if (B.has(x)) hit++;
  return hit / Math.max(1, Math.max(A.size, B.size));
};
const fpCache = new Map();
const structFp = (s2) => {
  if (s2 < 1) return [];
  if (!fpCache.has(s2)) fpCache.set(s2, fpOf(gen(s2, 0)));
  return fpCache.get(s2);
};

// 레벨 자동 재배치 + 유사도 검출: 후보 판마다 (목표 난이도와의 거리) +
// (직전 두 스테이지 구조 지문과의 자카드 유사도 × 30) 점수가 가장 낮은
// 판을 채택한다. 이웃 지문은 살트0 구조라 스테이지의 순수 함수 —
// 시드 고정 결정론(모두 같은 판)이 그대로 유지된다.
function genTuned(stage) {
  const T = targetD(stage);
  const p1 = structFp(stage - 1), p2 = structFp(stage - 2);
  let best = null, bestScore = Infinity;
  for (let v = 0; v < 6; v++) {
    const g = gen(stage, v);
    const fp = fpOf(g);
    const score = Math.abs(diffOf(g) - T) +
      30 * Math.max(simFp(fp, p1), simFp(fp, p2));
    if (score < bestScore) { bestScore = score; best = g; }
    if (bestScore <= 6) break;
  }
  return best;
}
window.blDiffAt = (s) => diffOf(genTuned(s));
window.blSimAt = (s) => s < 2 ? 0 : simFp(fpOf(genTuned(s)), fpOf(genTuned(s - 1)));

/* ── 상태 ─────────────────────────────────────────────── */
const BEST_KEY = "bl-icerush-best";
let best = 0;
try { best = +localStorage.getItem(BEST_KEY) || 0; } catch {}
let stage = 1, score = 0;
let phase = "title";
let grid = [], picks = 0, gemsLeft = 0, parts = [], shakeT = 0;
const cellPos = (c, r) => [GX + c * CELL + CELL / 2, GY + r * CELL + CELL / 2];

function loadStage() {
  const g = genTuned(stage);
  grid = g.grid; picks = g.picks; gemsLeft = g.gems;
  dScore = diffOf(g);
  parts = []; phase = "play";
  if (DEBUG) window.__ic = {                                    // 테스트/디버그용
    solution: g.solution,
    cellPos,
    state: () => ({ picks, gemsLeft }),
  };
  hud();
}

function poof(x, y, col, n = 10) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 50 + Math.random() * 110;
    parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60, life: 0.7, col });
  }
}

function hitCell(cell, dmg) {
  if (cell.hp <= 0) return null;
  cell.hp -= dmg;
  if (cell.hp > 0) return null;
  cell.hp = 0;
  const [x, y] = cellPos(cell.c, cell.r);
  poof(x, y, cell.what === "gem" ? "#ffd75e" : "#bde3f5");
  return cell.what;                                 // 열렸을 때 내용물
}

function tap(c, r) {
  if (phase !== "play" || !inGrid(c, r)) return;
  const cell = grid[r][c];
  if (cell.hp <= 0 || picks <= 0) return;
  picks--; shakeT = 0.18;
  const opened = [hitCell(cell, 2)];
  for (const [dc, dr] of NB) {
    if (inGrid(c + dc, r + dr)) opened.push(hitCell(grid[r + dr][c + dc], 1));
  }
  let boom = false;
  for (let i = 0; i < opened.length; i++) {
    if (opened[i] === "gem") { gemsLeft--; }
    if (opened[i] === "bomb") boom = true;
  }
  hud();
  if (boom) return fail("폭탄 위 얼음이 깨졌어요. 💥");
  if (gemsLeft === 0) return win();
  if (picks === 0) return fail("곡괭이가 다 닳았어요.");
}

function fail(msg) {
  phase = "fail";
  const newBest = score > best;
  if (newBest) { best = score; try { localStorage.setItem(BEST_KEY, best); } catch {} }
  if (score >= 1) window.blWeeklyReport?.(score);
  const quips = ["광고 속 그 사람도 맨날 폭탄부터 찍던데요.",
                 "괜찮아요. 얼음은 내년 겨울에 또 얼어요.",
                 "보석은 원래 남 주기 아까워서 얼려둔 겁니다."];
  show("💥", `${score}판 연속 클리어`,
       msg + (newBest ? "\n🎉 최고 기록 경신!" : "") + "\n\n" + quips[(Math.random() * quips.length) | 0],
       "처음부터 다시");
}
function win() {
  phase = "win";
  score++;
  $("hStage").textContent = `✨ 스테이지 ${stage} 클리어! · 🔥 ${score}연속`;
  setTimeout(() => {                                 // 짧게 보여주고 자동으로 다음 판
    if (phase !== "win") return;
    stage++;
    loadStage();
  }, 700);
}

/* ── 그리기 ───────────────────────────────────────────── */
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
let scale = 1, ox = 0, oy = 0;
function resize() {
  const dpr = devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  cv.style.width = innerWidth + "px"; cv.style.height = innerHeight + "px";
  scale = Math.min(innerWidth / W, innerHeight / H);
  ox = (innerWidth - W * scale) / 2; oy = (innerHeight - H * scale) / 2;
}
addEventListener("resize", resize); resize();

// 셀별 고정 크랙 무늬(시드: 좌표)
function crackLines(cell, x, y, level) {
  const rnd = mulberry32(cell.c * 73 + cell.r * 179 + 5);
  ctx.strokeStyle = "rgba(30,60,90,.4)"; ctx.lineWidth = 1.5;
  const n = level * 3;
  for (let i = 0; i < n; i++) {
    const a = rnd() * Math.PI * 2, l = 8 + rnd() * 14;
    const sx = x + (rnd() - 0.5) * 30, sy = y + (rnd() - 0.5) * 30;
    ctx.beginPath(); ctx.moveTo(sx, sy);
    ctx.lineTo(sx + Math.cos(a) * l, sy + Math.sin(a) * l);
    ctx.lineTo(sx + Math.cos(a + 0.8) * l * 0.6, sy + Math.sin(a + 0.8) * l * 0.6);
    ctx.stroke();
  }
}

function draw(dt) {
  const D = dark.matches, dpr = devicePixelRatio || 1;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = D ? "#0b0f17" : "#f3f0e8";
  ctx.fillRect(0, 0, innerWidth, innerHeight);
  const sh = shakeT > 0 ? Math.sin(shakeT * 90) * 3 * scale : 0;
  if (shakeT > 0) shakeT -= dt;
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * (ox + sh), dpr * oy);
  if (phase === "title") return;

  for (const row of grid) for (const cell of row) {
    const x = GX + cell.c * CELL, y = GY + cell.r * CELL;
    const cx2 = x + CELL / 2, cy2 = y + CELL / 2;
    // 바닥(뚫린 칸)
    ctx.fillStyle = D ? "#14101f" : "#e7d7bd";
    ctx.beginPath(); ctx.roundRect(x + 2, y + 2, CELL - 4, CELL - 4, 8); ctx.fill();
    // 얼음
    if (cell.hp > 0) {
      const g = ctx.createLinearGradient(x, y, x + CELL, y + CELL);
      if (D) { g.addColorStop(0, "rgba(140,190,235,.82)"); g.addColorStop(1, "rgba(80,120,180,.82)"); }
      else { g.addColorStop(0, "rgba(190,228,252,.86)"); g.addColorStop(1, "rgba(130,180,225,.86)"); }
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.roundRect(x + 2, y + 2, CELL - 4, CELL - 4, 8); ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.roundRect(x + 3.5, y + 3.5, CELL - 7, CELL - 7, 7); ctx.stroke();
      if (cell.hp < cell.max) crackLines(cell, cx2, cy2, cell.max - cell.hp);
      // 얼음 속 내용물 실루엣 — 깨질수록 선명해진다
      if (cell.what) {
        ctx.globalAlpha = 0.5 + 0.22 * (cell.max - cell.hp);
        ctx.font = "22px system-ui"; ctx.textAlign = "center";
        ctx.fillText(cell.what === "gem" ? "💎" : "💣", cx2, cy2 + 8);
        ctx.globalAlpha = 1;
      }
    }
  }

  for (const pt of parts) {
    pt.life -= dt; pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.vy += 500 * dt;
    ctx.globalAlpha = Math.max(0, pt.life / 0.7);
    ctx.beginPath(); ctx.arc(pt.x, pt.y, 3, 0, 7);
    ctx.fillStyle = pt.col; ctx.fill();
  }
  ctx.globalAlpha = 1;
  parts = parts.filter((pt) => pt.life > 0);
}

let last = performance.now();
function loop(t) {
  let dt = (t - last) / 1000; last = t;
  if (dt > 0.05) dt = 0.05;
  draw(dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ── 입력/UI ──────────────────────────────────────────── */
const $ = (id) => document.getElementById(id);
function hud() {
  $("hStage").textContent =
    `🔥 ${score}연속 · 스테이지 ${stage} ${starsOf(dScore)} · 💎 ${gemsLeft} · ⛏️ ${picks}`;
}
function show(emoji, title, msg, btnText) {
  $("oEmoji").textContent = emoji; $("oTitle").textContent = title;
  $("oMsg").textContent = msg; $("btn").textContent = btnText;
  $("best").textContent = best ? `최고 기록: ${best}연속` : "";
  $("overlay").classList.remove("hide");
}
if (best) $("best").textContent = `최고 기록: ${best}연속`;
$("btn").addEventListener("click", () => {
  if (phase === "play" || phase === "win") return;
  stage = 1; score = 0;                              // 새 런은 항상 스테이지 1부터
  $("overlay").classList.add("hide");
  loadStage();
});

addEventListener("pointerdown", (e) => {
  if (e.target === cv) e.preventDefault();   // 모바일 더블탭 줌·고스트 클릭 방지
  if (phase !== "play") return;
  const x = (e.clientX - ox) / scale, y = (e.clientY - oy) / scale;
  tap(Math.floor((x - GX) / CELL), Math.floor((y - GY) / CELL));
});

window.blShareText = () => `얼음 러시 ${best}연속! 한 번도 안 틀리고 도전해보세요 💎`;
window.blWeekly = { game: "icerush", dir: "max", fmt: (v) => `${v}연속` };
</script>
<script defer src="/_shared/records.js"></script>
<script defer src="/_shared/share.js"></script>
<script defer src="/_shared/like.js"></script>
</body>
</html>
