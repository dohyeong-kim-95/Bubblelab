<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>버블팝</title>
<link rel="stylesheet" href="/_shared/bubble.css">
<style>
  :root { color-scheme: light dark; --accent-h: 280; }
  body { margin: 0; overflow: hidden; user-select: none;
         -webkit-user-select: none; touch-action: manipulation; }
  canvas { display: block; }
  /* HUD — 숫자만 mono */
  #score, #time { position: fixed; top: 1rem; font-family: var(--mono); font-size: 1.1rem;
                  font-weight: 700; color: var(--ink); pointer-events: none; }
  #score { left: 1.25rem; }
  #time { right: 1.25rem; }
  #overlay { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
             display: flex; flex-direction: column; align-items: center; gap: var(--s-4);
             padding: var(--s-5) var(--s-5) var(--s-4); text-align: center; box-sizing: border-box;
             width: min(86vw, 20rem); }
  #overlay.hide { display: none; }
  #overlay .bl-head { margin: 0; text-align: left; }
  #msg { margin: 0; color: var(--muted); line-height: 1.6; white-space: pre-line; }
  #msg:empty { display: none; }
  #result { font-weight: 700; line-height: 1.6; white-space: pre-line; }
  #result:empty { display: none; }
  #btn { font-size: 1.1rem; min-height: 3rem; padding: .7rem 2.6rem; }
  #best { margin: 0; color: var(--muted); font-size: var(--t-caption); min-height: 1.2em; }
</style>
</head>
<body>
<div id="score" class="bl-num">🫧 0개</div>
<div id="time" class="bl-num">20.0초</div>
<div id="overlay" class="bl-glass">
  <header class="bl-head">
    <span class="bl-bubble" aria-hidden="true">🫧</span>
    <h1>버블팝</h1>
    <p>20초 동안 터트린 개수로 승부</p>
  </header>
  <p id="msg">20초 동안 버블을
최대한 많이 터트리세요!</p>
  <div id="result"></div>
  <button id="btn" class="bl-btn bl-btn--primary">시작!</button>
  <p id="best" class="bl-mono bl-num"></p>
</div>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const timeEl = document.getElementById("time");
const overlay = document.getElementById("overlay");
const msg = document.getElementById("msg");
const result = document.getElementById("result");
const btn = document.getElementById("btn");
const bestEl = document.getElementById("best");

const LIMIT = 20;   // 초
let phase = "idle"; // idle | running | done
let startTime = 0;
let popped = 0;
// 최고 기록은 새로고침해도 남게 localStorage 에 둔다(키 bl-<게임>-best 로 통일).
const BEST_KEY = "bl-bubble-pop-best";
let best = loadBest();
function loadBest() {
  try {
    const saved = localStorage.getItem(BEST_KEY);
    if (saved === null) return null;
    const value = Number(saved);
    return Number.isFinite(value) ? value : null;
  } catch {
    return null;
  }
}
function saveBest() {
  try { localStorage.setItem(BEST_KEY, String(best)); } catch {}
}
if (best !== null) bestEl.textContent = `최고 기록: ${best}개`;

window.blWeekly = { game: "bubble-pop", dir: "max", fmt: (v) => v + "개" };
window.blShareText = () => `20초 동안 버블 ${best ?? popped}개 터트림! 도전해보세요`;

function resize() {
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
addEventListener("resize", resize);
resize();

const bubbles = [];
function spawn() {
  const r = 14 + Math.random() * 30;
  bubbles.push({
    x: Math.random() * canvas.width,
    y: canvas.height + r,
    r,
    v: 0.4 + Math.random() * 1.2,
    hue: 190 + Math.random() * 60,
    wobble: Math.random() * Math.PI * 2,
  });
}

function pop(x, y) {
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    if ((x - b.x) ** 2 + (y - b.y) ** 2 < b.r * b.r) {
      bubbles.splice(i, 1);
      if (phase === "running") {
        popped++;
        scoreEl.textContent = "🫧 " + popped + "개";
      }
      return;
    }
  }
}
addEventListener("pointerdown", (e) => pop(e.clientX, e.clientY));
// 오버레이 조작이 버블 팝으로 새지 않게
for (const ev of ["pointerdown", "click"]) {
  overlay.addEventListener(ev, (e) => e.stopPropagation());
}

btn.addEventListener("click", () => {
  if (phase === "running") return;
  phase = "running";
  popped = 0;
  startTime = performance.now();
  scoreEl.textContent = "🫧 0개";
  overlay.classList.add("hide");
});

function finish() {
  phase = "done";
  timeEl.textContent = "0.0초";
  if (best === null || popped > best) {
    best = popped;
    saveBest();
    bestEl.textContent = `최고 기록: ${best}개`;
  }
  const grade =
    popped >= 70 ? "🤖 물방울 진공청소기" :
    popped >= 55 ? "⚡ 광속 손가락" :
    popped >= 40 ? "🔥 대단한데요" :
    popped >= 25 ? "🙂 나쁘지 않아요" : "🫠 여유롭게 즐기셨군요…";
  result.textContent = `${popped}개 터트림!\n${grade}`;
  msg.textContent = "";
  btn.textContent = "다시!";
  overlay.classList.remove("hide");
  // 종료 직후 연타로 바로 재시작되지 않게 잠깐 잠근다
  btn.disabled = true;
  setTimeout(() => { btn.disabled = false; }, 1000);
  window.blWeeklyReport?.(popped);
}

// 프레임 수가 아니라 흐른 시간으로 움직인다 — 120Hz 기기가 버블을 두 배 받지 않게.
// frames = 60Hz 기준으로 몇 프레임만큼 시간이 흘렀나(탭 복귀 때 튀지 않게 3프레임 상한).
let lastFrameAt = 0;

function tick(t) {
  const frames = lastFrameAt ? Math.min((t - lastFrameAt) / (1000 / 60), 3) : 1;
  lastFrameAt = t;
  const running = phase === "running";
  if (running) {
    const left = LIMIT - (performance.now() - startTime) / 1000;
    if (left <= 0) finish();
    else timeEl.textContent = left.toFixed(1) + "초";
  }
  // 게임 중에는 버블이 더 자주, 더 많이 올라온다
  const cap = running ? 35 : 25;
  const rate = running ? 0.18 : 0.08;
  if (bubbles.length < cap && Math.random() < rate * frames) spawn();
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    b.y -= b.v * frames;
    b.x += Math.sin(t / 900 + b.wobble) * 0.4 * frames;
    if (b.y < -b.r) { bubbles.splice(i, 1); continue; }
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${b.hue}, 80%, 70%, .25)`;
    ctx.fill();
    ctx.strokeStyle = `hsla(${b.hue}, 80%, 60%, .6)`;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(b.x - b.r * 0.3, b.y - b.r * 0.35, b.r * 0.18, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,255,255,.7)";
    ctx.fill();
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
<script defer src="/_shared/records.js"></script>
<script defer src="/_shared/share.js"></script>
</body>
</html>
