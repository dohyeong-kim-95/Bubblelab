<!doctype html>
<html lang="ko" class="bl-stage">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>명예의 전당</title>
<link rel="stylesheet" href="/_shared/bubble.css">
<style>
  :root { color-scheme: light dark; --accent-h: 109; }
  body { margin: 0; min-height: 100vh;
         display: flex; flex-direction: column; align-items: center;
         justify-content: center; gap: 1.4rem;
         padding: 2.5rem 1.5rem; box-sizing: border-box; }
  .bl-head { width: min(100%, 26rem); margin: 0; }
  #board { width: min(100%, 26rem); display: flex; flex-direction: column;
           gap: .55rem; text-align: left; }
  .row { display: grid; grid-template-columns: auto 1fr auto;
         column-gap: .6rem; row-gap: .3rem; align-items: baseline;
         padding: .75rem .95rem; border-radius: var(--r);
         border: 1px solid var(--line); background: var(--field);
         text-decoration: none; color: var(--ink);
         transition: border-color .15s, transform .12s; }
  .row:hover { border-color: var(--accent-line); }
  .row:active { transform: scale(.99); }
  .row .emoji { grid-row: 1; grid-column: 1; }
  .row .game { grid-row: 1; grid-column: 2; font-family: var(--mono); font-weight: 700;
               font-size: .92rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .date { grid-row: 1; grid-column: 3; font-family: var(--mono); color: var(--muted);
               font-size: var(--t-caption); font-variant-numeric: tabular-nums; }
  .row .rec { grid-row: 2; grid-column: 1 / 4; overflow: hidden; font-weight: 600;
              text-overflow: ellipsis; white-space: nowrap; }
  .row .rec.empty { color: var(--muted); font-weight: 400; }
  #msg { color: var(--muted); min-height: 1.2em; font-size: .9rem; text-align: center; }
</style>
</head>
<body>
  <header class="bl-head">
    <span class="bl-bubble" aria-hidden="true">🏆</span>
    <h1>명예의 전당</h1>
    <p id="sub">slop별 올타임 1위 — 주간 보드와 달리 초기화되지 않아요</p>
  </header>
  <div id="hof-podium" class="bl-podium" hidden>
    <p class="podium-title">👑 올타임 slop 삼대장</p>
    <div class="podium-row"></div>
  </div>
  <div id="board"></div>
  <div id="msg">불러오는 중…</div>
<script>
// slop 주간 보드 토이 전부 — 아이콘은 각 토이 카드와 같은 것(파일의 첫 이모지).
// 이 표에 있는 게임만 보여 준다(다른 서브도메인 기록이 섞여도 링크가 깨지지 않게).
// 새 토이에 blWeekly 를 붙이면 여기에도 한 줄 넣는다.
const EMOJI = {
  "10sec": "⏱", "2048": "🔢", "animal-vs": "🐋", beer: "🍺", "bubble-pop": "🫧",
  circle: "⭕", clicker: "👆", dart: "🎯", "dart-adv": "🎯", dino: "🦖",
  dogrush: "🐶", flags: "🌍", fruitmerge: "🥥", gaterush: "🏃", icerush: "💎",
  lockrush: "🔓", logroll: "🪵", parkrush: "🚗", pinrush: "📌", reactiontime: "⚡",
  screwrush: "🔩", "sort-line": "🏭", touch25: "👆", trader: "📈", woodstack: "🪵",
  "yacht-bot": "🤖",
};
const board = document.getElementById("board");
const msg = document.getElementById("msg");

(async () => {
  try {
    const res = await fetch("/_records?alltime=1&scope=slop", { cache: "no-store" });
    if (!res.ok) throw new Error();
    const { records: all } = await res.json();
    const records = {};
    for (const game of Object.keys(all)) {
      if (EMOJI[game]) records[game] = all[game];
    }
    // 올타임 1위를 가장 많이 가진 삼대장. 순위 계산·렌더는 /_shared/podium.js가
    // 맡는다 — 카테고리 홈의 이번 주 시상대와 동점 규칙을 함께 쓰기 위해서다.
    // podium.js는 defer라 파싱 뒤에야 실행된다. fetch가 그 사이(interactive)에
    // 끝나면 blPodium이 아직 없다 — 문서 load까지 기다리면 확실하다.
    if (document.readyState !== "complete") {
      await new Promise((r) => addEventListener("load", r, { once: true }));
    }
    window.blPodium?.render(
      document.getElementById("hof-podium"),
      window.blPodium.rank(records),
      EMOJI,
    );
    // 기록 있는 게임 먼저(달성일 최신순), 그 뒤에 아직 빈 게임들
    const games = Object.keys(EMOJI)
      .sort((a, b) => (records[b]?.at ?? -1) - (records[a]?.at ?? -1) ||
                      a.localeCompare(b));
    for (const game of games) {
      const r = records[game];
      const row = document.createElement("a");
      row.className = "row";
      row.href = `/${game}/`;
      row.innerHTML = `<span class="emoji"></span><span class="game"></span>
        <span class="rec"></span><span class="date"></span>`;
      row.querySelector(".emoji").textContent = EMOJI[game] ?? "🫧";
      row.querySelector(".game").textContent = game;
      const rec = row.querySelector(".rec");
      if (r) {
        // text 없는 옛 기록은 생 float가 못생기지 않게 반올림해서 보여준다
        rec.textContent = `👑 ${r.nick} · ${r.text ?? Math.round(r.score * 100) / 100}`;
        row.querySelector(".date").textContent = new Date(r.at)
          .toLocaleDateString("ko-KR", { year: "2-digit", month: "numeric", day: "numeric" });
      } else {
        rec.classList.add("empty");
        rec.textContent = "아직 주인이 없어요";
      }
      board.appendChild(row);
    }
    msg.textContent = games.length ? "" : "아직 아무 기록도 없어요";
  } catch {
    msg.textContent = "⚠️ 기록 보드 연결 실패";
  }
})();
</script>
<script defer src="/_shared/podium.js"></script>
<script defer src="/_shared/share.js"></script>
</body>
</html>
