<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Fruit Merge | Bubble Lab</title><!-- 🥥 -->
<meta name="description" content="같은 과일을 합쳐 더 큰 과일을 만드는 물리 퍼즐 게임">
<link rel="stylesheet" href="/_shared/bubble.css">
<style>
:root{color-scheme: light dark;--accent-h:92}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;overscroll-behavior:none}
button{font:inherit}
.shell{min-height:100svh;padding:18px 14px 28px;display:grid;place-items:center;position:relative;overflow:hidden}
/* 바탕 방울 두 개 — 강조색 면으로만 */
.glow{position:fixed;border-radius:50%;pointer-events:none;background:var(--gloss),var(--accent-soft);opacity:.7}
.glow.a{width:260px;height:260px;left:-130px;bottom:-80px}.glow.b{width:220px;height:220px;right:-110px;top:12%}
.game{width:min(100%,430px);position:relative;z-index:1}
header.bl-head{margin:0 4px 14px}
.scores{display:grid;grid-template-columns:1fr 1fr 72px;gap:8px;margin-bottom:9px}
.card,.next{height:58px;padding:8px 13px;border-radius:var(--r);display:flex;flex-direction:column;justify-content:center}
.card small,.next small{font-family:var(--mono);font-size:var(--t-caption);color:var(--muted)}
.card strong{font-family:var(--mono);font-size:22px;line-height:1.1;font-weight:800}
.card.best strong{color:var(--accent)}
.next{align-items:center;padding:6px}.next span{font-size:26px;line-height:30px}
/* 게임판 — 나무 틀·종이 바닥은 게임 화면이라 그대로 */
.board{position:relative;border:6px solid #6f4430;border-top-width:9px;border-radius:17px 17px 25px 25px;overflow:hidden;background:#fffaf0;box-shadow:0 18px 45px #5a31193b,inset 0 0 0 3px #d99965}
.board:after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 -18px 30px #80432414}
canvas{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair}
.overlay{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}
.hero{font-size:72px;filter:drop-shadow(0 10px 10px #5f30172e);animation:float 2.4s ease-in-out infinite}
.overlay h2{font-size:1.45rem;font-weight:800;margin:12px 0 6px;letter-spacing:-.02em}
.overlay p{font-size:var(--t-small);line-height:1.6;color:var(--muted);margin:0 0 16px}
.result{width:min(230px,100%);margin:0 0 20px;display:flex;flex-direction:column;align-items:center;padding:14px}
.result small{font-family:var(--mono);font-size:var(--t-caption);color:var(--muted)}
.result strong{font-family:var(--mono);font-size:40px;line-height:1.1;font-weight:800;color:var(--accent)}
.result span{margin-top:5px;font-size:var(--t-caption);font-weight:600;color:var(--muted)}
.play{font-size:1.05rem;min-height:3rem;padding:.7rem 2rem}
.hint{text-align:center;font-size:var(--t-caption);color:var(--muted);margin:12px 0 8px}.hint b{color:var(--ink)}
.line{display:flex;justify-content:center;align-items:center;overflow:hidden;white-space:nowrap;border-radius:var(--pill);padding:7px 9px;font-size:15px}
.line i{font-style:normal;font-size:11px;color:var(--muted);margin:0 2px}
@keyframes float{50%{transform:translateY(-8px) rotate(3deg)}}
@media(max-height:760px){.shell{padding-top:8px}.board{max-width:330px;margin:auto}.scores{margin-bottom:6px}.hint{margin:7px 0 5px}header.bl-head{margin-bottom:8px}.card,.next{height:51px}.card strong{font-size:19px}}
@media(min-width:700px){.shell{padding:28px}.game{width:410px}}
</style>
</head>
<body><main class="shell"><div class="glow a"></div><div class="glow b"></div><section class="game"><header class="bl-head"><span class="bl-bubble" aria-hidden="true">🥥</span><h1>Fruit Merge</h1><p>같은 과일을 합쳐 코코넛까지</p></header><div class="scores"><div class="card bl-panel"><small>SCORE</small><strong id="score" class="bl-num">0</strong></div><div class="card best bl-panel"><small>BEST</small><strong id="best" class="bl-num">0</strong></div><div class="next bl-panel"><small>NEXT</small><span id="next">🫐</span></div></div><div class="board"><canvas id="canvas" width="360" height="560" aria-label="과일 합치기 게임판"></canvas><div class="overlay bl-scrim" id="overlay"><div class="hero" id="hero">🥥</div><h2 id="message">과일을 합쳐보세요</h2><p id="sub">같은 과일끼리 만나면 더 큰 과일이 돼요.</p><div class="result bl-panel" id="result" hidden><small>SCORE</small><strong id="finalScore" class="bl-num">0</strong><span id="finalBest">최고 기록 0점</span></div><button class="play bl-btn bl-btn--primary" id="play">게임 시작</button></div></div><p class="hint"><b>이동</b> 손가락을 좌우로 움직이고&nbsp;&nbsp; <b>놓기</b> 화면을 톡 누르세요</p><div class="line bl-sunk" id="line"></div></section></main>
<script>
const F=[{n:"블루베리",e:"🫐",c:"#7569ff",r:13,p:1},{n:"포도",e:"🍇",c:"#8e5bd0",r:18,p:3},{n:"체리",e:"🍒",c:"#f04f66",r:24,p:6},{n:"레몬",e:"🍋",c:"#ffd43b",r:30,p:10},{n:"귤",e:"🍊",c:"#ff9f43",r:38,p:15},{n:"키위",e:"🥝",c:"#8bc34a",r:46,p:21},{n:"사과",e:"🍎",c:"#ef5350",r:55,p:28},{n:"망고",e:"🥭",c:"#ffb300",r:64,p:36},{n:"파인애플",e:"🍍",c:"#f5c84b",r:74,p:45},{n:"코코넛",e:"🥥",c:"#b98a5e",r:86,p:60}],W=360,H=560,DANGER=88,G=1180;
const $=s=>document.querySelector(s),canvas=$("#canvas"),ctx=canvas.getContext("2d");let balls=[],id=1,aim=W/2,current=rand(),upcoming=rand(),lastDrop=0,dangerSince=null,state="ready",score=0,sound=true,last=performance.now();
function rand(){return Math.floor(Math.random()*4)}function ui(){$("#score").textContent=score.toLocaleString();$("#best").textContent=(+localStorage.getItem("fruitmerge-best")||0).toLocaleString();$("#next").textContent=F[upcoming].e}function blip(p=520){if(!sound)return;try{const c=new AudioContext,o=c.createOscillator(),g=c.createGain();o.frequency.value=p;g.gain.setValueAtTime(.05,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.09);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+.1)}catch{}}
function reset(){balls=[];score=0;current=rand();upcoming=rand();dangerSince=null;state="playing";$("#result").hidden=true;$("#overlay").hidden=true;ui()}function over(){state="over";const best=Math.max(+localStorage.getItem("fruitmerge-best")||0,score);localStorage.setItem("fruitmerge-best",best);ui();$("#hero").textContent="🥥";$("#message").textContent="GAME OVER";$("#sub").textContent="위험선을 3초 동안 넘겼어요";$("#finalScore").textContent=score.toLocaleString();$("#finalBest").textContent=`최고 기록 ${best.toLocaleString()}점`;$("#result").hidden=false;$("#play").textContent="다시 하기";$("#overlay").hidden=false;window.blWeeklyReport?.(score);blip(120)}
function drop(){if(state!=="playing"){reset();return}const now=performance.now();if(now-lastDrop<420)return;const l=current,r=F[l].r;balls.push({id:id++,l,x:Math.max(r+3,Math.min(W-r-3,aim)),y:31,vx:0,vy:0,born:now,safe:false});current=upcoming;upcoming=rand();lastDrop=now;ui();blip(300)}
function fruit(x,y,r,e,c){ctx.save();ctx.shadowColor="#5e361e29";ctx.shadowBlur=10;ctx.shadowOffsetY=5;ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.shadowColor="transparent";ctx.strokeStyle="#ffffffc7";ctx.lineWidth=Math.max(2,r*.07);ctx.stroke();ctx.font=`${Math.max(18,r*1.12)}px Apple Color Emoji,Segoe UI Emoji`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(e,x,y+1);ctx.restore()}
function tick(now){const elapsed=Math.min(.12,(now-last)/1000),steps=Math.max(1,Math.ceil(elapsed/.018)),dt=elapsed/steps;last=now;if(state==="playing")for(let step=0;step<steps;step++)physics(dt,now);draw();requestAnimationFrame(tick)}
function physics(dt,now){if(state!=="playing")return;for(const b of balls){b.vy+=G*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;const r=F[b.l].r;if(b.x-r<0){b.x=r;b.vx=Math.abs(b.vx)*.38}if(b.x+r>W){b.x=W-r;b.vx=-Math.abs(b.vx)*.38}if(b.y+r>H){b.y=H-r;b.vy=-Math.abs(b.vy)*.2;b.vx*=.96}if(b.y-r>=DANGER)b.safe=true}const merged=new Set;for(let pass=0;pass<3;pass++)for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){const a=balls[i],b=balls[j];if(merged.has(a.id)||merged.has(b.id))continue;const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.001,min=F[a.l].r+F[b.l].r;if(d<min){if(a.l===b.l&&a.l<F.length-1&&now-a.born>120&&now-b.born>120){merged.add(a.id);merged.add(b.id);const l=a.l+1;balls.push({id:id++,l,x:(a.x+b.x)/2,y:(a.y+b.y)/2,vx:(a.vx+b.vx)/2,vy:-115,born:now,safe:true});score+=F[l].p;ui();blip(420+l*55)}else{const nx=dx/d,ny=dy/d,o=min-d;a.x-=nx*o*.5;a.y-=ny*o*.5;b.x+=nx*o*.5;b.y+=ny*o*.5;const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rv<0){const imp=-rv*.56;a.vx-=imp*nx;a.vy-=imp*ny;b.vx+=imp*nx;b.vy+=imp*ny}}}}if(merged.size)balls=balls.filter(b=>!merged.has(b.id));const danger=balls.some(b=>b.safe&&b.y-F[b.l].r<DANGER);if(danger){dangerSince??=now;if(now-dangerSince>3000)over()}else dangerSince=null}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle="#fffaf0";ctx.fillRect(0,0,W,H);ctx.strokeStyle="#f3a46f";ctx.lineWidth=3;ctx.setLineDash([8,8]);ctx.beginPath();ctx.moveTo(0,DANGER);ctx.lineTo(W,DANGER);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle="#d9755b";ctx.font="700 11px system-ui";ctx.fillText("DANGER",10,DANGER-8);if(state!=="over"){const f=F[current];ctx.globalAlpha=.28;ctx.strokeStyle=f.c;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(aim,12);ctx.lineTo(aim,H);ctx.stroke();ctx.globalAlpha=1;fruit(aim,28,f.r,f.e,f.c)}for(const b of balls){const f=F[b.l];fruit(b.x,b.y,f.r,f.e,f.c)}if(state==="playing"&&dangerSince!==null){const left=Math.max(1,Math.ceil((3000-(performance.now()-dangerSince))/1000));ctx.save();ctx.fillStyle="#d95b45e8";ctx.beginPath();ctx.roundRect(W/2-66,DANGER+13,132,38,19);ctx.fill();ctx.fillStyle="#fff";ctx.font="900 17px system-ui";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(`게임오버 ${left}`,W/2,DANGER+32);ctx.restore()}}
function point(x){const r=canvas.getBoundingClientRect();aim=(x-r.left)*W/r.width}canvas.addEventListener("pointermove",e=>point(e.clientX));canvas.addEventListener("pointerdown",e=>{point(e.clientX);drop()});$("#play").onclick=reset;/* 소리 토글은 우하단 공용 유틸 독으로 (다른 토이와 같은 자리) */(window.blDock=window.blDock||[]).push({id:"bl-mute",icon:"🔊",label:"소리 켜기/끄기",order:50,onClick:el=>{sound=!sound;el.textContent=sound?"🔊":"🔇"}});$("#line").innerHTML=F.map((f,i)=>`<span title="${f.n}">${f.e}${i<F.length-1?"<i>›</i>":""}</span>`).join("");ui();requestAnimationFrame(tick);window.blWeekly={game:"fruitmerge",dir:"max",fmt:v=>`${v.toLocaleString("ko-KR")}점`};window.blShareText=()=>`Fruit Merge 내 최고 기록은 ${+localStorage.getItem("fruitmerge-best")||score}점! 도전해보세요 🥥`;
</script>
<script defer src="/_shared/records.js"></script>\n<script defer src="/_shared/share.js"></script>
</body></html>
