<!doctype html>
<html lang="ko" class="bl-stage">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>10초 맞추기</title>
<link rel="stylesheet" href="/_shared/bubble.css">
<style>
  :root { color-scheme: light dark; --accent-h: 202; }
  body { margin: 0; min-height: 100vh;
         display: flex; flex-direction: column; align-items: center;
         justify-content: center; gap: var(--s-5); text-align: center;
         padding: var(--s-5) var(--s-4); box-sizing: border-box; user-select: none;
         -webkit-user-select: none; }
  .bl-head { margin: 0; text-align: left; }
  #clock { font-family: var(--mono); font-size: 4rem; font-weight: 700;
           min-height: 5rem; display: grid; place-items: center;
           padding: 0 1.4rem; border-radius: var(--r-lg); color: var(--ink); }
  #clock.hidden-time { filter: blur(14px); opacity: .35; }
  #msg { color: var(--muted); min-height: 2.6em; white-space: pre-line; line-height: 1.55; }
  #btn { font-size: 1.15rem; min-height: 3.2rem; padding: .8rem 2.8rem; }
  #best { color: var(--muted); font-size: var(--t-small); min-height: 1.2em; }
</style>
</head>
<body>
  <header class="bl-head">
    <span class="bl-bubble" aria-hidden="true">⏱</span>
    <h1>10초 맞추기</h1>
    <p>시계 없이 감으로 재는 10초</p>
  </header>
  <div id="clock" class="bl-num">0.000</div>
  <div id="msg">시작을 누르고, 정확히 10초라고 생각될 때 정지!
3초 뒤에 시계가 가려져요.</div>
  <button id="btn" class="bl-btn bl-btn--primary">시작</button>
  <div id="best" class="bl-num"></div>
<script>
const clock = document.getElementById("clock");
const msg = document.getElementById("msg");
const btn = document.getElementById("btn");
const bestEl = document.getElementById("best");

let running = false;
let startTime = 0;
let raf = null;
let best = null;

const formatError = (seconds) =>
  `${Math.round(seconds * 1000).toLocaleString("ko-KR")} ms`;

window.blWeekly = { game: "10sec", dir: "min", fmt: (v) => "오차 " + formatError(v) };

function tick() {
  const t = (performance.now() - startTime) / 1000;
  clock.textContent = t.toFixed(3);
  if (t >= 3) clock.classList.add("hidden-time");
  raf = requestAnimationFrame(tick);
}

btn.addEventListener("click", () => {
  if (!running) {
    running = true;
    startTime = performance.now();
    clock.classList.remove("hidden-time");
    msg.textContent = "…";
    btn.textContent = "정지";
    tick();
  } else {
    running = false;
    cancelAnimationFrame(raf);
    clock.classList.remove("hidden-time");
    const t = (performance.now() - startTime) / 1000;
    clock.textContent = t.toFixed(3);
    const diff = Math.abs(t - 10);
    if (best === null || diff < best) {
      best = diff;
      bestEl.textContent = `최고 기록: 오차 ${formatError(best)}`;
    }
    const grade =
      diff < 0.05 ? "🎯 인간 시계" :
      diff < 0.2  ? "🔥 대단한데요" :
      diff < 0.5  ? "👍 나쁘지 않아요" :
      diff < 1    ? "🙂 연습하면 돼요" : "🫠 시계 보는 법부터…";
    msg.textContent = `${t < 10 ? "-" : "+"}${formatError(diff)} ${grade}`;
    btn.textContent = "다시";
    window.blWeeklyReport?.(diff);
  }
});
</script>
<script defer src="/_shared/records.js"></script>
<script defer src="/_shared/share.js"></script>
</body>
</html>
