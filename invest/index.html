<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>잔고와 수익률 📈</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="bar">
  <h1>📈 잔고</h1>
  <div class="bar-right">
    <span id="updated" class="updated" aria-live="polite"></span>
    <button id="refresh" type="button">지금 갱신</button>
  </div>
</header>

<p id="notice" class="notice" role="status" hidden></p>

<!-- 그룹 탭. 좌우 스와이프로 넘기고, 탭을 눌러도 이동한다. -->
<nav id="tabs" class="tabs" role="tablist" aria-label="자산 그룹"></nav>

<div id="track" class="track">
  <p class="empty pane-empty">불러오는 중…</p>
</div>

<main>
  <section class="panel" aria-label="전체 수익률 추이">
    <h2>전체 수익률 추이 — 통화별</h2>
    <div id="chart" class="chart"><p class="empty">불러오는 중…</p></div>
    <p class="foot">집 PC 데몬이 하루에 한 점씩 올립니다. 토스 API에는 과거 자산
      추이가 없어서 이 화면을 켠 날부터 그려집니다.
      <strong>수익률은 예수금을 빼고 보유분만으로 계산합니다</strong> —
      원가가 없는 현금을 섞으면 수익률이 현금 비중만큼 희석됩니다.</p>
  </section>
</main>

<footer class="foot end">
  조회 전용입니다 — 이 화면은 주문을 낼 수 없습니다.
  <a href="/logout">로그아웃</a>
</footer>

<script defer src="app.js"></script>
</body>
</html>
