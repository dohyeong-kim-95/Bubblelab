# 서브도메인이 **자기 폴더 밖에서** 소유하는 경로. pre-commit 훅이 이 파일을
# 읽어 에이전트 브랜치의 커밋 범위를 강제한다.
#
#   <서브도메인>: <패턴> <패턴> …      (공백 구분, `*` 와일드카드)
#
# 이름 규칙(`_infra/<이름>.*`, `_infra/<이름>-*`, `_src/<이름>/**`,
# `_src/<이름>-*/**`)은 훅에 기본으로 들어 있으므로 여기 적을 필요 없다.
# 여기 적는 건 이름이 서브도메인과 다른 파일뿐이다.
#
# 여러 서브도메인이 한 줄씩 등록하는 공용 파일(www/index.html, _infra/worker.js,
# _infra/records.js …)은 아래 `*shared*` 에 있고, 허용되되 경고가 뜬다.
# 아무에게도 속하지 않는 공용 인프라(_infra/security.js, webpush.js, realtime.js,
# home-button.test.mjs, _shared/ 대부분)는 어느 목록에도 없다 = 에이전트가 못
# 건드린다. 필요하면 오케스트레이터가 처리한다.

admin: _infra/analytics.js _infra/analytics.test.mjs
assets: _infra/asset-flags.js _infra/asset-flags.test.mjs _infra/downloads.js _infra/downloads.test.mjs _infra/devices.test.mjs _infra/wallpaper.mjs _infra/wallpaper.test.mjs _infra/sticker-pack.mjs _infra/sticker-pack.test.mjs _infra/png.mjs _infra/apng.mjs _infra/gif.mjs _infra/gif.test.mjs
games: _infra/check-avalon-sync.mjs _infra/check-avalon-sync.test.mjs _infra/liargame.test.mjs _infra/stepcam.test.mjs _src/avalon/*
slop: _infra/animal-vs.test.mjs _infra/podium.test.mjs
util: _infra/brief.js _infra/brief.test.mjs _infra/fortune.js _infra/fortune.test.mjs _infra/planner.js _infra/planner.test.mjs _infra/chat.js _infra/chat.test.mjs _infra/proofread.test.mjs _infra/stars.test.mjs _infra/stars-skyline.test.mjs
work: _infra/workqna.js _infra/workqna.test.mjs _infra/reviews.js _infra/reviews.test.mjs _infra/emoticon*.mjs _infra/emoticon*.js _infra/skeleton*.mjs _src/emoticon/*
www: _infra/search-rules.test.mjs

# 공용 등록 파일 — 서브도메인마다 한 줄씩 더한다. 커밋은 되지만 훅이 경고하고,
# 오케스트레이터는 머지할 때 여기서 충돌이 날 것을 알고 순서를 잡는다.
*shared*: www/index.html _shared/search-rules.js _infra/records.js _infra/build.mjs _infra/worker.js _infra/worker.test.mjs _infra/e2e/smoke.spec.mjs wrangler.jsonc package.json package-lock.json
