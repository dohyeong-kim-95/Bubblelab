<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>달력</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>📅</text></svg>">
<style>
  :root { color-scheme: light dark; }
  html, body { height: 100%; }
  body { font-family: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Consolas, monospace;
         margin: 0; overflow: hidden; background: #05080c;
         color: light-dark(#1c2733, #dbe4ee); }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
             overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }

  /* 화면 자체가 배경화면이다. 무대는 기종 비율 그대로 화면에 최대 크기로 앉는다. */
  #app { position: fixed; inset: 0; display: grid; place-items: center; }
  #stage { position: relative; overflow: hidden; touch-action: none;
           box-shadow: 0 0 0 1px #ffffff1f; }
  #wallpaper, #stickers { position: absolute; inset: 0; width: 100%; height: 100%; }
  #wallpaper { display: block; }
  #stickers { overflow: hidden; }
  body:not(.editing) #stickers { pointer-events: none; }
  .sticker { position: absolute; transform-origin: center; height: auto; max-width: none;
             border: 2px solid transparent; border-radius: .2rem; touch-action: none;
             -webkit-user-drag: none; user-select: none; }
  .sticker.selected { border-color: #fff; outline: 2px solid #8ab8ff; }
  /* 시계·알림이 겹치는 상단 영역 안내 — 화면에만 있고 저장 PNG에는 안 들어간다 */
  #safe-guide { position: absolute; inset: 0 0 auto; height: 20%; pointer-events: none;
                display: grid; place-items: end end;
                border-bottom: 1px dashed light-dark(#1c273366, #dbe4ee55); }
  #safe-guide[hidden] { display: none; }
  #safe-guide span { font-size: .6rem; opacity: .5; padding: .3rem .4rem;
                     color: light-dark(#1c2733, #dbe4ee); }
  /* 지금 잡고 있는 대상(기본값 = 달력) */
  #cal-frame { position: absolute; pointer-events: none; border-radius: .35rem;
               border: 1.5px dashed #8ab8ff; }
  #cal-frame[hidden] { display: none; }
  #cal-frame::after { content: "달력"; position: absolute; top: .2rem; left: .2rem;
                      font-size: .62rem; padding: .1rem .35rem; border-radius: .3rem;
                      background: #8ab8ff; color: #06121f; }

  .bar { position: absolute; left: 0; right: 0; z-index: 3; color: #fff;
         display: flex; flex-direction: column; gap: .35rem; }
  .bar[hidden] { display: none; }
  .bar button { color: #fff; border: 1px solid #ffffff44; background: #ffffff14;
                font: inherit; border-radius: .5rem; cursor: pointer; padding: .5rem .8rem; }
  .bar button:hover:not(:disabled) { background: #ffffff2b; }
  .bar button:disabled { opacity: .4; cursor: default; }

  /* 편집 도구는 위쪽 — 시계·알림 자리라 어차피 오브젝트를 놓지 않는다 */
  .bar.top { top: 0; padding: max(.5rem, env(safe-area-inset-top)) .6rem .6rem;
             background: linear-gradient(#000000e8, #000000cc 62%, #0000); }
  .edit-row { display: flex; align-items: center; gap: .4rem; }
  #edit-device-label { flex: 1; min-width: 0; font-size: .72rem; opacity: .75;
                       overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .edit-row select { flex: 1; min-width: 0; font: inherit; font-size: .78rem; color: #fff;
                     background: #1b232ef2; border: 1px solid #ffffff44; border-radius: .4rem;
                     padding: .3rem .4rem; }
  .edit-row button { padding: .4rem .6rem; font-size: .76rem; flex: none; }
  #edit-device-change { font-size: .68rem; padding: .3rem .45rem; }
  #edit-save { background: #ffffff2e; font-weight: bold; }
  .edit-tools { display: grid; grid-template-columns: repeat(4, 1fr); gap: .3rem; }
  /* 좁은 무대에서도 한 줄로 — 줄바꿈되면 막대가 안전영역을 넘는다 */
  .edit-tools button { min-width: 0; padding: .45rem .15rem; font-size: .68rem;
                       white-space: nowrap; overflow: hidden; }
  #edit-hint { margin: 0; font-size: .66rem; line-height: 1.35; text-align: center;
               color: #ffffffcc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* 보기 상태의 아래 막대: 월 이동 + 꾸미기 + 저장 */
  .bar.bottom { bottom: 0; align-items: center; gap: .5rem;
                padding: 1.4rem .6rem max(.7rem, env(safe-area-inset-bottom));
                background: linear-gradient(#0000, #000000cc 38%, #000000ee); }
  .month-nav { display: flex; align-items: center; gap: .2rem; }
  .month-nav button { border: 0; background: none; opacity: .6; padding: .45rem .55rem;
                      font-size: .95rem; }
  .month-nav button:hover { opacity: 1; background: #ffffff1f; }
  .month-label { min-width: 7rem; text-align: center; font-size: .82rem; opacity: .85; }
  .view-actions { display: flex; gap: .4rem; align-items: center; flex-wrap: wrap;
                  justify-content: center; padding-right: 3.4rem; }
  .view-actions button { font-size: .8rem; }
  #view-save { background: #ffffff2e; font-weight: bold; }
  #today-btn { font-size: .74rem; padding: .4rem .6rem; }
  #today-btn[hidden] { display: none; }
  #view-note { margin: 0; font-size: .63rem; color: #ffffff9e; text-align: center; }
  #view-note[hidden] { display: none; }
  /* 저장 결과 안내는 두 상태 모두에서 같은 자리(화면 가운데)에 잠깐 뜬다 */
  #err { position: absolute; z-index: 5; left: 50%; top: 50%; transform: translate(-50%, -50%);
         margin: 0; max-width: 82%; padding: .5rem .8rem; border-radius: .6rem;
         background: #000000cc; color: #ffb0a4; font-size: .75rem; text-align: center; }
  #err:empty { display: none; }
  #err.info { color: #fff; }

  /* 스티커 고르기 시트 (util/photo의 에셋 픽커와 같은 구성) */
  #asset-picker { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column;
                  justify-content: flex-end; background: #0007; }
  #asset-picker[hidden] { display: none; }
  .picker-sheet { max-height: 72dvh; overflow-y: auto; padding: .9rem 1rem 1.2rem;
                  border-radius: 1rem 1rem 0 0;
                  background: light-dark(#fff, #141d28);
                  color: light-dark(#1c2733, #dbe4ee);
                  border-top: 1px solid light-dark(#dce3ea, #2a3747); }
  .picker-head { display: flex; justify-content: space-between; align-items: center; gap: .6rem; }
  .picker-head h3 { margin: 0; font-size: .92rem; }
  .picker-sheet button { font: inherit; color: inherit; cursor: pointer; border-radius: .5rem;
                         background: none; border: 1px solid light-dark(#1c273355, #dbe4ee55); }
  .picker-head button { padding: .4rem .8rem; font-size: .75rem; }
  .picker-status { margin: .5rem 0; opacity: .6; font-size: .72rem; line-height: 1.5; }
  .picker-tabs { display: flex; gap: .35rem; overflow-x: auto; padding: .55rem 0 .45rem;
                 scrollbar-width: none; }
  .picker-tabs::-webkit-scrollbar { display: none; }
  .picker-tabs button { flex: none; width: 3rem; height: 3rem; padding: .28rem;
                        display: grid; place-items: center; border-radius: .6rem; }
  .picker-tabs button.on { outline: 2px solid light-dark(#2563ab, #8ab8ff); }
  /* minmax(0,1fr) — 이미지 고유 폭이 트랙을 밀어내 가로로 넘치는 것 방지 */
  .picker-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .45rem;
                 min-height: 30dvh; align-content: start; touch-action: pan-y; }
  .picker-grid button { min-width: 0; padding: .3rem; aspect-ratio: 1; display: grid; place-items: center; }
  .picker-grid img { width: 100%; height: 100%; object-fit: contain; }
  .picker-tabs img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .picker-grid.swap-left { animation: packSwapL .16s ease-out; }
  .picker-grid.swap-right { animation: packSwapR .16s ease-out; }
  @keyframes packSwapL { from { opacity: .3; transform: translateX(14px); } }
  @keyframes packSwapR { from { opacity: .3; transform: translateX(-14px); } }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="wallpaper" role="img" aria-label="달력 배경화면"></canvas>
    <div id="stickers" aria-label="스티커 편집 영역"></div>
    <div id="safe-guide" hidden><span>시계·알림 영역</span></div>
    <div id="cal-frame" hidden></div>

    <!-- 꾸미기 상태: 도구 막대 -->
    <div class="bar top" id="edit-bar" hidden>
      <div class="edit-row">
        <button id="edit-close" type="button" aria-label="꾸미기 끝내기">✕</button>
        <span id="edit-device-label"></span>
        <select id="device" aria-label="휴대폰 기종 선택" hidden></select>
        <button id="edit-device-change" type="button" hidden>기종 바꾸기</button>
        <button id="edit-save" type="button">💾 저장</button>
      </div>
      <div class="edit-tools">
        <button id="edit-asset" type="button">🐶 스티커</button>
        <button id="edit-smaller" type="button">－ 크기</button>
        <button id="edit-larger" type="button">＋ 크기</button>
        <button id="edit-rotate" type="button" disabled>↻ 회전</button>
        <button id="edit-duplicate" type="button" disabled>복제</button>
        <button id="edit-remove" type="button" disabled>삭제</button>
        <button id="edit-cal" type="button">📅 달력</button>
        <button id="edit-reset" type="button">되돌리기</button>
      </div>
      <p id="edit-hint"></p>
    </div>

    <!-- 보기 상태: 월 이동과 시작 버튼 -->
    <div class="bar bottom" id="view-bar">
      <div class="month-nav">
        <button id="prev" type="button" aria-label="이전 달">◀</button>
        <!-- 배경화면 자체가 큰 월 제목을 갖고 있으므로 여기는 작게 (중복 인상 방지) -->
        <div class="month-label"><span id="month-label">달력</span></div>
        <button id="next" type="button" aria-label="다음 달">▶</button>
      </div>
      <div class="view-actions">
        <button id="today-btn" type="button" hidden>오늘로</button>
        <button id="decorate" type="button">🎨 꾸미기</button>
        <button id="view-save" type="button">💾 배경화면 저장</button>
      </div>
      <p id="view-note" hidden>● 오늘 표시는 화면에서만 보여요</p>
    </div>

    <p id="err" role="alert"></p>
  </div>
</div>

<!-- 화면은 캔버스라 읽히지 않는다. 스크린리더와 텍스트 선택을 위한 같은 내용의 표. -->
<table id="a11y-cal" class="sr-only">
  <caption id="a11y-caption"></caption>
  <thead>
    <tr>
      <th scope="col">일</th><th scope="col">월</th><th scope="col">화</th><th scope="col">수</th>
      <th scope="col">목</th><th scope="col">금</th><th scope="col">토</th>
    </tr>
  </thead>
  <tbody id="a11y-body"></tbody>
</table>

<div id="asset-picker" hidden>
  <div class="picker-sheet">
    <div class="picker-head">
      <h3>🖼️ 스티커</h3>
      <button id="close-picker" type="button">닫기</button>
    </div>
    <div class="picker-tabs" id="picker-tabs" hidden></div>
    <p class="picker-status" id="picker-status">assets.bubblelab.dev의 스티커입니다. 누르면 배경을 지우고 붙여드려요.</p>
    <div class="picker-grid" id="picker-body"></div>
  </div>
</div>

<script>
const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

// 월별 날짜 데이터: 7칸짜리 주 배열 (빈 칸은 null)
function monthData(y, m) {
  const firstDow = new Date(y, m, 1).getDay();
  const lastDate = new Date(y, m + 1, 0).getDate();
  const weeks = [];
  let week = new Array(firstDow).fill(null);
  for (let d = 1; d <= lastDate; d++) {
    week.push(d);
    if (week.length === 7) { weeks.push(week); week = []; }
  }
  if (week.length) { while (week.length < 7) week.push(null); weeks.push(week); }
  return { y, m, weeks };
}

// 현재 활성 테마의 색상 (배경화면 = 이 페이지의 배경색)
function themeColors() {
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  return dark
    ? { bg: "#10161f", fg: "#dbe4ee", sun: "#ff8a7a", sat: "#8ab8ff" }
    : { bg: "#eef2f6", fg: "#1c2733", sun: "#c0392b", sat: "#2563ab" };
}

const MONTHS_EN = ["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE",
                   "JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"];
const DOW_EN = ["SUN","MON","TUE","WED","THU","FRI","SAT"];

// today = 기기의 오늘, view = 보고 있는 달. cal은 view의 날짜 배열.
let today = new Date();
let view = { y: today.getFullYear(), m: today.getMonth() };
let cal = monthData(view.y, view.m);
let editing = false;

const isThisMonth = () => cal.y === today.getFullYear() && cal.m === today.getMonth();
// 오늘 강조는 화면에서만. 정적 이미지에 넣으면 내일부터 틀린 표시가 된다.
const screenToday = () => (isThisMonth() && !editing ? today.getDate() : 0);

// ---- 배경화면 그리기 ----
// 달력 블록의 위치·크기 (0~1 정규화). 화면에서 손으로 직접 옮기고 키운다.
const CAL_DEFAULT = { x: .5, y: .55, scale: .6 };
const calState = { ...CAL_DEFAULT };

// 셀 크기에 모든 치수가 비례한다 (연도 .55 + 월 1.15 + 요일 .85 + 주당 1.05).
function calGeometry(W, H, data, opt) {
  const cellToBlock = 0.55 + 1.15 + 0.85 + 1.05 * data.weeks.length;
  // 폴더블처럼 화면이 넓으면 W 기준 폭이 화면 높이를 넘어선다 — 잘리지 않게 함께 줄인다.
  const cell = Math.min(W * opt.scale / 7, H * 0.96 / cellToBlock);
  const bw = cell * 7, blockH = cell * cellToBlock;
  return {
    cell, bw, blockH,
    left: clamp(opt.x * W - bw / 2, 0, Math.max(0, W - bw)),
    top: clamp(opt.y * H - blockH / 2, 0, Math.max(0, H - blockH)),
  };
}

function drawWallpaper(canvas, data, c, opt) {
  const W = opt.w, H = opt.h;
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d");
  const mono = 'ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Consolas, monospace';

  ctx.fillStyle = c.bg;
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  const { cell, bw, left, top } = calGeometry(W, H, data, opt);
  const rowH = cell * 1.05;
  const yearH = cell * 0.55, monthH = cell * 1.15, dowH = cell * 0.85;
  const colX = (i) => left + cell * (i + .5);
  const center = left + bw / 2;

  let y = top;
  ctx.fillStyle = c.fg;
  ctx.globalAlpha = .6;
  ctx.font = `${cell * 0.30}px ${mono}`;
  ctx.fillText(String(data.y), center, y + yearH / 2);
  y += yearH;

  ctx.globalAlpha = 1;
  ctx.font = `bold ${cell * 0.62}px ${mono}`;
  ctx.fillText(MONTHS_EN[data.m], center, y + monthH / 2);
  y += monthH;

  ctx.font = `${cell * 0.21}px ${mono}`;
  DOW_EN.forEach((name, i) => {
    ctx.fillStyle = i === 0 ? c.sun : i === 6 ? c.sat : c.fg;
    ctx.globalAlpha = (i === 0 || i === 6) ? .9 : .5;
    ctx.fillText(name, colX(i), y + dowH / 2);
  });
  ctx.globalAlpha = 1;
  y += dowH;

  ctx.font = `${cell * 0.30}px ${mono}`;
  data.weeks.forEach((week, r) => {
    week.forEach((d, i) => {
      if (d === null) return;
      const cx = colX(i), cy = y + rowH * r + rowH / 2;
      if (d === opt.todayDate) {
        // 화면 전용 오늘 강조 (CSS의 .today와 같은 지름 2.1em)
        ctx.fillStyle = c.fg;
        ctx.beginPath();
        ctx.arc(cx, cy, cell * 0.315, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = c.bg;
      } else {
        ctx.fillStyle = i === 0 ? c.sun : i === 6 ? c.sat : c.fg;
      }
      ctx.fillText(String(d), cx, cy);
    });
  });
}

// 스티커는 화면에서 DOM으로 조작하고, 그릴 때만 캔버스에 합성한다.
function drawStickers(ctx, W, H) {
  for (const item of stickers) {
    const width = item.size * W;
    const height = width * item.image.naturalHeight / item.image.naturalWidth;
    ctx.save();
    ctx.translate(item.x * W, item.y * H);
    ctx.rotate(item.rotation * Math.PI / 180);
    ctx.drawImage(item.image, -width / 2, -height / 2, width, height);
    ctx.restore();
  }
}

// ---- 기종 ----
// screen(CSS px) × DPR = 실제 패널 픽셀. 실측해 보면 대부분 정확히 맞는다
// (S24 1080×2340, iPhone 15 Pro Max 1290×2796). DPR이 정수가 아닌 기기는 1~2px
// 어긋날 수 있어 짝수로 맞춘다 — 배경화면에는 영향 없다.
function detectDevice() {
  const dpr = devicePixelRatio || 1;
  const a = Math.round(screen.width * dpr), b = Math.round(screen.height * dpr);
  const w = Math.min(a, b) & ~1, h = Math.max(a, b) & ~1;
  const mobile = /Android|iPhone|iPod|iPad|Mobile/i.test(navigator.userAgent);
  if (mobile && w >= 640 && w <= 2400 && h <= 4400) return { w, h };
  return null;
}

const DEVICE_PRESETS = [
  ["Galaxy S26", 1080, 2340],
  ["Galaxy S26+ / Ultra", 1440, 3120],
  ["iPhone Pro Max", 1290, 2796],
  ["iPhone / Pro", 1179, 2556],
];

const deviceSel = document.getElementById("device");
const deviceLabel = document.getElementById("edit-device-label");
const deviceChangeBtn = document.getElementById("edit-device-change");
const detected = detectDevice();

if (detected) {
  const opt = document.createElement("option");
  opt.value = `${detected.w}x${detected.h}`;
  opt.textContent = `내 기기 (${detected.w}×${detected.h})`;
  deviceSel.appendChild(opt);
}
for (const [name, w, h] of DEVICE_PRESETS) {
  const opt = document.createElement("option");
  opt.value = `${w}x${h}`;
  opt.textContent = `${name} (${w}×${h})`;
  deviceSel.appendChild(opt);
}
if (!detected) deviceSel.value = "1080x2340"; // 인식 실패 시 기본값: Galaxy S26

// 자동 인식되면 고를 게 없으므로 선택창을 숨기고 해상도만 알려준다.
// (폴더블 커버화면처럼 어긋나는 경우를 위해 "기종 바꾸기"로 다시 꺼낼 수 있다.)
let devicePickerOpen = !detected;

function deviceSize() {
  const [w, h] = deviceSel.value.split("x").map(Number);
  return { w, h };
}

function refreshDeviceUi() {
  const { w, h } = deviceSize();
  deviceLabel.textContent = detected && deviceSel.selectedIndex === 0
    ? `내 기기 ${w}×${h}` : `${w}×${h}`;
  deviceLabel.hidden = devicePickerOpen;
  deviceChangeBtn.hidden = devicePickerOpen || !detected;
  deviceSel.hidden = !devicePickerOpen;
}
deviceChangeBtn.addEventListener("click", () => { devicePickerOpen = true; refreshDeviceUi(); });
deviceSel.addEventListener("change", () => {
  refreshDeviceUi();
  layoutStage();
  render();
});

function wallpaperOpt(shrinkTo = 0, todayDate = 0) {
  const { w, h } = deviceSize();
  // 화면에 그릴 때는 표시 크기만큼만 — 드래그·핀치 중 매 프레임 4백만 픽셀을
  // 새로 칠하지 않게. 레이아웃이 W·H에 비례하므로 구도는 저장본과 같다.
  const shrink = shrinkTo ? Math.min(1, shrinkTo / h) : 1;
  return { w: Math.round(w * shrink), h: Math.round(h * shrink),
           x: calState.x, y: calState.y, scale: calState.scale, todayDate };
}

// 저장용 캔버스: 배경+달력 위에 스티커까지 합성한 최종 이미지 (오늘 강조 없음)
function composeWallpaper() {
  const canvas = document.createElement("canvas");
  drawWallpaper(canvas, cal, themeColors(), wallpaperOpt());
  drawStickers(canvas.getContext("2d"), canvas.width, canvas.height);
  return canvas;
}

// 화면(뷰포트) 안에 기종 비율 그대로 최대 크기로 무대를 앉힌다.
// 브라우저 주소창 때문에 뷰포트가 실제 화면보다 짧을 수 있어 비율을 기준으로 맞춘다.
function layoutStage() {
  const { w, h } = deviceSize();
  const scale = Math.min(innerWidth / w, innerHeight / h);
  stage.style.width = `${Math.floor(w * scale)}px`;
  stage.style.height = `${Math.floor(h * scale)}px`;
}

let renderPending = false;
function render() {
  if (renderPending) return;
  renderPending = true;
  requestAnimationFrame(() => {
    renderPending = false;
    const opt = wallpaperOpt(1200, screenToday());
    drawWallpaper(wallpaperCv, cal, themeColors(), opt);
    // 달력 선택 테두리는 방금 그린 배치를 그대로 %로 옮긴다
    const g = calGeometry(opt.w, opt.h, cal, opt);
    calFrame.style.left = `${g.left / opt.w * 100}%`;
    calFrame.style.top = `${g.top / opt.h * 100}%`;
    calFrame.style.width = `${g.bw / opt.w * 100}%`;
    calFrame.style.height = `${g.blockH / opt.h * 100}%`;
  });
}

function renderA11yTable() {
  document.getElementById("a11y-caption").textContent =
    `${cal.y}년 ${cal.m + 1}월 달력`;
  const body = document.getElementById("a11y-body");
  body.textContent = "";
  for (const week of cal.weeks) {
    const row = body.insertRow();
    for (const d of week) {
      const cell = row.insertCell();
      if (d === null) continue;
      cell.textContent = isThisMonth() && d === today.getDate() ? `${d} (오늘)` : d;
    }
  }
}

function renderMonth() {
  cal = monthData(view.y, view.m);
  monthLabel.textContent = `${cal.y}. ${cal.m + 1}월`;
  document.title = `${cal.y}년 ${cal.m + 1}월 달력`;
  todayBtn.hidden = isThisMonth();
  viewNote.hidden = !isThisMonth() || editing;
  renderA11yTable();
  render();
}

function shiftMonth(delta) {
  const d = new Date(view.y, view.m + delta, 1);
  view = { y: d.getFullYear(), m: d.getMonth() };
  renderMonth();
}

document.getElementById("prev").addEventListener("click", () => shiftMonth(-1));

});

  if (event.target.closest("input, select, button")) return;

});

// ---- 저장 ----
function downloadCanvasPng(canvas, filename, done) {
  canvas.toBlob((blob) => {
    if (!blob) { done(new Error("PNG 인코딩 실패")); return; }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    done(null);
  }, "image/png");
}

// 모바일에서는 <a download>가 실제 파일 저장을 보장하지 않을 수 있다.
// 사용자 탭의 활성 상태를 유지하기 위해 PNG File을 동기 생성해 공유 시트를 연다.
function canvasPngFile(canvas, filename) {
  const dataUrl = canvas.toDataURL("image/png");
  const base64 = dataUrl.slice(dataUrl.indexOf(",") + 1);
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new File([bytes], filename, { type: "image/png" });
}

function isMobileDevice() {
  return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)
    || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
}

function canShareFile(file) {
  try {
    return typeof navigator.share === "function"
      && typeof navigator.canShare === "function"
      && navigator.canShare({ files: [file] });
  } catch (_) {
    return false;
  }
}

const mobileDevice = isMobileDevice();
const mobileFileShare = mobileDevice
  && canShareFile(new File([""], "calendar.png", { type: "image/png" }));

function saveWallpaper(button) {
  if (button.disabled) return;
  const idleLabel = button.textContent;
  button.disabled = true;
  button.textContent = "이미지 생성 중...";
  errEl.textContent = "";
  errEl.classList.remove("info");
  const restore = () => { button.disabled = false; button.textContent = idleLabel; };

  try {
    const canvas = composeWallpaper();
    const name = `calendar-${cal.y}-${String(cal.m + 1).padStart(2, "0")}-mobile.png`;

    if (mobileFileShare) {
      const file = canvasPngFile(canvas, name);
      if (canShareFile(file)) {
        navigator.share({ title: `${cal.y}년 ${cal.m + 1}월 달력`, files: [file] })
          .catch((err) => {
            if (err?.name !== "AbortError") {
              errEl.textContent = "공유 메뉴를 열지 못했습니다. 다시 시도해주세요.";
            }
          })
          .finally(restore);
        return;
      }
    }

    // 공유 파일을 지원하지 않는 브라우저는 파일 앱 다운로드로 대체한다.
    setTimeout(() => {
      downloadCanvasPng(canvas, name, (err) => {
        if (err) errEl.textContent = "배경화면을 생성하지 못했습니다.";
        else if (mobileDevice) {
          errEl.textContent = "다운로드를 요청했습니다. 파일 앱에서 확인해주세요.";
          errEl.classList.add("info");
        }
        restore();
      });
    }, 30);
  } catch (e) {
    errEl.textContent = "배경화면을 생성하지 못했습니다.";
    restore();
  }
}

// 새 스티커가 서로 겹치지 않게 화면 전체에 흩어 놓는다
const STICKER_SPOTS = [
  [.26, .12], [.74, .2], [.28, .3], [.72, .38], [.24, .84], [.76, .9],
  [.5, .14], [.3, .92], [.7, .12], [.22, .46], [.78, .74], [.5, .95],
];

function addStickerImage(image, url) {
  if (stickers.length >= MAX_STICKERS) return false;
  const spot = STICKER_SPOTS[stickers.length % STICKER_SPOTS.length];
  const item = { id: ++stickerId, image, el: image, url,
    x: spot[0], y: spot[1], size: .22, rotation: (stickers.length % 5 - 2) * 6 };
  image.className = "sticker";
  image.alt = "붙인 스티커";
  image.draggable = false;
  stickers.push(item);
  stickerLayer.appendChild(image);
  positionSticker(item);
  selectSticker(stickers.length - 1);
  return true;
}

document.getElementById("edit-remove").addEventListener("click", () => {
  const item = currentSticker();
  if (!item) return;
  item.el.remove();
  stickers.splice(selectedSticker, 1);
  selectSticker(-1);
});
document.getElementById("edit-duplicate").addEventListener("click", () => {
  const source = currentSticker();
  if (!source || stickers.length >= MAX_STICKERS) return;
  const image = new Image();
  image.addEventListener("load", () => {
    if (!addStickerImage(image, source.url)) return;
    const item = currentSticker();
    item.x = clamp(source.x + .06, 0, 1);
    item.y = clamp(source.y + .03, 0, 1);
    item.size = source.size;
    item.rotation = source.rotation;
    positionSticker(item);
  }, { once: true });
  image.src = source.url;
});
document.getElementById("edit-rotate").addEventListener("click", () => {
  const item = currentSticker();
  if (!item) return;
  item.rotation += 15;
  positionSticker(item);
});

// ＋/－ 크기는 잡고 있는 대상(달력 또는 선택한 스티커)에 적용된다
function resize(factor) {
  const item = currentSticker();
  if (item) {
    item.size = clamp(item.size * factor, .06, .8);
    positionSticker(item);
  } else {
    calState.scale = clamp(calState.scale * factor, .25, 1);
    render();
  }
}
document.getElementById("edit-smaller").addEventListener("click", () => resize(1 / 1.12));
document.getElementById("edit-larger").addEventListener("click", () => resize(1.12));

// ---- 제스처: 꾸미기 중엔 이동·크기, 보기 중엔 좌우로 밀어 월 이동 ----
const activePointers = new Map();
let gesture = null;
let viewSwipe = null;

function beginGesture() {
  const points = [...activePointers.values()];
  if (!points.length) { gesture = null; return; }
  const item = currentSticker();
  const base = item
    ? { x: item.x, y: item.y, size: item.size, rotation: item.rotation }
    : { x: calState.x, y: calState.y, size: calState.scale, rotation: 0 };
  if (points.length === 1) { gesture = { count: 1, base, point: points[0] }; return; }
  const [a, b] = points;
  gesture = { count: 2, base,
    mid: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 },
    distance: Math.hypot(b.x - a.x, b.y - a.y),
    angle: Math.atan2(b.y - a.y, b.x - a.x) };
}

stage.addEventListener("pointerdown", (event) => {
  if (event.target.closest(".bar")) return;   // 막대는 버튼으로 동작
  if (!editing) { viewSwipe = { x: event.clientX, y: event.clientY }; return; }
  event.preventDefault();
  const sticker = stickers.findIndex((item) => item.el === event.target);
  if (activePointers.size === 0) selectSticker(sticker);   // 첫 손가락이 대상을 정한다
  activePointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
  try { stage.setPointerCapture(event.pointerId); } catch (_) {}
  beginGesture();
});

stage.addEventListener("pointermove", (event) => {
  if (!activePointers.has(event.pointerId)) return;
  event.preventDefault();
  activePointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
  const points = [...activePointers.values()].slice(0, 2);
  const rect = stage.getBoundingClientRect();
  if (!gesture || gesture.count !== points.length) beginGesture();
  const item = currentSticker();
  let { x, y, size, rotation } = gesture.base;

  if (points.length === 1) {
    x += (points[0].x - gesture.point.x) / rect.width;
    y += (points[0].y - gesture.point.y) / rect.height;
  } else {
    const [a, b] = points, mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    const distance = Math.max(1, Math.hypot(b.x - a.x, b.y - a.y));
    x += (mid.x - gesture.mid.x) / rect.width;
    y += (mid.y - gesture.mid.y) / rect.height;
    size *= distance / Math.max(1, gesture.distance);
    if (item) rotation += (Math.atan2(b.y - a.y, b.x - a.x) - gesture.angle) * 180 / Math.PI;
  }

  if (item) {
    item.x = clamp(x, -.1, 1.1);
    item.y = clamp(y, -.05, 1.05);
    item.size = clamp(size, .06, .8);
    item.rotation = rotation;
    positionSticker(item);
  } else {
    // 달력은 화면 밖으로 나가지 않는다 (calGeometry가 최종 클램프도 한 번 더 한다)
    calState.x = clamp(x, 0, 1);
    calState.y = clamp(y, 0, 1);
    calState.scale = clamp(size, .25, 1);
    render();
  }
});

function endPointer(event) {
  // 보기 상태에서 좌우로 크게 밀면 월을 넘긴다 (세로 움직임과 구분)
  if (!editing && viewSwipe) {
    const dx = event.clientX - viewSwipe.x, dy = event.clientY - viewSwipe.y;
    viewSwipe = null;
    if (Math.abs(dx) >= 56 && Math.abs(dx) >= Math.abs(dy) * 1.6) shiftMonth(dx < 0 ? 1 : -1);
    return;
  }
  activePointers.delete(event.pointerId);
  beginGesture();
}
stage.addEventListener("pointerup", endPointer);
stage.addEventListener("pointercancel", endPointer);
// 데스크톱: 꾸미기 중 휠로 크기 조절
stage.addEventListener("wheel", (event) => {
  if (!editing) return;
  event.preventDefault();
  resize(event.deltaY < 0 ? 1.06 : 1 / 1.06);
}, { passive: false });

// ---- 스티커 고르기: /_assets 카탈로그의 스티커를 배경 제거 후 붙인다 ----
const escapeText = (value) => String(value).replace(/[&<>'"]/g, (char) => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;",
})[char]);
const assetPicker = document.getElementById("asset-picker");
const pickerBody = document.getElementById("picker-body");
const pickerTabs = document.getElementById("picker-tabs");
const pickerStatus = document.getElementById("picker-status");
const cutoutCache = new Map();
let stickerPacks = null, activePack = 0;

// 테두리에서 시작하는 flood fill로 흰 배경만 투명 처리 (그림 속 흰색은 유지)
// — util/photo, util/chat과 같은 방식
function cutoutWhiteBackground(imageData) {
  const { data, width, height } = imageData;
  const whiteness = (i) => Math.min(data[i], data[i + 1], data[i + 2]);
  const visited = new Uint8Array(width * height);
  const queue = [];
  for (let x = 0; x < width; x++) queue.push(x, (height - 1) * width + x);
  for (let y = 0; y < height; y++) queue.push(y * width, y * width + width - 1);
  while (queue.length) {
    const p = queue.pop();
    if (visited[p]) continue;
    visited[p] = 1;
    const i = p * 4;
    const w = whiteness(i);
    if (w < 208) continue;
    // 235 이상은 완전 투명, 208~235는 경계 안티앨리어싱을 살려 반투명 처리
    data[i + 3] = w >= 235 ? 0 : Math.round(((235 - w) / 27) * 255);
    const x = p % width, y = (p / width) | 0;
    if (x > 0) queue.push(p - 1);
    if (x < width - 1) queue.push(p + 1);
    if (y > 0) queue.push(p - width);
    if (y < height - 1) queue.push(p + width);
  }
}

async function addAssetSticker(src) {
  let url = cutoutCache.get(src);
  if (!url) {
    const source = new Image();
    source.src = src;
    await source.decode();
    const canvas = document.createElement("canvas");
    canvas.width = source.naturalWidth; canvas.height = source.naturalHeight;
    const context = canvas.getContext("2d");
    context.drawImage(source, 0, 0);
    const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
    cutoutWhiteBackground(imageData);
    context.putImageData(imageData, 0, 0);
    const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
    if (!blob) throw new Error("cutout failed");
    url = URL.createObjectURL(blob);
    cutoutCache.set(src, url);
  }
  const image = new Image();
  image.src = url;
  await image.decode();
  return addStickerImage(image, url);
}

// 카카오톡 이모티콘 픽커처럼 팩 탭을 두고 현재 팩의 스티커만 로드한다
function renderPickerPack(direction = 0) {
  const pack = stickerPacks[activePack];
  [...pickerTabs.children].forEach((tab, index) => {
    tab.classList.toggle("on", index === activePack);
    if (index === activePack) tab.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
  });
  pickerStatus.textContent = `${pack.title} · 누르면 배경을 지우고 붙여드려요.`;
  pickerBody.innerHTML = pack.downloads
    .filter((download) => /\.(png|webp|jpe?g)$/i.test(download.file))
    .map((download) => `<button type="button" data-src="${escapeText(download.url)}" aria-label="${escapeText(download.label)}">
      <img src="${escapeText(download.url)}" alt="" loading="lazy" decoding="async"></button>`).join("");
  pickerBody.classList.remove("swap-left", "swap-right");
  if (direction) {
    void pickerBody.offsetWidth;
    pickerBody.classList.add(direction > 0 ? "swap-left" : "swap-right");
  }
}

// 그리드에서 좌우 스와이프로 이웃 팩으로 이동 (세로 스크롤과 구분)
let packSwipe = null;
pickerBody.addEventListener("touchstart", (event) => {
  packSwipe = { x: event.touches[0].clientX, y: event.touches[0].clientY };
}, { passive: true });
pickerBody.addEventListener("touchend", (event) => {
  if (!packSwipe || !stickerPacks) return;
  const dx = event.changedTouches[0].clientX - packSwipe.x;
  const dy = event.changedTouches[0].clientY - packSwipe.y;
  packSwipe = null;
  if (Math.abs(dx) < 56 || Math.abs(dx) < Math.abs(dy) * 1.6) return;
  const next = activePack + (dx < 0 ? 1 : -1);
  if (next < 0 || next >= stickerPacks.length) return;
  activePack = next;
  renderPickerPack(dx < 0 ? 1 : -1);
}, { passive: true });

async function openAssetPicker() {
  assetPicker.hidden = false;
  if (stickerPacks) return;
  pickerStatus.textContent = "스티커를 불러오는 중…";
  try {
    const response = await fetch("/_assets/catalog.json", { cache: "no-cache" });
    if (!response.ok) throw new Error("catalog unavailable");
    const catalog = await response.json();
    const packs = (catalog.items || []).filter((item) => item.category === "sticker"
      && item.downloads.some((download) => /\.(png|webp|jpe?g)$/i.test(download.file)));
    if (!packs.length) { pickerStatus.textContent = "아직 등록된 스티커가 없습니다."; return; }
    stickerPacks = packs;
    pickerTabs.hidden = false;
    pickerTabs.innerHTML = packs.map((pack, index) =>
      `<button type="button" data-pack="${index}" aria-label="${escapeText(pack.title)}">
        <img src="${escapeText(pack.preview)}" alt="" decoding="async"></button>`).join("");
    renderPickerPack();
  } catch (_) {
    pickerStatus.textContent = "스티커 목록을 불러오지 못했습니다. 잠시 후 다시 시도해주세요.";
  }
}

pickerTabs.addEventListener("click", (event) => {
  const tab = event.target.closest("button[data-pack]");
  if (!tab) return;
  activePack = Number(tab.dataset.pack);
  renderPickerPack();
});
document.getElementById("edit-asset").addEventListener("click", openAssetPicker);
document.getElementById("close-picker").addEventListener("click", () => { assetPicker.hidden = true; });
assetPicker.addEventListener("click", (event) => {
  if (event.target === assetPicker) assetPicker.hidden = true;
});
pickerBody.addEventListener("click", async (event) => {
  const button = event.target.closest("button[data-src]");
  if (!button) return;
  if (stickers.length >= MAX_STICKERS) {
    pickerStatus.textContent = `스티커는 최대 ${MAX_STICKERS}개까지 붙일 수 있습니다.`;
    return;
  }
  button.disabled = true;
  try {
    await addAssetSticker(button.dataset.src);
    pickerStatus.textContent = `붙였어요! (${stickers.length}/${MAX_STICKERS}) 계속 고르거나 닫기를 눌러주세요.`;
  } catch (_) {
    pickerStatus.textContent = "이 스티커는 불러오지 못했습니다.";
  } finally {
    button.disabled = false;
  }
});

refreshDeviceUi();
layoutStage();
renderMonth();
updateControls();
</script>
<script defer src="/_shared/share.js"></script>
</body>
</html>
