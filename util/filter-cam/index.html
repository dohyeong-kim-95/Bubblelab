<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>📷 필터 카메라</title>
<meta name="description" content="플래시 디카·로파이·필름 같은 요즘 필터와 볼록거울·타임 워프 같은 장난 필터를 실시간으로 보며 찍고 저장하는 카메라. 사진은 기기 밖으로 나가지 않습니다.">
<meta name="bl-group" content="사진·이미지">
<link rel="stylesheet" href="/_shared/bubble.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>📷</text></svg>">
<style>
  :root { --accent-h: 66; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; min-height: 100dvh; user-select: none; -webkit-user-select: none; }
  button { font: inherit; color: var(--ink); cursor: pointer; border: 1px solid var(--line);
           background: var(--field); border-radius: var(--r); padding: .7rem 1rem; }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .42; cursor: default; transform: none; }
  .app { width: min(30rem, 100%); margin: 0 auto; padding: 1rem 1rem 1.5rem;
         display: flex; flex-direction: column; gap: .8rem; }
  .app > .bl-head { margin: 0 0 .1rem; }
  /* 뷰파인더는 언제나 어두운 면 — 테마와 상관없이 검정 위 밝은 글씨 */
  .stage { position: relative; width: 100%; aspect-ratio: 4 / 5; border-radius: var(--r-lg); overflow: hidden;
           background: #000; box-shadow: 0 0 0 1px var(--line), 0 14px 32px -18px #0008; }
  .stage canvas, .stage img { width: 100%; height: 100%; display: block; object-fit: cover; }
  .empty { position: absolute; inset: 0; display: grid; place-content: center; gap: .8rem;
           padding: 1.5rem; text-align: center; color: #ece8df; }
  .empty p { margin: 0; font-size: .88rem; line-height: 1.6; color: #b9bdc6; }
  .empty .notice { color: #f3bd5c; min-height: 1.6em; }
  #start { justify-self: center; min-width: 11rem; }
  /* 화면에 붙어 있어야 아이폰 사파리가 영상을 돌린다. 보이지 않게 캔버스 뒤에 깐다. */
  #camera { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; pointer-events: none; }
  #result { position: absolute; inset: 0; }
  /* 감성·장난 — 한 단 낮은 홈 안의 세그먼트 */
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: .25rem; padding: .25rem;
          border-radius: var(--pill); }
  .tabs button { padding: .5rem; min-height: 2.4rem; font-size: .9rem; border: 0; border-radius: var(--pill);
                 background: transparent; color: var(--muted); }
  .tabs button[aria-selected="true"] { background: var(--field); color: var(--ink); font-weight: 700;
                                       box-shadow: 0 0 0 1px var(--accent-line), 0 1px 3px #0002; }
  .filters { flex-wrap: nowrap; overflow-x: auto; padding-bottom: .2rem;
             scroll-snap-type: x proximity; scrollbar-width: none; }
  .filters::-webkit-scrollbar { display: none; }
  .filters button { flex: none; scroll-snap-align: center; white-space: nowrap; }
  .filters button[aria-pressed="true"] { font-weight: 700; }
  .controls { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: .8rem; }
  /* 셔터 — 강조색 방울 */
  #shoot { width: 4.4rem; height: 4.4rem; border-radius: 50%; padding: 0;
           border: .3rem solid var(--bg);
           background: radial-gradient(circle at 32% 28%, rgb(255 255 255 / .55) 0 9%, transparent 26%),
                       var(--accent);
           box-shadow: 0 0 0 2px var(--accent); }
  #switch { justify-self: start; width: 3rem; height: 3rem; padding: 0; border-radius: 50%; font-size: 1.15rem; }
  #shotActions { display: none; gap: .6rem; }
  #shotActions.on { display: grid; grid-template-columns: 1fr 1fr; }
  .status { margin: 0; min-height: 1.2em; text-align: center; font-size: .82rem; color: var(--muted); }
  .privacy { margin: 0; text-align: center; }
</style>
</head>
<body>
<main class="app">
  <header class="bl-head">
    <span class="bl-bubble" aria-hidden="true">📷</span>
    <h1>필터 카메라</h1>
    <p>플래시 디카·로파이·필름 같은 요즘 필터와 볼록거울·타임 워프 같은 장난 필터를 실시간으로 보며 찍고 저장하는 카메라.</p>
  </header>

  <div class="stage">
    <video id="camera" autoplay muted playsinline></video>
    <canvas id="preview" width="432" height="540" aria-label="필터 미리보기"></canvas>
    <img id="result" alt="찍은 사진" hidden>
    <div class="empty" id="empty">
      <p>요즘 유행하는 감성 필터와 장난 필터를 실시간으로 보면서 찍어요.</p>
      <p class="notice" id="notice" role="alert"></p>
      <button class="primary bl-btn bl-btn--primary" id="start" type="button">카메라 켜기</button>
    </div>
  </div>

  <div class="tabs bl-sunk" id="tabs" role="tablist" aria-label="필터 종류">
    <button type="button" role="tab" data-group="mood" aria-selected="true">✨ 감성</button>
    <button type="button" role="tab" data-group="fun" aria-selected="false">🤪 장난</button>
  </div>
  <div class="filters bl-chips" id="filters" role="group" aria-label="필터"></div>

  <div class="controls" id="cameraControls">
    <button id="switch" type="button" disabled aria-label="전면·후면 전환">🔄</button>
    <button id="shoot" type="button" disabled aria-label="찍기"></button>
    <span></span>
  </div>
  <div id="shotActions">
    <button class="bl-btn" id="retake" type="button">다시 찍기</button>
    <button class="primary bl-btn bl-btn--primary" id="save" type="button">저장</button>
  </div>

  <p class="status" id="status" role="status"></p>
  <p class="privacy bl-note">사진은 이 기기 브라우저 안에서만 만들어지고 서버로 전송되지 않습니다.</p>
</main>

<script type="module">
import { FILTERS, applyColor, applyEffect, applyLayers } from "./filters.js";

const $ = (id) => document.getElementById(id);
const preview = $("preview");
const pctx = preview.getContext("2d", { willReadFrequently: true });
const scratch = document.createElement("canvas");
const video = $("camera");

let stream = null;
let facing = "user";
let current = FILTERS[1];
let group = "mood";
let frame = 0;
let raf = 0;
let shot = null; // { blob, url, name }
let scan = null; // 타임 워프 진행 상태 { live, frozen, y, last }

// ── 탭 · 필터 고르기 ──
const filterBox = $("filters");
function selectFilter(filter) {
  current = filter;
  for (const b of filterBox.children) b.setAttribute("aria-pressed", String(b.dataset.id === filter.id));
  $("status").textContent = filter.hint ?? "";
}
function showGroup(name) {
  group = name;
  for (const tab of $("tabs").children) tab.setAttribute("aria-selected", String(tab.dataset.group === name));
  filterBox.replaceChildren();
  for (const filter of FILTERS.filter((f) => f.group === name)) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "bl-chip";
    button.textContent = filter.name;
    button.dataset.id = filter.id;
    button.setAttribute("aria-pressed", String(filter === current));
    button.addEventListener("click", () => {
      selectFilter(filter);
      button.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
    });
    filterBox.append(button);
  }
  filterBox.scrollLeft = 0;
}
for (const tab of $("tabs").children) tab.addEventListener("click", () => showGroup(tab.dataset.group));
showGroup("mood");

// 영상 가운데를 4:5 로 잘라 캔버스에 그린다. 전면 카메라는 거울처럼 뒤집는다.
function drawFrame(ctx, canvas) {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) return false;
  const target = canvas.width / canvas.height;
  let sw = vw, sh = vh;
  if (vw / vh > target) sw = vh * target; else sh = vw / target;
  const sx = (vw - sw) / 2, sy = (vh - sh) / 2;
  ctx.save();
  if (facing === "user") { ctx.translate(canvas.width, 0); ctx.scale(-1, 1); }
  ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
  ctx.restore();
  return true;
}

function render(ctx, canvas) {
  if (!drawFrame(ctx, canvas)) return false;
  if (current.effect && current.effect !== "timewarp") {
    const src = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const dst = ctx.createImageData(src);
    applyEffect(src, dst, current);
    ctx.putImageData(dst, 0, 0);
  } else if (current.id !== "original" && !current.effect) {
    const image = ctx.getImageData(0, 0, canvas.width, canvas.height);
    applyColor(image.data, current, frame++);
    ctx.putImageData(image, 0, 0);
  }
  applyLayers(ctx, canvas, current, scratch);
  return true;
}

function drawScanLine(ctx, canvas, y) {
  ctx.fillStyle = "#29adff";
  ctx.fillRect(0, Math.max(0, y - 2), canvas.width, 4);
}

function loop() {
  if (scan) stepScan();
  else {
    render(pctx, preview);
    if (current.effect === "timewarp") drawScanLine(pctx, preview, 0);
  }
  raf = requestAnimationFrame(loop);
}

// ── 타임 워프: 선이 지나간 줄은 그 순간의 영상으로 굳는다 ──
const SCAN_MS = 6000;
function startScan() {
  const live = makeOutputCanvas(), frozen = makeOutputCanvas();
  scan = { live, frozen, y: 0, last: performance.now() };
  setBusy(true);
}
function stepScan() {
  const { live, frozen } = scan;
  const now = performance.now();
  const next = Math.min(live.height, scan.y + (live.height * (now - scan.last)) / SCAN_MS);
  scan.last = now;
  drawFrame(live.getContext("2d"), live);
  const from = Math.floor(scan.y), rows = Math.ceil(next) - from;
  if (rows > 0) frozen.getContext("2d").drawImage(live, 0, from, live.width, rows, 0, from, live.width, rows);
  scan.y = next;
  // 미리보기: 위쪽은 굳은 줄, 아래쪽은 지금 영상.
  const k = preview.height / live.height, cut = Math.floor(next * k);
  pctx.drawImage(live, 0, 0, preview.width, preview.height);
  if (cut > 0) pctx.drawImage(frozen, 0, 0, live.width, cut / k, 0, 0, preview.width, cut);
  drawScanLine(pctx, preview, cut);
  if (next >= live.height) {
    const done = scan.frozen;
    scan = null;
    setBusy(false);
    finishShot(done);
  }
}

function setBusy(on) {
  $("shoot").disabled = on;
  $("switch").disabled = on;
  for (const b of [...filterBox.children, ...$("tabs").children]) b.disabled = on;
}

// ── 카메라 ──
// 안내는 카메라를 켜기 전에는 버튼 바로 위에, 켠 뒤에는 아래 상태줄에 낸다.
function notify(text) {
  $("notice").textContent = text;
  $("status").textContent = $("empty").hidden ? text : "";
}

// 영상이 실제로 흐르기 시작할 때까지 기다린다. 재생이 끝내 시작되지 않는 브라우저에서
// 버튼이 멈춘 것처럼 보이지 않게 몇 초 뒤에는 포기하고 안내한다.
function waitForVideo(ms = 6000) {
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => reject(new Error("timeout")), ms);
    const ready = () => { if (video.videoWidth) { clearTimeout(timer); resolve(); } };
    video.addEventListener("loadedmetadata", ready, { once: true });
    video.addEventListener("playing", ready, { once: true });
    video.play().then(ready, () => {});
    ready();
  });
}

async function startCamera() {
  if (!navigator.mediaDevices?.getUserMedia) {
    notify("이 브라우저에서는 카메라를 쓸 수 없어요. 카카오톡·인스타 안의 브라우저라면 사파리나 크롬으로 열어 주세요.");
    return;
  }
  const start = $("start");
  start.disabled = true;
  notify("카메라 권한을 확인하는 중…");
  stopCamera();
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: facing }, width: { ideal: 1920 }, height: { ideal: 1920 } }, audio: false,
    });
    video.srcObject = stream;
    await waitForVideo();
    $("empty").hidden = true;
    $("shoot").disabled = false;
    $("switch").disabled = false;
    notify(current.hint ?? "");
    loop();
  } catch (err) {
    stopCamera();
    $("empty").hidden = false;
    $("shoot").disabled = true;
    $("switch").disabled = true;
    notify(err?.name === "NotAllowedError"
      ? "카메라 권한이 막혀 있어요. 주소창의 설정(아이폰은 aA 메뉴)에서 카메라를 허용한 뒤 다시 눌러 주세요."
      : err?.message === "timeout"
        ? "카메라 화면이 열리지 않았어요. 한 번 더 눌러 보시고, 그래도 안 되면 사파리·크롬에서 열어 주세요."
        : "카메라를 열지 못했어요. 다른 앱이 카메라를 쓰고 있다면 닫고 다시 눌러 주세요.");
  } finally {
    start.disabled = false;
  }
}

function stopCamera() {
  cancelAnimationFrame(raf);
  if (scan) { scan = null; setBusy(false); }
  stream?.getTracks().forEach((track) => track.stop());
  stream = null;
  video.srcObject = null;
}

$("start").addEventListener("click", startCamera);
$("switch").addEventListener("click", () => {
  facing = facing === "user" ? "environment" : "user";
  startCamera();
});

// ── 찍기 · 저장 ──
function showShot(on) {
  $("result").hidden = !on;
  $("cameraControls").hidden = on;
  $("shotActions").classList.toggle("on", on);
  $("filters").hidden = on;
  $("tabs").hidden = on;
}

// 미리보기보다 큰 해상도(최대 1080×1350)로 그린다.
function makeOutputCanvas() {
  const out = document.createElement("canvas");
  const scale = Math.min(1, video.videoHeight / 1350, video.videoWidth / 1080) || 1;
  out.width = Math.round(1080 * scale);
  out.height = Math.round(1350 * scale);
  return out;
}

async function finishShot(canvas) {
  const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", 0.92));
  if (!blob) { $("status").textContent = "사진을 만들지 못했어요."; return; }
  if (shot) URL.revokeObjectURL(shot.url);
  shot = { blob, url: URL.createObjectURL(blob), name: `filter-${current.id}-${Date.now()}.jpg` };
  $("result").src = shot.url;
  cancelAnimationFrame(raf);
  showShot(true);
}

$("shoot").addEventListener("click", () => {
  if (current.effect === "timewarp") { startScan(); return; }
  const out = makeOutputCanvas();
  if (!render(out.getContext("2d", { willReadFrequently: true }), out)) return;
  finishShot(out);
});

$("retake").addEventListener("click", () => {
  showShot(false);
  if (stream) loop();
});

$("save").addEventListener("click", async () => {
  if (!shot) return;
  // 폰에서는 공유 시트로 "사진에 저장"이 가장 빠르다. 안 되면 파일로 내려받는다.
  const file = new File([shot.blob], shot.name, { type: "image/jpeg" });
  if (navigator.canShare?.({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; } catch (err) {
      if (err?.name === "AbortError") return;
    }
  }
  const link = document.createElement("a");
  link.href = shot.url;
  link.download = shot.name;
  link.click();
});

document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    cancelAnimationFrame(raf);
    if (scan) { scan = null; setBusy(false); }
  } else if (stream && $("result").hidden) loop();
});
</script>
<script defer src="/_shared/share.js"></script>
</body>
</html>
