<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>📷 필터 카메라</title>
<meta name="description" content="플래시 디카·로파이·필름 같은 요즘 필터를 실시간으로 보며 찍고 저장하는 카메라. 사진은 기기 밖으로 나가지 않습니다.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>📷</text></svg>">
<style>
  :root { color-scheme: light dark; --bg: light-dark(#f2f4f7, #0d131c);
          --panel: light-dark(#fff, #171f2b); --line: light-dark(#d9e0e7, #2a3646);
          --text: light-dark(#1c2733, #e2e9f0); --muted: light-dark(#6e7985, #91a0b2);
          --accent: #e0782f; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--text);
         font-family: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Consolas, monospace;
         user-select: none; -webkit-user-select: none; }
  button { font: inherit; color: inherit; cursor: pointer; border: 1px solid var(--line);
           background: var(--panel); border-radius: .75rem; padding: .7rem 1rem; }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .42; cursor: default; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: bold; }
  .app { width: min(30rem, 100%); margin: 0 auto; padding: .8rem 1rem 1.5rem;
         display: flex; flex-direction: column; gap: .8rem; }
  h1 { margin: .2rem 0 0; font-size: 1rem; text-align: center; }
  .stage { position: relative; width: 100%; aspect-ratio: 4 / 5; border-radius: 1rem; overflow: hidden;
           background: #000; border: 1px solid var(--line); }
  .stage canvas, .stage img { width: 100%; height: 100%; display: block; object-fit: cover; }
  .empty { position: absolute; inset: 0; display: grid; place-content: center; gap: .8rem;
           padding: 1.5rem; text-align: center; color: #e2e9f0; }
  .empty p { margin: 0; font-size: .78rem; line-height: 1.6; color: #b9c4d0; }
  #result { position: absolute; inset: 0; }
  .filters { display: flex; gap: .45rem; overflow-x: auto; padding-bottom: .2rem;
             scroll-snap-type: x proximity; scrollbar-width: none; }
  .filters::-webkit-scrollbar { display: none; }
  .filters button { flex: none; scroll-snap-align: center; padding: .5rem .8rem; font-size: .78rem;
                    border-radius: 999px; white-space: nowrap; }
  .filters button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent);
                                         color: #fff; font-weight: bold; }
  .controls { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: .8rem; }
  #shoot { width: 4.4rem; height: 4.4rem; border-radius: 50%; padding: 0;
           border: .3rem solid var(--panel); background: var(--accent);
           box-shadow: 0 0 0 2px var(--accent); }
  #switch { justify-self: start; }
  #shotActions { display: none; gap: .6rem; }
  #shotActions.on { display: grid; grid-template-columns: 1fr 1fr; }
  .status { margin: 0; min-height: 1.2em; text-align: center; font-size: .72rem; color: var(--muted); }
  .privacy { margin: 0; text-align: center; font-size: .66rem; line-height: 1.55; color: var(--muted); }
</style>
</head>
<body>
<main class="app">
  <h1>📷 필터 카메라</h1>

  <div class="stage">
    <canvas id="preview" width="432" height="540" aria-label="필터 미리보기"></canvas>
    <img id="result" alt="찍은 사진" hidden>
    <div class="empty" id="empty">
      <p>요즘 유행하는 필터를 실시간으로 보면서 찍어요.</p>
      <button class="primary" id="start" type="button">카메라 켜기</button>
    </div>
  </div>

  <div class="filters" id="filters" role="group" aria-label="필터"></div>

  <div class="controls" id="cameraControls">
    <button id="switch" type="button" disabled aria-label="전면·후면 전환">🔄</button>
    <button id="shoot" type="button" disabled aria-label="찍기"></button>
    <span></span>
  </div>
  <div id="shotActions">
    <button id="retake" type="button">다시 찍기</button>
    <button class="primary" id="save" type="button">저장</button>
  </div>

  <p class="status" id="status" role="status"></p>
  <p class="privacy">사진은 이 기기 브라우저 안에서만 만들어지고 서버로 전송되지 않습니다.</p>
</main>

<script type="module">
import { FILTERS, applyColor, applyLayers } from "./filters.js";

const $ = (id) => document.getElementById(id);
const preview = $("preview");
const pctx = preview.getContext("2d", { willReadFrequently: true });
const scratch = document.createElement("canvas");
const video = document.createElement("video");
video.muted = true; video.playsInline = true; video.setAttribute("playsinline", "");

let stream = null;
let facing = "user";
let current = FILTERS[1];
let frame = 0;
let raf = 0;
let shot = null; // { blob, url }

// ── 필터 고르기 ──
const filterBox = $("filters");
for (const filter of FILTERS) {
  const button = document.createElement("button");
  button.type = "button";
  button.textContent = filter.name;
  button.dataset.id = filter.id;
  button.setAttribute("aria-pressed", String(filter === current));
  button.addEventListener("click", () => {
    current = filter;
    for (const b of filterBox.children) b.setAttribute("aria-pressed", String(b.dataset.id === filter.id));
    button.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
  });
  filterBox.append(button);
}

// 영상 가운데를 4:5 로 잘라 캔버스에 그린다. 전면 카메라는 거울처럼 뒤집는다.
function drawFrame(ctx, canvas) {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) return false;
  const target = canvas.width / canvas.height;
  let sw = vw, sh = vh;
  if (vw / vh > target) sw = vh * target; else sh = vw / target;
  const sx = (vw - sw) / 2, sy = (vh - sh) / 2;
  ctx.save();
  if (facing === "user") { ctx.translate(canvas.width, 0); ctx.scale(-1, 1); }
  ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
  ctx.restore();
  return true;
}

function render(ctx, canvas) {
  if (!drawFrame(ctx, canvas)) return false;
  if (current.id !== "original") {
    const image = ctx.getImageData(0, 0, canvas.width, canvas.height);
    applyColor(image.data, current, frame++);
    ctx.putImageData(image, 0, 0);
  }
  applyLayers(ctx, canvas, current, scratch);
  return true;
}

function loop() {
  render(pctx, preview);
  raf = requestAnimationFrame(loop);
}

// ── 카메라 ──
async function startCamera() {
  if (!navigator.mediaDevices?.getUserMedia) {
    $("status").textContent = "이 브라우저는 카메라를 지원하지 않아요.";
    return;
  }
  $("status").textContent = "카메라 권한을 확인하는 중…";
  stopCamera();
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: facing }, width: { ideal: 1920 }, height: { ideal: 1920 } }, audio: false,
    });
    video.srcObject = stream;
    await video.play();
    $("empty").hidden = true;
    $("shoot").disabled = false;
    $("switch").disabled = false;
    $("status").textContent = "";
    cancelAnimationFrame(raf);
    loop();
  } catch (err) {
    $("status").textContent = err?.name === "NotAllowedError"
      ? "카메라 권한이 필요해요. 브라우저 설정에서 허용해 주세요."
      : "카메라를 열지 못했어요. 기본 브라우저에서 열어 보세요.";
  }
}

function stopCamera() {
  cancelAnimationFrame(raf);
  stream?.getTracks().forEach((track) => track.stop());
  stream = null;
}

$("start").addEventListener("click", startCamera);
$("switch").addEventListener("click", () => {
  facing = facing === "user" ? "environment" : "user";
  startCamera();
});

// ── 찍기 · 저장 ──
function showShot(on) {
  $("result").hidden = !on;
  $("cameraControls").hidden = on;
  $("shotActions").classList.toggle("on", on);
  $("filters").hidden = on;
}

$("shoot").addEventListener("click", async () => {
  // 미리보기보다 큰 해상도(최대 1080×1350)로 같은 필터를 한 번 더 그린다.
  const out = document.createElement("canvas");
  const scale = Math.min(1, video.videoHeight / 1350, video.videoWidth / 1080) || 1;
  out.width = Math.round(1080 * scale);
  out.height = Math.round(1350 * scale);
  if (!render(out.getContext("2d", { willReadFrequently: true }), out)) return;
  const blob = await new Promise((resolve) => out.toBlob(resolve, "image/jpeg", 0.92));
  if (!blob) { $("status").textContent = "사진을 만들지 못했어요."; return; }
  if (shot) URL.revokeObjectURL(shot.url);
  shot = { blob, url: URL.createObjectURL(blob), name: `filter-${current.id}-${Date.now()}.jpg` };
  $("result").src = shot.url;
  cancelAnimationFrame(raf);
  showShot(true);
});

$("retake").addEventListener("click", () => {
  showShot(false);
  if (stream) loop();
});

$("save").addEventListener("click", async () => {
  if (!shot) return;
  // 폰에서는 공유 시트로 "사진에 저장"이 가장 빠르다. 안 되면 파일로 내려받는다.
  const file = new File([shot.blob], shot.name, { type: "image/jpeg" });
  if (navigator.canShare?.({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; } catch (err) {
      if (err?.name === "AbortError") return;
    }
  }
  const link = document.createElement("a");
  link.href = shot.url;
  link.download = shot.name;
  link.click();
});

document.addEventListener("visibilitychange", () => {
  if (document.hidden) cancelAnimationFrame(raf);
  else if (stream && $("result").hidden) loop();
});
</script>
<script defer src="/_shared/share.js"></script>
</body>
</html>
