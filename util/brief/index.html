<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아침 브리핑</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>🌤️</text></svg>">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { font-family: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Consolas, monospace;
         margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
         /* 우하단 독은 fixed라 문서 흐름을 밀어내지 않는다. 독이 차지하는 높이
            (버튼 3개 ≈ 133px + 아래 여백 16px)만큼 아래를 비워 카드가 그 위로
            올라오게 한다 — 짧은 화면에서 안내 문구가 독에 가리던 문제. */
         padding: 1.5rem 1.5rem 10rem;
         background: light-dark(#eef2f6, #10161f);
         color: light-dark(#1c2733, #dbe4ee); }
  main { width: min(30rem, 100%); }
  header { text-align: center; margin-bottom: 1.2rem; }
  h1 { margin: 0; font-size: 1.15rem; font-weight: bold; letter-spacing: .02em; }
  .date { margin: .35rem 0 0; opacity: .55; font-size: .85rem; }

  .card { padding: 1.4rem 1.3rem; border-radius: .9rem;
          border: 1px solid light-dark(#1c273322, #dbe4ee22);
          background: light-dark(#ffffffaa, #182230aa); }

  /* 지역 선택 */
  .region-row { display: flex; align-items: center; gap: .55rem; margin-bottom: 1rem; }
  .region-row label { font-size: .78rem; opacity: .6; flex: none; }
  select { flex: 1; font: inherit; font-size: .85rem; color: inherit; padding: .45rem .55rem;
           border-radius: .5rem; background: light-dark(#ffffff, #10161f);
           border: 1px solid light-dark(#1c273333, #dbe4ee33); }

  /* 지금 */
  .now { display: flex; align-items: center; gap: 1rem; }
  .now .icon { font-size: 3.2rem; line-height: 1; flex: none; }
  .now .temp { font-size: 2.4rem; font-weight: bold; line-height: 1.1; }
  .now .sky { font-size: .9rem; opacity: .7; margin-top: .15rem; }

  /* 오늘 요약 */
  .facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .4rem;
           margin-top: 1.1rem; }
  .fact { padding: .6rem .5rem; border-radius: .5rem; text-align: center;
          background: light-dark(#1c273307, #dbe4ee08); }
  .fact .k { font-size: .66rem; opacity: .55; }
  .fact .v { font-size: .95rem; font-weight: bold; margin-top: .22rem; }
  .fact[data-grade="나쁨"] .v, .fact[data-grade="매우 나쁨"] .v { color: light-dark(#b6483d, #ff8a7a); }
  .fact[data-grade="좋음"] .v { color: light-dark(#247b5f, #6fd4ac); }

  .tomorrow { margin: 1rem 0 0; font-size: .78rem; line-height: 1.5; opacity: .62; }
  .source { margin: .7rem 0 0; font-size: .6rem; line-height: 1.45; opacity: .4; }
  .source a { color: inherit; }

  /* 읽어주기 */
  .actions { display: flex; gap: .5rem; margin-top: 1.1rem; }
  button { font: inherit; color: inherit; background: none; cursor: pointer;
           padding: .6rem 1.2rem; border-radius: .55rem;
           border: 1px solid light-dark(#1c273355, #dbe4ee55); transition: background .15s; }
  button:hover:not(:disabled) { background: light-dark(#1c273310, #dbe4ee14); }
  button:active:not(:disabled) { transform: scale(.97); }
  button:disabled { opacity: .45; cursor: default; }
  #speak { flex: 1; font-size: .85rem; }

  /* 데일리 알림 (토글 스위치) — fortune과 같은 모양이되 자리가 다르다.
     우하단은 공용 독(#bl-dock)이 fixed로 차지한다. 이 페이지는 짧아서 세로 중앙
     정렬을 하면 알림 행이 정확히 그 코너에 놓이고, 360px 화면에서는 토글을 눌러도
     독의 버튼이 눌렸다. 그래서 ① 알림을 카드 안으로 넣고 ② 토글을 행의 왼쪽에
     둔다 — 조작 요소가 오른쪽 코너에 없으면 독과 구조적으로 겹칠 수 없다. */
  #notify { margin-top: 1.1rem; padding-top: 1rem;
            border-top: 1px solid light-dark(#1c273315, #dbe4ee15); }
  .notify-row { display: flex; align-items: center; justify-content: flex-start; gap: .7rem; }
  .notify-title { font-size: .88rem; font-weight: bold; }
  .notify-toggle { position: relative; flex: none; width: 3rem; height: 1.7rem; padding: 0;
                   border-radius: 1rem; border: 1px solid light-dark(#1c273333, #dbe4ee33);
                   background: light-dark(#1c273315, #dbe4ee15);
                   transition: background .18s, border-color .18s; }
  .notify-toggle::before { content: ""; position: absolute; top: 50%; left: .2rem;
                   transform: translateY(-50%); width: 1.24rem; height: 1.24rem; border-radius: 50%;
                   background: light-dark(#fff, #dbe4ee); box-shadow: 0 1px 3px #0003;
                   transition: left .18s; }
  .notify-toggle:hover:not(:disabled) { background: light-dark(#1c273322, #dbe4ee22); }
  .notify-toggle[aria-checked="true"],
  .notify-toggle[aria-checked="true"]:hover:not(:disabled) {
                   background: light-dark(#247b5f, #6fd4ac); border-color: transparent; }
  .notify-toggle[aria-checked="true"]::before { left: calc(100% - 1.44rem); background: #fff; }
  .notify-toggle:disabled { opacity: .5; cursor: default; }
  .notify-help { margin: .6rem 0 0; font-size: .72rem; line-height: 1.45; opacity: .5; }

  section { margin-top: 1.2rem; }
  [hidden] { display: none !important; }
  #err { margin: 1rem 0 0; font-size: .8rem; line-height: 1.5; text-align: center;
         color: light-dark(#b6483d, #ff8a7a); }

  /* 불러오는 동안 뼈대만 흐리게 — 값이 튀어 보이지 않게 한다 */
  .card.is-loading .now, .card.is-loading .facts, .card.is-loading .tomorrow { opacity: .35; }
</style>
</head>
<body>
<main>
  <header>
    <h1>🌤️ 아침 브리핑</h1>
    <p class="date" id="date">오늘의 날씨와 미세먼지</p>
  </header>

  <div class="card is-loading" id="card">
    <div class="region-row">
      <label for="region">지역</label>
      <select id="region"></select>
    </div>

    <div class="now">
      <span class="icon" id="now-icon">⏳</span>
      <div>
        <div class="temp" id="now-temp">--°</div>
        <div class="sky" id="now-sky">불러오는 중…</div>
      </div>
    </div>

    <div class="facts">
      <div class="fact"><div class="k">낮 최고</div><div class="v" id="f-max">--°</div></div>
      <div class="fact"><div class="k">아침 최저</div><div class="v" id="f-min">--°</div></div>
      <div class="fact"><div class="k">강수확률</div><div class="v" id="f-rain">--%</div></div>
      <div class="fact"><div class="k">미세먼지</div><div class="v" id="f-pm10">--</div></div>
      <div class="fact"><div class="k">초미세먼지</div><div class="v" id="f-pm25">--</div></div>
      <div class="fact" id="fact-air"><div class="k">종합</div><div class="v" id="f-air">--</div></div>
    </div>

    <p class="tomorrow" id="tomorrow"></p>
    <p class="source">날씨·대기질 데이터: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> (CC BY 4.0)</p>

    <div class="actions">
      <button type="button" id="speak">🔊 브리핑 읽어주기</button>
    </div>

    <!-- 데일리 알림 (푸시 지원 시에만 노출). 토글이 행의 왼쪽인 이유는 위 CSS 주석 참고 -->
    <section id="notify" hidden>
      <div class="notify-row">
        <button type="button" id="notify-btn" class="notify-toggle" role="switch" aria-checked="false" aria-label="매일 오전 8시 날씨 알림"></button>
        <span class="notify-title">🔔 매일 오전 8시 알림 받기</span>
      </div>
      <p class="notify-help" id="notify-help">브라우저 알림으로 매일 오전 8시(KST)에 선택한 지역의 날씨를 받아보세요.</p>
    </section>
  </div>

  <p id="err" hidden></p>
</main>

<script>
  // 지역 목록은 서버의 허용 목록과 같아야 한다 (_infra/brief.js BRIEF_REGIONS).
  // 화면은 id만 서버로 보내고 좌표는 다루지 않는다 — 위치 권한을 쓰지 않는 이유다.
  const REGIONS = [
    ["seoul", "서울"], ["busan", "부산"], ["daegu", "대구"], ["incheon", "인천"],
    ["gwangju", "광주"], ["daejeon", "대전"], ["ulsan", "울산"], ["sejong", "세종"],
    ["gyeonggi", "경기(수원)"], ["gangwon", "강원(춘천)"], ["chungbuk", "충북(청주)"],
    ["chungnam", "충남(홍성)"], ["jeonbuk", "전북(전주)"], ["jeonnam", "전남(무안)"],
    ["gyeongbuk", "경북(안동)"], ["gyeongnam", "경남(창원)"], ["jeju", "제주"],
  ];
  const STORE_KEY = "bl-brief-region";

  const $ = (id) => document.getElementById(id);
  const card = $("card"), errEl = $("err"), regionSel = $("region");

  let brief = null;
  let region = localStorage.getItem(STORE_KEY);
  if (!REGIONS.some(([id]) => id === region)) region = "seoul";

  for (const [id, name] of REGIONS) {
    regionSel.append(new Option(name, id, false, id === region));
  }

  // 읽어주기(_shared/tts.js)가 읽을 문장. 서버가 만든 브리핑을 그대로 쓴다 —
  // 화면·음성·푸시가 같은 문장을 쓰도록 문구 생성은 서버 한 곳에만 둔다.
  window.blSpeakText = () => brief?.text ?? "";

  const degree = (v) => (v === null || v === undefined ? "--°" : `${v}°`);

  function render(data) {
    brief = data;
    $("date").textContent = `${data.date} (${data.weekday}) · ${data.region.name}`;
    $("now-icon").textContent = data.current.icon;
    $("now-temp").textContent = degree(data.current.temp);
    $("now-sky").textContent = data.current.label;
    $("f-max").textContent = degree(data.today?.max);
    $("f-min").textContent = degree(data.today?.min);
    $("f-rain").textContent = data.today?.rainChance === null || data.today?.rainChance === undefined
      ? "--%" : `${data.today.rainChance}%`;
    // 농도 칸은 색을 입히지 않는다 — 등급은 둘 중 나쁜 쪽으로 정해지므로
    // 좋은 쪽 칸까지 빨갛게 물들면 어느 게 나쁜지 거꾸로 읽힌다.
    $("f-pm10").textContent = data.air.pm10 === null ? "--" : `${data.air.pm10}㎍`;
    $("f-pm25").textContent = data.air.pm25 === null ? "--" : `${data.air.pm25}㎍`;
    $("f-air").textContent = data.air.label ?? "--";
    $("fact-air").dataset.grade = data.air.label ?? "";
    $("tomorrow").textContent = data.tomorrow
      ? `내일 ${data.tomorrow.icon} ${data.tomorrow.label} · ${degree(data.tomorrow.min)} ~ ${degree(data.tomorrow.max)}`
      : "";
    card.classList.remove("is-loading");
    errEl.hidden = true;
  }

  async function load() {
    card.classList.add("is-loading");
    $("speak").disabled = true;
    try {
      const res = await fetch(`/_brief/today?region=${encodeURIComponent(region)}`);
      if (!res.ok) throw new Error(`http ${res.status}`);
      render(await res.json());
      $("speak").disabled = false;
    } catch (e) {
      // 조용히 실패하면 사용자는 왜 비어 있는지 알 수 없다.
      errEl.textContent = "날씨를 불러오지 못했어요. 잠시 후 다시 시도해주세요.";
      errEl.hidden = false;
      $("now-sky").textContent = "불러오기 실패";
      $("now-icon").textContent = "❔";
    }
  }

  regionSel.addEventListener("change", () => {
    region = regionSel.value;
    localStorage.setItem(STORE_KEY, region);
    window.blTTS?.stop();
    load();
    syncSubscribedRegion();
  });

  // 읽어주기 버튼. 독의 🔊와 같은 동작이지만, 이 페이지에서는 브리핑이 본론이라
  // 카드 안에도 큰 버튼을 둔다. iOS 제약 때문에 클릭 안에서 await 하지 않는다.
  $("speak").addEventListener("click", () => {
    if (!window.blTTS) return;
    if (window.blTTS.speaking) { window.blTTS.stop(); return; }
    window.blTTS.speak(brief?.text ?? "");
  });
  addEventListener("load", () => {
    window.blTTS?.on("start", () => { $("speak").textContent = "⏹ 멈추기"; });
    window.blTTS?.on("end", () => { $("speak").textContent = "🔊 브리핑 읽어주기"; });
  });

  load();

  // ── 매일 오전 8시(KST) 알림 ────────────────────────────────────
  // 서버(Cloudflare cron)가 08:00 KST에 구독한 기기로 Web Push를 보낸다.
  // 구독에는 고른 지역 id만 함께 저장한다(좌표·위치 권한 없음).
  let syncSubscribedRegion = () => {};
  (function setupNotify() {
    const notifySec = $("notify"), notifyBtn = $("notify-btn"), notifyHelp = $("notify-help");
    const supported = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
    if (!supported || !isSecureContext) return;   // 미지원 브라우저·http에서는 노출하지 않음

    function vapidKeyBytes(base64url) {
      const padded = base64url.replace(/-/g, "+").replace(/_/g, "/")
        .padEnd(Math.ceil(base64url.length / 4) * 4, "=");
      return Uint8Array.from(atob(padded), (c) => c.charCodeAt(0));
    }
    function setState(on) {
      notifyBtn.setAttribute("aria-checked", String(on));
      notifyHelp.textContent = on
        ? "매일 오전 8시(KST)에 선택한 지역의 날씨를 알려드려요. 토글을 끄면 해지됩니다."
        : "브라우저 알림으로 매일 오전 8시(KST)에 선택한 지역의 날씨를 받아보세요.";
    }

    let vapidPublicKey = null, registration = null, busy = false;

    const api = (method, body) => fetch("/_brief/push", {
      method,
      ...(body && { headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }),
    });

    async function enable() {
      if ((await Notification.requestPermission()) !== "granted") {
        notifyHelp.textContent = "브라우저 설정에서 알림을 허용해야 받을 수 있어요.";
        return false;
      }
      const subscription = await registration.pushManager.subscribe({
        userVisibleOnly: true, applicationServerKey: vapidKeyBytes(vapidPublicKey),
      });
      const res = await api("POST", { subscription, region });
      if (!res.ok) { await subscription.unsubscribe().catch(() => {}); throw new Error("subscribe failed"); }
      return true;
    }

    async function disable() {
      const subscription = await registration.pushManager.getSubscription();
      if (subscription) {
        await api("DELETE", { endpoint: subscription.endpoint }).catch(() => {});
        await subscription.unsubscribe().catch(() => {});
      }
      return false;
    }

    // 지역을 바꾸면 이미 켜 둔 알림도 그 지역으로 따라가야 한다 — 안 그러면
    // 화면은 부산인데 알림은 계속 서울이 온다.
    syncSubscribedRegion = async () => {
      if (!registration || notifyBtn.getAttribute("aria-checked") !== "true") return;
      const subscription = await registration.pushManager.getSubscription().catch(() => null);
      if (subscription) await api("POST", { subscription, region }).catch(() => {});
    };

    notifyBtn.addEventListener("click", async () => {
      if (busy || !vapidPublicKey || !registration) return;
      busy = true; notifyBtn.disabled = true;
      const turningOn = notifyBtn.getAttribute("aria-checked") !== "true";
      try {
        setState(turningOn ? await enable() : await disable());
      } catch (e) {
        notifyHelp.textContent = "알림 설정에 실패했어요. 잠시 후 다시 시도해주세요.";
      } finally {
        busy = false; notifyBtn.disabled = false;
      }
    });

    (async function init() {
      try {
        const res = await api("GET");
        vapidPublicKey = res.ok ? (await res.json()).vapidPublicKey : null;
        if (!vapidPublicKey) return;   // 서버에 푸시 미설정 시 버튼 숨김 유지
        registration = await navigator.serviceWorker.register("sw.js");
        await navigator.serviceWorker.ready;
        setState(Boolean(await registration.pushManager.getSubscription()));
        notifySec.hidden = false;
      } catch (e) { /* 조용히 미노출 */ }
    })();
  })();
</script>
<script defer src="/_shared/tts.js"></script>
<script defer src="/_shared/share.js"></script>
</body>
</html>
