<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#f4f1e8">
  <meta name="mobile-web-app-capable" content="yes">
  <title>할 일</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="bar">
    <div class="bar-title">
      <h1 id="list-name">할 일</h1>
      <span id="list-count" class="count"></span>
    </div>
    <button id="menu-button" type="button" aria-label="목록 메뉴" aria-haspopup="dialog">⋯</button>
  </header>

  <nav id="dots" class="dots" aria-label="목록"></nav>

  <main id="track" class="track" tabindex="-1"></main>

  <form id="add-form" class="add">
    <label class="sr-only" for="add-text">할 일 추가</label>
    <input id="add-text" type="text" maxlength="200" autocomplete="off" placeholder="할 일 추가">
    <button type="submit" aria-label="추가">＋</button>
  </form>

  <dialog id="menu" aria-labelledby="menu-title">
    <h2 id="menu-title" class="sr-only">목록 메뉴</h2>
    <div class="menu-items">
      <button id="menu-add" type="button">새 목록</button>
      <button id="menu-rename" type="button">이름 바꾸기</button>
      <button id="menu-clear" type="button">완료한 항목 지우기</button>
      <button id="menu-remove" type="button" class="danger">이 목록 삭제</button>
      <button id="menu-close" type="button" class="quiet">닫기</button>
    </div>
  </dialog>

  <dialog id="prompt" aria-labelledby="prompt-title">
    <form id="prompt-form" method="dialog">
      <h2 id="prompt-title">새 목록</h2>
      <label class="sr-only" for="prompt-text">목록 이름</label>
      <input id="prompt-text" type="text" maxlength="24" autocomplete="off" required>
      <p id="prompt-error" class="error" role="alert"></p>
      <div class="menu-items row">
        <button id="prompt-cancel" type="button" class="quiet">취소</button>
        <button id="prompt-ok" type="submit" class="primary">확인</button>
      </div>
    </form>
  </dialog>
</body>
</html>
