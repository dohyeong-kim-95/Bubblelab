<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="LIFE">
  <title>LIFE</title>
  <!-- crossorigin: 이게 없으면 크롬이 매니페스트를 쿠키 없이 받아 간다. 게이트가
       /login 으로 돌려보내면 매니페스트가 깨져 설치 대신 "바로가기"가 되고,
       바로가기는 브라우저 탭이라 주소창이 그대로 보인다. -->
  <link rel="manifest" href="manifest.json" crossorigin="use-credentials">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <!-- app.js 를 파싱한 뒤에야 store.js 를 발견하면 왕복이 한 번 더 붙는다. -->
  <link rel="modulepreload" href="store.js">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="bar">
    <h1 class="bar-title">
      <button id="list-name" type="button" aria-haspopup="dialog"
              title="한 번 누르면 목록 선택 · 두 번 누르면 이름 바꾸기">할 일</button>
      <span id="list-count" class="count"></span>
    </h1>
    <button id="menu-button" type="button" aria-label="목록 메뉴" aria-haspopup="dialog">⋯</button>
  </header>

  <nav id="dots" class="dots" aria-label="목록"></nav>

  <main id="track" class="track" tabindex="-1"></main>

  <form id="add-form" class="add">
    <label class="sr-only" for="add-text">할 일 추가</label>
    <input id="add-text" type="text" maxlength="200" autocomplete="off" placeholder="할 일 추가">
    <button type="submit" aria-label="추가">＋</button>
  </form>

  <dialog id="menu" aria-labelledby="menu-title">
    <h2 id="menu-title" class="sr-only">목록 메뉴</h2>
    <div class="menu-items">
      <button id="menu-add" type="button">새 목록</button>
      <button id="menu-rename" type="button">이름 바꾸기</button>
      <button id="menu-clear" type="button">완료한 항목 지우기</button>
      <button id="menu-remove" type="button" class="danger">이 목록 삭제</button>
      <button id="menu-close" type="button" class="quiet">닫기</button>
    </div>
  </dialog>

  <dialog id="picker" aria-labelledby="picker-title">
    <h2 id="picker-title">목록</h2>
    <p id="picker-hint" class="dialog-hint" hidden>⠿ 를 끌어 순서를 바꿉니다</p>
    <div id="picker-items" class="menu-items"></div>
  </dialog>

  <dialog id="prompt" aria-labelledby="prompt-title">
    <form id="prompt-form" method="dialog">
      <h2 id="prompt-title">새 목록</h2>
      <label class="sr-only" for="prompt-text">목록 이름</label>
      <input id="prompt-text" type="text" maxlength="24" autocomplete="off" required>
      <p id="prompt-error" class="error" role="alert"></p>
      <div class="menu-items row">
        <button id="prompt-cancel" type="button" class="quiet">취소</button>
        <button id="prompt-ok" type="submit" class="primary">확인</button>
      </div>
    </form>
  </dialog>
</body>
</html>
