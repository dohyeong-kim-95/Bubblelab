<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#000000">
  <title>DRAM 동작</title>
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="modulepreload" href="engine.js">
  <link rel="modulepreload" href="spec/index.js">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="bar">
    <a class="back" href="../" aria-label="LIFE 로 돌아가기">←</a>
    <h1 class="bar-title">DRAM <span id="clock" class="count"></span></h1>
    <button id="settings-open" type="button" aria-label="세대와 속도">⚙</button>
    <button id="refs-open" type="button" aria-label="참고문헌">📚</button>
    <button id="undo" type="button" aria-label="마지막 커맨드 취소">↺</button>
    <button id="reset" type="button" aria-label="처음으로">⟲</button>
  </header>

  <!-- 한 장에 하나씩. 깊이 들어가려면 아래로 넘긴다. -->
  <main id="deck" class="deck">
    <section class="pane" id="pane-structure" aria-label="구조">
      <p class="pane-head"><b>구조</b> <span id="org" class="dim"></span><span class="pane-n">1/3</span></p>
      <div id="layers" class="chips" role="group" aria-label="계층 고르기"></div>
      <p id="layer-key" class="layer-key"></p>
      <svg id="layer-art" class="layer-art"></svg>
      <div id="grid" class="grid" role="group" aria-label="뱅크 고르기"></div>
      <div id="refresh" class="refresh"></div>
      <p id="layer-now" class="layer-now"></p>
      <div id="layer-plist" class="chips tail"></div>
    </section>

    <section class="pane" id="pane-wave" aria-label="전압">
      <p class="pane-head"><b>전압</b> <span class="dim">동작에 따른 변화 · 화살표가 tXX</span><span class="pane-n">2/3</span></p>
      <div id="legend" class="legend-box"></div>
      <div id="scroller" class="scroller"><svg id="timeline" class="timeline"></svg></div>
      <div class="zoomrow tail">
        <label for="zoom" class="dim">확대</label>
        <input id="zoom" type="range" min="2" max="24" step="1" value="4">
        <span id="zoomval" class="dim"></span>
      </div>
      <p id="lane-note" class="note"></p>
    </section>

    <section class="pane pane-scroll" id="pane-param" aria-label="설명">
      <p class="pane-head"><b>설명</b> <span class="dim">tXX 하나씩</span><span class="pane-n">3/3</span></p>
      <div id="param-picker" class="chips" role="group" aria-label="파라미터 고르기"></div>
      <h2 id="param-title"></h2>
      <div id="param-body" class="explain"></div>
    </section>
  </main>

  <div class="cmdbar">
    <p id="target" class="dim"></p>
    <div id="palette" class="palette"></div>
  </div>

  <dialog id="settings" aria-labelledby="settings-title">
    <h2 id="settings-title">세대와 속도</h2>
    <p class="dialog-hint">구조는 표준, 숫자는 모의값이다.</p>
    <div id="gens" class="chips" role="group" aria-label="세대"></div>
    <p id="gen-note" class="note"></p>
    <label for="bin" class="dim">스피드빈</label>
    <select id="bin"></select>
    <p id="tck" class="note"></p>
    <div class="menu-items row">
      <button id="settings-close" type="button" class="quiet">닫기</button>
    </div>
  </dialog>

  <dialog id="refs" aria-labelledby="refs-title">
    <h2 id="refs-title">참고문헌</h2>
    <p class="dialog-hint">숫자가 어디서 왔는지, 무엇이 표준이고 무엇이 아닌지.</p>
    <div id="refs-body" class="refs"></div>
    <div class="menu-items row">
      <button id="refs-close" type="button" class="quiet">닫기</button>
    </div>
  </dialog>
</body>
</html>
