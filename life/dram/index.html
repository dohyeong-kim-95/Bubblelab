<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#000000">
  <title>DRAM 동작</title>
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="modulepreload" href="engine.js">
  <link rel="modulepreload" href="spec/index.js">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="bar">
    <a class="back" href="../" aria-label="LIFE 로 돌아가기">←</a>
    <h1 class="bar-title">DRAM <span id="clock" class="count"></span></h1>
    <button id="refs-open" type="button" aria-label="참고문헌">📚</button>
    <button id="undo" type="button" aria-label="마지막 커맨드 취소">↺</button>
    <button id="reset" type="button" aria-label="처음으로">⟲</button>
  </header>

  <main class="page">
    <nav id="gens" class="gens" aria-label="세대"></nav>

    <p id="gen-note" class="note"></p>

    <section id="sim" class="sim">
      <div class="binrow">
        <label for="bin" class="dim">스피드빈</label>
        <select id="bin"></select>
        <span id="tck" class="dim"></span>
      </div>

      <div id="refresh" class="refresh"></div>

      <h2 class="head">뱅크 <span id="org" class="dim"></span></h2>
      <div id="grid" class="grid" role="group" aria-label="뱅크 고르기"></div>

      <h2 class="head">커맨드 <span id="target" class="dim"></span></h2>
      <div id="palette" class="palette"></div>

      <div id="why" class="why" hidden></div>

      <h2 class="head">파형 <span class="dim">전압 레벨의 시간 변화</span></h2>
      <div class="zoomrow">
        <label for="zoom" class="dim">가로 확대</label>
        <input id="zoom" type="range" min="2" max="24" step="1" value="4">
        <span id="zoomval" class="dim"></span>
      </div>
      <div id="legend" class="legend-box"></div>
      <div id="scroller" class="scroller"><svg id="timeline" class="timeline"></svg></div>
      <p id="lane-note" class="note">신호를 누르면 그것만 남기고 나머지는 흐려진다.</p>
      <p id="rails" class="note"></p>

      <h2 class="head">파라미터</h2>
      <p id="params-note" class="note"></p>
      <p class="note">실제 값을 넣으려면 스펙을 보고 <code>spec/</code> 의 숫자만 바꾼다 — 화면·파형·테스트가 함께 따라온다. <button id="refs-link" type="button" class="linkish">참고문헌 →</button></p>
      <div id="params" class="params"></div>
    </section>
  </main>

  <dialog id="param" aria-labelledby="param-title">
    <h2 id="param-title"></h2>
    <div id="param-body" class="explain"></div>
    <div class="menu-items row">
      <button id="param-close" type="button" class="quiet">닫기</button>
    </div>
  </dialog>

  <dialog id="refs" aria-labelledby="refs-title">
    <h2 id="refs-title">참고문헌</h2>
    <p class="dialog-hint">숫자가 어디서 왔는지, 무엇이 표준이고 무엇이 아닌지.</p>
    <div id="refs-body" class="refs"></div>
    <div class="menu-items row">
      <button id="refs-close" type="button" class="quiet">닫기</button>
    </div>
  </dialog>
</body>
</html>
