<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#000000">
  <title>백업</title>
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="modulepreload" href="store.js">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="bar">
    <a class="back" href="../" aria-label="LIFE 로 돌아가기">←</a>
    <h1 class="bar-title">백업</h1>
  </header>

  <main class="panel">
    <p class="fine-print">이 기기에 있는 LIFE 기록 전부를 파일 하나로 내보내고, 그 파일로 되돌립니다.
      도구를 새로 만들어도 등록할 곳은 없습니다 — 저장소 이름이 <code>bl_</code> 로 시작하면 저절로 포함됩니다.</p>

    <h2 class="section">지금 이 기기에 있는 것</h2>
    <ul id="current" class="entries"></ul>
    <p id="current-empty" class="fine-print" hidden>아직 아무것도 없습니다.</p>

    <div class="button-row">
      <button id="export-button" type="button" class="primary">내보내기</button>
      <label class="file-button" for="import-input">가져오기</label>
      <input id="import-input" type="file" accept="application/json,.json" hidden>
    </div>
    <p id="status" class="fine-print" role="status" aria-live="polite"></p>
  </main>

  <dialog id="confirm" aria-labelledby="confirm-title">
    <h2 id="confirm-title">이 파일로 되돌릴까요?</h2>
    <p id="incoming-when" class="fine-print"></p>
    <ul id="incoming" class="entries"></ul>
    <p class="fine-print danger-note">지금 이 기기에 있는 LIFE 기록은 <b>모두 지워지고</b> 파일의 내용으로 바뀝니다.</p>
    <div class="menu-items row">
      <button id="confirm-cancel" type="button" class="quiet">취소</button>
      <button id="confirm-ok" type="button" class="danger">되돌리기</button>
    </div>
  </dialog>
</body>
</html>
