<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>🧳 여행 계획·예산</title>
<style>
:root {
  color-scheme: light dark;
  --bg: light-dark(#f4f6f9, #0d131c);
  --fg: light-dark(#1c2733, #e2e9f0);
  --card: light-dark(#ffffff, #151e2a);
  --line: light-dark(#dce4ec, #263445);
  --dim: light-dark(#5d6b7a, #93a3b4);
  --accent: light-dark(#1d4ed8, #5b82f0);
  --warn: light-dark(#b3261e, #ff8a80);
  --ok: light-dark(#166534, #6ee7a8);
}
* { box-sizing: border-box; }
body {
  margin: 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 14px; line-height: 1.6;
  background: var(--bg); color: var(--fg);
  -webkit-text-size-adjust: 100%;
}
main { max-width: 760px; margin: 0 auto; padding: 20px 14px 64px; }
h1 { font-size: 1.1rem; margin: 0; }
h2 { font-size: 0.9rem; margin: 24px 0 10px; }
p { margin: 8px 0; }
.dim { color: var(--dim); font-size: 0.78rem; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

button, select, input, textarea {
  font: inherit; font-size: 0.85rem; color: inherit;
  background: var(--card); border: 1px solid var(--line);
  border-radius: 8px; padding: 6px 10px; max-width: 100%;
}
button { cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.ghost { background: none; border-color: transparent; color: var(--dim); padding: 4px 6px; }
button.ghost:hover { color: var(--warn); border-color: transparent; }
input[type="number"] { -moz-appearance: textfield; }
label.field { display: flex; flex-direction: column; gap: 3px; font-size: 0.72rem; color: var(--dim); }
label.field > input, label.field > select { font-size: 0.85rem; width: 100%; }
.check { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; color: var(--dim); }
.check input { accent-color: var(--accent); width: auto; }

/* 머리 */
header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
header .grow { flex: 1 1 120px; min-width: 0; }
#tripPick { width: 100%; }
.sub { font-size: 0.78rem; color: var(--dim); margin: 2px 0 0; }

/* 통계 */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin: 14px 0; }
.stat { padding: 10px 12px; }
.stat .k { font-size: 0.7rem; color: var(--dim); }
.stat .v { font-size: 1.15rem; font-weight: 700; margin-top: 1px; word-break: break-all; }
.stat .d { font-size: 0.7rem; color: var(--dim); }
.stat .v.over { color: var(--warn); }
.stat .v.ok { color: var(--ok); }

/* 탭 */
.tabs { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin: 4px 0 12px; }
.tabs button { flex: 1; border: 0; border-right: 1px solid var(--line); border-radius: 0; background: var(--card); }
.tabs button:last-child { border-right: 0; }
.tabs button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.tabs.top button { font-weight: 700; padding: 9px 10px; }

/* 계획 탭 — 가격 관측 */
.badge {
  display: inline-block; font-size: 0.68rem; padding: 1px 7px; border-radius: 999px;
  border: 1px solid var(--line); color: var(--dim); vertical-align: 1px;
}
.badge.live { color: var(--ok); border-color: currentColor; }
.badge.ref { color: var(--warn); border-color: currentColor; }
.watch { padding: 11px 12px; margin-bottom: 8px; cursor: pointer; }
.watch[aria-selected="true"] { border-color: var(--accent); }
.watch .top { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.watch .route { font-weight: 700; }
.watch .price { margin-left: auto; font-size: 1rem; font-weight: 700; white-space: nowrap; }
.watch .delta.down { color: var(--ok); }
.watch .delta.up { color: var(--warn); }
.watch .routes { margin: 8px 0 4px; }
.route-line {
  display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap;
  padding: 5px 6px; border-radius: 8px; cursor: pointer;
  border: 1px solid transparent;
}
.route-line:hover { background: light-dark(#f1f5fb, #1c2734); }
.route-line.on { border-color: var(--accent); }
.route-line .p { margin-left: auto; font-weight: 700; white-space: nowrap; }
.route-row { align-items: end; margin-bottom: 8px; }
.route-row .check { align-self: center; }

/* 날짜 격자 — 행=출발일, 열=밤수. 폰에서는 이 상자만 가로로 스크롤된다. */
.gridwrap { overflow-x: auto; margin: 0 -2px; padding: 0 2px 4px; }
table.grid { border-collapse: separate; border-spacing: 3px; font-size: 0.72rem; }
table.grid th { font-weight: 400; color: var(--dim); white-space: nowrap; padding: 0 4px; }
table.grid th.rowh { text-align: right; }
table.grid td { padding: 0; }
table.grid button {
  width: 100%; min-width: 4.4em; padding: 5px 4px; border-radius: 6px; font-size: 0.7rem;
  border: 1px solid transparent; background: light-dark(#eef2f7, #1c2734); color: inherit;
}
table.grid button.cheap { background: light-dark(#dcf5e6, #14361f); }
table.grid button.mid { background: light-dark(#fdf3d9, #3a3013); }
table.grid button.dear { background: light-dark(#fbe3e0, #3d1c19); }
table.grid button.best { border-color: var(--accent); font-weight: 700; }
table.grid button.empty { color: var(--dim); background: none; border: 1px dashed var(--line); }

/* 추이 — 관측일별 최저가 */
.spark { display: block; width: 100%; height: 64px; }
.spark path { fill: none; stroke: var(--accent); stroke-width: 2; }
.spark .area { fill: color-mix(in srgb, var(--accent) 14%, transparent); stroke: none; }
.legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 0.7rem; color: var(--dim); margin-top: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: -1px; margin-right: 3px; }

/* 일정 */
.day { margin-bottom: 10px; overflow: hidden; }
.day > summary {
  display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap;
  padding: 9px 12px; cursor: pointer; list-style: none;
}
.day > summary::-webkit-details-marker { display: none; }
.day > summary::before { content: "▸"; color: var(--dim); }
.day[open] > summary::before { content: "▾"; }
.day .d-name { font-weight: 700; }
.day .d-sum { margin-left: auto; font-size: 0.8rem; color: var(--dim); }
.day .body { border-top: 1px solid var(--line); padding: 8px 10px 10px; }

/* 시간 | 내용 | 금액 3열. 내용이 길어도 금액 칸을 밀지 않게 grid 로 잡는다
   (flex 로 두니 폰 폭에서 제목이 두세 글자씩 잘려 내려갔다). */
.item {
  display: grid; grid-template-columns: 3.1em minmax(0, 1fr) auto;
  gap: 2px 8px; align-items: baseline;
  padding: 7px 4px; border-radius: 8px; cursor: pointer;
}
.item:hover { background: light-dark(#f1f5fb, #1c2734); }
.item .t { color: var(--dim); font-size: 0.75rem; }
.item .n { min-width: 0; overflow-wrap: anywhere; }
.item .n .cat { opacity: 0.85; }
.item .n .st { color: var(--dim); font-size: 0.72rem; }
.item .a { text-align: right; font-size: 0.82rem; }
.item .a .orig { display: block; font-size: 0.68rem; color: var(--dim); white-space: nowrap; }
.item.paid .a > b { color: var(--ok); }
.item .memo { grid-column: 2 / -1; color: var(--dim); font-size: 0.72rem; }

/* 항목 편집 */
.edit { border: 1px dashed var(--line); border-radius: 10px; padding: 10px; margin: 6px 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
.edit .full { grid-column: 1 / -1; }

/* 예산 */
.bud { padding: 10px 12px; margin-bottom: 8px; }
.bud .top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.bud .name { font-weight: 700; flex: 1 1 auto; }
.bud input { width: 8em; text-align: right; }
.bar { height: 6px; border-radius: 999px; background: light-dark(#e6ecf3, #1f2b3a); margin-top: 8px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.bar > i.over { background: var(--warn); }
.bud .note { font-size: 0.75rem; color: var(--dim); margin-top: 4px; }
.bud .note .over { color: var(--warn); }

.empty { padding: 28px 16px; text-align: center; color: var(--dim); }
.hidden { display: none !important; }
dialog {
  border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--fg);
  padding: 16px; max-width: 420px; width: calc(100% - 28px);
}
dialog::backdrop { background: rgba(0, 0, 0, 0.45); }
footer { margin-top: 28px; font-size: 0.72rem; color: var(--dim); text-align: center; }
</style>
</head>
<body>
<main>
  <header>
    <h1>🧳 여행</h1>
    <span class="grow" id="tripPickWrap"><select id="tripPick" aria-label="여행 선택"></select></span>
    <button id="newTrip" title="새 여행">＋</button>
    <button id="openSetup" title="여행 설정">⚙️</button>
  </header>
  <p class="sub" id="tripSub"></p>

  <div class="tabs top">
    <button id="modePlan" aria-pressed="false">🔭 계획</button>
    <button id="modeRun" aria-pressed="true">🧭 실행</button>
  </div>

  <!-- 계획: 가격 관측. 서버(가격)만 여기, 개인 일정은 실행 탭의 로컬 저장분이다. -->
  <section id="planMode" class="hidden">
    <div class="row" style="justify-content:space-between;margin-bottom:8px">
      <span class="dim" id="watchProvider">가격 관측</span>
      <span class="row">
        <button id="addWatch">＋ 여행 후보 추가</button>
        <button id="watchToken" title="접근 토큰">🔑</button>
      </span>
    </div>
    <div id="watchList"></div>
    <div id="watchDetail"></div>
  </section>

  <!-- 실행: 지금까지의 일정표·예산 (브라우저에만 저장) -->
  <section id="runMode">
    <section id="app" class="hidden">
      <div class="stats" id="stats"></div>
      <div class="tabs">
        <button id="tabPlan" aria-pressed="true">📋 일정</button>
        <button id="tabBudget" aria-pressed="false">💰 예산</button>
      </div>
      <div id="planView"></div>
      <div id="budgetView" class="hidden"></div>
    </section>

    <section id="blank" class="card empty">
      <p>아직 여행이 없습니다.</p>
      <p><button class="primary" id="firstTrip">＋ 첫 여행 만들기</button></p>
    </section>
  </section>

  <footer>
    <span id="footNote"></span><br>
    <span id="footTools">
      <button class="ghost" id="exportBtn">⬇ 내보내기</button>
      <button class="ghost" id="importBtn">⬆ 가져오기</button>
    </span>
    <input type="file" id="importFile" accept="application/json,.json" class="hidden">
  </footer>
</main>

<dialog id="setup">
  <form method="dialog" id="setupForm">
    <h2 style="margin-top:0">여행 설정</h2>
    <div class="grid">
      <label class="field full">이름<input name="title" maxlength="60" required></label>
      <label class="field full">목적지<input name="dest" maxlength="60" placeholder="예: 오사카"></label>
      <label class="field">출발<input type="date" name="start" required></label>
      <label class="field">도착<input type="date" name="end" required></label>
      <label class="field">인원<input type="number" name="people" min="1" max="99" step="1" required></label>
      <label class="field">현지통화<input name="currency" maxlength="8" placeholder="JPY"></label>
      <label class="field">환율 (1단위 = ?원)<input type="number" name="rate" min="0" step="any" placeholder="9.5"></label>
    </div>
    <p class="dim">환율은 계획용 어림값입니다. 바꾸면 현지통화로 적은 항목이 모두 다시 환산됩니다.</p>
    <div class="row" style="justify-content:space-between;margin-top:12px">
      <button type="button" class="ghost" id="deleteTrip">🗑 이 여행 삭제</button>
      <span class="row">
        <button value="cancel" formnovalidate>취소</button>
        <button value="save" class="primary">저장</button>
      </span>
    </div>
  </form>
</dialog>

<dialog id="watchSetup">
  <form method="dialog" id="watchForm">
    <h2 style="margin-top:0" id="watchFormTitle">여행 후보 추가</h2>
    <div class="grid">
      <label class="field full">여행지<input name="name" maxlength="40" required placeholder="몽골"></label>
      <label class="field">나라 코드<input name="country" maxlength="2" placeholder="MN" style="text-transform:uppercase"></label>
      <label class="field">인원<input type="number" name="people" min="1" max="9" value="2"></label>
      <label class="field">여행 가능 시작<input type="date" name="from" required></label>
      <label class="field">여행 가능 끝<input type="date" name="to" required></label>
      <label class="field">최소 박<input type="number" name="minNights" min="0" max="30" value="5"></label>
      <label class="field">최대 박<input type="number" name="maxNights" min="0" max="30" value="8"></label>
      <label class="field">상태<select name="status">
        <option value="watching">관측 중</option>
        <option value="selected">결정함</option>
        <option value="archived">보류</option>
      </select></label>
    </div>
    <h2>항공 노선</h2>
    <p class="dim">여행지를 실현하는 노선입니다. 여러 개를 넣으면 같은 조건으로 함께 비교합니다
      (홋카이도 = ICN→CTS + PUS→CTS).</p>
    <div id="routeRows"></div>
    <p><button type="button" id="addRoute">＋ 노선</button></p>
    <p class="dim" id="watchError" style="color:var(--warn)"></p>
    <div class="row" style="justify-content:flex-end;margin-top:10px">
      <button value="cancel" formnovalidate>취소</button>
      <button value="save" class="primary">저장</button>
    </div>
  </form>
</dialog>

<script type="module">
import {
  CATS, CAT_BY_KEY, STATUSES,
  summarize, itemKRW, dayList, weekday, sortItems,
  formatKRW, formatShort, newTrip, newItem, normalizeStore, todayKST,
} from "./budget.js";

const KEY = "bl-trip-v1";
const TOKEN_KEY = "bl-trip-token";
const $ = (id) => document.getElementById(id);

let store = load();
let mode = "run";   // run = 일정·예산(로컬) / plan = 가격 관측(서버)
let tab = "plan";   // 실행 탭 안의 하위 탭 (일정/예산)
let editing = null; // 편집 중인 항목 id ("new:<날짜>" 면 추가 폼)

function load() {
  try {
    return normalizeStore(JSON.parse(localStorage.getItem(KEY) ?? "{}"));
  } catch {
    // 저장본이 깨졌다고 화면까지 죽이지 않는다 — 빈 상태로 시작한다.
    return normalizeStore(null);
  }
}
function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(store));
  } catch {
    // 용량 초과(사진 없는 텍스트라 사실상 안 나지만) — 화면은 계속 쓸 수 있게 둔다.
  }
}
const active = () => store.trips.find((t) => t.id === store.activeId) ?? null;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ── 화면 ─────────────────────────────────────────────────────────── */

function render() {
  $("modePlan").setAttribute("aria-pressed", String(mode === "plan"));
  $("modeRun").setAttribute("aria-pressed", String(mode === "run"));
  $("planMode").classList.toggle("hidden", mode !== "plan");
  $("runMode").classList.toggle("hidden", mode !== "run");
  // 여행 선택·설정은 실행 탭의 것이다 (계획은 노선 단위라 여행이 없어도 본다)
  for (const id of ["tripPickWrap", "newTrip", "openSetup"]) {
    $(id).classList.toggle("hidden", mode !== "run");
  }
  // 계획 탭은 서버를 쓴다 — "서버로 보내지 않습니다" 를 거기서도 띄우면 거짓말이다.
  $("footNote").textContent = mode === "plan"
    ? "가격 관측만 서버에 저장됩니다 · 일정·예산은 이 브라우저에만 있습니다"
    : "브라우저에만 저장됩니다 (localStorage) · 서버로 보내지 않습니다";
  $("footTools").classList.toggle("hidden", mode !== "run");
  if (mode === "plan") {
    $("tripSub").textContent = "";
    return;
  }

  const trip = active();
  $("blank").classList.toggle("hidden", !!trip);
  $("app").classList.toggle("hidden", !trip);
  $("openSetup").disabled = !trip;

  $("tripPick").innerHTML = store.trips
    .map((t) => `<option value="${esc(t.id)}"${t.id === store.activeId ? " selected" : ""}>${esc(t.title)}</option>`)
    .join("");
  $("tripPick").classList.toggle("hidden", store.trips.length === 0);

  if (!trip) {
    $("tripSub").textContent = "";
    return;
  }

  const s = summarize(trip, todayKST());
  const period = trip.start === trip.end ? trip.start : `${trip.start} → ${trip.end}`;
  $("tripSub").textContent =
    `${trip.dest ? trip.dest + " · " : ""}${period} · ${s.dayCount}일 · ${s.people}명` +
    (trip.currency !== "KRW" ? ` · ${trip.currency} ${trip.rate}원` : "");

  renderStats(s);
  $("tabPlan").setAttribute("aria-pressed", String(tab === "plan"));
  $("tabBudget").setAttribute("aria-pressed", String(tab === "budget"));
  $("planView").classList.toggle("hidden", tab !== "plan");
  $("budgetView").classList.toggle("hidden", tab !== "budget");
  if (tab === "plan") renderPlan(trip, s);
  else renderBudget(trip, s);
}

function renderStats(s) {
  const d = s.dday;
  const ddayText = d === null ? "—" : d > 0 ? `D-${d}` : d === 0 ? "D-DAY" : `D+${-d}`;
  const overBudget = s.budgetTotal > 0 && s.remain < 0;
  $("stats").innerHTML = [
    { k: "출발까지", v: ddayText, d: `${s.dayCount}일 일정` },
    { k: "계획 총액", v: formatShort(s.planned), d: `1인 ${formatShort(s.perPerson)}` },
    {
      k: s.budgetTotal > 0 ? (overBudget ? "예산 초과" : "예산 남음") : "예산",
      v: s.budgetTotal > 0 ? formatShort(Math.abs(s.remain)) : "미설정",
      d: s.budgetTotal > 0 ? `총 ${formatShort(s.budgetTotal)}` : "예산 탭에서 설정",
      cls: s.budgetTotal > 0 ? (overBudget ? "over" : "ok") : "",
    },
    { k: "결제 완료", v: formatShort(s.paid), d: `미결제 ${formatShort(s.unpaid)}` },
  ].map((x) => `<div class="stat card"><div class="k">${x.k}</div>` +
      `<div class="v ${x.cls ?? ""}">${esc(x.v)}</div><div class="d">${esc(x.d)}</div></div>`).join("");
}

// 금액 칸: 환산된 원화가 크게, 원래 입력(현지통화·1인당)이 그 밑에 작게.
function amountCell(item, trip) {
  const krw = itemKRW(item, trip);
  if (!krw && !item.amount) return "";
  const parts = [];
  if (item.cur === "LOC") parts.push(`${item.amount.toLocaleString("ko-KR")}${trip.currency}`);
  if (item.per) parts.push(`${trip.people}인`);
  return `<b>${esc(formatKRW(krw))}</b>` +
    (parts.length ? `<span class="orig">${esc(parts.join(" · "))}</span>` : "");
}

function itemRow(item, trip) {
  const cat = CAT_BY_KEY.get(item.cat) ?? CAT_BY_KEY.get("etc");
  const st = STATUSES.find((s) => s.key === item.status) ?? STATUSES[0];
  return `<div class="item ${item.status}" data-item="${esc(item.id)}" tabindex="0" role="button">
    <span class="t">${esc(item.time || "–")}</span>
    <span class="n"><span class="cat">${cat.emoji}</span> ${esc(item.title || "(제목 없음)")}
      <span class="st" title="${esc(st.label)}">${st.emoji}</span></span>
    <span class="a">${amountCell(item, trip)}</span>
    ${item.memo ? `<span class="memo">${esc(item.memo)}</span>` : ""}
  </div>`;
}

function renderPlan(trip, s) {
  const byDate = new Map();
  for (const item of trip.items) {
    const key = s.days.includes(item.date) ? item.date : "";
    if (!byDate.has(key)) byDate.set(key, []);
    byDate.get(key).push(item);
  }

  const dayCard = (date, index) => {
    const items = sortItems(byDate.get(date) ?? []);
    const total = items.reduce((sum, it) => sum + itemKRW(it, trip), 0);
    const title = date
      ? `Day ${index + 1} · ${date.slice(5).replace("-", "/")} (${weekday(date)})`
      : "날짜 미정";
    const open = editing?.startsWith(`new:${date}`) ||
      items.some((it) => it.id === editing) ||
      (date && date === todayKST()) || index === 0;
    return `<details class="day card" data-date="${esc(date)}"${open ? " open" : ""}>
      <summary><span class="d-name">${esc(title)}</span>
        <span class="d-sum">${items.length ? `${items.length}건 · ${formatShort(total)}` : "비어 있음"}</span></summary>
      <div class="body">
        ${items.map((it) => (editing === it.id ? editForm(it, trip) : itemRow(it, trip))).join("")}
        ${editing === `new:${date}` ? editForm(newItem({ date }), trip, true) : ""}
        ${editing === `new:${date}` ? "" :
          `<p><button data-add="${esc(date)}">＋ 항목 추가</button></p>`}
      </div>
    </details>`;
  };

  const cards = s.days.map((d, i) => dayCard(d, i));
  // 날짜를 아직 못 정한 항목(항공권 후보 등)은 맨 아래 한 장에 모은다.
  if ((byDate.get("") ?? []).length || editing === "new:") cards.push(dayCard("", -1));
  $("planView").innerHTML = cards.join("") ||
    `<div class="card empty">기간을 설정하면 날짜별 일정이 생깁니다.</div>`;
}

function editForm(item, trip, isNew = false) {
  const opt = (list, sel, val = (x) => x.key, lab = (x) => x.label) =>
    list.map((x) => `<option value="${esc(val(x))}"${val(x) === sel ? " selected" : ""}>${esc(lab(x))}</option>`).join("");
  return `<form class="edit" data-edit="${esc(item.id)}" data-new="${isNew ? "1" : ""}" data-date="${esc(item.date)}">
    <div class="grid">
      <label class="field full">내용<input name="title" maxlength="80" value="${esc(item.title)}" placeholder="예: 간사이공항 도착" autofocus></label>
      <label class="field">시간<input type="time" name="time" value="${esc(item.time)}"></label>
      <label class="field">분류<select name="cat">${opt(CATS, item.cat, (x) => x.key, (x) => `${x.emoji} ${x.label}`)}</select></label>
      <label class="field">상태<select name="status">${opt(STATUSES, item.status)}</select></label>
      <label class="field">금액<input type="number" name="amount" min="0" step="any" value="${item.amount || ""}"></label>
      <label class="field">통화<select name="cur">
        <option value="KRW"${item.cur === "KRW" ? " selected" : ""}>원</option>
        <option value="LOC"${item.cur === "LOC" ? " selected" : ""}>${esc(trip.currency)}</option>
      </select></label>
      <label class="field full">메모<input name="memo" maxlength="500" value="${esc(item.memo)}"></label>
      <label class="check full"><input type="checkbox" name="per"${item.per ? " checked" : ""}> 1인당 금액 (×${trip.people}명)</label>
      <label class="field full">날짜<input type="date" name="date" value="${esc(item.date)}"></label>
    </div>
    <div class="row" style="justify-content:space-between;margin-top:8px">
      ${isNew ? "<span></span>" : `<button type="button" class="ghost" data-del="${esc(item.id)}">🗑 삭제</button>`}
      <span class="row">
        <button type="button" data-cancel="1">취소</button>
        <button type="submit" class="primary">${isNew ? "추가" : "저장"}</button>
      </span>
    </div>
  </form>`;
}

function renderBudget(trip, s) {
  const rows = s.byCat.map((c) => {
    const pct = c.ratio === null ? 0 : Math.min(100, Math.round(c.ratio * 100));
    return `<div class="bud card">
      <div class="top">
        <span class="name">${c.emoji} ${c.label}</span>
        <span class="dim">${c.count}건</span>
        <input type="number" min="0" step="1000" data-budget="${c.key}" value="${c.budget || ""}" placeholder="예산" aria-label="${c.label} 예산">
      </div>
      ${c.budget > 0 ? `<div class="bar"><i class="${c.over ? "over" : ""}" style="width:${pct}%"></i></div>` : ""}
      <div class="note">계획 ${formatKRW(c.planned)} · 결제 ${formatKRW(c.paid)}
        ${c.budget > 0
          ? c.over
            ? `<span class="over">· ${formatKRW(c.planned - c.budget)} 초과</span>`
            : `· ${formatKRW(c.budget - c.planned)} 남음`
          : ""}</div>
    </div>`;
  });
  const over = s.budgetTotal > 0 && s.remain < 0;
  $("budgetView").innerHTML = rows.join("") + `<div class="bud card">
    <div class="top"><span class="name">합계</span>
      <span>${formatKRW(s.planned)} / ${s.budgetTotal > 0 ? formatKRW(s.budgetTotal) : "예산 미설정"}</span></div>
    <div class="note">1인 ${formatKRW(s.perPerson)} · 하루 ${formatKRW(s.perDay)}
      ${s.budgetTotal > 0 ? (over ? `<span class="over">· ${formatKRW(-s.remain)} 초과</span>` : `· ${formatKRW(s.remain)} 남음`) : ""}</div>
  </div>`;
}

/* ── 조작 ─────────────────────────────────────────────────────────── */

function update(fn) {
  const trip = active();
  if (!trip) return;
  fn(trip);
  save();
  render();
}

$("tripPick").addEventListener("change", (e) => {
  store.activeId = e.target.value;
  editing = null;
  save();
  render();
});

const createTrip = () => {
  const trip = newTrip({ title: `여행 ${store.trips.length + 1}` });
  store.trips.push(trip);
  store.activeId = trip.id;
  save();
  render();
  openSetup();
};
$("newTrip").addEventListener("click", createTrip);
$("firstTrip").addEventListener("click", createTrip);

$("tabPlan").addEventListener("click", () => { tab = "plan"; render(); });
$("tabBudget").addEventListener("click", () => { tab = "budget"; render(); });

function openSetup() {
  const trip = active();
  if (!trip) return;
  const f = $("setupForm");
  for (const k of ["title", "dest", "start", "end", "people", "currency", "rate"]) f[k].value = trip[k];
  $("setup").showModal();
}
$("openSetup").addEventListener("click", openSetup);

$("setupForm").addEventListener("submit", (e) => {
  if (e.submitter?.value !== "save") return;
  const f = new FormData(e.target);
  update((trip) => {
    trip.title = String(f.get("title") ?? "").trim() || trip.title;
    trip.dest = String(f.get("dest") ?? "").trim();
    trip.start = String(f.get("start") ?? "") || trip.start;
    trip.end = String(f.get("end") ?? "") || trip.end;
    trip.people = Math.min(99, Math.max(1, Math.round(Number(f.get("people")) || 1)));
    trip.currency = (String(f.get("currency") ?? "").trim() || "KRW").toUpperCase();
    const rate = Number(f.get("rate"));
    trip.rate = rate > 0 ? rate : 1;
    // 기간을 줄여도 항목은 지우지 않는다 — "날짜 미정"으로 내려가 살아 있다.
  });
});

$("deleteTrip").addEventListener("click", () => {
  const trip = active();
  if (!trip || !confirm(`"${trip.title}"을(를) 삭제할까요? 되돌릴 수 없습니다.`)) return;
  store.trips = store.trips.filter((t) => t.id !== trip.id);
  store.activeId = store.trips[0]?.id ?? "";
  save();
  $("setup").close();
  render();
});

// 일정 조작은 목록 전체에 위임한다 — 매 렌더마다 핸들러를 다시 달지 않는다.
$("planView").addEventListener("click", (e) => {
  const add = e.target.closest("[data-add]");
  if (add) { editing = `new:${add.dataset.add}`; render(); return; }
  const del = e.target.closest("[data-del]");
  if (del) {
    update((trip) => { trip.items = trip.items.filter((i) => i.id !== del.dataset.del); });
    editing = null;
    render();
    return;
  }
  if (e.target.closest("[data-cancel]")) { editing = null; render(); return; }
  const row = e.target.closest("[data-item]");
  if (row) { editing = row.dataset.item; render(); }
});
$("planView").addEventListener("keydown", (e) => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const row = e.target.closest("[data-item]");
  if (!row) return;
  e.preventDefault();
  editing = row.dataset.item;
  render();
});

$("planView").addEventListener("submit", (e) => {
  const form = e.target.closest("[data-edit]");
  if (!form) return;
  e.preventDefault();
  const f = new FormData(form);
  const patch = {
    title: String(f.get("title") ?? "").trim(),
    time: String(f.get("time") ?? ""),
    cat: String(f.get("cat") ?? "etc"),
    status: String(f.get("status") ?? "plan"),
    amount: Math.max(0, Number(f.get("amount")) || 0),
    cur: f.get("cur") === "LOC" ? "LOC" : "KRW",
    per: f.get("per") === "on",
    memo: String(f.get("memo") ?? "").trim(),
    date: String(f.get("date") ?? ""),
  };
  update((trip) => {
    if (form.dataset.new) trip.items.push(newItem(patch));
    else {
      const item = trip.items.find((i) => i.id === form.dataset.edit);
      if (item) Object.assign(item, patch);
    }
  });
  // 이어서 더 넣는 경우가 많다 — 추가였으면 빈 폼을 그 자리에 다시 연다.
  editing = form.dataset.new ? `new:${form.dataset.date}` : null;
  render();
});

$("budgetView").addEventListener("change", (e) => {
  const input = e.target.closest("[data-budget]");
  if (!input) return;
  update((trip) => {
    trip.budgets[input.dataset.budget] = Math.max(0, Math.round(Number(input.value) || 0));
  });
});

/* ── 계획 탭: 여행지 관측 ──────────────────────────────────────────
 *
 * 여기만 서버를 쓴다. **여행지가 상위 개념**이고 항공 노선은 그걸 실현하는 수단
 * 중 하나다(패키지는 자리만 있고 수집기는 아직 없다). 내 일정·예산은 올라가지
 * 않지만 여행 의향은 드러나므로 읽기·쓰기 모두 admin 발급 토큰을 쓴다.
 */
let destinations = [];
let selected = null;    // 펼친 여행지 id
let selectedFlight = null;
let grid = null;
let packages = null;   // 패키지 목록을 펼친 여행지의 응답
let planError = "";    // 목록 자체를 못 불러온 경우
let detailError = "";  // 격자·패키지 상세만 실패한 경우
let editingDestination = null;
const token = () => localStorage.getItem(TOKEN_KEY) ?? "";

async function api(path, init = {}) {
  const headers = { ...(init.headers ?? {}), Authorization: `Bearer ${token()}` };
  if (init.method && init.method !== "GET") headers["Content-Type"] = "application/json";
  const res = await fetch(`/_trip${path}`, { ...init, headers });
  const body = await res.json().catch(() => null);
  if (!res.ok) {
    throw new Error(body?.errors?.join(", ") || body?.error ||
      (res.status === 401 ? "토큰이 필요합니다 — 🔑 에서 admin 발급 토큰을 넣어 주세요" : `요청 실패 (${res.status})`));
  }
  return body;
}

async function loadDestinations() {
  try {
    const data = await api("/destinations");
    destinations = data.destinations ?? [];
    const p = data.provider ?? {};
    const kind = qualityBadge(p.quality);
    $("watchProvider").innerHTML = `가격 관측 ${kind} <span class="dim">${esc(p.name ?? "?")}</span>` +
      (p.live === false ? ' <span class="dim">· 집 PC 데몬이 수집</span>' : "");
    planError = "";
    if (!destinations.some((d) => d.id === selected)) {
      selected = destinations[0]?.id ?? null;
      selectedFlight = null;
    }
    const flights = destinations.find((d) => d.id === selected)?.flights ?? [];
    if (!flights.some((f) => f.id === selectedFlight)) selectedFlight = flights[0]?.id ?? null;
    if (selectedFlight) await loadGrid(selectedFlight);
    else grid = null;
  } catch (error) {
    planError = error.message;
  }
  renderWatches();
}

// 상세(격자·패키지) 실패가 목록 전체를 덮으면 안 된다 — 노선 하나가 사라졌을 뿐인데
// 여행지 카드가 통째로 에러 문구로 바뀌면 다른 여행지도 못 본다.
async function loadGrid(flightId) {
  try {
    grid = await api(`/grid?flight=${encodeURIComponent(flightId)}`);
    detailError = "";
  } catch (error) {
    grid = null;
    detailError = error.message;
  }
}

// 가격의 성격. "예매가"라고 부르지 않는다 — 검색 결과 가격은 좌석·수수료 때문에
// 결제 화면에서 바뀔 수 있어서, 그대로 결제된다고 오해하면 예산이 어긋난다.
const QUALITY = {
  verified: { cls: "live", label: "확인됨", note: "결제 직전까지 확인한 값" },
  live: { cls: "live", label: "실시간", note: "예약 직전 재확인 필요" },
  reference: { cls: "ref", label: "참고가", note: "그대로 결제되는 값이 아님" },
};
const qualityBadge = (q) => {
  const kind = QUALITY[q] ?? QUALITY.reference;
  return `<span class="badge ${kind.cls}" title="${kind.note}">${kind.label}</span>`;
};

// 나라 코드 → 국기. 코드가 없으면 지구본.
const flagOf = (code) => (/^[A-Z]{2}$/.test(code ?? "")
  ? String.fromCodePoint(...[...code].map((c) => 0x1f1e6 + c.charCodeAt(0) - 65))
  : "🌍");

const STATUS_LABEL = { watching: "관측 중", selected: "결정함", archived: "보류" };

function renderWatches() {
  $("watchList").innerHTML = planError
    ? `<div class="card empty">${esc(planError)}</div>`
    : destinations.length
      ? destinations.map(destinationCard).join("")
      : `<div class="card empty"><p>관측 중인 여행 후보가 없습니다.</p>
         <p class="dim">＋ 여행 후보 추가로 "몽골" 같은 여행지를 등록하고,<br>
         그 아래에 ICN→UBN 같은 노선을 답니다. 6시간마다 조금씩 조사합니다.</p></div>`;
  $("watchDetail").innerHTML = detailError
    ? `<div class="card empty">${esc(detailError)}</div>`
    : (packages ? packageView(packages)
      : (grid && selectedFlight ? detailView(grid) : ""));
}

function destinationCard(d) {
  const on = d.id === selected;
  const period = `${(d.from ?? "").slice(0, 7).replace("-", ".")} ~ ${(d.to ?? "").slice(0, 7).replace("-", ".")}`;
  const nights = d.oneWay ? "편도" : `${d.minNights}~${d.maxNights}박`;
  const lastChecked = Math.max(0, ...(d.flights ?? []).map((f) => f.coverage?.lastCheckedAt ?? 0));

  const routes = (d.flights ?? []).map((f) => {
    const price = f.best
      ? `${esc(formatKRW(f.best.price))}~`
      : (f.coverage?.attempted ? '<span class="dim">가격 없음</span>' : '<span class="dim">조사 전</span>');
    const cov = f.coverage
      ? `<span class="dim">${f.coverage.resolved}/${f.coverage.total}` +
        `${f.coverage.error ? ` · 오류 ${f.coverage.error}` : ""}</span>`
      : "";
    return `<div class="route-line${f.id === selectedFlight && on ? " on" : ""}" data-flight="${esc(f.id)}" role="button" tabindex="0">
      <span>✈️ ${esc(f.origin)} → ${esc(f.dest)}</span>
      <span class="p">${price}</span> ${cov}
    </div>`;
  }).join("") || '<div class="dim">노선이 없습니다 — ⚙️ 에서 추가하세요</div>';

  const packages = packageLine(d);

  return `<div class="watch card" data-dest="${esc(d.id)}" aria-selected="${on}">
    <div class="top">
      <span class="route">${flagOf(d.country)} ${esc(d.name)}</span>
      <span class="dim">${esc(period)} · ${esc(nights)} · ${d.people}명</span>
      <span class="dim" style="margin-left:auto">${esc(STATUS_LABEL[d.status] ?? d.status)}</span>
    </div>
    <div class="routes">${routes}</div>
    ${packages}
    <div class="row" style="margin-top:6px">
      <span class="dim">최근 조사 ${lastChecked ? esc(agoLabel(lastChecked)) : "없음"}</span>
      <span class="row" style="margin-left:auto">
        <button class="ghost" data-edit-dest="${esc(d.id)}">⚙️ 설정</button>
        <button class="ghost" data-refresh="${esc(d.id)}">🔄 지금 조사</button>
      </span>
    </div>
  </div>`;
}

// 패키지는 표시가가 아니라 **실질가(effectivePrice)** 로 줄을 세운다 —
// 표시가로 비교하면 현지경비를 감춘 상품이 항상 이긴다.
function packageLine(d) {
  const s = d.packageSummary;
  if (!s?.count) {
    const watching = (d.packages ?? []).length;
    return `<div class="route-line" data-packages="${esc(d.id)}" role="button" tabindex="0">
      <span>🧳 패키지</span>
      <span class="p dim">${watching ? "수집 대기" : "아직 수집 전"}</span></div>`;
  }
  const best = s.best;
  const delta = Number.isFinite(s.change) && s.change !== 0
    ? `<span class="delta ${s.change < 0 ? "down" : "up"}">${s.change < 0 ? "▼" : "▲"} ${esc(formatShort(Math.abs(s.change)))}</span>`
    : "";
  const floor = s.floor
    ? ` <span class="badge ref" title="${esc(s.unknownCosts.join(", "))}">추가비용 확인 필요</span>`
    : "";
  const span = best.nights ? `${best.nights}박${best.days ? `${best.days}일` : ""}` : "";
  return `<div class="route-line" data-packages="${esc(d.id)}" role="button" tabindex="0">
    <span>🧳 ${esc(best.title || "패키지")}</span>
    <span class="p">${esc(formatKRW(best.effectivePrice))}${s.floor ? "~" : ""}/인 ${delta}</span>
    <span class="dim">${esc([span, best.airline, `${s.count}건`].filter(Boolean).join(" · "))}</span>${floor}
  </div>`;
}

function agoLabel(ms) {
  const diff = Date.now() - ms;
  if (diff < 3600000) return `${Math.max(1, Math.round(diff / 60000))}분 전`;
  if (diff < 86400000) return `${Math.round(diff / 3600000)}시간 전`;
  return `${Math.round(diff / 86400000)}일 전`;
}

// 격자: 행=출발일, 열=박수. Google Flights 의 날짜 격자와 같은 읽는 법이지만
// 열을 귀국일 대신 박수로 둬서 폰 화면에 들어온다.
function detailView(g) {
  const cells = g.cells ?? [];
  const flight = g.watch ?? {};
  const head2 = `<h2>✈️ ${esc(flight.origin ?? "")} → ${esc(flight.dest ?? "")} 날짜별 최저가</h2>`;
  if (!cells.length) {
    return `${head2}<div class="card empty">아직 관측된 가격이 없습니다.
      <br><span class="dim">6시간마다 조금씩 모읍니다 — "지금 조사"로 앞당길 수 있습니다.</span>
      ${coverageNote(g.coverage)}</div>`;
  }
  const prices = cells.map((c) => c.price);
  const min = Math.min(...prices);
  const max = Math.max(...prices);
  const nights = [...new Set(cells.map((c) => nightsOf(c)))].sort((a, b) => a - b);
  const departs = [...new Set(cells.map((c) => c.depart))].sort();
  const at = new Map(cells.map((c) => [`${c.depart}:${nightsOf(c)}`, c]));

  const tier = (p) => {
    if (max === min) return "cheap";
    const r = (p - min) / (max - min);
    return r <= 0.33 ? "cheap" : r <= 0.66 ? "mid" : "dear";
  };

  const head = `<tr><th></th>${nights.map((n) => `<th>${n}박</th>`).join("")}</tr>`;
  const rows = departs.map((d) => {
    const tds = nights.map((n) => {
      const cell = at.get(`${d}:${n}`);
      if (!cell) return `<td><button class="empty" disabled>·</button></td>`;
      const isBest = cell.price === min;
      return `<td><button class="${tier(cell.price)}${isBest ? " best" : ""}"
        data-pick="${esc(cell.depart)}|${esc(cell.ret ?? "")}|${cell.price}"
        title="${esc(cell.depart)}${cell.ret ? ` → ${esc(cell.ret)}` : ""} · ${esc(cell.carrier || "")} ${cell.stops ? `${cell.stops}경유` : "직항"} · ${esc(observedLabel(cell.observedAt))} 관측">
        ${esc(formatShort(cell.price))}</button></td>`;
    }).join("");
    return `<tr><th class="rowh">${esc(d.slice(5).replace("-", "/"))} (${esc(weekday(d))})</th>${tds}</tr>`;
  }).join("");

  const badge = qualityBadge(g.stats?.quality) +
    (g.stats?.quality === "live" ? ' <span class="dim">예약 직전 재확인 필요</span>' : "");

  return `${head2}<div class="card bud">
    <div class="top"><span class="name">최저 ${esc(formatKRW(min))}</span> ${badge}
      <span class="dim">중앙값 ${esc(formatKRW(g.stats?.median ?? 0))} · 관측 ${g.stats?.observed ?? 0}칸</span></div>
    <div class="note">${g.best ? `${esc(g.best.depart)}${g.best.ret ? ` → ${esc(g.best.ret)}` : ""} · ${esc(g.best.carrier || "-")}${g.best.stops ? ` · ${g.best.stops}경유` : " · 직항"}
      · <span class="dim">${esc(observedLabel(g.best.observedAt))} 관측</span>` : ""}</div>
  </div>
  <div class="gridwrap"><table class="grid">${head}${rows}</table></div>
  <div class="legend">
    <span><i style="background:light-dark(#dcf5e6,#14361f)"></i>싼 편</span>
    <span><i style="background:light-dark(#fdf3d9,#3a3013)"></i>중간</span>
    <span><i style="background:light-dark(#fbe3e0,#3d1c19)"></i>비싼 편</span>
    <span>칸을 누르면 그 날짜로 일정이 만들어집니다</span>
  </div>
  ${trendView(g.history ?? [], g.coverage)}`;
}

// 시도(attempted)와 답을 얻은 것(resolved)은 다르다 — 상류가 429 로 막혀도
// 큐가 막히지 않게 시각은 갱신되므로, 시도만 세면 오류가 숨는다.
function coverageNote(c) {
  if (!c?.total) return "";
  return `<div class="note">한 바퀴 진행 ${c.resolved}/${c.total} 조합` +
    `${c.noOffer ? ` · 항공편 없음 ${c.noOffer}` : ""}` +
    `${c.error ? ` · <span class="over">오류 ${c.error}</span>` : ""}` +
    `${c.attempted > c.resolved + c.error ? "" : ""}</div>`;
}

const nightsOf = (c) => {
  if (!c.ret) return 0;
  const a = Date.parse(`${c.depart}T00:00:00Z`);
  const b = Date.parse(`${c.ret}T00:00:00Z`);
  return Math.round((b - a) / 86400000);
};

/* 패키지 상세 — 표시가와 실질가를 나란히 둔다. 이게 이 화면의 핵심이다:
 * 표시가 749,900원 옆에 "현지경비·선택관광 확인 필요"가 없으면 자유여행과
 * 비교할 때 패키지가 실제보다 싸 보인다. */
function packageView(data) {
  const rows = data.packages ?? [];
  if (!rows.length) {
    return `<h2>🧳 패키지</h2><div class="card empty">
      아직 수집된 상품이 없습니다.
      <br><span class="dim">집 PC 데몬이 여행사 페이지를 읽어 밀어 넣습니다
      (<code>POST /_trip/snapshot</code>).</span></div>`;
  }
  const list = rows.map((p) => {
    const extra = p.effectivePrice - p.listedPrice;
    return `<div class="card bud">
      <div class="top">
        <span class="name">${esc(p.title || "(제목 없음)")}</span>
        <span>${esc(formatKRW(p.effectivePrice))}${p.floor ? "~" : ""}/인</span>
      </div>
      <div class="note">${esc([
        p.nights ? `${p.nights}박${p.days ? `${p.days}일` : ""}` : "",
        p.departureDate, p.airline,
        p.direct === null ? "" : (p.direct ? "직항" : "경유"),
      ].filter(Boolean).join(" · "))}</div>
      <div class="note">표시가 ${esc(formatKRW(p.listedPrice))}${extra > 0 ? ` · 확인된 추가 ${esc(formatKRW(extra))}` : ""}
        ${p.floor ? `· <span class="over">추가비용 확인 필요: ${esc(p.unknownCosts.join(", "))}</span>` : ""}</div>
      ${p.included?.length ? `<div class="note">포함 ${esc(p.included.join(", "))}</div>` : ""}
      ${p.excluded?.length ? `<div class="note">불포함 ${esc(p.excluded.join(", "))}</div>` : ""}
      <div class="note dim">${esc(p.source)} · ${esc(observedLabel(p.observedAt))} 관측
        ${p.url ? `· <a href="${esc(p.url)}" target="_blank" rel="noopener">상품 보기</a>` : ""}</div>
    </div>`;
  }).join("");
  return `<h2>🧳 패키지 ${rows.length}건</h2>
    <p class="dim">실질가(표시가 + 확인된 필수비용) 순입니다. 모르는 비용은 0원으로 세지 않고
    "확인 필요"로 둡니다 — 그래야 나중에 자유여행과 정직하게 비교됩니다.</p>
    ${list}`;
}

// 격자 칸은 "마지막으로 본 값"이다 — 며칠 전 값일 수 있으니 언제 본 것인지 밝힌다.
function observedLabel(ms) {
  if (!Number.isFinite(ms)) return "?";
  const day = todayKST(new Date(ms));
  const today = todayKST();
  if (day === today) return "오늘";
  const diff = Math.round((Date.parse(`${today}T00:00:00Z`) - Date.parse(`${day}T00:00:00Z`)) / 86400000);
  return diff === 1 ? "어제" : `${diff}일 전`;
}

// 추이 점은 **그날 실제로 조회한 것**의 최저가다. cron 이 하루에 그리드의 일부만
// 돌기 때문에, 몇 칸을 보고 나온 값인지(coverage)를 같이 보여 주지 않으면
// "그날 그 가격이 있었다"고 과장하게 된다.
function trendView(history, coverage) {
  const priced = history.filter((p) => Number.isFinite(p.min));
  const cov = (p) => (p?.total ? ` · ${p.found ?? p.checked}/${p.total} 조합 확인` : "");
  if (priced.length < 2) {
    const last = history.at(-1);
    return `<p class="dim" style="margin-top:10px">추이는 가격이 나온 관측일이 이틀 이상 쌓이면 그려집니다
      (지금 ${priced.length}일${last ? cov(last) : ""}).</p>${coverageNote(coverage)}`;
  }
  const w = 300;
  const h = 60;
  const values = priced.map((p) => p.min);
  const min = Math.min(...values);
  const max = Math.max(...values);
  const span = max - min || 1;
  const x = (i) => (i / (priced.length - 1)) * w;
  const y = (v) => h - ((v - min) / span) * (h - 8) - 4;
  const line = priced.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.min).toFixed(1)}`).join(" ");
  const last = priced.at(-1);
  return `<h2>가격 추이</h2>
  <div class="card bud">
    <svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img"
      aria-label="관측일별 최저가 추이, ${formatKRW(values[0])}에서 ${formatKRW(values.at(-1))}">
      <path class="area" d="${line} L${w},${h} L0,${h} Z"></path>
      <path d="${line}"></path>
    </svg>
    <div class="note">${esc(last.date)} ${esc(formatKRW(last.min))}${esc(cov(last))}</div>
    <div class="note">${esc(priced[0].date)} ${esc(formatShort(values[0]))}
      → ${esc(last.date)} ${esc(formatShort(values.at(-1)))} · 기간 최저 ${esc(formatKRW(min))}</div>
    ${coverageNote(coverage)}
  </div>`;
}

$("modePlan").addEventListener("click", () => {
  mode = "plan";
  render();
  loadDestinations();
});
$("modeRun").addEventListener("click", () => { mode = "run"; render(); });

$("watchToken").addEventListener("click", () => {
  const next = prompt("admin 에서 발급한 접근 토큰을 붙여 넣으세요 (비우면 삭제)", token());
  if (next === null) return;
  if (next.trim()) localStorage.setItem(TOKEN_KEY, next.trim());
  else localStorage.removeItem(TOKEN_KEY);
  loadDestinations();
});

/* 노선 입력 줄 (여행지 하나에 여러 개) */
function routeRow(flight = {}) {
  const row = document.createElement("div");
  row.className = "route-row grid";
  row.innerHTML = `
    <label class="field">출발<input name="origin" maxlength="3" required value="${esc(flight.origin ?? "")}" placeholder="ICN" style="text-transform:uppercase"></label>
    <label class="field">도착<input name="dest" maxlength="3" required value="${esc(flight.dest ?? "")}" placeholder="UBN" style="text-transform:uppercase"></label>
    <label class="field">좌석<select name="cabin">
      <option value="ECONOMY"${flight.cabin === "ECONOMY" || !flight.cabin ? " selected" : ""}>이코노미</option>
      <option value="PREMIUM_ECONOMY"${flight.cabin === "PREMIUM_ECONOMY" ? " selected" : ""}>프리미엄</option>
      <option value="BUSINESS"${flight.cabin === "BUSINESS" ? " selected" : ""}>비즈니스</option>
    </select></label>
    <label class="check"><input type="checkbox" name="nonstop"${flight.nonstop ? " checked" : ""}> 직항만</label>
    <button type="button" class="ghost" data-drop-route="1">🗑</button>`;
  row.dataset.id = flight.id ?? "";
  return row;
}

$("addRoute").addEventListener("click", () => $("routeRows").append(routeRow()));
$("routeRows").addEventListener("click", (e) => {
  if (e.target.closest("[data-drop-route]")) e.target.closest(".route-row").remove();
});

function openDestinationForm(destination = null) {
  editingDestination = destination;
  const f = $("watchForm");
  const today = todayKST();
  $("watchFormTitle").textContent = destination ? "여행 후보 설정" : "여행 후보 추가";
  f.name.value = destination?.name ?? "";
  f.country.value = destination?.country ?? "";
  f.people.value = destination?.people ?? 2;
  f.from.value = destination?.from ?? today;
  f.to.value = destination?.to ?? today;
  f.minNights.value = destination?.minNights ?? 5;
  f.maxNights.value = destination?.maxNights ?? 8;
  f.status.value = destination?.status ?? "watching";
  $("routeRows").innerHTML = "";
  const flights = destination?.flights ?? [{}];
  for (const flight of flights) $("routeRows").append(routeRow(flight));
  $("watchError").textContent = "";
  $("watchSetup").showModal();
}

$("addWatch").addEventListener("click", () => openDestinationForm(null));

$("watchForm").addEventListener("submit", async (e) => {
  if (e.submitter?.value !== "save") return;
  e.preventDefault();
  const f = e.target;
  const flights = [...$("routeRows").querySelectorAll(".route-row")].map((row) => ({
    id: row.dataset.id || undefined,
    origin: row.querySelector('[name="origin"]').value,
    dest: row.querySelector('[name="dest"]').value,
    cabin: row.querySelector('[name="cabin"]').value,
    nonstop: row.querySelector('[name="nonstop"]').checked,
  }));
  try {
    const created = await api("/destinations", {
      method: "POST",
      body: JSON.stringify({
        id: editingDestination?.id,
        createdAt: editingDestination?.createdAt,
        packages: editingDestination?.packages ?? [],
        name: f.name.value, country: f.country.value, people: Number(f.people.value),
        from: f.from.value, to: f.to.value,
        minNights: Number(f.minNights.value), maxNights: Number(f.maxNights.value),
        status: f.status.value,
        flights,
      }),
    });
    selected = created.destination.id;
    selectedFlight = created.destination.flights[0]?.id ?? null;
    $("watchSetup").close();
    await loadDestinations();
  } catch (error) {
    $("watchError").textContent = error.message;
  }
});

$("planMode").addEventListener("click", async (e) => {
  const editDest = e.target.closest("[data-edit-dest]");
  if (editDest) {
    openDestinationForm(destinations.find((d) => d.id === editDest.dataset.editDest));
    return;
  }
  const refresh = e.target.closest("[data-refresh]");
  if (refresh) {
    refresh.disabled = true;
    refresh.textContent = "조사 중…";
    try {
      await api("/refresh", {
        method: "POST",
        body: JSON.stringify({ destinationId: refresh.dataset.refresh, limit: 12 }),
      });
      await loadDestinations();
    } catch (error) {
      planError = error.message;
      renderWatches();
    }
    return;
  }
  const pkg = e.target.closest("[data-packages]");
  if (pkg) {
    selected = pkg.closest("[data-dest]").dataset.dest;
    selectedFlight = null;
    grid = null;
    try {
      packages = await api(`/packages?destination=${encodeURIComponent(selected)}`);
      detailError = "";
    } catch (error) {
      packages = null;
      detailError = error.message;
    }
    renderWatches();
    return;
  }
  const route = e.target.closest("[data-flight]");
  if (route) {
    selected = route.closest("[data-dest]").dataset.dest;
    selectedFlight = route.dataset.flight;
    packages = null;
    detailError = "";
    await loadGrid(selectedFlight);
    renderWatches();
    return;
  }
  const card = e.target.closest("[data-dest]");
  if (card && card.dataset.dest !== selected) {
    selected = card.dataset.dest;
    packages = null;
    selectedFlight = destinations.find((d) => d.id === selected)?.flights?.[0]?.id ?? null;
    if (selectedFlight) await loadGrid(selectedFlight);
    else grid = null;
    renderWatches();
    return;
  }
  // 격자 칸 → 그 날짜로 실행 탭의 여행을 만든다. 계획에서 실행으로 넘어오는 길목이고,
  // 이때부터는 서버가 아니라 브라우저에만 남는다.
  const pick = e.target.closest("[data-pick]");
  if (pick) adoptCombo(pick.dataset.pick);
});

$("planMode").addEventListener("keydown", (e) => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const line = e.target.closest("[data-flight], [data-packages]");
  if (!line) return;
  e.preventDefault();
  line.click();
});

function adoptCombo(value) {
  const [depart, ret, price] = value.split("|");
  const destination = destinations.find((d) => d.id === selected);
  const flight = (destination?.flights ?? []).find((f) => f.id === selectedFlight);
  if (!destination || !flight) return;
  if (!confirm(`${depart}${ret ? ` → ${ret}` : ""} 일정으로 새 여행을 만들까요?\n항공권 ${formatKRW(Number(price))}이 예산에 들어갑니다.`)) return;
  const trip = newTrip({
    title: destination.name,
    dest: destination.name,
    start: depart,
    end: ret || depart,
    people: destination.people,
    items: [newItem({
      date: depart, title: `${flight.origin} → ${flight.dest} 항공권`, cat: "flight",
      amount: Number(price), cur: "KRW", status: "plan",
      memo: `관측 최저가 (${flight.origin}→${flight.dest})`,
    })],
  });
  store.trips.push(trip);
  store.activeId = trip.id;
  save();
  mode = "run";
  tab = "plan";
  render();
}

/* ── 내보내기·가져오기 (기기 옮길 때) ─────────────────────────────── */

$("exportBtn").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(store, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `trip-${todayKST()}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
$("importBtn").addEventListener("click", () => $("importFile").click());
$("importFile").addEventListener("change", async (e) => {
  const file = e.target.files?.[0];
  if (!file) return;
  try {
    const incoming = normalizeStore(JSON.parse(await file.text()));
    if (!incoming.trips.length) throw new Error("여행이 없습니다");
    if (!confirm(`여행 ${incoming.trips.length}건을 가져옵니다. 지금 저장된 내용은 지워집니다.`)) return;
    store = incoming;
    editing = null;
    save();
    render();
  } catch (err) {
    alert(`가져오지 못했습니다: ${err.message}`);
  } finally {
    e.target.value = "";
  }
});

render();
</script>
