<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>🛋️ 인테리어 동선 계산기</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>🛋️</text></svg>">
<link rel="stylesheet" href="/_shared/bubble.css">
<style>
  :root { --accent-h: 336; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); overflow: hidden; }
  .app { height: 100dvh; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
  @media (min-width: 900px) {
    .app { grid-template-columns: minmax(0, 1fr) 380px; grid-template-rows: auto minmax(0, 1fr); }
    .top { grid-column: 1 / -1; }
    .side { grid-row: 2; grid-column: 2; max-height: none !important; border-top: 0 !important; border-left: 1px solid var(--line); }
  }
  .top { display: flex; align-items: center; gap: var(--s-2); flex-wrap: wrap;
         padding: calc(env(safe-area-inset-top, 0px) + var(--s-2)) max(16px, env(safe-area-inset-right, 0px)) var(--s-2) max(16px, env(safe-area-inset-left, 0px));
         border-bottom: 1px solid var(--line); }
  .top h1 { margin: 0; font-family: var(--serif); font-size: 1.1rem; font-weight: 700; }
  .top .name { color: var(--muted); font-size: var(--t-small); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  #stage { position: relative; min-height: 0; touch-action: none; user-select: none; -webkit-user-select: none; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  .float { position: absolute; display: flex; gap: var(--s-1); }
  .float.tl { top: var(--s-2); left: max(var(--s-2), env(safe-area-inset-left, 0px)); }
  .float.tr { top: var(--s-2); right: max(var(--s-2), env(safe-area-inset-right, 0px)); }
  .hint { position: absolute; bottom: var(--s-2); left: 50%; transform: translateX(-50%); font-size: var(--t-caption);
          color: var(--muted); pointer-events: none; white-space: nowrap; }

  .side { overflow-y: auto; max-height: 44dvh; border-top: 1px solid var(--line); background: var(--field);
          padding: var(--s-3) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + var(--s-3)) max(16px, env(safe-area-inset-left, 0px));
          display: grid; gap: var(--s-3); align-content: start; }
  .score { display: flex; align-items: baseline; gap: var(--s-2); flex-wrap: wrap; }
  .score b { font-size: 1.8rem; font-variant-numeric: tabular-nums; }
  .score .sub { color: var(--muted); font-size: var(--t-small); }
  .score .delta { font-size: var(--t-small); font-weight: 600; }
  .delta.good { color: var(--ok); } .delta.bad { color: var(--bad); }
  .row { display: flex; gap: var(--s-2); flex-wrap: wrap; align-items: center; }
  .tasks { display: grid; gap: 2px; margin: 0; padding: 0; list-style: none; }
  .tasks li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--s-2); align-items: center;
              padding: .35rem .5rem; border-radius: var(--r-sm); cursor: pointer; font-size: var(--t-small); }
  .tasks li:hover { background: var(--sunk); }
  .tasks li.off { opacity: .45; }
  .tasks .sw { width: .8rem; height: .8rem; border-radius: 50%; }
  .tasks .lbl { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tasks .num { font-family: var(--mono); font-size: var(--t-caption); color: var(--muted); }
  .tasks .warn { color: var(--bad); }
  .sel { display: grid; gap: var(--s-2); }
  .sel[hidden] { display: none; }
  .sel .title { font-weight: 700; }
  .sel .meta { font-family: var(--mono); font-size: var(--t-caption); color: var(--muted); }
  .problems { color: var(--bad); font-size: var(--t-small); margin: 0; }
  .progress { height: 4px; border-radius: 2px; background: var(--sunk); overflow: hidden; }
  .progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  h2 { margin: 0; font-size: var(--t-caption); font-family: var(--mono); color: var(--muted); letter-spacing: .06em; font-weight: 500; }

  dialog { width: min(720px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); border: 1px solid var(--line);
           border-radius: var(--r-lg); background: var(--field); color: var(--ink); padding: var(--s-4); }
  dialog::backdrop { background: color-mix(in srgb, var(--bg) 70%, transparent); }
  dialog form { display: grid; gap: var(--s-3); }
  dialog textarea { width: 100%; min-height: 50dvh; font-family: var(--mono); font-size: .75rem; line-height: 1.4;
                    color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-sm); padding: var(--s-2); }
  dialog h3 { margin: 0; font-size: 1rem; }
  .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 1rem); transform: translateX(-50%);
           z-index: 9; max-width: calc(100vw - 32px); font-family: var(--sans); border-radius: var(--r); }
  .toast[hidden] { display: none; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>🛋️ 동선 계산기</h1>
    <span class="name" id="plan-name"></span>
    <button class="bl-btn bl-btn--sm" id="open-json" type="button">📄 도면 JSON</button>
  </header>

  <div id="stage">
    <div class="float tl">
      <button class="bl-btn bl-btn--sm" id="view" type="button">⬇ 위에서</button>
      <button class="bl-btn bl-btn--sm" id="walls" type="button">🧱 벽 낮게</button>
    </div>
    <div class="float tr">
      <button class="bl-btn bl-btn--sm" id="undo" type="button" disabled>↶ 되돌리기</button>
    </div>
    <div class="hint" id="hint">가구를 끌어 옮기고, 빈 곳을 끌면 돌려 봅니다</div>
  </div>

  <aside class="side">
    <div>
      <h2>주당 동선</h2>
      <div class="score"><b id="score">—</b><span class="sub" id="score-sub"></span><span class="delta" id="delta"></span></div>
    </div>
    <div class="row">
      <button class="bl-btn bl-btn--primary" id="optimize" type="button">✨ 동선 최적화</button>
      <button class="bl-btn bl-btn--ghost" id="reset-base" type="button" title="지금 배치를 비교 기준으로">기준 다시 잡기</button>
    </div>
    <div class="progress" id="progress" hidden><i></i></div>

    <section class="sel" id="sel" hidden>
      <h2>선택한 가구</h2>
      <div class="title" id="sel-title"></div>
      <div class="meta" id="sel-meta"></div>
      <div class="row">
        <button class="bl-btn bl-btn--sm" id="rotate" type="button">⟳ 90° 돌리기</button>
        <button class="bl-btn bl-btn--sm" id="pin" type="button">📌 고정</button>
        <button class="bl-btn bl-btn--sm bl-btn--ghost" id="deselect" type="button">닫기</button>
      </div>
      <p class="problems" id="sel-problems"></p>
    </section>

    <section>
      <h2>할 일별 (눌러서 길 보이기/숨기기)</h2>
      <ul class="tasks" id="tasks"></ul>
    </section>
    <p class="problems" id="problems"></p>
    <p class="bl-note">걷는 길은 벽·가구를 몸 반지름(20cm)만큼 피해서 잽니다. 📌 고정한 가구와 붙박이(세탁기·싱크대 등)는 최적화가 옮기지 않아요.
      도면은 이 브라우저에만 저장됩니다.</p>
  </aside>
</div>

<dialog id="json-dlg">
  <form method="dialog">
    <h3>도면 JSON</h3>
    <p class="bl-note">LLM 에게 「LLM 요청문 복사」를 붙여 넣고 원하는 걸 말하면 이 형식으로 초안을 써 줍니다. 받은 JSON 을 여기 붙여 넣고 불러오기.</p>
    <textarea id="json-text" spellcheck="false"></textarea>
    <p class="problems" id="json-err"></p>
    <div class="row">
      <button class="bl-btn bl-btn--primary" id="json-load" type="button">불러오기</button>
      <button class="bl-btn" id="json-copy" type="button">JSON 복사</button>
      <button class="bl-btn" id="json-prompt" type="button">🤖 LLM 요청문 복사</button>
      <button class="bl-btn bl-btn--ghost" id="json-sample" type="button">예시 도면</button>
      <button class="bl-btn bl-btn--ghost" value="close">닫기</button>
    </div>
  </form>
</dialog>

<div class="toast bl-pill bl-glass" id="toast" hidden></div>

<script type="module" src="./app.js"></script>
</body>
</html>
