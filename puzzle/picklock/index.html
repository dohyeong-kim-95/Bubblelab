<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>자물쇠 따기 — 광고에서 본 그 게임</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>🔓</text></svg>">
<style>
  :root { color-scheme: light dark; }
  html, body { height: 100%; }
  body { margin: 0; overflow: hidden; user-select: none; -webkit-user-select: none;
         touch-action: none; font-family: ui-monospace, "SF Mono", "Cascadia Mono",
         "Roboto Mono", Consolas, monospace;
         background: light-dark(#f6ead8, #1a1626); color: light-dark(#3a2b18, #e8ddcb); }
  canvas { display: block; touch-action: none; }
  #hud { position: fixed; top: 0; left: 0; right: 0; display: flex; gap: .55rem;
         align-items: center; padding: .5rem .7rem; font-size: .78rem; z-index: 3;
         pointer-events: none; white-space: nowrap; }
  #hud .sp { flex: 1; }
  #hud > span:first-child { flex: 0 1 auto; min-width: 0; overflow: hidden;
                            text-overflow: ellipsis; }
  #retry { pointer-events: auto; font: inherit; border: 1.5px solid currentColor;
           background: none; color: inherit; border-radius: 1rem; padding: .15rem .7rem;
           cursor: pointer; opacity: .75; }
  #retry:active { transform: scale(.95); }
  #overlay { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
             display: flex; flex-direction: column; align-items: center; gap: .9rem;
             width: min(84vw, 21rem); padding: 1.5rem 1.6rem; border-radius: 1.25rem;
             text-align: center; z-index: 5;
             border: 1.5px solid light-dark(rgba(90,60,20,.3), rgba(230,215,190,.25));
             background: light-dark(rgba(255,250,240,.92), rgba(26,20,38,.92));
             backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #overlay.hide { display: none; }
  #overlay h1 { margin: 0; font-size: 1.15rem; }
  #overlay p { margin: 0; font-size: .88rem; line-height: 1.55; opacity: .75;
               white-space: pre-line; }
  #overlay .big { font-size: 2.2rem; margin: 0; }
  #btn { font: inherit; font-size: 1.05rem; padding: .75rem 2.2rem; border-radius: 2rem;
         border: 2px solid currentColor; background: none; color: inherit; cursor: pointer; }
  #btn:active { transform: scale(.96); }
  #best { margin: 0; font-size: .8rem; opacity: .5; min-height: 1.1em; }
</style>
</head>
<body>
<div id="hud">
  <span>🔓 <b>자물쇠 따기 (진짜임)</b></span>
  <span class="sp"></span>
  <span id="hStage"></span>
  <button id="retry" title="다시 시작">↻</button>
</div>
<div id="overlay">
  <p class="big" id="oEmoji">🔓</p>
  <h1 id="oTitle">자물쇠 따기</h1>
  <p id="oMsg">광고 속 그 사람이 만년 실패하던 게임.
근데 이건 진짜로 그 게임임.

바늘이 금색 구간에 들어왔을 때 탭!
성공할 때마다 방향이 바뀌고 빨라져요.
한 번이라도 빗나가면 자물쇠가 부러집니다.</p>
  <button id="btn">시작</button>
  <p id="best"></p>
</div>
<canvas id="cv"></canvas>
<script>
"use strict";
// 정적 난이도(0~100)와 별점 — DIFFICULTY.md Phase 1
const clamp01 = (x) => Math.max(0, Math.min(1, x));
const starsOf = (d) => "\u2605".repeat(Math.max(1, Math.min(5, Math.ceil(d / 20))));
let dScore = 0;

/* ── 상수/난수 ────────────────────────────────────────── */
const W = 360, H = 640, CX = 180, CY = 340, R = 112;
const dark = matchMedia("(prefers-color-scheme: dark)");
const mulberry32 = (a) => () => {
  a |= 0; a = (a + 0x6D2B79F5) | 0;
  let t = Math.imul(a ^ (a >>> 15), 1 | a);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};
const D2R = Math.PI / 180;
const angDiff = (a, b) => ((a - b + 540) % 360) - 180;

function diffFor(s) {
  const need2 = Math.min(3 + s, 12);
  const spd2 = Math.min(200 + s * 22, 500) + 7 * need2;  // 중반 속도 기준
  const windowMs = (2 * Math.max(9, 21 - s)) / spd2 * 1000;
  return 100 * clamp01((170 - windowMs) / 130 * 0.7 + (need2 - 4) / 8 * 0.3);
}
window.blDiffAt = diffFor;

/* ── 상태 ─────────────────────────────────────────────── */
let stage = 1, best = +localStorage.getItem("picklock.best") || 0;
let phase = "title";
let need = 0, hits = 0, ang = 0, dir = 1, spd = 0, half = 0;
let notches = [], flash = 0, breakT = 0, shackleT = 0;

function loadStage() {
  const rnd = mulberry32(stage * 40093 + 17);
  need = Math.min(3 + stage, 12);
  spd = Math.min(200 + stage * 22, 500);          // 도/초
  half = Math.max(9, 21 - stage);                 // 노치 반각(도)
  notches = [];
  let prev = 90;
  for (let i = 0; i < need; i++) {                // 직전 위치에서 충분히 떨어진 곳
    let a2 = (prev + 70 + rnd() * 220) % 360;
    notches.push(a2); prev = a2;
  }
  hits = 0; ang = 200; dir = 1;
  dScore = diffFor(stage);
  flash = 0; breakT = 0; shackleT = 0;
  phase = "play";
  window.__pl = {                                  // 테스트/디버그용
    state: () => ({ hits, need, ang, notch: notches[hits], half, spd, dir }),
    aligned: (m = 3) => Math.abs(angDiff(ang, notches[hits] ?? 0)) <= Math.max(2, half - m),
    misaligned: () => Math.abs(angDiff(ang, notches[hits] ?? 0)) > half + 25,
  };
  hud();
}

function tap() {
  if (phase !== "play") return;
  const diff = Math.abs(angDiff(ang, notches[hits]));
  if (diff <= half + 1.5) {                        // 살짝 관용
    hits++; flash = 1; dir *= -1;
    spd += 14;                                     // 딸 때마다 조금 더 빨라짐
    hud();
    if (hits >= need) return win();
  } else {
    breakT = 1; fail();
  }
}

function fail() {
  phase = "fail";
  const quips = ["광고에서 봤죠? 네, 이게 그 기분입니다.",
                 "광고 속 그 사람이 이해되기 시작했다면 정상입니다.",
                 "괜찮아요. 자물쇠는 원래 열쇠로 여는 겁니다."];
  show("🔒", "부러졌다…", `${hits}/${need} 핀에서 빗나갔어요.\n\n` +
       quips[(Math.random() * quips.length) | 0], "다시 도전");
}
function win() {
  phase = "win"; shackleT = 0.001;
  if (stage > best) { best = stage; localStorage.setItem("picklock.best", best); }
  window.blWeeklyReport?.(stage);
  show("🔓", `스테이지 ${stage} 클리어!`,
       `${need}핀 자물쇠 해제. 광고 속 그 사람은 못 하는 것.`, "다음 자물쇠");
}

/* ── 그리기 ───────────────────────────────────────────── */
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
let scale = 1, ox = 0, oy = 0;
function resize() {
  const dpr = devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  cv.style.width = innerWidth + "px"; cv.style.height = innerHeight + "px";
  scale = Math.min(innerWidth / W, innerHeight / H);
  ox = (innerWidth - W * scale) / 2; oy = (innerHeight - H * scale) / 2;
}
addEventListener("resize", resize); resize();

function rr(x, y, w, h, r2) {
  ctx.beginPath();
  ctx.moveTo(x + r2, y);
  ctx.arcTo(x + w, y, x + w, y + h, r2);
  ctx.arcTo(x + w, y + h, x, y + h, r2);
  ctx.arcTo(x, y + h, x, y, r2);
  ctx.arcTo(x, y, x + w, y, r2);
  ctx.closePath();
}

function draw(dt) {
  const D = dark.matches, dpr = devicePixelRatio || 1;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = D ? "#1a1626" : "#f6ead8";
  ctx.fillRect(0, 0, innerWidth, innerHeight);
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * ox, dpr * oy);
  if (phase === "title") return;

  const steel = D ? "#9fb0c2" : "#8494a4";
  const goldC = "#e0a72e";

  // 걸쇠(위 고리) — 클리어 시 튀어 오른다
  const pop = Math.min(1, shackleT) * 26;
  ctx.lineWidth = 16; ctx.strokeStyle = steel; ctx.lineCap = "round";
  ctx.beginPath();
  ctx.arc(CX, 175 - pop, 52, Math.PI, 0);
  ctx.moveTo(CX - 52, 175 - pop); ctx.lineTo(CX - 52, 195 - pop * 0.4);
  ctx.moveTo(CX + 52, 175 - pop); ctx.lineTo(CX + 52, 195);
  ctx.stroke();

  // 몸통
  const shake = breakT > 0 ? Math.sin(breakT * 55) * 4 * breakT : 0;
  ctx.save();
  ctx.translate(shake, 0);
  ctx.fillStyle = D ? "#3a3050" : "#d9b46a";
  rr(CX - 118, 195, 236, 290, 26); ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,.2)"; ctx.lineWidth = 3; ctx.stroke();

  // 다이얼 링
  ctx.beginPath(); ctx.arc(CX, CY, R, 0, 7);
  ctx.lineWidth = 15; ctx.strokeStyle = D ? "#241d33" : "#fff7e8"; ctx.stroke();

  // 노치(금색 구간)
  if (phase === "play" || flash > 0) {
    const n = notches[Math.min(hits, need - 1)];
    ctx.beginPath();
    ctx.arc(CX, CY, R, (n - half) * D2R, (n + half) * D2R);
    ctx.lineWidth = 15; ctx.strokeStyle = goldC; ctx.lineCap = "butt"; ctx.stroke();
  }

  // 바늘
  const a2 = ang * D2R;
  ctx.beginPath();
  ctx.moveTo(CX + Math.cos(a2) * 24, CY + Math.sin(a2) * 24);
  ctx.lineTo(CX + Math.cos(a2) * (R + 9), CY + Math.sin(a2) * (R + 9));
  ctx.lineWidth = 5; ctx.lineCap = "round";
  ctx.strokeStyle = phase === "fail" ? "#e5484d" : (D ? "#e8ddcb" : "#3a2b18");
  ctx.stroke();

  // 중앙 열쇠구멍
  ctx.beginPath(); ctx.arc(CX, CY, 15, 0, 7);
  ctx.fillStyle = D ? "#14101f" : "#6a4e14"; ctx.fill();
  ctx.fillRect(CX - 4.5, CY + 6, 9, 22);

  // 성공 플래시
  if (flash > 0) {
    ctx.globalAlpha = flash * 0.5;
    ctx.beginPath(); ctx.arc(CX, CY, R, 0, 7);
    ctx.lineWidth = 22; ctx.strokeStyle = "#7bd88f"; ctx.stroke();
    ctx.globalAlpha = 1;
    flash -= dt * 3;
  }
  ctx.restore();

  // 핀 진행 표시
  ctx.textAlign = "center";
  for (let i = 0; i < need; i++) {
    const px = CX + (i - (need - 1) / 2) * 22;
    ctx.beginPath(); ctx.arc(px, 545, 7, 0, 7);
    if (i < hits) { ctx.fillStyle = "#7bd88f"; ctx.fill(); }
    else { ctx.lineWidth = 2; ctx.strokeStyle = D ? "rgba(232,221,203,.4)" : "rgba(58,43,24,.4)"; ctx.stroke(); }
  }
  if (breakT > 0) breakT -= dt * 1.6;
  if (shackleT > 0) shackleT += dt * 3;
}

let last = performance.now();
function loop(t) {
  let dt = (t - last) / 1000; last = t;
  if (dt > 0.05) dt = 0.05;
  if (phase === "play") ang = (ang + dir * spd * dt + 360) % 360;
  draw(dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ── 입력/UI ──────────────────────────────────────────── */
const $ = (id) => document.getElementById(id);
function hud() { $("hStage").textContent = `스테이지 ${stage} ${starsOf(dScore)} · 🔑 ${hits}/${need}`; }
function show(emoji, title, msg, btnText) {
  $("oEmoji").textContent = emoji; $("oTitle").textContent = title;
  $("oMsg").textContent = msg; $("btn").textContent = btnText;
  $("best").textContent = best ? `최고 기록: 스테이지 ${best}` : "";
  $("overlay").classList.remove("hide");
}
$("btn").addEventListener("click", () => {
  if (phase === "win") stage++;
  $("overlay").classList.add("hide");
  loadStage();
});
$("retry").addEventListener("click", () => { if (phase === "play") loadStage(); });

addEventListener("pointerdown", (e) => {
  if (e.target === cv) e.preventDefault();   // 모바일 더블탭 줌·고스트 클릭 방지
  if (e.target === cv) tap();
});
addEventListener("keydown", (e) => { if (e.key === " ") tap(); });

window.blShareText = () => `자물쇠 스테이지 ${best}까지 땄음! 광고 속 걔는 평생 못 하는 거 🔓`;
window.blWeekly = { game: "picklock", dir: "max", fmt: (v) => `스테이지 ${v}` };
</script>
<script defer src="/_shared/records.js"></script>
<script defer src="/_shared/share.js"></script>
<script defer src="/_shared/like.js"></script>
</body>
</html>
