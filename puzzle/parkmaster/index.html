<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>주차 마스터 — 광고에서 본 그 게임</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>🚗</text></svg>">
<style>
  :root { color-scheme: light dark; }
  html, body { height: 100%; }
  body { margin: 0; overflow: hidden; user-select: none; -webkit-user-select: none;
         touch-action: none; font-family: ui-monospace, "SF Mono", "Cascadia Mono",
         "Roboto Mono", Consolas, monospace;
         background: light-dark(#f6ead8, #1a1626); color: light-dark(#3a2b18, #e8ddcb); }
  canvas { display: block; touch-action: none; }
  #hud { position: fixed; top: 0; left: 0; right: 0; display: flex; gap: .55rem;
         align-items: center; padding: .5rem .7rem; font-size: .78rem; z-index: 3;
         pointer-events: none; white-space: nowrap; }
  #hud .sp { flex: 1; }
  #hud > span:first-child { flex: 0 1 auto; min-width: 0; overflow: hidden;
                            text-overflow: ellipsis; }
  #retry { pointer-events: auto; font: inherit; border: 1.5px solid currentColor;
           background: none; color: inherit; border-radius: 1rem; padding: .15rem .7rem;
           cursor: pointer; opacity: .75; }
  #retry:active { transform: scale(.95); }
  #go { pointer-events: auto; font: inherit; border: 1.5px solid currentColor;
        background: none; color: inherit; border-radius: 1rem; padding: .15rem .8rem;
        cursor: pointer; font-weight: bold; }
  #go:disabled { opacity: .3; cursor: default; }
  #go:active:not(:disabled) { transform: scale(.95); }
  #go.hide { display: none; }
  #overlay { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
             display: flex; flex-direction: column; align-items: center; gap: .9rem;
             width: min(84vw, 21rem); padding: 1.5rem 1.6rem; border-radius: 1.25rem;
             text-align: center; z-index: 5;
             border: 1.5px solid light-dark(rgba(90,60,20,.3), rgba(230,215,190,.25));
             background: light-dark(rgba(255,250,240,.92), rgba(26,20,38,.92));
             backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #overlay.hide { display: none; }
  #overlay h1 { margin: 0; font-size: 1.15rem; }
  #overlay p { margin: 0; font-size: .88rem; line-height: 1.55; opacity: .75;
               white-space: pre-line; }
  #overlay .big { font-size: 2.2rem; margin: 0; }
  #btn { font: inherit; font-size: 1.05rem; padding: .75rem 2.2rem; border-radius: 2rem;
         border: 2px solid currentColor; background: none; color: inherit; cursor: pointer; }
  #btn:active { transform: scale(.96); }
  #best { margin: 0; font-size: .8rem; opacity: .5; min-height: 1.1em; }
</style>
</head>
<body>
<div id="hud">
  <span>🚗 <b>주차 마스터 (진짜임)</b></span>
  <span class="sp"></span>
  <span id="hStage"></span>
  <button id="go" class="hide" disabled>출발!</button>
  <button id="retry" title="다시 시작">↻</button>
</div>
<div id="overlay">
  <p class="big" id="oEmoji">🚗</p>
  <h1 id="oTitle">주차 마스터</h1>
  <p id="oMsg">광고에서 보던 바로 그 주차선 긋기 게임.
근데 이건 진짜로 그 게임임.

차에서 같은 색 P까지 길을 그리세요.
출발하면 모든 차가 동시에 달립니다.
부딪히면 끝 — 길이로 타이밍을 조절하세요!</p>
  <button id="btn">시작</button>
  <p id="best"></p>
</div>
<canvas id="cv"></canvas>
<script>
"use strict";
// 정적 난이도(0~100)와 별점 — DIFFICULTY.md Phase 1
const clamp01 = (x) => Math.max(0, Math.min(1, x));
const starsOf = (d) => "\u2605".repeat(Math.max(1, Math.min(5, Math.ceil(d / 20))));
let dScore = 0;
const targetD = (s) => Math.min(90, 5 + 4.7 * s);

/* ── 상수 ─────────────────────────────────────────────── */
const W = 360, H = 640, CAR_R = 15, CRASH_D = 30, BASE_SPD = 130;
const PAL = ["#e5484d", "#3b82f6", "#46a758", "#f79009", "#8e4ec6"];
const dark = matchMedia("(prefers-color-scheme: dark)");

/* ── 자동 레벨 제너레이터 ─────────────────────────────── */
// 구성적 풀이 보장: k번째 차는 자기 전용 스톨 존(사각 구역)에서 앞선 차들이
// 전부 주차할 때까지 맴돌다가 존 중심 → 주차칸 직선으로 출발하면 항상 성공.
// 생성 시 그 전략이 성립하는 기하 여유(존끼리·존-주차칸·경로-존 거리)를
// 검사하고, 난이도는 "직선끼리 가까이 지나가는 쌍" 수로 강제한다.
const mulberry32 = (a) => () => {
  a |= 0; a = (a + 0x6D2B79F5) | 0;
  let t = Math.imul(a ^ (a >>> 15), 1 | a);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};
const dist2 = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
function segPointDist(a, b, p) {
  const dx = b[0] - a[0], dy = b[1] - a[1], l2 = dx * dx + dy * dy || 1;
  let t = ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / l2;
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  return Math.hypot(p[0] - (a[0] + dx * t), p[1] - (a[1] + dy * t));
}
const rectPointDist = (bx, p) => Math.hypot(
  Math.max(bx.x1 - p[0], 0, p[0] - bx.x2), Math.max(bx.y1 - p[1], 0, p[1] - bx.y2));
const rectGap = (a, b) => Math.hypot(
  Math.max(a.x1 - b.x2, 0, b.x1 - a.x2), Math.max(a.y1 - b.y2, 0, b.y1 - a.y2));
function segRectDist(a, b, bx) {                    // 샘플링 근사(8px 간격)
  const n = Math.max(2, Math.ceil(dist2(a, b) / 8));
  let m = Infinity;
  for (let i = 0; i <= n; i++) {
    m = Math.min(m, rectPointDist(bx, [a[0] + (b[0] - a[0]) * i / n,
                                       a[1] + (b[1] - a[1]) * i / n]));
  }
  return m;
}
function segSegDist(a, b, c, d) {
  const n = Math.max(2, Math.ceil(dist2(a, b) / 10));
  let m = Infinity;
  for (let i = 0; i <= n; i++) {
    m = Math.min(m, segPointDist(c, d, [a[0] + (b[0] - a[0]) * i / n,
                                        a[1] + (b[1] - a[1]) * i / n]));
  }
  return m;
}
const carsFor = (stage) =>
  1 + (stage >= 2 ? 1 : 0) + (stage >= 5 ? 1 : 0) + (stage >= 9 ? 1 : 0) + (stage >= 14 ? 1 : 0);

function gen(stage, salt = 0) {
  const nCars = carsFor(stage);
  // 5대는 화면이 비좁아 존을 줄이고 간격 요구를 완화한다 (전략 성립엔 충분)
  const half = nCars >= 5 ? 36 : 46;
  const startGap = nCars >= 5 ? 82 : 90;
  const spotGap = nCars >= 5 ? 72 : 80;
  for (const needCross of [nCars < 2 ? 0 : (stage >= 5 ? nCars - 1 : 1), 0]) {
    for (let attempt = 0; attempt < 1500; attempt++) {
      const rnd = mulberry32(stage * 70241 + attempt * 449 + needCross * 131 + salt * 15877 + 7);
      const P = () => [50 + rnd() * 260, 85 + rnd() * 510];
      const starts = [], spots = [];
      let ok = true;
      for (let i = 0; i < nCars && ok; i++) {
        let s = null, g = null;
        for (let t = 0; t < 60 && !s; t++) {
          const c = P();
          if (starts.every((o) => dist2(c, o) >= startGap) &&
              spots.every((o) => dist2(c, o) >= 60)) s = c;
        }
        if (!s) { ok = false; break; }
        starts.push(s);
        for (let t = 0; t < 60 && !g; t++) {
          const c = P();
          if (dist2(c, s) >= 220 && spots.every((o) => dist2(c, o) >= spotGap) &&
              starts.every((o) => dist2(c, o) >= 60)) g = c;
        }
        if (!g) { ok = false; break; }
        spots.push(g);
      }
      if (!ok) continue;
      // 스톨 존 (1번 차부터)
      const boxes = [null];
      for (let k = 1; k < nCars && ok; k++) {
        const b = { x1: Math.max(16, starts[k][0] - half), y1: Math.max(70, starts[k][1] - half),
                    x2: Math.min(344, starts[k][0] + half), y2: Math.min(624, starts[k][1] + half) };
        if (boxes.some((o) => o && rectGap(b, o) < 34)) ok = false;
        if (rectPointDist(b, starts[0]) < 34) ok = false;
        for (const g of spots) if (rectPointDist(b, g) < 34) ok = false;
        boxes.push(b);
      }
      if (!ok) continue;
      // 출발 경로(존 중심 → 주차칸): 먼저 주차된 칸·아직 대기 중인 존과 여유
      for (let k = 0; k < nCars && ok; k++) {
        const from = k === 0 ? starts[0]
          : [(boxes[k].x1 + boxes[k].x2) / 2, (boxes[k].y1 + boxes[k].y2) / 2];
        for (let j = 0; j < k && ok; j++) {
          if (segPointDist(from, spots[k], spots[j]) < 36) ok = false;
        }
        for (let j = k + 1; j < nCars && ok; j++) {
          if (segRectDist(from, spots[k], boxes[j]) < 30) ok = false;
        }
      }
      if (!ok) continue;
      // 난이도: 순진한 동시 직진이 위험해지는(가까이 지나는) 쌍 수
      let cross = 0;
      for (let i = 0; i < nCars; i++) {
        for (let j = i + 1; j < nCars; j++) {
          if (segSegDist(starts[i], spots[i], starts[j], spots[j]) < 42) cross++;
        }
      }
      if (cross < needCross) continue;
      return { defs: starts.map((s, i) => [s[0], s[1], spots[i][0], spots[i][1]]), boxes, cross };
    }
  }
  // 이론상 도달 불가 폴백 (제약 전부 실패 시 1대짜리)
  return { defs: [[80, 520, 280, 120]], boxes: [null], cross: 0 };
}
const diffOf = (g) => 100 * clamp01((g.defs.length - 1) / 4 * 0.7 +
  (g.cross ?? 0) / Math.max(1, g.defs.length * (g.defs.length - 1) / 2) * 0.3);

// 레벨 자동 재배치: 후보 판을 몇 개 만들어 목표 난이도 곡선(targetD)에
// 가장 가까운 판을 채택한다. salt까지 시드 고정이라 모두 같은 판을 받는다.
function genTuned(stage) {
  const T = targetD(stage);
  let best = null, bestGap = Infinity;
  for (let v = 0; v < 3; v++) {
    const g = gen(stage, v);
    const gap = Math.abs(diffOf(g) - T);
    if (gap < bestGap) { bestGap = gap; best = g; }
    if (bestGap <= 5) break;
  }
  return best;
}
window.blDiffAt = (s) => diffOf(genTuned(s));

/* ── 상태 ─────────────────────────────────────────────── */
let stage = 1, best = +localStorage.getItem("parkmaster.best") || 0;
let phase = "title";           // title | draw | run | win | fail
let cars = [], timer = 0, spd = BASE_SPD, tip = "", boom = null;
let drawingCar = -1, curPath = [];

function loadStage() {
  const g = genTuned(stage);
  spd = BASE_SPD;
  dScore = diffOf(g);
  tip = stage === 1 ? "차를 누른 채 P까지 길을 그리세요"
      : stage === 2 ? "직선끼리는 부딪혀요. 길이로 타이밍을 벌리세요" : "";
  cars = g.defs.map(([sx, sy, tx, ty], i) => ({
    sx, sy, tx, ty, col: PAL[i % PAL.length],
    path: null, len: 0, cum: [], x: sx, y: sy, hx: 0, hy: -1, parked: false,
  }));
  timer = 0; boom = null; drawingCar = -1; curPath = [];
  phase = "draw";
  const go = document.getElementById("go");
  go.classList.remove("hide"); go.disabled = true;
  window.__pm = {                                    // 테스트/디버그용
    defs: g.defs, boxes: g.boxes,
    state: () => ({ moves, phase }),
  };
  window.__pmGen = (s) => {                          // 생성기 대량 검사용
    const r = gen(s);
    return { n: r.defs.length, defs: r.defs, boxes: r.boxes };
  };
  hud();
}

function setPath(c, pts) {
  c.path = pts; c.cum = [0]; c.len = 0;
  for (let i = 1; i < pts.length; i++) {
    c.len += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    c.cum.push(c.len);
  }
  document.getElementById("go").disabled = !cars.every((k) => k.path);
}

function posAt(c, d) {
  if (d >= c.len) return [c.path[c.path.length - 1], true];
  let i = 1;
  while (c.cum[i] < d) i++;
  const f = (d - c.cum[i - 1]) / (c.cum[i] - c.cum[i - 1] || 1);
  const a = c.path[i - 1], b = c.path[i];
  return [[a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f], false];
}

/* ── 진행 ─────────────────────────────────────────────── */
function step(dt) {
  timer += dt;
  for (const c of cars) {
    const [p, done] = posAt(c, spd * timer);
    if (!done && (p[0] !== c.x || p[1] !== c.y)) {
      const hl = Math.hypot(p[0] - c.x, p[1] - c.y);
      c.hx = (p[0] - c.x) / hl; c.hy = (p[1] - c.y) / hl;
    }
    c.x = p[0]; c.y = p[1]; c.parked = done;
  }
  for (let i = 0; i < cars.length; i++) {
    for (let j = i + 1; j < cars.length; j++) {
      if (Math.hypot(cars[i].x - cars[j].x, cars[i].y - cars[j].y) < CRASH_D) {
        boom = [(cars[i].x + cars[j].x) / 2, (cars[i].y + cars[j].y) / 2];
        return fail();
      }
    }
  }
  if (cars.every((c) => c.parked)) win();
}

function fail() {
  phase = "fail";
  const quips = ["광고 속 그 사람도 딱 이렇게 박던데요.",
                 "보험사에 광고 탓이라고 해보세요.",
                 "괜찮아요. 어차피 광고엔 이 게임이 없었잖아요."];
  show("💥", "쾅…", "차가 부딪혔어요. 길이로 타이밍을 벌리세요.\n\n" +
       quips[(Math.random() * quips.length) | 0], "다시 도전");
}
function win() {
  phase = "win";
  if (stage > best) { best = stage; localStorage.setItem("parkmaster.best", best); }
  window.blWeeklyReport?.(stage);
  show("🏆", `스테이지 ${stage} 클리어!`, "전 차량 주차 완료. 접촉사고 0건!", "다음 스테이지");
}

/* ── 그리기 ───────────────────────────────────────────── */
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
let scale = 1, ox = 0, oy = 0;
function resize() {
  const dpr = devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  cv.style.width = innerWidth + "px"; cv.style.height = innerHeight + "px";
  scale = Math.min(innerWidth / W, innerHeight / H);
  ox = (innerWidth - W * scale) / 2; oy = (innerHeight - H * scale) / 2;
}
addEventListener("resize", resize); resize();

function polyline(pts, col, dash) {
  ctx.beginPath(); ctx.lineWidth = 3; ctx.strokeStyle = col;
  ctx.setLineDash(dash ? [7, 7] : []);
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.stroke(); ctx.setLineDash([]);
}

function draw() {
  const D = dark.matches, dpr = devicePixelRatio || 1;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = D ? "#1a1626" : "#f6ead8";
  ctx.fillRect(0, 0, innerWidth, innerHeight);
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * ox, dpr * oy);
  if (phase === "title") return;

  ctx.textAlign = "center";
  for (const c of cars) {                                   // 주차 자리
    ctx.beginPath(); ctx.setLineDash([6, 6]); ctx.lineWidth = 2.5;
    ctx.strokeStyle = c.col;
    ctx.arc(c.tx, c.ty, 19, 0, 7); ctx.stroke(); ctx.setLineDash([]);
    ctx.font = "bold 15px ui-monospace, monospace"; ctx.fillStyle = c.col;
    ctx.fillText("P", c.tx, c.ty + 5.5);
  }
  ctx.globalAlpha = 0.55;
  for (const c of cars) if (c.path) polyline(c.path, c.col, true);
  if (curPath.length > 1 && drawingCar >= 0)
    polyline(curPath, cars[drawingCar].col, true);
  ctx.globalAlpha = 1;

  for (const c of cars) {                                   // 차
    ctx.beginPath(); ctx.fillStyle = c.col;
    ctx.arc(c.x, c.y, CAR_R, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.fillStyle = "rgba(255,255,255,.85)";
    ctx.arc(c.x + c.hx * 6, c.y + c.hy * 6, 5.5, 0, 7); ctx.fill();
  }
  if (boom) {
    ctx.font = "34px system-ui";
    ctx.fillText("💥", boom[0], boom[1] + 12);
  }
  if (tip && phase === "draw") {
    ctx.font = "12px ui-monospace, monospace";
    ctx.fillStyle = D ? "rgba(232,221,203,.65)" : "rgba(58,43,24,.6)";
    ctx.fillText(tip, W / 2, 52);
  }
}

let last = performance.now();
function loop(t) {
  let dt = (t - last) / 1000; last = t;
  if (dt > 0.05) dt = 0.05;
  if (phase === "run") step(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ── 입력/UI ──────────────────────────────────────────── */
const $ = (id) => document.getElementById(id);
function hud() { $("hStage").textContent = `스테이지 ${stage} ${starsOf(dScore)}`; }
function show(emoji, title, msg, btnText) {
  $("oEmoji").textContent = emoji; $("oTitle").textContent = title;
  $("oMsg").textContent = msg; $("btn").textContent = btnText;
  $("best").textContent = best ? `최고 기록: 스테이지 ${best}` : "";
  $("overlay").classList.remove("hide");
  $("go").classList.add("hide");
}
$("btn").addEventListener("click", () => {
  if (phase === "win") stage++;
  $("overlay").classList.add("hide");
  loadStage();
});
$("retry").addEventListener("click", () => {
  if (phase === "draw" || phase === "run") loadStage();
});
$("go").addEventListener("click", () => {
  if (phase !== "draw" || !cars.every((c) => c.path)) return;
  phase = "run"; timer = 0; $("go").classList.add("hide");
});

const toPt = (e) => [(e.clientX - ox) / scale, (e.clientY - oy) / scale];
cv.addEventListener("pointerdown", (e) => {
  e.preventDefault();                        // 모바일 더블탭 줌·고스트 클릭 방지
  if (phase !== "draw") return;
  const [x, y] = toPt(e);
  drawingCar = cars.findIndex((c) => Math.hypot(x - c.sx, y - c.sy) < 26);
  if (drawingCar >= 0) curPath = [[cars[drawingCar].sx, cars[drawingCar].sy]];
});
addEventListener("pointermove", (e) => {
  if (phase !== "draw" || drawingCar < 0) return;
  const [x, y] = toPt(e);
  const lp = curPath[curPath.length - 1];
  if (Math.hypot(x - lp[0], y - lp[1]) >= 8) curPath.push([x, y]);
});
addEventListener("pointerup", () => {
  if (phase !== "draw" || drawingCar < 0) return;
  const c = cars[drawingCar];
  const lp = curPath[curPath.length - 1];
  if (Math.hypot(lp[0] - c.tx, lp[1] - c.ty) < 32) {
    curPath.push([c.tx, c.ty]);
    setPath(c, curPath);
  }
  drawingCar = -1; curPath = [];
});

window.blShareText = () => `주차 마스터 스테이지 ${best}까지 무사고! 광고에서 본 그 게임, 진짜로 있음 🚗`;
window.blWeekly = { game: "parkmaster", dir: "max", fmt: (v) => `스테이지 ${v}` };
</script>
<script defer src="/_shared/records.js"></script>
<script defer src="/_shared/share.js"></script>
<script defer src="/_shared/like.js"></script>
</body>
</html>
