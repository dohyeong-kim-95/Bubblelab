<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>트래픽 잼 탈출 — 광고에서 본 그 게임</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>🚕</text></svg>">
<style>
  :root { color-scheme: light dark; }
  html, body { height: 100%; }
  body { margin: 0; overflow: hidden; user-select: none; -webkit-user-select: none;
         touch-action: none; font-family: ui-monospace, "SF Mono", "Cascadia Mono",
         "Roboto Mono", Consolas, monospace;
         background: light-dark(#f6ead8, #1a1626); color: light-dark(#3a2b18, #e8ddcb); }
  canvas { display: block; touch-action: none; }
  #hud { position: fixed; top: 0; left: 0; right: 0; display: flex; gap: .55rem;
         align-items: center; padding: .5rem .7rem; font-size: .78rem; z-index: 3;
         pointer-events: none; white-space: nowrap; }
  #hud .sp { flex: 1; }
  #retry { pointer-events: auto; font: inherit; border: 1.5px solid currentColor;
           background: none; color: inherit; border-radius: 1rem; padding: .15rem .7rem;
           cursor: pointer; opacity: .75; }
  #retry:active { transform: scale(.95); }
  #overlay { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
             display: flex; flex-direction: column; align-items: center; gap: .9rem;
             width: min(84vw, 21rem); padding: 1.5rem 1.6rem; border-radius: 1.25rem;
             text-align: center; z-index: 5;
             border: 1.5px solid light-dark(rgba(90,60,20,.3), rgba(230,215,190,.25));
             background: light-dark(rgba(255,250,240,.92), rgba(26,20,38,.92));
             backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #overlay.hide { display: none; }
  #overlay h1 { margin: 0; font-size: 1.15rem; }
  #overlay p { margin: 0; font-size: .88rem; line-height: 1.55; opacity: .75;
               white-space: pre-line; }
  #overlay .big { font-size: 2.2rem; margin: 0; }
  #btn { font: inherit; font-size: 1.05rem; padding: .75rem 2.2rem; border-radius: 2rem;
         border: 2px solid currentColor; background: none; color: inherit; cursor: pointer; }
  #btn:active { transform: scale(.96); }
  #best { margin: 0; font-size: .8rem; opacity: .5; min-height: 1.1em; }
</style>
</head>
<body>
<div id="hud">
  <span>🚕 <b>트래픽 잼 (진짜임)</b></span>
  <span class="sp"></span>
  <span id="hStage"></span>
  <button id="retry" title="처음 배치로">↻</button>
</div>
<div id="overlay">
  <p class="big" id="oEmoji">🚕</p>
  <h1 id="oTitle">트래픽 잼 탈출</h1>
  <p id="oMsg">"이 주차장을 탈출하시오. 99%는 실패함."
그 광고, 근데 이건 진짜로 그 게임임.

차를 밀어서 길을 트고
노란 택시를 오른쪽 출구로 빼내세요.
차는 자기 방향으로만 움직입니다.</p>
  <button id="btn">시작</button>
  <p id="best"></p>
</div>
<canvas id="cv"></canvas>
<script>
"use strict";
// 정적 난이도(0~100)와 별점 — DIFFICULTY.md Phase 1
const clamp01 = (x) => Math.max(0, Math.min(1, x));
const starsOf = (d) => "\u2605".repeat(Math.max(1, Math.min(5, Math.ceil(d / 20))));
let dScore = 0;

/* ── 상수/난수 ────────────────────────────────────────── */
const W = 360, H = 640, N = 6, CELL = 50, GX = 30, GY = 170, EXIT_ROW = 2;
const dark = matchMedia("(prefers-color-scheme: dark)");
const PAL = ["#f7c948", "#3b82f6", "#46a758", "#8e4ec6", "#e93d82", "#12a594",
             "#f79009", "#7bb0d8", "#a18072", "#5b8def", "#c26fbb", "#6aa84f"];
const mulberry32 = (a) => () => {
  a |= 0; a = (a + 0x6D2B79F5) | 0;
  let t = Math.imul(a ^ (a >>> 15), 1 | a);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};

/* ── BFS 솔버 (풀이 보장 + 난이도 측정) ───────────────── */
// cars[i] = {r, c, len, h}  (h: 가로 여부, 0번 = 노란 택시)
function solve(cars, capStates = 150000) {
  const key = (pos) => pos.join(",");
  const start = cars.map((k) => (k.h ? k.c : k.r));
  const seen = new Map([[key(start), null]]);       // key → [prevKey, move]
  const queue = [start];
  const occ = new Int8Array(N * N);
  const fill = (pos) => {
    occ.fill(0);
    for (let i = 0; i < cars.length; i++) {
      const k = cars[i];
      for (let j = 0; j < k.len; j++) {
        occ[k.h ? k.r * N + pos[i] + j : (pos[i] + j) * N + k.c] = 1;
      }
    }
  };
  let states = 0;
  while (queue.length) {
    const pos = queue.shift();
    if (pos[0] + cars[0].len === N) {               // 택시가 출구에 닿음
      const moves = [];
      let cur = key(pos);
      while (seen.get(cur)) { moves.push(seen.get(cur)[1]); cur = seen.get(cur)[0]; }
      return moves.reverse();
    }
    if (++states > capStates) return null;
    fill(pos);
    for (let i = 0; i < cars.length; i++) {
      const k = cars[i];
      for (const d of [-1, 1]) {
        const v = pos[i] + d;
        if (v < 0 || v + k.len > N) continue;
        const cell = d === 1
          ? (k.h ? k.r * N + v + k.len - 1 : (v + k.len - 1) * N + k.c)
          : (k.h ? k.r * N + v : v * N + k.c);
        if (occ[cell]) continue;
        const np = pos.slice(); np[i] = v;
        const nk = key(np);
        if (!seen.has(nk)) { seen.set(nk, [key(pos), [i, d]]); queue.push(np); }
      }
    }
  }
  return null;
}

/* ── 스테이지 생성 ────────────────────────────────────── */
function gen(stage) {
  const target = Math.min(3 + stage, 14);           // 목표 최소 이동 수
  let bestPick = null;
  for (let attempt = 0; attempt < 350; attempt++) {
    const rnd = mulberry32(stage * 52501 + attempt * 613 + 29);
    const cars = [{ r: EXIT_ROW, c: (rnd() * 2) | 0, len: 2, h: true }];
    const occ = new Int8Array(N * N);
    const mark = (k2, on) => {
      for (let j = 0; j < k2.len; j++) {
        occ[k2.h ? k2.r * N + k2.c + j : (k2.r + j) * N + k2.c] = on;
      }
    };
    mark(cars[0], 1);
    const nV = Math.min(5 + stage, 12);
    for (let i = 0, guard = 0; i < nV && guard < 120; guard++) {
      const h = rnd() < 0.5, len = rnd() < 0.3 ? 3 : 2;
      const r = (rnd() * (h ? N : N - len + 1)) | 0;
      const c = (rnd() * (h ? N - len + 1 : N)) | 0;
      if (h && r === EXIT_ROW) continue;            // 출구 행에 다른 가로차 금지
      const k2 = { r, c, len, h };
      let clash = false;
      for (let j = 0; j < len; j++) {
        if (occ[h ? r * N + c + j : (r + j) * N + c]) { clash = true; break; }
      }
      if (clash) continue;
      mark(k2, 1); cars.push(k2); i++;
    }
    const sol = solve(cars);
    if (!sol || sol.length < 2) continue;
    if (sol.length >= Math.max(2, target - 2) && sol.length <= target + 6) {
      return { cars, solution: sol, optimal: sol.length };
    }
    if (!bestPick || sol.length > bestPick.solution.length) {
      bestPick = { cars, solution: sol, optimal: sol.length };
    }
  }
  return bestPick;                                   // 최선의 풀 수 있는 판
}

const diffOf = (g) => 100 * clamp01((g.optimal - 2) / 16 * 0.7 +
  (g.cars.length - 6) / 7 * 0.3);
window.blDiffAt = (s) => diffOf(gen(s));

/* ── 상태 ─────────────────────────────────────────────── */
let stage = 1, best = +localStorage.getItem("trafficjam.best") || 0;
let phase = "title";
let cars = [], moves = 0, optimal = 0, exitAnim = 0;
let drag = null;                                     // {i, grabOff, pos(float), lo, hi, startPos}

function loadStage() {
  const g = gen(stage);
  cars = g.cars.map((k, i) => ({ ...k, col: PAL[i % PAL.length] }));
  optimal = g.optimal; moves = 0; exitAnim = 0; drag = null;
  dScore = diffOf(g);
  phase = "play";
  window.__tj = {                                    // 테스트/디버그용
    solution: g.solution, optimal,
    carCenter: (i) => {
      const k = cars[i], p = varOf(k);
      return k.h
        ? [GX + (p + k.len / 2) * CELL, GY + (k.r + 0.5) * CELL]
        : [GX + (k.c + 0.5) * CELL, GY + (p + k.len / 2) * CELL];
    },
    state: () => ({ moves, phase }),
  };
  hud();
}
const varOf = (k) => (k.h ? k.c : k.r);
const setVar = (k, v) => { if (k.h) k.c = v; else k.r = v; };

function freeRange(i) {                              // 드래그 가능한 [lo, hi]
  const k = cars[i];
  const occ = new Int8Array(N * N);
  for (let j2 = 0; j2 < cars.length; j2++) {
    if (j2 === i) continue;
    const o = cars[j2];
    for (let j = 0; j < o.len; j++) {
      occ[o.h ? o.r * N + Math.round(o.c) + j : (Math.round(o.r) + j) * N + o.c] = 1;
    }
  }
  const at = (v, j) => (k.h ? k.r * N + v + j : (v + j) * N + k.c);
  let lo = Math.round(varOf(k)), hi = lo;
  while (lo > 0 && !occ[at(lo - 1, 0)]) lo--;
  while (hi + k.len < N && !occ[at(hi + 1, k.len - 1)]) hi++;
  return [lo, hi];
}

function win() {
  phase = "win";
  if (stage > best) { best = stage; localStorage.setItem("trafficjam.best", best); }
  window.blWeeklyReport?.(stage);
  show("🏁", `스테이지 ${stage} 탈출!`,
       `${moves}번 만에 출차 완료 (최단 ${optimal}번).\n광고는 99% 실패라던데요?`, "다음 주차장");
}

/* ── 그리기 ───────────────────────────────────────────── */
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
let scale = 1, ox = 0, oy = 0;
function resize() {
  const dpr = devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  cv.style.width = innerWidth + "px"; cv.style.height = innerHeight + "px";
  scale = Math.min(innerWidth / W, innerHeight / H);
  ox = (innerWidth - W * scale) / 2; oy = (innerHeight - H * scale) / 2;
}
addEventListener("resize", resize); resize();

function rr(x, y, w, h, r2) {
  ctx.beginPath();
  ctx.moveTo(x + r2, y);
  ctx.arcTo(x + w, y, x + w, y + h, r2);
  ctx.arcTo(x + w, y + h, x, y + h, r2);
  ctx.arcTo(x, y + h, x, y, r2);
  ctx.arcTo(x, y, x + w, y, r2);
  ctx.closePath();
}

function draw(dt) {
  const D = dark.matches, dpr = devicePixelRatio || 1;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = D ? "#1a1626" : "#f6ead8";
  ctx.fillRect(0, 0, innerWidth, innerHeight);
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * ox, dpr * oy);
  if (phase === "title") return;

  // 보드
  ctx.fillStyle = D ? "#241d33" : "#efe0c8";
  rr(GX - 8, GY - 8, N * CELL + 16, N * CELL + 16, 14); ctx.fill();
  ctx.strokeStyle = D ? "#6e4522" : "#8a5a33"; ctx.lineWidth = 5; ctx.stroke();
  ctx.strokeStyle = D ? "rgba(232,221,203,.07)" : "rgba(58,43,24,.08)";
  ctx.lineWidth = 1.5;
  for (let i = 1; i < N; i++) {
    ctx.beginPath(); ctx.moveTo(GX + i * CELL, GY); ctx.lineTo(GX + i * CELL, GY + N * CELL); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(GX, GY + i * CELL); ctx.lineTo(GX + N * CELL, GY + i * CELL); ctx.stroke();
  }
  // 출구
  ctx.fillStyle = D ? "#1a1626" : "#f6ead8";
  ctx.fillRect(GX + N * CELL + 2.5, GY + EXIT_ROW * CELL + 4, 14, CELL - 8);
  ctx.font = "16px system-ui"; ctx.textAlign = "left";
  ctx.fillStyle = D ? "#e8ddcb" : "#3a2b18";
  ctx.fillText("→", GX + N * CELL + 18, GY + (EXIT_ROW + 0.62) * CELL);

  // 차
  if (exitAnim > 0) exitAnim += dt * 3;
  for (let i = 0; i < cars.length; i++) {
    const k = cars[i];
    const p = drag && drag.i === i ? drag.pos : varOf(k);
    let x = k.h ? GX + p * CELL : GX + k.c * CELL;
    let y = k.h ? GY + k.r * CELL : GY + p * CELL;
    if (i === 0 && exitAnim > 0) x += exitAnim * exitAnim * 260;
    const w2 = (k.h ? k.len : 1) * CELL, h2 = (k.h ? 1 : k.len) * CELL;
    ctx.fillStyle = k.col;
    rr(x + 5, y + 5, w2 - 10, h2 - 10, 12); ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,.25)"; ctx.lineWidth = 2.5; ctx.stroke();
    // 유리창
    ctx.fillStyle = "rgba(255,255,255,.4)";
    if (k.h) rr(x + w2 * 0.32, y + 12, w2 * 0.2, h2 - 24, 6);
    else rr(x + 12, y + h2 * 0.32, w2 - 24, h2 * 0.2, 6);
    ctx.fill();
    if (i === 0) {                                    // 택시 표시
      ctx.font = "bold 14px ui-monospace, monospace"; ctx.textAlign = "center";
      ctx.fillStyle = "#3a2b18";
      ctx.fillText("TAXI", x + w2 / 2, y + h2 / 2 + 5);
    }
  }
}

let last = performance.now();
function loop(t) {
  let dt = (t - last) / 1000; last = t;
  if (dt > 0.05) dt = 0.05;
  draw(dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ── 입력/UI ──────────────────────────────────────────── */
const $ = (id) => document.getElementById(id);
function hud() { $("hStage").textContent = `스테이지 ${stage} ${starsOf(dScore)} · ${moves}/${optimal}수`; }
function show(emoji, title, msg, btnText) {
  $("oEmoji").textContent = emoji; $("oTitle").textContent = title;
  $("oMsg").textContent = msg; $("btn").textContent = btnText;
  $("best").textContent = best ? `최고 기록: 스테이지 ${best}` : "";
  $("overlay").classList.remove("hide");
}
$("btn").addEventListener("click", () => {
  if (phase === "win") stage++;
  $("overlay").classList.add("hide");
  loadStage();
});
$("retry").addEventListener("click", () => { if (phase === "play") loadStage(); });

const toPt = (e) => [(e.clientX - ox) / scale, (e.clientY - oy) / scale];
cv.addEventListener("pointerdown", (e) => {
  e.preventDefault();                        // 모바일 더블탭 줌·고스트 클릭 방지
  if (phase !== "play") return;
  const [x, y] = toPt(e);
  const c = Math.floor((x - GX) / CELL), r = Math.floor((y - GY) / CELL);
  for (let i = 0; i < cars.length; i++) {
    const k = cars[i];
    const hit = k.h ? (r === k.r && c >= k.c && c < k.c + k.len)
                    : (c === k.c && r >= k.r && r < k.r + k.len);
    if (!hit) continue;
    const [lo, hi] = freeRange(i);
    drag = { i, pos: varOf(k), startPos: varOf(k), lo, hi,
             grab: (k.h ? x - GX : y - GY) / CELL - varOf(k) };
    return;
  }
});
addEventListener("pointermove", (e) => {
  if (!drag || phase !== "play") return;
  const [x, y] = toPt(e);
  const k = cars[drag.i];
  const want = (k.h ? x - GX : y - GY) / CELL - drag.grab;
  drag.pos = Math.max(drag.lo, Math.min(drag.hi, want));
});
addEventListener("pointerup", () => {
  if (!drag || phase !== "play") { drag = null; return; }
  const k = cars[drag.i];
  const snapped = Math.round(drag.pos);
  setVar(k, snapped);
  if (snapped !== drag.startPos) { moves++; hud(); }
  drag = null;
  if (k === cars[0] && k.c + k.len === N) {          // 출구 도달
    exitAnim = 0.001;
    setTimeout(win, 550);
  }
});

window.blShareText = () => `트래픽 잼 스테이지 ${best}까지 탈출! 99% 실패라던 그 광고 게임, 진짜임 🚕`;
window.blWeekly = { game: "trafficjam", dir: "max", fmt: (v) => `스테이지 ${v}` };
</script>
<script defer src="/_shared/records.js"></script>
<script defer src="/_shared/share.js"></script>
<script defer src="/_shared/like.js"></script>
</body>
</html>
