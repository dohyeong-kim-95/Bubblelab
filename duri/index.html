// 좌우 스와이프로 화면 전환, 실시간 드래그(손끝을 그대로 따라간다 — 탭을 당겨오는
// 느낌). 순서는 [채팅|캘린더](채팅이 왼쪽, 캘린더가 오른쪽 화면 밖에서 대기).
// touchmove 마다 translateX 를 손가락 위치로 직접 갱신하고(transition 끔),
// 손을 뗀 순간에만 남은 진행률로 열지/닫을지 정해 CSS 스냅 애니메이션으로 마무리한다.
// 열 때(닫힘→왼쪽 드래그)는 30% 를 확실히 끌어야 열리지만, 돌아갈 때(열림→오른쪽
// 드래그)는 그보다 훨씬 가볍게(15%) 반응한다 — 뒤로가기는 적은 스와이프로 충분해야 한다.
const CAL_OPEN_AT = .3;
const CAL_CLOSE_AT = 1 - .15;
let calDrag = null; // { startX, startY, fromOpen, w, moved, progress }
function calDragStart(e) {
  if (!$("cal-dialog").hidden || !$("cal-colorbox").hidden) return; // 다이얼로그 위에서는 드래그 안 함
  const t = e.touches[0];
  calDrag = { startX: t.clientX, startY: t.clientY, fromOpen: !$("cal").classList.contains("cal-off"), w: innerWidth, moved: false };
}
function calDragMove(e) {
  if (!calDrag) return;
  const t = e.touches[0];
  const dx = t.clientX - calDrag.startX, dy = t.clientY - calDrag.startY;
  if (!calDrag.moved) {
    if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return; // 방향 판정 전
    const horizontal = Math.abs(dx) > Math.abs(dy) * 1.3;
    const rightDir = calDrag.fromOpen ? dx > 0 : dx < 0; // 열림→오른쪽으로 닫기 / 닫힘→왼쪽으로 열기
    if (!horizontal || !rightDir) { calDrag = null; return; } // 세로 스크롤이거나 반대 방향 — 평소대로 둔다
    calDrag.moved = true;
    $("cal").style.transition = "none";
  }
  e.preventDefault();
  const progress = calDrag.fromOpen ? Math.max(0, 1 - dx / calDrag.w) : Math.min(1, -dx / calDrag.w);
  calDrag.progress = progress;
  $("cal").style.transform = `translateX(${(1 - progress) * 100}%)`;
}
function calDragEnd() {
  if (!calDrag) return;
  const { moved, fromOpen, progress = fromOpen ? 1 : 0 } = calDrag;
  calDrag = null;
  if (!moved) return;
  const open = progress > (fromOpen ? CAL_CLOSE_AT : CAL_OPEN_AT);
  const cal = $("cal");
  cal.style.transition = "transform .26s cubic-bezier(.32,.72,0,1)";
  cal.style.transform = open ? "translateX(0%)" : "translateX(100%)";
  cal.addEventListener("transitionend", () => { cal.style.transition = ""; cal.style.transform = ""; }, { once: true });
  if (open) openCal(); else closeCal(); // 클래스·렌더링은 기존 함수에 위임(위 인라인 값과 동일해 튀지 않음)
}
log().addEventListener("touchstart", calDragStart, { passive: true });
log().addEventListener("touchmove", calDragMove, { passive: false });
log().addEventListener("touchend", calDragEnd);
log().addEventListener("touchcancel", calDragEnd);
$("cal").addEventListener("touchstart", calDragStart, { passive: true });
$("cal").addEventListener("touchmove", calDragMove, { passive: false });
$("cal").addEventListener("touchend", calDragEnd);
$("cal").addEventListener("touchcancel", calDragEnd);

// 월간↔주간 세로 스와이프(구글 캘린더 뷰 전환 제스처): 월간에서 아래로 끌면
// 주간, 주간에서 위로 끌면 월간. 가로 드래그(위 calDrag)와 방향 우세로 서로
// 간섭하지 않는다 — 실시간 추적 없이 손을 뗀 순간의 총 이동량으로만 판정한다.
const CAL_VSWIPE_PX = 70;
let calVStart = null; // { x, y }
$("cal-grid").addEventListener("touchstart", (e) => {
  if (!$("cal-dialog").hidden || !$("cal-colorbox").hidden) return;
  calVStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
}, { passive: true });
$("cal-grid").addEventListener("touchend", (e) => {
  if (!calVStart) return;
  const dx = e.changedTouches[0].clientX - calVStart.x, dy = e.changedTouches[0].clientY - calVStart.y;
  calVStart = null;
  if (Math.abs(dy) < CAL_VSWIPE_PX || Math.abs(dy) < Math.abs(dx) * 1.3) return; // 세로 우세가 아니면 무시
  if (dy > 0 && calView === "month") setCalView("week");
  else if (dy < 0 && calView === "week") setCalView("month");
});

// ── 채팅 "/일정" 명령: 아고다식 시작~종료일 미니 달력 ─────────────
// 시간·반복은 지원하지 않는다(단순 종일/여러 날 일정만) — 그 이상은 캘린더
// 탭에서 편집한다. 이번달+다음달 두 장을 보여주고, 첫 탭=시작일, 두 번째
// 탭=종료일(시작보다 이르면 시작을 그 날짜로 다시 잡는다), 같은 날 두 번째
// 탭이면 하루짜리로 확정.
let ccpTitle = "", ccpStart = null, ccpEnd = null;
function ccpBuildMonth(year, month) {
  const wrap = document.createElement("div"); wrap.className = "ccp-month";
  const hd = document.createElement("div"); hd.className = "ccp-mhead"; hd.textContent = `${year}년 ${month + 1}월`;
  const grid = document.createElement("div"); grid.className = "ccp-grid";
  const first = new Date(year, month, 1);
  const start = new Date(first); start.setDate(1 - first.getDay());
  const days = new Date(year, month + 1, 0).getDate();
  const cells = Math.ceil((first.getDay() + days) / 7) * 7;
  const tk = todayYmd();
  for (let i = 0; i < cells; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const ds = ymd(d);
    const cell = document.createElement("div"); cell.className = "cal-date-cell ccp-day"; cell.dataset.date = ds;
    markWeekend(cell, d.getDay());
    if (d.getMonth() !== month) cell.classList.add("other");
    if (ds < tk) cell.classList.add("past"); else cell.addEventListener("click", () => ccpPick(ds));
    const dn = document.createElement("div"); dn.className = "d"; dn.textContent = d.getDate(); cell.appendChild(dn);
    grid.appendChild(cell);
  }
  wrap.append(hd, weekHeader(), grid);
  return wrap;
}
function ccpRefreshHighlight() {
  $("ccp-months").querySelectorAll(".ccp-day").forEach((cell) => {
    const ds = cell.dataset.date;
    cell.classList.remove("range-start", "range-end", "in-range");
    if (!ccpStart) return;
    if (ds === ccpStart) cell.classList.add("range-start");
    if (ccpEnd && ds === ccpEnd) cell.classList.add("range-end");
    else if (!ccpEnd && ds === ccpStart) cell.classList.add("range-end"); // 아직 하루뿐이어도 끝처럼 보이게
    if (ccpEnd && ds > ccpStart && ds < ccpEnd) cell.classList.add("in-range");
  });
}
function ccpUpdateFooter() {
  if (!ccpStart) { $("ccp-range").textContent = "날짜를 선택하세요"; return; }
  const s = dlgDateLabel(ccpStart);
  if (!ccpEnd || ccpEnd === ccpStart) $("ccp-range").textContent = `${s.d} (${s.w})`;
  else $("ccp-range").textContent = `${s.d} ~ ${dlgDateLabel(ccpEnd).d}`;
}
function ccpPick(ds) {
  if (!ccpStart || ccpEnd) { ccpStart = ds; ccpEnd = null; }
  else if (ds < ccpStart) { ccpStart = ds; ccpEnd = null; }
  else { ccpEnd = ds; }
  ccpRefreshHighlight();
  ccpUpdateFooter();
}
// 보내기 버튼이 미니 달력이 열린 동안엔 "추가" 버튼을 겸한다(버튼 두 개가
// 헷갈리지 않게 — 달력 안엔 확정 버튼을 따로 두지 않는다).
function setSendMode(isAdd) {
  const btn = $("sendBtn");
  btn.classList.toggle("addmode", isAdd);
  btn.title = isAdd ? "일정 추가" : "보내기";
  btn.setAttribute("aria-label", isAdd ? "일정 추가" : "보내기");
  btn.innerHTML = isAdd ? "추가"
    : '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M2,21L23,12L2,3V10L17,12L2,14V21Z"/></svg>';
}
function openCalCmdPicker() {
  if (!picker.hidden) closePicker();
  ccpStart = null; ccpEnd = null;
  ccpTitle = text.value.replace(CAL_CMD_RE, "").trim() || "(제목 없음)";
  $("ccp-title").textContent = "📅 " + ccpTitle;
  const now = new Date();
  const next = new Date(now.getFullYear(), now.getMonth() + 1, 1);
  $("ccp-months").replaceChildren(ccpBuildMonth(now.getFullYear(), now.getMonth()), ccpBuildMonth(next.getFullYear(), next.getMonth()));
  ccpUpdateFooter();
  $("cal-cmd-bar").hidden = true; // 칩은 이미 할 일을 했으니 접어서 버튼이 하나로 보이게
  $("cal-cmd-picker").hidden = false;
  setSendMode(true);
}
function closeCalCmdPicker() {
  $("cal-cmd-picker").hidden = true;
  $("cal-cmd-bar").hidden = !CAL_CMD_RE.test(text.value); // 텍스트가 아직 명령이면 칩을 되살린다
  setSendMode(false);
}
$("cal-cmd-chip").addEventListener("click", openCalCmdPicker);
$("ccp-cancel").addEventListener("click", closeCalCmdPicker);
async function confirmCalCmd() {
  if (!ccpStart) { showToast("날짜를 먼저 골라주세요"); return; }
  if (!ws || ws.readyState !== 1) { showToast("연결이 끊겨서 추가하지 못했어요"); return; }
  const endDate = (ccpEnd && ccpEnd > ccpStart) ? ccpEnd : undefined;
  await calSaveEvent({ id: randToken(), date: ccpStart, title: ccpTitle, owner: MY_NAME, shared: true, endDate, recur: null });
  const rangeTxt = endDate ? `${dlgDateLabel(ccpStart).d} ~ ${dlgDateLabel(endDate).d}` : dlgDateLabel(ccpStart).d;
  await sendSysNotice(`📅 "${ccpTitle}" 일정 추가됨 (${rangeTxt})`);
  closeCalCmdPicker();
  text.value = ""; text.style.height = "auto"; $("cal-cmd-bar").hidden = true;
}

calRestore();

// 저장된 키·이름이 있으면 곧바로 입장 (아무것도 안 해도 이어짐)
(async () => {
  const savedName = localStorage.getItem("duri:name");
  if (savedName) $("name").value = savedName; // 이름은 항상 미리 채운다(문구만 다시 입력 시 편하게)
  if (!savedName) return;

  await ensureDB();
  const savedKey = await getMeta("key");
  if (savedKey) { await enterWith(savedKey, savedName); return; }

  // 마이그레이션: 예전 버전이 남긴 평문 문구가 있으면 이번 한 번만 읽어서 키로
  // 바꿔 담고 문구는 지운다(enterWith가 처리). 다음 방문부터는 키만 남는다.
  const legacyPass = localStorage.getItem("duri:pass") ?? await getMeta("pass");
  if (legacyPass) { await enterWith(await deriveKey(legacyPass), savedName); return; }
  // 키도 문구도 없으면 셋업 화면 그대로 — 문구를 다시 받는다.
})();
</script>
