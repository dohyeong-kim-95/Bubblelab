<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Duri — 둘이서 주고받은 대화와 사진이 내 컴퓨터에 저절로 쌓이는 기록 시스템.">
<meta name="theme-color" content="#10151c">
<!-- PWA(홈 화면 설치). duri 게이트 뒤라 매니페스트는 자격증명과 함께 받아야 한다. -->
<link rel="manifest" href="/manifest.json" crossorigin="use-credentials">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Duri">
<title>💞 Duri</title>
<style>
  :root { color-scheme: light dark; --pink: light-dark(#c0568a, #f0a8ce); --line: light-dark(#e6eaef, #232c38);
          --panel: light-dark(#ffffff, #161c25); --bg: light-dark(#fafbfc, #10151c); --dim: light-dark(#5b6875, #8b97a6);
          --kb: 18rem; /* 측정된 키보드 높이(JS가 갱신) — 서랍을 키보드와 같은 높이로 */
          --kb-live: 0px; /* 지금 이 순간 키보드가 차지한 높이(0=닫힘) — 다이얼로그 위치 보정용 */
          /* 채팅 본문·입력창은 비례폭 폰트. UI 껍데기(헤더·버튼·시각)는 monospace 유지하되,
             실제 대화 글은 고정폭이면 공백(띄어쓰기)이 한 글자만큼 벌어져 거북하다. */
          --chat-font: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; }
  * { box-sizing: border-box; }
  /* iOS 더블탭-확대 제스처가 스티커 두 번째 탭을 먹지 않게 — 컨트롤은 두 번 탭을
     두 번 클릭으로 처리한다(핀치 줌은 그대로). */
  button, a, label, #grid img, #grid button, .cal-date-cell, .cal-day-body { touch-action: manipulation; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; } /* iOS가 rem을 자동확대하지 않게 */
  /* overscroll-behavior-y:contain — 안드로이드 Chrome의 당겨서 새로고침이 우리
     세로 스와이프 제스처(캘린더 월/주 전환 등)와 안 겹치게 문서 레벨에서도 막는다. */
  html, body { height: 100%; margin: 0; overscroll-behavior-y: contain; }
  body { font-family: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Consolas, monospace;
         color: light-dark(#1c2733, #e2e9f0); background: var(--bg);
         display: flex; flex-direction: column;
         /* 앱을 '보이는 영역(비주얼 뷰포트)'에 딱 맞춰 고정한다. 키보드가 뜨면 그만큼
            높이가 줄어 입력창이 항상 키보드 바로 위에 놓인다 — iOS 표준 PWA에서
            문서가 스크롤되며(특히 보낸 직후) 입력창이 키보드와 겹치던 문제를 없앤다.
            visualViewport 미지원 브라우저는 100%(전체 뷰포트)로 폴백. */
         position: fixed; left: 0; right: 0; top: var(--vvt, 0px); height: var(--vvh, 100%); }
  /* 노치·다이나믹 아일랜드 밑까지 화면이 차므로(standalone + viewport-fit=cover),
     헤더 상단·좌우에 안전영역 인셋을 더해 버튼이 가려지지 않게 한다. */
  header { display: flex; align-items: center; gap: .5rem;
           padding: calc(.7rem + env(safe-area-inset-top, 0px)) calc(1rem + env(safe-area-inset-right, 0px))
                    .7rem calc(1rem + env(safe-area-inset-left, 0px));
           border-bottom: 1px solid var(--line); background: var(--panel); }
  header .mark { font-size: 1.2rem; }
  header b { font-size: .95rem; }
  /* 접속 표시: 텍스트 대신 나·상대 색 동그라미 두 개(캘린더 색상 설정과 같은 색).
     꺼져 있으면 옅게, 접속 중이면 꽉 채운 색으로 — 둘 다 접속 중인지 한눈에. */
  header .status { margin-left: auto; display: flex; align-items: center; gap: .3rem; flex-shrink: 0; }
  header .dot { width: .55rem; height: .55rem; border-radius: 50%; background: var(--dim);
                opacity: .3; flex-shrink: 0; transition: opacity .15s, background .15s; }
  header .dot.on { opacity: 1; }
  /* 헤더 우측 아이콘 버튼(설정·나가기) — 텍스트 대신 이모지 한 글자라 줄바꿈이 없다 */
  header .icon-btn { flex-shrink: 0; font: inherit; font-size: 1.15rem; line-height: 1; background: none;
                     border: 0; color: inherit; cursor: pointer; padding: .3rem; border-radius: .5rem;
                     text-decoration: none; }
  header .icon-btn:hover { background: var(--bg); }
  .menu-wrap { position: relative; flex-shrink: 0; display: flex; }
  .menu { position: absolute; top: calc(100% + .4rem); right: 0; background: var(--panel);
          border: 1px solid var(--line); border-radius: .6rem; padding: .3rem; display: flex;
          flex-direction: column; gap: .1rem; min-width: 9.5rem; z-index: 20;
          box-shadow: 0 8px 24px light-dark(#0002, #0007); }
  .menu[hidden] { display: none; }
  .menu button { font: inherit; font-size: .82rem; text-align: left; padding: .55rem .65rem;
                 background: none; border: 0; border-radius: .45rem; color: inherit; cursor: pointer;
                 white-space: nowrap; }
  .menu button:hover { background: var(--bg); }
  .menu button.danger { color: light-dark(#b4453a, #f0a8a2); }
  .menu button[aria-checked=true] { color: var(--pink); font-weight: 600; }

  #log-wrap { flex: 1; min-height: 0; position: relative; display: flex; }
  #log { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column;
         max-width: 44rem; width: 100%; margin: 0 auto; }
  /* 스크롤이 위로 올라가 있을 때만 뜨는 "맨 아래로" 버튼 (util/chat 패턴) */
  #to-bottom { position: absolute; left: 50%; transform: translateX(-50%); bottom: .8rem;
               width: 2.6rem; height: 2.6rem; border-radius: 50%; cursor: pointer;
               border: 1px solid var(--line); background: var(--panel); color: inherit;
               font-size: 1.05rem; line-height: 1; box-shadow: 0 3px 10px #0003; z-index: 5; }
  #to-bottom[hidden] { display: none; }
  /* 그룹 사이는 넓게, 같은 사람 연속(.cont)은 좁게 — 카톡식 묶어읽기 */
  .row { display: flex; flex-direction: column; max-width: 78%; margin-top: .5rem; }
  .row.cont { margin-top: .13rem; }
  .row.me { align-self: flex-end; align-items: flex-end; }
  .row .who { font-size: .68rem; color: var(--dim); margin: 0 .3rem .1rem; }
  /* 날짜 구분선: 가운데 회색 알약 칩 */
  .daysep { align-self: center; display: flex; margin: .85rem 0 .2rem; }
  .daysep span { font-size: .68rem; color: var(--dim); background: light-dark(#eef1f4, #1b232e);
                 padding: .2rem .7rem; border-radius: 1rem; }
  /* 시스템 알림(오픈카톡 입장 메시지 벤치마킹) — "/일정" 명령으로 만든 일정을
     상대에게도 알리는 용도. 실제 대화(bubble)와 안 헷갈리게 가운데 정렬 알약. */
  .sysnotice { align-self: center; display: flex; max-width: 88%; margin: .35rem 0; }
  .sysnotice span { font-size: .72rem; color: var(--dim); background: light-dark(#eef1f4, #1b232e);
                    padding: .3rem .8rem; border-radius: 1rem; text-align: center; }
  .bubble { padding: .5rem .75rem; border-radius: .9rem; background: var(--panel); border: 1px solid var(--line);
            white-space: pre-wrap; word-break: break-word; line-height: 1.5; font-size: .95rem;
            font-family: var(--chat-font); }
  .row.me .bubble { background: light-dark(#fbe6f0, #3a2233); border-color: light-dark(#f2cfe1, #4d2c40); }
  .bubble img { max-width: 18rem; border-radius: .5rem; display: block; cursor: pointer; }
  .bubble .cap { font-size: .82rem; margin-top: .3rem; color: var(--dim); }
  /* 앨범(묶어보내기): 한 말풍선 안 사진 그리드. 사진이 올라오는 대로 채워진다. */
  .bubble.album, .row.me .bubble.album { background: none; border: none; padding: .1rem;
                                         display: grid; gap: .15rem; max-width: 18rem; }
  .bubble.album { grid-template-columns: repeat(3, 1fr); } /* 5장+ 기본 3열 */
  .bubble.album[data-n="2"], .bubble.album[data-n="4"] { grid-template-columns: repeat(2, 1fr); }
  .bubble.album[data-n="3"] { grid-template-columns: repeat(3, 1fr); }
  .bubble.album img { width: 100%; max-width: none; aspect-ratio: 1 / 1; object-fit: cover;
                      border-radius: .35rem; }
  /* 사진 전체화면 뷰어(라이트박스) */
  #lightbox { position: fixed; inset: 0; z-index: 200; background: #000000ee; display: flex;
              align-items: center; justify-content: center; overflow: hidden;
              padding: env(safe-area-inset-top, 0px) 1rem env(safe-area-inset-bottom, 0px); }
  #lightbox[hidden] { display: none; }
  #lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: .3rem;
                  touch-action: pan-y; will-change: transform; }
  #lb-close { position: absolute; top: calc(.7rem + env(safe-area-inset-top, 0px)); right: 1rem;
              width: 2.4rem; height: 2.4rem; border-radius: 50%; border: 0; background: #ffffff22;
              color: #fff; font-size: 1.05rem; cursor: pointer; z-index: 1; }
  #lb-bar { position: absolute; left: 50%; transform: translateX(-50%); z-index: 1;
            bottom: calc(1.2rem + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center;
            gap: .5rem; flex-wrap: nowrap; max-width: calc(100% - 1.5rem); }
  #lb-count { color: #fff; font-size: .8rem; opacity: .85; margin-right: .2rem; white-space: nowrap; flex: none; }
  #lb-bar button { flex: none; white-space: nowrap; font: inherit; font-size: .85rem; font-weight: 600;
                   padding: .55rem .95rem; border: 0; border-radius: 1.2rem; background: #ffffffee;
                   color: #10151c; cursor: pointer; box-shadow: 0 4px 16px #0006; }
  /* 스티커는 정사각 자리를 먼저 잡고, 말풍선 배경 없이 투명하게 */
  .bubble.sticker, .row.me .bubble.sticker { background: none; border: none; padding: .2rem; }
  .bubble.sticker img { width: 8.5rem; aspect-ratio: 1 / 1; height: auto; border-radius: 0; }
  .sticker-anim { will-change: transform; } /* 움직이는 스티커: 합성 힌트 */
  .time { font-size: .62rem; color: var(--dim); margin: .1rem .3rem 0; }
  .broken { color: light-dark(#b4453a, #f0a8a2); font-size: .82rem; }

  /* 사진 전송 전 미리보기 트레이(카톡 벤치마킹): 여러 장 담아 확인 후 보낸다 */
  #photo-tray { display: flex; gap: .4rem; overflow-x: auto; padding: .55rem .7rem;
                border-top: 1px solid var(--line); background: var(--panel);
                max-width: 44rem; width: 100%; margin: 0 auto; }
  #photo-tray[hidden] { display: none; }
  #photo-tray.sending { opacity: .55; pointer-events: none; }
  #photo-tray .thumb { position: relative; flex: 0 0 auto; }
  #photo-tray .thumb img { width: 3.6rem; height: 3.6rem; object-fit: cover; border-radius: .55rem;
                           border: 1px solid var(--line); display: block; }
  #photo-tray .thumb .rm { position: absolute; top: -.35rem; right: -.35rem; width: 1.25rem; height: 1.25rem;
                           border-radius: 50%; border: 0; background: light-dark(#000a, #000d); color: #fff;
                           font-size: .7rem; line-height: 1; cursor: pointer; padding: 0; }
  form { display: flex; gap: .5rem; border-top: 1px solid var(--line); background: var(--panel);
         max-width: 44rem; width: 100%; margin: 0 auto; align-items: flex-end;
         padding: .6rem calc(.6rem + env(safe-area-inset-right, 0px))
                  calc(.6rem + env(safe-area-inset-bottom, 0px)) calc(.6rem + env(safe-area-inset-left, 0px)); }
  textarea { flex: 1; resize: none; font: inherit; font-family: var(--chat-font); padding: .55rem .7rem;
             border-radius: .8rem; border: 1px solid var(--line); background: var(--bg); color: inherit; max-height: 8rem; }
  button, label.attach { font: inherit; border: 1px solid var(--line); background: var(--bg); color: inherit;
           border-radius: .8rem; padding: .55rem .75rem; cursor: pointer; }
  #sticker-btn { font-size: 1.1rem; line-height: 1; }
  #sticker-btn[aria-expanded="true"] { background: light-dark(#f0e3ea, #26202a); }
  /* 첨부·스티커·입력창을 테두리 하나짜리 알약 바로 합친다(카톡 벤치마킹) — 각각
     따로 박스를 두지 않고 하나의 넓은 바처럼 보이게. 보내기 버튼만 바 바깥에
     별도 강조 버튼으로 남긴다. */
  .inputbar { flex: 1; display: flex; align-items: flex-end; gap: .1rem; min-width: 0;
              border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: .2rem .3rem; }
  .inputbar:focus-within { border-color: color-mix(in srgb, var(--pink) 45%, var(--line)); }
  .inputbar textarea { border: none; background: none; padding: .5rem .3rem; }
  .inputbar textarea:focus { outline: none; } /* 바 테두리 강조만으로 충분 — 브라우저 기본 포커스 링(하얀 하이라이트)은 끈다 */
  .inputbar label.attach, .inputbar #sticker-btn { border: none; background: none; padding: 0;
              width: 2.2rem; height: 2.2rem; flex: none; display: flex; align-items: center; justify-content: center; }
  .inputbar #sticker-btn[aria-expanded="true"] { background: light-dark(#f0e3ea, #26202a); border-radius: 50%; }
  /* 종이비행기 아이콘 — 이모지는 테마 무관 풀컬러라 색이 안 맞아서, currentColor 로
     버튼 글자색을 그대로 따라가는 인라인 SVG를 쓴다(추가 이미지·의존성 없음).
     입력창 바(알약)와 굴곡이 맞도록 완전한 원형으로. */
  button.send { flex: none; background: var(--pink); color: light-dark(#fff, #1a1016); border-color: transparent;
                width: 2.6rem; height: 2.6rem; padding: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  button.send svg { width: 1.15rem; height: 1.15rem; }
  /* "/일정" 미니 달력이 열려 있는 동안엔 보내기 버튼이 잠깐 "추가" 버튼으로 바뀐다 */
  button.send.addmode { font: inherit; font-size: .8rem; font-weight: 700; }
  button:disabled { opacity: .5; cursor: default; }

  /* 스티커/이모지 서랍 — 높이를 측정된 키보드 높이(--kb)와 똑같이 맞춰
     키보드↔서랍 전환이 1:1 공간 교체로 매끄럽게 되도록 한다(카톡 벤치마킹). */
  #picker { max-width: 44rem; width: 100%; margin: 0 auto; border-top: 1px solid var(--line); background: var(--panel);
            height: var(--kb, 18rem); display: flex; flex-direction: column; }
  #picker[hidden] { display: none; }
  #tabs { flex: none; display: flex; gap: .25rem; padding: .65rem .7rem 0; overflow-x: auto; }
  #tabs button { font: inherit; font-size: .72rem; padding: .55rem .6rem; border: 0; border-radius: .5rem .5rem 0 0;
                 background: none; color: inherit; opacity: .55; white-space: nowrap; cursor: pointer; }
  #tabs button[aria-selected="true"] { opacity: 1; font-weight: 600; background: var(--bg); }
  /* 팩 탭은 꾹 눌러서 드래그로 순서를 바꿀 수 있다. touch-action은 기본값
     (manipulation)을 그대로 둬서 짧게 끄는 제스처는 여전히 탭 목록을 좌우로
     스크롤한다 — 길게 눌러 실제로 드래그가 시작된 뒤에만 pointermove의
     preventDefault로 그 순간의 스크롤을 가로챈다(타이머가 뜨기 전에 8px
     넘게 움직이면 스크롤 의도로 보고 꾹 누르기를 취소하므로 서로 안 부딪힌다). */
  #tabs button.dragging { position: relative; z-index: 3; opacity: .9; background: var(--bg);
                           box-shadow: 0 2px 10px rgba(0,0,0,.28); transition: none; }
  /* 탭 이름 영역과 스티커 그리드 영역을 선 하나로 확실히 나눈다 */
  #hint { flex: none; font-size: .68rem; opacity: .55; padding: .4rem .8rem; background: var(--bg);
          min-height: 1.2rem; border-bottom: 1px solid var(--line); }
  #grid { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(4rem, 1fr)); gap: .3rem;
          padding: .45rem .7rem .7rem; overflow-y: auto; background: var(--bg); align-content: start; }
  #grid button { padding: .25rem; background: none; border: 2px solid transparent; border-radius: .6rem; cursor: pointer; }
  #grid button.selected { border-color: var(--pink); background: light-dark(#c0568a1a, #f0a8ce22); }
  #grid img { width: 100%; aspect-ratio: 1 / 1; height: auto; display: block; }

  /* 채팅 "/일정 " 명령 — 칩 + 아고다식 시작~종료일 미니 달력(시간·반복 미지원) */
  #cal-cmd-bar { display: flex; max-width: 44rem; width: 100%; margin: 0 auto;
                 padding: .5rem calc(.6rem + env(safe-area-inset-right, 0px)) 0
                          calc(.6rem + env(safe-area-inset-left, 0px));
                 background: var(--panel); }
  #cal-cmd-bar[hidden] { display: none; }
  #cal-cmd-picker { max-width: 44rem; width: 100%; margin: 0 auto; border-top: 1px solid var(--line);
                    background: var(--panel); max-height: min(26rem, 70vh); display: flex; flex-direction: column; }
  #cal-cmd-picker[hidden] { display: none; }
  .ccp-head { flex: none; display: flex; align-items: center; gap: .5rem; padding: .6rem .8rem; }
  .ccp-head b { font-size: .9rem; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #ccp-months { flex: 1; min-height: 0; overflow-y: auto; padding: 0 .5rem; }
  .ccp-mhead { font-size: .78rem; font-weight: 600; color: var(--dim); text-align: center; padding: .3rem 0; }
  .ccp-grid { display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: 2.6rem; margin-bottom: .4rem; }
  .ccp-day.past { opacity: .3; cursor: default; }
  .ccp-day.range-start .d, .ccp-day.range-end .d { background: var(--pink); color: light-dark(#fff,#1a1016); font-weight: 700; }
  .ccp-day.in-range { background: color-mix(in srgb, var(--pink) 14%, transparent); }
  .ccp-actions { flex: none; display: flex; align-items: center; gap: .6rem; padding: .6rem .8rem;
                 border-top: 1px solid var(--line); }
  .ccp-actions span { flex: 1; font-size: .82rem; color: var(--dim); }
  #grid .empty { grid-column: 1 / -1; text-align: center; font-size: .78rem; opacity: .5; padding: 1.2rem 0; }
  /* 이모지 탭: 셀을 작게, 글자는 크게 */
  #grid.emoji-grid { grid-template-columns: repeat(auto-fill, minmax(2.7rem, 1fr)); }
  #grid .emoji { font-size: 1.7rem; line-height: 1; padding: .3rem 0; border: 0; }
  #grid .emoji:hover { background: light-dark(#00000010, #ffffff18); }

  .overlay { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center;
             padding: calc(1.5rem + env(safe-area-inset-top, 0px)) 1.5rem calc(1.5rem + env(safe-area-inset-bottom, 0px)); }
  .card { max-width: 24rem; width: 100%; }
  .card h1 { font-size: 1.2rem; }
  .card p { font-size: .85rem; color: var(--dim); line-height: 1.7; }
  .card label { display: block; font-size: .78rem; margin: 1rem 0 .3rem; }
  .card input { width: 100%; font: inherit; padding: .55rem .7rem; border-radius: .7rem;
                border: 1px solid var(--line); background: var(--panel); color: inherit; }
  /* type="password"는 일부 한국어 키보드 앱이 "보안 키보드"로 인식해 영문 전환
     키 자체를 빼버린다 — type="text" + -webkit-text-security로 화면엔 그대로
     점(•)만 보이게 가리면서 키보드는 평범한 전체 키보드가 뜨게 한다. */
  #pass { -webkit-text-security: disc; }
  .card button { width: 100%; margin-top: 1.1rem; padding: .65rem; background: var(--pink);
                 color: light-dark(#fff, #1a1016); border: none; border-radius: .7rem; font-weight: 600; }
  .card .warn { font-size: .72rem; color: light-dark(#b4453a, #f0a8a2); margin-top: .8rem; }
  .hidden { display: none !important; }
  /* ── 공유 캘린더 ─────────────────────────────────────────────
     구글·애플 캘린더 벤치마킹: 크롬(테두리)은 최대한 얇게, 오늘은 원형 배지,
     종일 일정은 옅게 채운 알약 / 시간 일정은 색점 + 시간 + 제목. 주간은
     하루 한 장의 카드로 보여준다(패스티컬식 어젠다). 화면 순서는 [채팅|캘린더]
     (채팅이 왼쪽, 캘린더가 오른쪽) — 캘린더는 평소 화면 밖 오른쪽에 있다가 왼쪽
     으로 끌어오면 열린다. 드래그 중에는 손끝을 그대로 따라가고(JS, 아래 스와이프
     섹션), 손을 뗀 순간만 이 transition으로 스냅한다. */
  #cal { position: fixed; inset: 0; z-index: 60; background: var(--bg); color: inherit;
         display: flex; flex-direction: column; transform: translateX(0);
         transition: transform .26s cubic-bezier(.32,.72,0,1);
         padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
         --sun: light-dark(#c2544f, #f0a8a2); --sat: light-dark(#4f6fc2, #a8c0f0); }
  #cal.cal-off { transform: translateX(100%); pointer-events: none; }
  .cal-head { display: flex; align-items: center; gap: .3rem; padding: .5rem .5rem .35rem;
              padding-left: calc(.35rem + env(safe-area-inset-left,0px)); padding-right: calc(.5rem + env(safe-area-inset-right,0px));
              background: var(--bg); border: 0; }
  .cal-head #cal-back { font-size: 1.5rem; line-height: 1; padding: .1rem .3rem; }
  #cal-title { display: flex; align-items: baseline; gap: .3rem; white-space: nowrap; margin-right: auto; }
  #cal-title .m { font-size: 1.1rem; font-weight: 700; letter-spacing: -.02em; }
  #cal-title .y { font-size: .68rem; font-weight: 400; color: var(--dim); }
  .cal-head .cal-nav { display: flex; align-items: center; gap: 0; }
  .cal-head .cal-nav button { font-size: .78rem; padding: .35rem .28rem; opacity: .7; }
  /* 월/주 세그먼티드 컨트롤 — 선택된 쪽만 떠 보인다 */
  .cal-seg { display: flex; gap: .1rem; padding: .13rem; border-radius: .55rem;
             background: light-dark(#eceff4, #1b2330); }
  .cal-seg button { font: inherit; font-size: .68rem; padding: .26rem .48rem; border: 0; border-radius: .42rem;
                    background: none; color: var(--dim); cursor: pointer; }
  .cal-seg button[aria-pressed=true] { background: var(--panel); color: inherit; font-weight: 600;
                                       box-shadow: 0 1px 2px light-dark(#0f172219, #0005); }
  /* "오늘"은 오늘이 화면 밖에 있을 때만 나타난다(구글 캘린더식) */
  #cal-today { flex: none; font: inherit; font-size: .66rem; padding: .28rem .5rem; border-radius: 999px;
               border: 1px solid var(--line); background: var(--panel); color: var(--dim); cursor: pointer; }
  #cal-today[hidden] { display: none; }
  /* overscroll-behavior-y:contain — 월/주 전환 스와이프(위→아래)가 스크롤 맨
     위에서 시작할 때 브라우저 당겨서 새로고침(pull-to-refresh)으로 새는 것을
     막는다. 우리 터치 핸들러가 먼저 처리하게 해야 하므로. */
  #cal-grid { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column;
              overscroll-behavior-y: contain; }
  .cal-wk { display: grid; grid-template-columns: repeat(7, 1fr); flex: none; position: sticky; top: 0; z-index: 2;
            background: var(--bg); padding-bottom: .2rem; }
  .cal-wk span { text-align: center; font-size: .62rem; letter-spacing: .08em; color: var(--dim); padding: .15rem 0; }
  .cal-wk span.sun { color: var(--sun); }
  .cal-wk span.sat { color: var(--sat); }
  /* 월간 격자: 세로 칸선 없이 가로 실선만. 날짜 아래 최대 2개 제목 미리보기(작은
     글씨, 말줄임) + 넘치면 +N. 고른 날의 전체 목록은 아래 패널에서 읽는다.
     여러 날 일정은 주(week) 단위로 하나의 막대(.cal-week-bars)에 그려서 같은
     주 안에서는 제목이 한 번만 보이게 한다. 한 주는 [날짜 숫자 7칸 → 막대 레인들
     → 일정 칩 7칸] 세 줄(.cal-week-dates/.cal-week-bars/.cal-week-days)로 나눠
     그린다 — 막대가 날짜 숫자보다 위로 올라오지 않게 순서를 고정한다. */
  .cal-month { flex: 1; display: flex; flex-direction: column; }
  .cal-week-row { flex: 1; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
  .cal-week-dates { flex: none; display: grid; grid-template-columns: repeat(7, 1fr); padding-top: .2rem; }
  .cal-date-cell { display: flex; align-items: center; justify-content: center; gap: .3rem; cursor: pointer; }
  .cal-date-cell .d { font-size: .72rem; color: var(--dim); flex: none;
                       width: 1.5rem; height: 1.5rem; display: grid; place-items: center; border-radius: 50%; }
  .cal-date-cell .marker { font-size: .8rem; line-height: 1; }
  .cal-date-cell.sun .d { color: var(--sun); }
  .cal-date-cell.sat .d { color: var(--sat); }
  .cal-date-cell.other .d { opacity: .38; }
  .cal-date-cell.sel .d { box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--pink) 60%, transparent); }
  .cal-date-cell.today .d { background: var(--pink); color: light-dark(#fff,#1a1016); font-weight: 700; }
  /* 일정 막대 레인 — 하루짜리든 여러 날이든 같은 레인 시스템에 함께 놓여
     위계가 같아진다(막대 하나가 자기 칸 폭만큼만 넓이를 차지). 레인이 상한을
     넘으면 그 요일에 "+N"만 남는다. */
  /* 막대 한 줄 높이를 낮춰서(전엔 1.05rem) 같은 공간에 더 많은 줄이 들어가게 한다 */
  .cal-week-bars { flex: none; display: grid; grid-template-columns: repeat(7, 1fr);
                   grid-auto-rows: .82rem; gap: .08rem 0; padding: .12rem .1rem .08rem; }
  .cal-bar { margin: 0 .06rem; font-size: .52rem; line-height: .82rem; padding: 0 .26rem; }
  .cal-bar-more { margin: 0 .06rem; font-size: .52rem; line-height: .82rem; text-align: center; color: var(--dim); }
  .cal-week-days { flex: 1; display: grid; grid-template-columns: repeat(7, 1fr); }
  /* 칩은 위 공통 레인이 그리므로 이 칸은 탭 영역(빈 스페이서)만 남는다 —
     막대가 없는 주도 칸이 너무 얇아지지 않게 최소 높이만 둔다. */
  .cal-day-body { min-height: 1rem; cursor: pointer; }
  /* 고른 날의 일정 목록(월간 전용) — 격자에서 못 보여준 제목·시간을 여기서 읽는다 */
  .cal-dp { flex: none; display: flex; flex-direction: column; gap: .4rem; max-height: 40%;
            border-top: 1px solid var(--line); background: var(--panel); padding: .55rem .7rem .7rem;
            padding-left: calc(.7rem + env(safe-area-inset-left,0px)); padding-right: calc(.7rem + env(safe-area-inset-right,0px)); }
  .cal-dp[hidden] { display: none; }
  .cal-dp .hd { display: flex; align-items: center; gap: .5rem; }
  .cal-dp .hd .dt { font-size: .82rem; font-weight: 600; }
  .cal-dp .hd .dt .wd { color: var(--dim); font-weight: 400; }
  .cal-dp .hd .marker-wrap { position: relative; flex: none; }
  .cal-dp .hd .marker-input { flex: none; width: 2.1rem; font: inherit; font-size: .95rem; text-align: center;
                               padding: .25rem 0; border: 1px solid var(--line); border-radius: .5rem;
                               background: var(--bg); color: inherit; cursor: pointer; }
  .cal-dp .hd .marker-input.placeholder { opacity: .55; }
  .cal-dp .hd .marker-input:focus { outline: none; border-color: color-mix(in srgb, var(--pink) 55%, var(--line)); }
  /* 별을 누르면 근처에 뜨는 이모지 8개 팝업 — 직접 타이핑하지 않고 골라서 담는다 */
  .cal-dp .hd .marker-popup { position: absolute; top: calc(100% + .3rem); left: 0; background: var(--panel);
                               border: 1px solid var(--line); border-radius: .6rem; padding: .35rem;
                               display: flex; flex-wrap: wrap; gap: .15rem; width: 9.4rem; z-index: 20;
                               box-shadow: 0 8px 24px light-dark(#0002, #0007); }
  .cal-dp .hd .marker-popup[hidden] { display: none; }
  .cal-dp .hd .marker-popup button { font-size: 1.3rem; line-height: 1; width: 2rem; height: 2rem;
                                      padding: 0; border: 0; border-radius: .4rem; background: none;
                                      color: inherit; cursor: pointer; display: grid; place-items: center; }
  .cal-dp .hd .marker-popup button:hover { background: var(--bg); }
  .cal-dp .hd .marker-popup button.clear { font-size: 1rem; color: var(--dim); }
  .cal-dp .hd .add { margin-left: auto; flex: none; font: inherit; font-size: .72rem; padding: .3rem .65rem;
                     border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: inherit; cursor: pointer; }
  .cal-dp .evs { min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: .3rem; }
  .cal-dp .evs .cal-ev { font-size: .8rem; line-height: 1.45; padding: .28rem .6rem; border-radius: .5rem; }
  .cal-dp .evs .cal-ev.timed { padding: .12rem .12rem; gap: .4rem; }
  .cal-dp .evs .cal-ev.timed::before { width: .42rem; height: .42rem; }
  .cal-dp .evs .empty { font-size: .74rem; color: var(--dim); opacity: .45; padding: .1rem; }
  /* 월 이동 하단 바 — 세로 스와이프가 월/주 전환에 쓰여서 엄지로 누르는 버튼으로 대체 */
  .cal-monthnav { flex: none; display: flex; border-top: 1px solid var(--line); background: var(--panel);
                  padding-bottom: env(safe-area-inset-bottom, 0px); }
  .cal-monthnav[hidden] { display: none; }
  .cal-monthnav button { flex: 1; font: inherit; font-size: .85rem; padding: .8rem .9rem; border: 0;
                         background: none; color: inherit; cursor: pointer; }
  .cal-monthnav button:first-child { text-align: left; border-right: 1px solid var(--line); }
  .cal-monthnav button:last-child { text-align: right; }
  .cal-monthnav button:active { background: var(--bg); }
  /* 종일 일정은 색을 꽉 채운 알약 + 흰 글자(선명하게 눈에 띄게). 시간 일정은
     아래 .timed 에서 배경 없이 색점만(지금까지와 동일 — 배경과 비슷하게 옅다).
     글자는 굵게 + 자간을 좁혀 좁은 칩 안에 최대한 많은 글자가 보이게 한다. */
  .cal-ev { font-size: .6rem; line-height: 1.35; font-weight: 800; letter-spacing: -.02em;
            border-radius: .3rem; padding: .07rem .26rem; cursor: pointer;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            background: var(--c); color: #fff; }
  .cal-ev.timed { background: none; color: inherit; display: flex; align-items: center; gap: .16rem; padding-left: .1rem; }
  .cal-ev.timed::before { content: ""; flex: none; width: .34rem; height: .34rem; border-radius: 50%; background: var(--c); }
  .cal-ev.timed .t { flex: none; color: var(--dim); }
  .cal-ev.timed .n { overflow: hidden; text-overflow: ellipsis; }
  .cal-week { flex: 1; display: flex; flex-direction: column; gap: .4rem; padding: .1rem .6rem .9rem;
              padding-left: calc(.6rem + env(safe-area-inset-left,0px)); padding-right: calc(.6rem + env(safe-area-inset-right,0px)); }
  .cal-wrow { display: flex; gap: .7rem; align-items: flex-start; padding: .55rem .7rem; cursor: pointer;
              background: var(--panel); border: 1px solid var(--line); border-radius: .85rem; }
  .cal-wrow.today { border-color: color-mix(in srgb, var(--pink) 40%, var(--line));
                    background: color-mix(in srgb, var(--pink) 7%, var(--panel)); }
  .cal-wrow .wd { width: 2.1rem; flex: none; display: flex; flex-direction: column; align-items: center; gap: .06rem; }
  .cal-wrow .wd .wn { font-size: 1rem; width: 1.85rem; height: 1.85rem; display: grid; place-items: center; border-radius: 50%; }
  .cal-wrow .wd .ww { font-size: .56rem; letter-spacing: .05em; color: var(--dim); }
  .cal-wrow.sun .wd .wn { color: var(--sun); }
  .cal-wrow.sat .wd .wn { color: var(--sat); }
  .cal-wrow.today .wd .wn { background: var(--pink); color: light-dark(#fff,#1a1016); font-weight: 700; }
  .cal-wrow .wevs { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: .3rem; padding-top: .2rem; }
  .cal-wrow .wevs .cal-ev { font-size: .78rem; line-height: 1.4; padding: .24rem .55rem; border-radius: .45rem; }
  .cal-wrow .wevs .cal-ev.timed { padding: .1rem .1rem; gap: .4rem; }
  .cal-wrow .wevs .cal-ev.timed::before { width: .42rem; height: .42rem; }
  .cal-wrow .wevs .empty { font-size: .72rem; color: var(--dim); opacity: .4; padding: .1rem .1rem; }
  /* 키보드가 올라오면 --kb-live 만큼 아래 여백을 더해, 가운데 정렬 기준이 키보드
     위 보이는 영역으로 좁혀지게 한다(전체 화면 기준 가운데 정렬이면 다이얼로그가
     키보드에 가려질 수 있다). */
  #cal-dialog, #cal-colorbox { position: fixed; inset: 0; z-index: 70; display: flex;
                               background: light-dark(#0f17223d, #000000a8); backdrop-filter: blur(2px);
                               align-items: center; justify-content: center; padding: 1rem;
                               padding-bottom: calc(1rem + var(--kb-live, 0px));
                               transition: padding-bottom .18s ease; }
  #cal-dialog[hidden], #cal-colorbox[hidden] { display: none; }
  .cal-card { width: min(22rem, 92vw); max-height: 100%; overflow-y: auto; background: var(--panel);
              border: 1px solid var(--line); border-radius: 1.1rem; padding: 1.1rem; display: flex;
              flex-direction: column; gap: .7rem; box-shadow: 0 18px 44px light-dark(#0f172226, #0009); }
  .cal-card h3 { margin: 0; font-size: 1rem; }
  #cal-colorbox label { display: flex; align-items: center; justify-content: space-between; font-size: .85rem; }
  .cal-card input[type=color] { width: 3rem; height: 2rem; border: 1px solid var(--line); border-radius: .4rem; background: none; padding: 0; }
  .cal-col-note { font-size: .78rem; color: var(--dim); line-height: 1.6; margin: .2rem 0 1rem; }
  /* 테두리 없는 큰 제목 입력(네이티브 캘린더 앱 벤치마킹) — 박스 대신 큰 글씨로만 존재감 */
  #cal-dlg-title { font: inherit; font-size: 1.3rem; font-weight: 700; padding: .1rem 0;
                   border: none; background: none; color: inherit; }
  #cal-dlg-title::placeholder { color: var(--dim); font-weight: 700; }
  #cal-dlg-title:focus { outline: none; }
  /* 시작/종료를 화살표 아이콘 + 전체 날짜 텍스트 행으로(네이티브 캘린더 앱 벤치마킹).
     실제 <input type=date> 는 투명하게 행 전체를 덮어 어디를 눌러도 네이티브
     피커가 뜨고, 보이는 글자는 dlgDateLabel 로 포맷한 텍스트다. */
  .cal-daterow { display: flex; flex-direction: column; }
  .cal-daterow-item { position: relative; display: flex; align-items: center; gap: .6rem;
                       padding: .55rem .1rem; border-bottom: 1px solid var(--line); font-size: .88rem; }
  .cal-daterow-item .arrow { flex: none; color: var(--dim); }
  .cal-daterow-item .txt { flex: 1; }
  .cal-daterow-item input[type=date] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  /* 반복을 기본 숨기고 칩으로 진입시킨다(네이티브 캘린더 앱 벤치마킹) — 대부분
     일정은 반복이 아니라서, 펼쳐진 폼보다 접힌 칩이 기본 화면을 가볍게 한다. */
  .cal-chips { display: flex; gap: .5rem; }
  .cal-chip { font: inherit; font-size: .8rem; padding: .45rem .8rem; border-radius: 999px;
              border: 1px solid var(--line); background: var(--bg); color: inherit; cursor: pointer; }
  .cal-chip[aria-pressed=true] { background: color-mix(in srgb, var(--pink) 16%, var(--bg));
                                  border-color: color-mix(in srgb, var(--pink) 55%, var(--line));
                                  color: var(--pink); font-weight: 600; }
  /* iOS 스타일 on/off 토글 — 체크박스는 숨기고 track+thumb 을 :checked 로 움직인다 */
  .cal-toggle { display: flex; align-items: center; gap: .5rem; font-size: .85rem; cursor: pointer; }
  .cal-toggle input { position: absolute; opacity: 0; width: 0; height: 0; }
  .cal-toggle .track { position: relative; flex: none; width: 2.5rem; height: 1.4rem; border-radius: 999px;
                        background: var(--line); transition: background .15s; }
  .cal-toggle .thumb { position: absolute; top: .15rem; left: .15rem; width: 1.1rem; height: 1.1rem;
                        border-radius: 50%; background: var(--panel); box-shadow: 0 1px 2px light-dark(#0f172233, #0007);
                        transition: transform .15s; }
  .cal-toggle input:checked + .track { background: var(--pink); }
  .cal-toggle input:checked + .track > .thumb { transform: translateX(1.1rem); }
  .cal-times { display: flex; gap: .9rem; }
  .cal-times label { display: flex; align-items: center; gap: .35rem; font-size: .82rem; }
  .cal-times input[type=time], .cal-times input[type=date] { font: inherit; padding: .35rem .45rem; border: 1px solid var(--line);
                                border-radius: .5rem; background: var(--bg); color: inherit; }
  .cal-recur { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem .9rem; font-size: .82rem; }
  .cal-recur label { display: flex; align-items: center; gap: .35rem; }
  .cal-recur select, .cal-recur input[type=date], .cal-recur input[type=number] { font: inherit; font-size: .8rem; padding: .35rem .45rem;
                                                    border: 1px solid var(--line); border-radius: .5rem;
                                                    background: var(--bg); color: inherit; }
  .cal-recur input[type=number] { width: 3.6rem; }
  .cal-hint { margin: 0; font-size: .68rem; color: var(--dim); line-height: 1.4; }
  .cal-dlg-delrow { display: flex; gap: .5rem; }
  .cal-cats { display: flex; gap: .4rem; }

<script>
"use strict";
// ── 유틸 ─────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const enc = new TextEncoder();
const dec = new TextDecoder();
const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const hex = (buf) => [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
// 시간은 시:분만 (날짜는 날짜 구분선이 담당). 날짜 구분선용 라벨은 dayLabel.
const fmtTime = (t) => new Date(t).toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
const dayLabel = (t) => new Date(t).toLocaleDateString("ko-KR", { year: "numeric", month: "long", day: "numeric", weekday: "short" });

// ── E2E 암호화 (PBKDF2 → AES-GCM 256) ────────────────────────
// 저장하는 것은 **패스프레이즈가 아니라 유도된 키 객체**다. deriveKey의
// extractable=false 로 만든 CryptoKey는 IndexedDB에 구조화 복제로 담을 수 있고,
// 담긴 뒤에도 원문 바이트를 다시 꺼낼 수 없다 — 브라우저가 encrypt/decrypt에만
// 쓰게 해 준다. 예전에는 문구를 localStorage에 평문으로 두어서, 기기를 잠깐
// 빌려주거나 XSS 한 번이면 문구 자체가 그대로 노출됐다(CSP가 script-src에
// 'unsafe-inline'을 허용하므로 XSS를 막아 주는 층도 없다).
const SALT = enc.encode("duri:v1:pbkdf2:shared-passphrase");
const ITER = 210_000;
let KEY = null, MY_NAME = "";

async function deriveKey(passphrase) {
  const base = await crypto.subtle.importKey("raw", enc.encode(passphrase), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: SALT, iterations: ITER, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"],
  );
}
async function encryptBytes(bytes) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, KEY, bytes);
  return { iv: b64(iv), ct };
}
async function decryptBytes(ivB64, ct) {
  return crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(ivB64) }, KEY, ct);
}
async function encryptJson(obj) {
  const { iv, ct } = await encryptBytes(enc.encode(JSON.stringify(obj)));
  return { iv, ct: b64(ct) };
}
async function decryptJson(ivB64, ctB64) {
  return JSON.parse(dec.decode(await decryptBytes(ivB64, unb64(ctB64))));
}

// ── 스티커 팩 (util/chat 와 동일: /_assets/catalog.json + 누끼) ─
const PACKS = [];
const PACK_IDS = new Map();
const RECENT_KEY = "duri:recent-stickers";
const PACKS_CACHE_KEY = "duri:packs";
// assets 카탈로그에서 비공개(active:false)로 내린 뒤에도 duri에서만 계속 쓰는 팩.
// 파일은 dist/_assets/sticker/ 에 그대로 배포되므로 목록만 여기서 보강한다.
const DURI_ONLY_PACKS = [
  { id: "dageudangseu-1", title: "다그당스1", count: 16, cutout: true },
  { id: "dageudangseu-2", title: "다그당스2", count: 16, cutout: true },
  // 움직이는 이모티콘 시험판 (work/emoticon). 장수는 늘어나는 대로 count만 올린다.
  // cutout:false 필수 — 클라이언트 누끼는 캔버스로 다시 그리는 방식이라
  // APNG를 첫 프레임짜리 정지 이미지로 만들어 버린다. 이 팩은 이미 투명 배경이다.
  { id: "emoticon-anim", title: "애니메이션", count: 3, cutout: false },
];

function setPacks(list) {
  PACKS.length = 0; PACK_IDS.clear();
  for (const pack of list) { PACKS.push(pack); PACK_IDS.set(pack.id, pack); }
}
// 지난번에 받아 둔 팩 목록을 캐시에서 즉시 채운다 — 네트워크를 기다리지 않아야
// 채팅 히스토리 렌더(로컬 데이터)가 카탈로그 fetch에 발목 잡히지 않는다.
function hydratePacksFromCache() {
  try {
    const cached = JSON.parse(localStorage.getItem(PACKS_CACHE_KEY) || "null");
    if (Array.isArray(cached)) setPacks(cached);
  } catch { /* 최선노력 — 캐시가 없으면 그냥 빈 채로 시작 */ }
}
// 최신 목록은 네트워크로 조용히 받아 갱신한다(로그인 흐름을 막지 않도록 await 안 함
// — 호출부 참고). 다음 번 시작할 때 쓸 수 있게 로컬에도 다시 저장해 둔다.
async function loadPacks() {
  try {
    const res = await fetch("/_assets/catalog.json");
    if (!res.ok) throw new Error();
    const { items } = await res.json();
    const fresh = [];
    for (const item of items ?? []) {
      if (item.category !== "sticker" || !item.chat?.title || !Array.isArray(item.downloads)) continue;
      fresh.push({ id: item.id, title: item.chat.title, count: item.downloads.length, cutout: item.chat.cutout !== false });
    }
    const merged = [
      ...DURI_ONLY_PACKS.filter((p) => !fresh.some((f) => f.id === p.id)),
      ...fresh,
    ];
    setPacks(merged);
    try { localStorage.setItem(PACKS_CACHE_KEY, JSON.stringify(merged)); } catch { /* 최선노력 */ }
  } catch { /* 카탈로그 없이도 텍스트·사진은 동작 — 캐시가 있으면 그걸로 계속 동작 */ }
}

const stickerUrl = (pack, n) => `/_assets/sticker/${pack}/${String(n).padStart(2, "0")}.png`;
const cutoutCache = new Map();

// 흰 배경 누끼 (util/chat 와 동일한 테두리 flood fill)
function cutoutWhiteBackground(imageData) {
  const { data, width, height } = imageData;
  const whiteness = (i) => Math.min(data[i], data[i + 1], data[i + 2]);
  const visited = new Uint8Array(width * height);
  const queue = [];
  for (let x = 0; x < width; x++) queue.push(x, (height - 1) * width + x);
  for (let y = 0; y < height; y++) queue.push(y * width, y * width + width - 1);
  while (queue.length) {
    const p = queue.pop();
    if (visited[p]) continue;
    visited[p] = 1;
    const i = p * 4;
    const w = whiteness(i);
    if (w < 208) continue;
    data[i + 3] = w >= 235 ? 0 : Math.round(((235 - w) / 27) * 255);
    const x = p % width, y = (p / width) | 0;
    if (x > 0) queue.push(p - 1);
    if (x < width - 1) queue.push(p + 1);
    if (y > 0) queue.push(p - width);
    if (y < height - 1) queue.push(p + width);
  }
}
function stickerObjectUrl(pack, n) {
  if (PACK_IDS.get(pack)?.cutout === false) return Promise.resolve(stickerUrl(pack, n));
  const key = `${pack}/${n}`;
  if (!cutoutCache.has(key)) {
    cutoutCache.set(key, (async () => {
      const source = new Image();
      source.src = stickerUrl(pack, n);
      await source.decode();
      const canvas = document.createElement("canvas");
      canvas.width = source.naturalWidth; canvas.height = source.naturalHeight;
      const context = canvas.getContext("2d");
      context.drawImage(source, 0, 0);
      const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
      cutoutWhiteBackground(imageData);
      context.putImageData(imageData, 0, 0);
      const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
      if (!blob) throw new Error("cutout failed");
      return URL.createObjectURL(blob);
    })().catch(() => stickerUrl(pack, n)));
  }
  return cutoutCache.get(key);
}
// ── 움직이는 스티커 (v1) ─────────────────────────────────────
// "파일을 굽지 않고 데이터로" — 투명 PNG 1장 + 키프레임 명세를 Web Animations 로
// 재생한다. 명세의 시간은 정규화(at: 0~1)라 해상도·프레임수와 무관하므로, 나중에

// 없다. 작업 캔버스 720² → 최종 270~360, 12~20프레임, 1~2초 루프가 두 플랫폼 교집합.

// 어떤 스티커에 어떤 움직임을 줄지(데이터). v1은 여기서 실험 — 값만 바꿔 재배포하면
// 즉시 반영된다. 나중엔 팩 metadata/catalog 로 옮겨 팩이 스스로 움직임을 갖게 한다.

        // 정지시키지 않는다(생성 직후 일시정지된 채 안 풀리는 경우 방지).

// ── WebSocket 연결 ───────────────────────────────────────────
let ws = null, backoff = 1000;
const seen = new Set();
const lastSeqKey = "duri:lastSeq";
const getLastSeq = () => Number(localStorage.getItem(lastSeqKey) || 0);
const setLastSeq = (n) => localStorage.setItem(lastSeqKey, String(n));

// 나·상대 동그라미. online 은 서버가 아는 "총 접속 수"일 뿐(신원 모름)이라, 상대
// 동그라미는 정확히 "그 사람"이 아니라 "나 말고 접속한 무언가가 있다"는 뜻이다
// (내 다른 기기일 수도 있음) — 서버가 평문·신원을 모르는 설계상 어쩔 수 없다.
function setStatus(mineOn, theirsOn) {
  $("dot-mine").classList.toggle("on", mineOn);
  $("dot-theirs").classList.toggle("on", theirsOn);
}

function connect() {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  ws = new WebSocket(`${proto}//${location.host}/_duri`);
  ws.onopen = () => {
    backoff = 1000; setStatus(true, false); // 상대 여부는 welcome/presence 로 곧 갱신
    // 내 푸시 endpoint 를 함께 알린다 → 접속 중인 내 기기엔 서버가 푸시를 안 보낸다
    // (silent push 방지 — iOS 알림 예산 보호). 없으면(알림 끔) null.
    ws.send(JSON.stringify({ type: "hello", since: getLastSeq(), endpoint: window.__duriPushEndpoint ?? null }));
    ws.send(JSON.stringify({ type: "cal-hello" })); // 캘린더 현재 상태 동기화
    calFlushOutbox();                                // 오프라인 중 쌓인 캘린더 변경 전송
  };
  ws.onmessage = (e) => {
    let m; try { m = JSON.parse(e.data); } catch { return; }
    if (m.type === "ping") { ws.send(JSON.stringify({ type: "pong" })); return; }
    if (m.type === "welcome" || m.type === "presence") { setStatus(true, m.online > 1); return; }
    if (m.type === "entry") { renderEntry(m); return; }
    if (m.type === "cal-state") { applyCalEntries(m.events || []); return; }
    if (m.type === "cal-put" || m.type === "cal-del") { applyCalEntry(m); return; }
    if (m.type === "reset") { localStorage.removeItem("duri:cal"); clearCache().then(() => location.reload()); return; }
    if (m.type === "error") { console.warn("duri error", m.error); return; }
  };
  ws.onclose = () => { setStatus(false, false); setTimeout(connect, backoff); backoff = Math.min(backoff * 2, 15000); };
  ws.onerror = () => { try { ws.close(); } catch {} };
}

// 접속 중인 기기엔 서버가 푸시를 건너뛴다(화면을 보고 있으니 실시간 수신 — silent push
// 방지). 그런데 백그라운드로 내려가도 웹소켓이 잠깐(핑 주기까지) 살아 있어, 그 사이엔
// 푸시가 안 와 알림이 늦었다. 화면 전환 즉시 서버에 알린다: 보일 때는 endpoint 를 줘
// "나 보는 중"(스킵), 숨을 때는 null 로 "나 안 봄"(바로 푸시) 로 만든다.
document.addEventListener("visibilitychange", () => {
  if (!ws || ws.readyState !== 1) return;
  const endpoint = document.visibilityState === "visible" ? (window.__duriPushEndpoint ?? null) : null;
  ws.send(JSON.stringify({ type: "presence-endpoint", endpoint }));
});

// ── 로컬 캐시 (IndexedDB) — 이 기기 표시용. 아카이브는 PC 싱크가 정본. ──
// 복호화한 항목을 이 기기에 담아 새로고침·재방문에도 대화가 남게 한다. 사진은
// 복호화한 원본 blob째 담아 서버 R2가 정리된 뒤에도 이 기기에선 계속 보인다.

let db = null;
const MAX_CACHE = 2000; // 이 기기에 보관할 최근 항목 수(IndexedDB)
const MAX_DOM = 300;    // 화면에 유지할 말풍선 수(성능 — 넘으면 위에서부터 제거)
function openDB() {
  return new Promise((resolve) => {
    let req;
    // v2: "meta" 스토어 추가 — 유도된 키 객체(추출 불가 CryptoKey)를 넣어
    // 서비스워커(sw.js)가 푸시 도착 시 같은 IndexedDB에서 읽어 그 자리에서
    // 복호화할 수 있게 한다(localStorage는 서비스워커에서 못 읽는다).
    // 키 객체는 담긴 뒤에도 원문 바이트를 다시 꺼낼 수 없다 — 문구는 어디에도 안 남는다.
    try { req = indexedDB.open("duri", 2); } catch { return resolve(null); }
    req.onupgradeneeded = () => {
      const d = req.result;
      if (!d.objectStoreNames.contains("entries")) d.createObjectStore("entries", { keyPath: "seq" });
      if (!d.objectStoreNames.contains("meta")) d.createObjectStore("meta", { keyPath: "id" });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => resolve(null);
  });
}
function putMeta(id, value) {
  if (!db) return;
  try { db.transaction("meta", "readwrite").objectStore("meta").put({ id, value }); } catch { /* 최선노력 */ }
}
function getMeta(id) {
  return new Promise((resolve) => {
    if (!db || !db.objectStoreNames.contains("meta")) return resolve(null);
    try {
      const req = db.transaction("meta").objectStore("meta").get(id);
      req.onsuccess = () => resolve(req.result?.value ?? null);
      req.onerror = () => resolve(null);
    } catch { resolve(null); }
  });
}
function delMeta(id) {
  if (!db) return;
  try { db.transaction("meta", "readwrite").objectStore("meta").delete(id); } catch { /* 최선노력 */ }
}
const ensureDB = async () => (db ??= await openDB());
function putEntry(rec) {
  if (!db) return;
  try {
    const store = db.transaction("entries", "readwrite").objectStore("entries");
    store.put(rec);
    if (rec.seq > MAX_CACHE) store.delete(IDBKeyRange.upperBound(rec.seq - MAX_CACHE)); // 오래된 것 정리
  } catch { /* 캐시는 최선노력 */ }
}
function allEntries() {
  return new Promise((resolve) => {
    if (!db) return resolve([]);
    const out = [];
    try {
      const cur = db.transaction("entries").objectStore("entries").openCursor();
      cur.onsuccess = (e) => { const c = e.target.result; if (c) { out.push(c.value); c.continue(); } else resolve(out); };
      cur.onerror = () => resolve(out);
    } catch { resolve(out); }
  });
}
function clearCache() {
  return new Promise((resolve) => {
    localStorage.removeItem(lastSeqKey);
    if (!db) return resolve();
    try { const t = db.transaction("entries", "readwrite"); t.objectStore("entries").clear(); t.oncomplete = resolve; t.onerror = resolve; }
    catch { resolve(); }
  });
}

// ── 렌더 ─────────────────────────────────────────────────────
const log = () => $("log");
function atBottom() { const el = log(); return el.scrollHeight - el.scrollTop - el.clientHeight < 80; }
function scroll() { log().scrollTop = log().scrollHeight; }
function scrollToBottom(smooth) { const el = log(); el.scrollTo({ top: el.scrollHeight, behavior: smooth ? "smooth" : "auto" }); }
// 스크롤이 위로 올라가 있으면 "맨 아래로" 버튼을 띄운다(바닥 근처면 숨김).

log().addEventListener("scroll", updateToBottom, { passive: true });
$("to-bottom").addEventListener("click", () => scrollToBottom(true));
$("lightbox").addEventListener("click", (e) => { if (e.target === $("lightbox")) closeLb(); }); // 배경 탭 → 닫기
$("lb-close").addEventListener("click", (e) => { e.stopPropagation(); closeLb(); });
// 좌우 스와이프로 앨범 넘기기
let lbTouchX = null;
$("lightbox").addEventListener("touchstart", (e) => { lbTouchX = e.touches[0].clientX; }, { passive: true });
$("lightbox").addEventListener("touchend", (e) => {
  if (lbTouchX === null) return;
  const dx = e.changedTouches[0].clientX - lbTouchX; lbTouchX = null;
  if (Math.abs(dx) > 45) lbGo(dx < 0 ? 1 : -1); // 왼쪽으로 밀면 다음, 오른쪽이면 이전

document.addEventListener("keydown", (e) => {

  else if (e.key === "ArrowRight") lbGo(1);

// 사진 저장: 안드로이드·데스크톱은 <a download> 로 Download 폴더에 바로 저장한다.
// iOS(사파리)는 download 속성을 무시하므로 그때만 공유 시트(→ "이미지 저장")로.
// 미리 담아둔 blob 으로 File 을 동기 생성(iOS 공유는 사용자 제스처 활성화 필요).
const EXT = { "image/png": "png", "image/gif": "gif", "image/webp": "webp" };
const toFile = (blob, i) => new File([blob], `duri-${Date.now()}-${i}.${EXT[blob.type] || "jpg"}`,
  { type: blob.type || "image/jpeg" });
const isIOS = /iP(hone|od|ad)/.test(navigator.userAgent) ||
  (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); // iPadOS(맥으로 위장) 포함
function downloadFiles(files) {
  files.forEach((f, k) => {
    const url = URL.createObjectURL(f);
    const a = document.createElement("a");
    a.href = url; a.download = f.name; a.rel = "noopener";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500 + k * 400);
  });
}
function saveFiles(files) {
  if (!files.length) return;
  if (isIOS && navigator.canShare && navigator.canShare({ files })) {
    // iOS: 공유 시트에서 "이미지 저장". await 없이 즉시 호출(활성화 유지), 실패 시 폴백.
    navigator.share({ files }).catch((err) => { if (err?.name !== "AbortError") downloadFiles(files); });
  } else {
    downloadFiles(files); // 안드로이드·데스크톱: Download 폴더로 바로 저장
  }
}
$("lb-save").addEventListener("click", (e) => {
  e.stopPropagation();
  const blob = lbBlobs[lbIndex];
  if (blob) saveFiles([toFile(blob, 1)]);
  else alert("사진을 저장할 수 없어요. 새로고침 후 다시 시도해 주세요.");
});
$("lb-save-all").addEventListener("click", (e) => {
  e.stopPropagation();
  const files = lbBlobs.filter(Boolean).map((b, i) => toFile(b, i + 1));
  if (files.length) saveFiles(files);
});

// 복호화가 끝난 레코드({seq,kind,at,name, text?|sticker?|photo blob|broken})를 그린다.
// 말풍선 묶어읽기(카톡 벤치마킹): ① 날짜가 바뀌면 가운데 날짜 구분선 ② 같은
// 사람의 연속 메시지는 이름 한 번·간격 좁게(그룹화) ③ 같은 사람·같은 분(minute)
// 연속이면 시간을 마지막 하나에만(직전 시간을 감춘다). 아래 상태로 직전 문맥을 기억.
let grpSender = null, grpMinute = -1, grpDay = null, grpTimeEl = null;
// 앨범(묶어보내기) 버블 추적: 앨범 id → 그리드 요소. 같은 id의 사진은 이 그리드에
// 이어붙인다(중간에 텍스트가 끼어도 id로 찾아 같은 앨범에 담는다).
const albumBubbles = new Map();
const randToken = () => Array.from(crypto.getRandomValues(new Uint8Array(12)),
  (b) => "abcdefghijklmnopqrstuvwxyz0123456789"[b % 36]).join("");
// 전체화면 뷰어(라이트박스): 앨범이면 좌우 스와이프로 넘기고, 묶음 전체 저장도.
let lbUrls = [], lbBlobs = [], lbIndex = 0, lbAnimating = false;
function updateLbBar() {
  $("lb-count").textContent = lbUrls.length > 1 ? `${lbIndex + 1} / ${lbUrls.length}` : "";
  $("lb-save-all").hidden = lbUrls.length <= 1;
}
function openLightbox(urls, index = 0, blobs = []) {
  lbUrls = Array.isArray(urls) ? urls.slice() : [urls];
  lbBlobs = blobs.slice();
  lbIndex = Math.max(0, Math.min(index, lbUrls.length - 1));
  const img = $("lightbox").querySelector("img");
  img.style.transition = "none"; img.style.transform = "translateX(0)"; img.style.opacity = "1";
  img.src = lbUrls[lbIndex] || "";
  updateLbBar();
  $("lightbox").hidden = false;
}
// 좌우로 부드럽게 슬라이드하며 넘긴다(현재는 밀려나가고 다음은 반대편에서 들어옴).
function lbGo(delta) {
  if (lbAnimating || lbUrls.length < 2) return;
  const target = Math.max(0, Math.min(lbIndex + delta, lbUrls.length - 1));
  if (target === lbIndex) return; // 양 끝이면 더 안 넘어감
  lbAnimating = true;
  const img = $("lightbox").querySelector("img");
  const dir = delta > 0 ? -1 : 1;
  const D = 180;
  img.style.transition = `transform ${D}ms ease, opacity ${D}ms ease`;
  img.style.transform = `translateX(${dir * 35}%)`;
  img.style.opacity = "0";
  setTimeout(() => {
    lbIndex = target;
    img.style.transition = "none";
    img.style.transform = `translateX(${-dir * 35}%)`;
    img.src = lbUrls[lbIndex];
    updateLbBar();
    requestAnimationFrame(() => {
      img.style.transition = `transform ${D}ms ease, opacity ${D}ms ease`;
      img.style.transform = "translateX(0)";
      img.style.opacity = "1";
      setTimeout(() => { lbAnimating = false; }, D);
    });
  }, D);
}
function closeLb() { const lb = $("lightbox"); lb.hidden = true; lb.querySelector("img").src = ""; lbUrls = []; lbAnimating = false; }

// 탭하면 전체화면으로 열리는 사진 img. 앨범(.bubble.album) 안이면 형제 사진들을
// 함께 넘겨 스와이프로 넘길 수 있게 한다.
function photoImg(blob, alt) {
  const img = document.createElement("img");
  img.alt = alt || "사진"; img.decoding = "async";
  img.__blob = blob; // 저장 시 동기적으로 File 을 만들기 위해 원본 blob 을 붙여둔다
  img.src = URL.createObjectURL(blob);
  img.addEventListener("click", () => {
    const album = img.closest(".bubble.album");
    const imgs = album ? [...album.querySelectorAll("img")] : [img];
    openLightbox(imgs.map((i) => i.src), imgs.indexOf(img), imgs.map((i) => i.__blob));
  });
  return img;
}

function appendRecord(rec, { silent = false } = {}) {
  if (seen.has(rec.seq)) return;
  seen.add(rec.seq);
  if (rec.seq > getLastSeq()) setLastSeq(rec.seq);
  if (rec.name) notePeerName(rec.name); // 상대 이름을 알아야 색상 설정에 상대 칸을 보여줄 수 있다
  // silent(초기 히스토리 대량 로드)일 땐 스크롤 위치를 매번 재지 않는다 —
  // atBottom()·scroll() 둘 다 레이아웃을 강제로 다시 계산시키는 연산이라
  // 수백 개를 한 번에 그릴 때 그만큼 강제 리플로우가 쌓인다. 다 그린 뒤
  // 호출자가 한 번만 바닥으로 스크롤한다.
  const stick = silent ? false : atBottom();

  // 앨범 사진: 같은 앨범 id 버블이 화면에 있으면 새 말풍선 대신 거기에 이어붙인다.
  if (rec.album && rec.blob) {
    const grid = albumBubbles.get(rec.album.id);
    if (grid && grid.isConnected) {
      grid.appendChild(photoImg(rec.blob, rec.caption));
      if (stick) scroll();
      if (!silent) updateToBottom();
      return;
    }
    if (grid) albumBubbles.delete(rec.album.id);
  }

  // 시스템 알림("/일정" 명령 등): 이름·말풍선 없이 가운데 정렬 알약 하나로 그린다.
  if (rec.sys) {
    const day = dayLabel(rec.at);
    if (day !== grpDay) {
      const sep = document.createElement("div"); sep.className = "daysep";
      const label = document.createElement("span"); label.textContent = day;
      sep.appendChild(label); log().appendChild(sep); grpDay = day;
    }
    const notice = document.createElement("div"); notice.className = "sysnotice";
    const span = document.createElement("span"); span.textContent = rec.text; notice.appendChild(span);
    log().appendChild(notice);
    grpSender = null; // 알림 뒤에 오는 다음 메시지는 이름을 다시 보여준다
    while (log().children.length > MAX_DOM) {
      const first = log().firstChild;
      first.querySelectorAll?.("img[src^='blob:']").forEach((im) => URL.revokeObjectURL(im.src));
      first.remove();
    }
    if (stick) scroll();
    if (!silent) updateToBottom();
    return;
  }

  const at = rec.at;
  const mine = rec.name && rec.name === MY_NAME;
  const broken = !!rec.broken;
  const senderKey = broken ? "\0broken" : (mine ? "\0me" : `them:${rec.name ?? ""}`);
  const day = dayLabel(at);
  const minute = Math.floor(at / 60000);

  // ① 날짜 구분선: 날짜가 바뀌면 삽입하고 그룹을 새로 시작한다.
  if (day !== grpDay) {
    const sep = document.createElement("div");
    sep.className = "daysep";
    const label = document.createElement("span");
    label.textContent = day;
    sep.appendChild(label);
    log().appendChild(sep);
    grpDay = day;
    grpSender = null;
  }
  // ② 같은 사람 연속이면 그룹 이어붙이기(이름 생략·간격 좁게).
  const cont = senderKey === grpSender;
  const showName = !mine && !cont;

  const row = document.createElement("div");
  row.className = cont ? "row cont" : "row";
  let timeEl;
  if (rec.album && rec.blob) {
    timeEl = buildBubble(row, rec.name, at, (b) => {
      b.classList.add("album");
      b.dataset.n = String(rec.album.n);
      b.appendChild(photoImg(rec.blob, rec.caption));
      albumBubbles.set(rec.album.id, b); // 이후 같은 앨범 사진이 이 그리드에 붙는다
    }, showName);
  } else if (rec.kind === "photo" && rec.blob) {
    timeEl = buildBubble(row, rec.name, at, (b) => {
      b.appendChild(photoImg(rec.blob, rec.caption));
      if (rec.caption) { const c = document.createElement("div"); c.className = "cap"; c.textContent = rec.caption; b.appendChild(c); }
    }, showName);
  } else if (rec.sticker && PACK_IDS.has(rec.sticker.pack)) {
    timeEl = buildBubble(row, rec.name, at, (b) => { b.classList.add("sticker"); b.appendChild(stickerImg(rec.sticker.pack, rec.sticker.n, "스티커")); }, showName);
  } else if (rec.broken) {
    timeEl = buildBubble(row, "🔒", at, (b) => { const s = document.createElement("span"); s.className = "broken"; s.textContent = rec.broken; b.appendChild(s); }, showName);
  } else {
    timeEl = buildBubble(row, rec.name, at, (b) => { b.textContent = rec.text; }, showName);
  }
  log().appendChild(row);

  // ③ 시간 묶기: 같은 사람·같은 분의 연속이면 직전 말풍선의 시간을 감춰 마지막만 남긴다.
  if (cont && minute === grpMinute && grpTimeEl) grpTimeEl.style.display = "none";
  grpSender = senderKey; grpMinute = minute; grpTimeEl = timeEl;

  // 화면 노드 수를 제한한다(성능). 지운 사진의 blob URL은 메모리 회수.
  while (log().children.length > MAX_DOM) {
    const first = log().firstChild;
    first.querySelectorAll?.("img[src^='blob:']").forEach((im) => URL.revokeObjectURL(im.src));
    first.remove();
  }
  if (stick) scroll();
  if (!silent) updateToBottom(); // 위를 보는 중 새 메시지가 오면 ⬇ 버튼을 띄운다
}

// 서버에서 온 암호화 항목: 복호화 → 그리기 → 이 기기 캐시에 저장(broken은 캐시 안 함).
async function renderEntry(m) {
  if (seen.has(m.seq)) return;
  try {
    if (m.kind === "msg") {
      const p = await decryptJson(m.iv, m.ct);
      const rec = { seq: m.seq, kind: "msg", at: p.at ?? m.at, name: p.name };
      if (p.sticker) rec.sticker = p.sticker;
      else { rec.text = p.text; if (p.sys) rec.sys = true; }
      appendRecord(rec); putEntry(rec);
    } else if (m.kind === "photo") {
      const meta = await decryptJson(m.metaIv, m.metaCt);
      const blob = await fetchPhotoBlob(m); // R2가 정리되기 전에 받아 캐시에 담는다
      if (blob) {
        const rec = { seq: m.seq, kind: "photo", at: meta.at ?? m.at, name: meta.name, caption: meta.caption, blob };
        if (m.album) rec.album = m.album; // 앨범 묶음(평문 그룹정보)
        appendRecord(rec); putEntry(rec);
      } else {
        appendRecord({ seq: m.seq, at: m.at, broken: "사진을 불러올 수 없습니다 (이미 백업되어 정리됨)" });
      }
    }
  } catch {
    appendRecord({ seq: m.seq, at: m.at, broken: "복호화할 수 없는 메시지 (암호 문구가 다릅니다)" });
  }
}

function buildBubble(row, name, at, fill, showName) {
  const mine = name && name === MY_NAME;
  if (mine) row.classList.add("me");
  if (showName && name && !mine) { const w = document.createElement("div"); w.className = "who"; w.textContent = name; row.appendChild(w); }
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  fill(bubble);
  row.appendChild(bubble);
  const t = document.createElement("div"); t.className = "time"; t.textContent = fmtTime(at); row.appendChild(t);
  return t;
}

// 매직바이트로 이미지 타입 판별(동기). 저장 시 올바른 확장자·타입에 쓴다.
function sniffImageType(bytes) {
  if (bytes[0] === 0x89 && bytes[1] === 0x50) return "image/png";
  if (bytes[0] === 0xFF && bytes[1] === 0xD8) return "image/jpeg";
  if (bytes[0] === 0x47 && bytes[1] === 0x49) return "image/gif";
  if (bytes[0] === 0x52 && bytes[1] === 0x49 && bytes[8] === 0x57 && bytes[9] === 0x45) return "image/webp";
  return "image/jpeg";
}
async function fetchPhotoBlob(m) {
  try {
    const res = await fetch(`/_duri/photo/${m.r2key}`, { cache: "no-store" });
    if (!res.ok) return null;
    const encbuf = await res.arrayBuffer();
    const plain = await decryptBytes(m.imgIv, encbuf);
    // 타입을 블롭에 새겨 둔다(저장 시 동기적으로 File 을 만들 수 있게).
    return new Blob([plain], { type: sniffImageType(new Uint8Array(plain)) });
  } catch { return null; }
}

// ── 보내기 ───────────────────────────────────────────────────
async function sendText(text) {
  const frame = await encryptJson({ name: MY_NAME, text, at: Date.now() });
  ws.send(JSON.stringify({ type: "msg", ...frame }));
}
// 오픈카톡 입장 메시지 벤치마킹: 실제 대화가 아니라 "무슨 일이 있었는지" 알리는
// 문구. 진짜 메시지처럼 E2E 암호화되어 상대·PC 백업에도 남지만, sys 플래그로
// 렌더링만 가운데 정렬 알약으로 다르게 한다(appendRecord 참고).
async function sendSysNotice(text) {
  if (!ws || ws.readyState !== 1) return;
  const frame = await encryptJson({ name: MY_NAME, text, at: Date.now(), sys: true });
  ws.send(JSON.stringify({ type: "msg", ...frame }));
}
async function sendSticker(pack, n) {
  if (!ws || ws.readyState !== 1) return;
  const frame = await encryptJson({ name: MY_NAME, at: Date.now(), sticker: { pack, n } });
  ws.send(JSON.stringify({ type: "msg", ...frame }));
  rememberSticker(pack, n);
}
async function sendPhoto(file, album) {
  const bytes = new Uint8Array(await file.arrayBuffer());
  const sha256 = hex(await crypto.subtle.digest("SHA-256", bytes));
  const img = await encryptBytes(bytes);
  const meta = await encryptJson({ name: MY_NAME, at: Date.now() }); // 파일명 캡션 없이 원본만
  const headers = { "X-Duri-Img-Iv": img.iv, "X-Duri-Sha256": sha256, "X-Duri-Meta-Iv": meta.iv, "X-Duri-Meta": meta.ct };
  if (album) headers["X-Duri-Album"] = `${album.id}.${album.i}.${album.n}`; // 묶어보내기 그룹정보(평문)
  const res = await fetch("/_duri/photo", { method: "POST", headers, body: img.ct });
  if (!res.ok) {
    const detail = await res.text().catch(() => "");
    alert(`사진 전송 실패: ${res.status}\n원본 ${(bytes.length / 1048576).toFixed(1)}MB\n${detail}`);
    return false;
  }
  return true;
}

// ── 사진 미리보기 트레이 (카톡식: 여러 장 담아 확인 후 보내기) ──
let pendingPhotos = []; // [{ file, url }]
const photoTray = () => $("photo-tray");

function renderTray() {
  const tray = photoTray();
  tray.replaceChildren();
  if (!pendingPhotos.length) { tray.hidden = true; return; }
  tray.hidden = false;
  pendingPhotos.forEach((p, i) => {
    const thumb = document.createElement("div");
    thumb.className = "thumb";
    const img = document.createElement("img");
    img.src = p.url; img.alt = "선택한 사진"; img.decoding = "async";
    const rm = document.createElement("button");
    rm.type = "button"; rm.className = "rm"; rm.textContent = "✕"; rm.title = "빼기";
    rm.addEventListener("click", () => { URL.revokeObjectURL(p.url); pendingPhotos.splice(i, 1); renderTray(); });
    thumb.append(img, rm);
    tray.append(thumb);
  });
}

// 백그라운드 전송: 트레이를 즉시 비워 입력창을 계속 쓸 수 있게 하고(업로드 중
// 채팅 가능 — 카톡식), 사진은 완료되는 대로 채팅에 쌓인다. 2장 이상이면 공유
// 앨범 id 를 붙여 한 말풍선(그리드)으로 묶인다.
const ALBUM_MAX = 30; // 앨범 한 묶음 최대 장수(서버 parseAlbumHeader 의 n≤30 과 일치)
function sendPendingPhotos() {
  if (!pendingPhotos.length) return;
  const batch = pendingPhotos;
  pendingPhotos = [];
  renderTray(); // 트레이 비움 → 입력창 자유
  (async () => {
    // 30장씩 묶어 각 묶음을 하나의 앨범으로 보낸다(30장 초과도 낱장 대신 뭉텅이로).
    for (let start = 0; start < batch.length; start += ALBUM_MAX) {
      const chunk = batch.slice(start, start + ALBUM_MAX);
      const n = chunk.length;
      const albumId = n >= 2 ? randToken() : null; // 묶음이 2장 이상이면 앨범
      for (let i = 0; i < n; i++) {
        await sendPhoto(chunk[i].file, albumId ? { id: albumId, i: i + 1, n } : null);
        URL.revokeObjectURL(chunk[i].url);
      }
    }
  })();
}

// ── 스티커 서랍 ──────────────────────────────────────────────
const picker = $("picker"), tabs = $("tabs"), grid = $("grid"), hint = $("hint");
const HINT_DEFAULT = "스티커를 누르면 미리보기, 한 번 더 누르면 전송돼요";
const HINT_EMOJI = "이모지를 누르면 입력창에 담겨요 — 보내기로 전송";
// 기본 유니코드 이모지(이모지 탭). 누르면 입력창에 담긴다.
const EMOJIS = ("😀 😁 😂 🤣 🥹 😊 😇 🙂 🙃 😉 😍 🥰 😘 😗 😚 😋 😛 😜 🤪 😝 🤗 " +
  "🤔 🤭 🫢 🤫 😐 😑 😶 😏 😒 🙄 😬 😌 😔 😪 🤤 😴 🤒 🥵 🥶 😵 🤯 🥳 😎 🤓 🧐 " +
  "😕 😟 🙁 ☹️ 😮 😯 😲 😳 🥺 😦 😧 😨 😰 😢 😭 😱 😖 😞 😓 😩 😫 🥱 😤 😡 🤬 😈 💀 💩 " +
  "👍 👎 👏 🙌 🙏 👌 ✌️ 🤞 🤙 👋 💪 🫶 " +
  "❤️ 🧡 💛 💚 💙 💜 🖤 🤍 💖 💕 💞 💗 💘 💔 🔥 ✨ ⭐ 🎉 💯 ✅ ❗ ❓ 🐴").split(" ");
let activeTab = "recent", selectedKey = null;

function insertEmoji(ch) {
  const ta = $("text");
  ta.value += ch;             // 입력창 끝에 담는다 (서랍은 열어둔 채 계속 고를 수 있게)
  autoGrow();                 // 높이 갱신. 포커스는 주지 않는다(포커스 시 서랍이 닫힘).
}
function emojiButton(ch) {
  const button = document.createElement("button");
  button.type = "button";
  button.className = "emoji";
  button.textContent = ch;
  button.addEventListener("click", () => insertEmoji(ch));
  return button;
}

function recentStickers() {
  try {
    const list = JSON.parse(localStorage.getItem(RECENT_KEY) ?? "[]");
    return Array.isArray(list) ? list.filter((key) => {
      const [pack, n] = String(key).split("/");
      return PACK_IDS.has(pack) && Number(n) >= 1 && Number(n) <= (PACK_IDS.get(pack)?.count ?? 0);
    }) : [];
  } catch { return []; }
}
function rememberSticker(pack, n) {
  const key = `${pack}/${n}`;
  localStorage.setItem(RECENT_KEY, JSON.stringify([key, ...recentStickers().filter((k) => k !== key)].slice(0, 16)));
}
function clearSelection() {
  selectedKey = null; hint.textContent = HINT_DEFAULT;
  for (const b of grid.querySelectorAll("button.selected")) b.classList.remove("selected");
}
function onStickerClick(button, pack, n) {
  const key = `${pack}/${n}`;
  if (selectedKey === key) { // 두 번째 탭 → 전송. 서랍은 닫지 않아 계속 보낼 수 있다.
    clearSelection();
    sendSticker(pack, n);
    return;
  }
  clearSelection();
  selectedKey = key; button.classList.add("selected");
  hint.textContent = (button.title ? `${button.title} — ` : "") + "한 번 더 누르면 전송";
}
function stickerButton(pack, n) {
  const button = document.createElement("button");
  button.type = "button";
  button.append(stickerImg(pack, n, `${PACK_IDS.get(pack)?.title ?? ""} ${n}`));
  button.addEventListener("click", () => onStickerClick(button, pack, n));
  return button;
}
function renderGrid() {
  clearSelection();
  grid.classList.toggle("emoji-grid", activeTab === "emoji");
  if (activeTab === "emoji") {
    hint.textContent = HINT_EMOJI;
    grid.replaceChildren(...EMOJIS.map(emojiButton));
    return;
  }
  if (activeTab === "recent") {
    const list = recentStickers();
    if (!list.length) {
      const empty = document.createElement("div");
      empty.className = "empty"; empty.textContent = "최근 보낸 스티커가 여기 모여요";
      grid.replaceChildren(empty); return;
    }
    grid.replaceChildren(...list.map((key) => { const [p, n] = key.split("/"); return stickerButton(p, Number(n)); }));
    return;
  }
  const pack = PACK_IDS.get(activeTab);
  const btns = [];
  for (let n = 1; n <= (pack?.count ?? 0); n++) btns.push(stickerButton(activeTab, n));
  grid.replaceChildren(...btns);
}
// 스티커 팩 탭 순서(기기별 로컬 기억) — 팩 글자를 꾹 눌러 드래그하면 바뀐다.
// 저장된 순서는 "이미 본 팩들 사이의 선호"일 뿐이라, 새 팩은 **앞에** 붙인다.
// 뒤에 붙이면 팩이 18개인 지금은 가로 스크롤 오른쪽 끝으로 밀려 사실상 안 보인다
// (순서를 한 번도 안 바꾼 기기에서만 보이고, 바꾼 기기에서는 안 보이는 차이가 났다).
// 드래그하면 전체 순서가 저장되므로 그 순간부터 원하는 자리에 고정된다.
const PACK_ORDER_KEY = "duri:pack-order";
function packOrder() {
  let saved = [];
  try { saved = JSON.parse(localStorage.getItem(PACK_ORDER_KEY) ?? "[]"); } catch { /* 최선노력 */ }
  const ids = PACKS.map((p) => p.id);
  const known = saved.filter((id) => ids.includes(id));
  return [...ids.filter((id) => !known.includes(id)), ...known];
}
function orderedPacks() { return packOrder().map((id) => PACK_IDS.get(id)).filter(Boolean); }
function savePackOrder(order) { try { localStorage.setItem(PACK_ORDER_KEY, JSON.stringify(order)); } catch { /* 최선노력 */ } }

function renderTabs() {
  tabs.replaceChildren();
  for (const tab of [{ id: "recent", title: "🕘 최근" }, { id: "emoji", title: "😀 이모지" }, ...orderedPacks()]) {
    const button = document.createElement("button");
    button.type = "button"; button.role = "tab"; button.textContent = tab.title;
    button.setAttribute("aria-selected", String(tab.id === activeTab));
    button.addEventListener("click", () => {
      if (tabDragged) { tabDragged = false; return; } // 방금 드래그로 순서를 바꾼 것 — 탭 전환은 무시
      activeTab = tab.id; renderTabs(); renderGrid();
    });
    if (PACK_IDS.has(tab.id)) { button.dataset.pack = tab.id; attachTabDrag(button, tab.id); }
    tabs.append(button);
  }
}
// 팩 탭 글자를 꾹 누르면(길게 누르기) 집어서 좌우로 옮길 수 있다 — 손을 뗀 자리에
// 맞춰 순서를 다시 계산해 저장한다(다른 탭을 실시간으로 밀어내진 않고, 뗄 때 한 번에 반영).
const TAB_LONGPRESS_MS = 420, TAB_MOVE_CANCEL_PX = 8;
let tabDragged = false; // 드래그 직후 곧바로 오는 click을 한 번 무시하기 위한 플래그
function attachTabDrag(button, packId) {
  let timer = null, startX = 0, startY = 0, dragging = false, siblingsInfo = [], pointerId = null;
  const clearTimer = () => { if (timer) { clearTimeout(timer); timer = null; } };
  const beginDrag = () => {
    dragging = true; tabDragged = true;
    button.classList.add("dragging");
    button.style.touchAction = "none"; // 이 시점부턴 진짜 드래그 — 좌우 스크롤과 안 겹치게 잠깐 끈다
    if (pointerId != null) button.setPointerCapture?.(pointerId);
    if (navigator.vibrate) navigator.vibrate(12); // 집었다는 촉각 피드백(지원 기기만, 실패해도 무시)
    // 자기 자신은 기준에서 빼야 targetIndex가 packOrder()에서 자기를 뺀 배열과
    // 같은 길이·순서로 맞아떨어진다(안 그러면 원래 자리 근처에서 잘못 튄다).
    siblingsInfo = [...tabs.querySelectorAll("button[data-pack]")].filter((el) => el !== button).map((el) => {
      const r = el.getBoundingClientRect();
      return { id: el.dataset.pack, center: r.left + r.width / 2 };
    });
  };
  const endDrag = () => {
    dragging = false;
    button.classList.remove("dragging");
    button.style.transform = "";
    button.style.touchAction = ""; // 기본값(manipulation)으로 복귀 — 평소엔 탭 목록이 좌우로 스크롤돼야 한다
  };
  button.addEventListener("pointerdown", (e) => {
    if (e.button != null && e.button !== 0) return; // 마우스 왼쪽 버튼(또는 터치)만
    startX = e.clientX; startY = e.clientY; pointerId = e.pointerId;
    clearTimer();
    timer = setTimeout(beginDrag, TAB_LONGPRESS_MS);
  });
  button.addEventListener("pointermove", (e) => {
    if (dragging) { e.preventDefault(); button.style.transform = `translateX(${e.clientX - startX}px)`; return; }
    if (timer && (Math.abs(e.clientX - startX) > TAB_MOVE_CANCEL_PX || Math.abs(e.clientY - startY) > TAB_MOVE_CANCEL_PX)) clearTimer(); // 스크롤 의도로 판단 — 길게 누르기 취소
  });
  const onRelease = (e) => {
    clearTimer();
    if (!dragging) return;
    endDrag();
    const dropX = e.clientX;
    let targetIndex = siblingsInfo.length; // 기본값: 맨 끝(모든 center보다 오른쪽에 놓음)
    for (let i = 0; i < siblingsInfo.length; i++) { if (dropX < siblingsInfo[i].center) { targetIndex = i; break; } }
    const order = packOrder().filter((id) => id !== packId);
    order.splice(targetIndex, 0, packId);
    savePackOrder(order);
    renderTabs(); renderGrid();
  };
  button.addEventListener("pointerup", onRelease);
  button.addEventListener("pointercancel", () => { clearTimer(); if (dragging) endDrag(); });
}
function openPicker() {
  // 스티커 팩이 없어도 이모지 탭이 있으므로 서랍은 항상 열 수 있다.
  $("text").blur();
  picker.hidden = false;
  $("sticker-btn").setAttribute("aria-expanded", "true");
  if (activeTab === "recent" && !recentStickers().length) activeTab = orderedPacks()[0]?.id ?? "emoji";
  renderTabs(); renderGrid(); scroll();
}
function closePicker() {
  picker.hidden = true;
  $("sticker-btn").setAttribute("aria-expanded", "false");
  clearSelection();
}
// 좌우 스와이프로 탭(최근/이모지/스티커 팩)을 넘긴다 — 탭 순서와 동일하게 순환.
function tabOrder() { return ["recent", "emoji", ...orderedPacks().map((p) => p.id)]; }
function gridGo(dir) {
  const order = tabOrder();
  const i = order.indexOf(activeTab);
  if (i === -1) return;
  activeTab = order[(i + dir + order.length) % order.length];
  renderTabs(); renderGrid();
}
let gridTouchX = null;
grid.addEventListener("touchstart", (e) => { gridTouchX = e.touches[0].clientX; }, { passive: true });
grid.addEventListener("touchend", (e) => {
  if (gridTouchX === null) return;
  const dx = e.changedTouches[0].clientX - gridTouchX; gridTouchX = null;
  if (Math.abs(dx) > 45) gridGo(dx < 0 ? 1 : -1); // 왼쪽으로 밀면 다음 팩, 오른쪽이면 이전 팩
});
$("sticker-btn").addEventListener("click", () => { if (picker.hidden) openPicker(); else closePicker(); });

// 키보드 높이를 재서 서랍(picker)을 딱 그 높이로 맞춘다 → 키보드↔서랍 전환이
// 같은 공간을 1:1로 바꿔 매끄럽다(카톡식). 측정값은 저장해 다음부터 즉시 적용.
const KB_KEY = "duri:kbHeight";
const setKb = (px) => document.documentElement.style.setProperty("--kb", px + "px");
const savedKb = Number(localStorage.getItem("duri:kbHeight") || 0);
if (savedKb > 120) setKb(savedKb);
let syncViewport = () => {}; // 입력창 포커스 핸들러 등 다른 곳에서도 부를 수 있게 모듈 스코프
if (window.visualViewport) {
  const vv = window.visualViewport;
  syncViewport = () => {
    // 앱 높이·위치를 '보이는 영역'에 맞춘다 → 입력창이 항상 키보드 위에 고정된다.
    document.documentElement.style.setProperty("--vvh", vv.height + "px");
    document.documentElement.style.setProperty("--vvt", vv.offsetTop + "px");
    // 레이아웃 뷰포트(innerHeight)는 그대로, 비주얼 뷰포트는 키보드만큼 줄어든다.
    const kb = Math.round(window.innerHeight - vv.height - vv.offsetTop);
    // 지금 이 순간의 실제 값(0=닫힘) — 캘린더 다이얼로그가 키보드를 피해 위치를 잡는 데 쓴다.
    document.documentElement.style.setProperty("--kb-live", Math.max(0, kb) + "px");
    if (kb > 120) { // 서랍 높이 기억용은 유의미하게 올라온 경우만 캡처(주소창 등 소소한 변동은 무시)
      setKb(kb);
      try { localStorage.setItem(KB_KEY, String(kb)); } catch { /* 최선노력 */ }
    }
    // 키보드로 화면(로그)이 줄면 맨 아래 메시지가 입력창에 가려질 수 있다 — 맨 아래를
    // 보고 있었으면 계속 붙여둬 마지막 메시지가 안 잘리게 한다(위로 읽는 중이면 건드리지 않음).
    if (atBottom()) scroll();
  };
  vv.addEventListener("resize", syncViewport);
  vv.addEventListener("scroll", syncViewport); // iOS: 키보드로 문서가 밀릴 때 위치 재동기화
  // 일부 안드로이드는 키보드 전환 시 visualViewport resize가 늦거나 누락돼 입력창이
  // 키보드에 가려진다 — window resize·입력창 포커스에도 한 번 더 동기화해 보정한다.
  window.addEventListener("resize", syncViewport);
  syncViewport(); // 초기값(키보드 없는 상태의 실제 높이)
}

// ── 셋업 & 이벤트 ────────────────────────────────────────────
$("enter").addEventListener("click", async () => {
  const pass = $("pass").value;
  const name = $("name").value.trim();
  if (!pass || !name) { $("setupWarn").textContent = "문구와 이름을 모두 입력하세요."; return; }
  $("pass").value = "";                      // 입력칸에 문구를 남겨 두지 않는다
  await enterWith(await deriveKey(pass), name);

// 입장 절차. 문구를 새로 입력했을 때와 이 기기에 저장된 키로 자동 입장할 때가
// 같은 경로를 타도록 키·이름만 받는다 — 문구 문자열은 여기까지 오지 않는다.
async function enterWith(key, name) {
  KEY = key;
  MY_NAME = name;
  applyStatusColors(); // 접속 표시 동그라미의 "내 색"이 이름 해시라 로그인 후 다시 계산
  // 이미 로컬에 복원된 일정 중 상대가 만든 게 있으면 그 이름을 바로 기억해 둔다
  // (메시지가 새로 오길 기다리지 않아도 색상 설정에 상대 칸이 뜨게).
  for (const ev of calEvents.values()) if (!ev.deleted && ev.owner) notePeerName(ev.owner);
  localStorage.setItem("duri:name", name);
  $("setup").classList.add("hidden");
  for (const el of ["bar", "log-wrap", "composer"]) $(el).classList.remove("hidden");
  // 팩 목록은 캐시로 즉시 채우고, 최신화는 네트워크로 백그라운드에서(await 안 함) —
  // 로컬에 이미 있는 채팅 히스토리 렌더가 이 fetch 하나 때문에 늦어지면 안 된다.
  hydratePacksFromCache();
  // 캐시로 먼저 그리므로, 새 팩이 추가된 뒤 첫 방문에서는 목록이 옛것이다.
  // 네트워크 목록이 도착하면 열려 있는 서랍을 다시 그려야 그 자리에서 보인다
  // (안 그리면 서랍을 닫았다 다시 열 때까지 새 팩이 안 뜬다).
  loadPacks().then(() => { if (!picker.hidden) { renderTabs(); renderGrid(); } });
  await ensureDB();
  // 키 객체(추출 불가)를 담는다 — 서비스워커(sw.js)가 푸시 도착 시 같은 키로
  // 그 자리에서 복호화하고, 페이지는 새로고침 뒤에도 문구 없이 이어 들어간다.
  putMeta("key", KEY);
  putMeta("name", name); // 내가 보낸 메시지는 내 기기에 푸시 알림을 띄우지 않게 비교용
  // 예전 버전이 남긴 평문 문구는 보이는 대로 지운다(마이그레이션).
  localStorage.removeItem("duri:pass");
  delMeta("pass");
  // 이 기기 캐시의 최근 분만 그린 뒤(새로고침에도 대화 유지, 화면은 가볍게),
  // 마지막 seq 이후만 이어받는다. 나머지 이력은 IndexedDB·PC 백업에 그대로 있다.
  for (const rec of (await allEntries()).sort((a, b) => a.seq - b.seq).slice(-MAX_DOM)) appendRecord(rec, { silent: true });
  scroll(); updateToBottom(); // 대량으로 그린 뒤 한 번만 바닥으로 스크롤
  connect();
}

// 설정(⚙️) 드롭다운: 기록 지우기·방 초기화를 담는다. 헤더를 한 줄로 유지한다.

document.addEventListener("click", (e) => {

  // 날짜 표식 이모지 팝업도 바깥을 누르면 닫는다(렌더될 때마다 새로 생기므로 매번 찾는다).

// 뒤로가기(안드로이드 하드웨어 백/제스처) 처리: 로그인 화면으로 나가지 않고,
// 서랍·메뉴가 열려 있으면 그것부터 닫고, 아니면 "한 번 더 누르면 종료" 안내 후
// 두 번째에 앱을 벗어난다(History API 트랩 — 표준 "두 번 눌러 종료" 패턴).
const toast = $("toast");
let toastTimer;
function showToast(msg, ms = 2000) {
  toast.textContent = msg; toast.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { toast.hidden = true; }, ms);
}
let backArmed = false, backTimer;
const trapBack = () => history.pushState(null, "", location.href);
trapBack(); // 초기 방어 상태
window.addEventListener("popstate", () => {
  if (!$("cal-dialog").hidden) { closeCalDialog(); trapBack(); return; }     // 이벤트 다이얼로그
  if (!$("cal-colorbox").hidden) { $("cal-colorbox").hidden = true; trapBack(); return; } // 색상 설정
  { const mp = $("cal-day").querySelector(".marker-popup");
    if (mp && !mp.hidden) { mp.hidden = true; trapBack(); return; } } // 표식 이모지 팝업 먼저 닫기
  if (!$("cal").classList.contains("cal-off")) { closeCal(); trapBack(); return; } // 캘린더 → 채팅
  if (!$("lightbox").hidden) { closeLb(); trapBack(); return; } // 사진 뷰어 먼저 닫기
  if (!$("cal-cmd-picker").hidden) { closeCalCmdPicker(); trapBack(); return; } // "/일정" 미니 달력 먼저 닫기
  if (!picker.hidden) { closePicker(); trapBack(); return; } // 서랍 먼저 닫기
  if (!menu.hidden) { closeMenu(); trapBack(); return; }     // 메뉴 먼저 닫기
  if (backArmed) { backArmed = false; history.back(); return; } // 두 번째 → 앱 종료
  trapBack();                                                // 앱에 머문다
  showToast("한 번 더 누르면 종료됩니다");
  backArmed = true;
  clearTimeout(backTimer); backTimer = setTimeout(() => { backArmed = false; }, 2000);
});

// 문구 다시 입력: 저장된 문구를 지우고 셋업 화면으로 돌아간다(이름은 유지·미리채움).
// 캐시·커서도 초기화해, 올바른 문구로 처음부터 다시 받아와 복호화되게 한다.

// 방 초기화: 서버 버퍼·사진을 양쪽에서 지우고 새로 시작. 되돌릴 수 없다.
// (이미 각자 PC에 백업된 아카이브는 서버가 손대지 못하므로 그대로 남는다.)

// 서비스워커 등록 — 앱 셸 캐싱(sw.js의 fetch 핸들러) + 푸시 알림 표시, 두 용도
// 모두에 쓰인다. 푸시 지원 여부와 무관하게 항상 등록해야 캐싱도 그 자체로
// 동작한다(예전엔 이 등록이 푸시 가능 여부 체크 뒤에 있어서, 서버에 VAPID
// 키가 없으면 캐싱까지 덩달아 켜지지 않는 문제가 있었다).
const swReady = (async () => {
  if (!("serviceWorker" in navigator) || !isSecureContext) return null;
  try {
    const registration = await navigator.serviceWorker.register("sw.js");
    await navigator.serviceWorker.ready;
    return registration;
  } catch { return null; }
})();

// ── 새 메시지 푸시 알림 (기본 꺼짐) ──────────────────────────────
// 서버는 여전히 평문을 모른다 — 페이로드는 암호블롭뿐이고, sw.js가 이 기기 안에서
// 복호화해서 알림을 그린다(위 IndexedDB "meta" 스토어의 키 객체로).
(function setupPush() {
  const btn = $("push-toggle");
  const supported = "PushManager" in window && "Notification" in window;
  if (!supported || !isSecureContext) return; // 미지원 브라우저·http 에선 노출하지 않음

  function vapidKeyBytes(base64url) {
    const padded = base64url.replace(/-/g, "+").replace(/_/g, "/").padEnd(Math.ceil(base64url.length / 4) * 4, "=");
    return Uint8Array.from(atob(padded), (c) => c.charCodeAt(0));
  }
  function setState(on) {
    btn.setAttribute("aria-checked", String(on));
    btn.textContent = on ? "🔔 푸시 알림: 켜짐" : "🔔 푸시 알림: 꺼짐";
  }

  let vapidPublicKey = null, registration = null, busy = false;
  const api = (method, body) => fetch("/_duri/push", {
    method, ...(body && { headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }),
  });
  // 내 endpoint 를 전역에 두고(connect 의 hello 가 읽음), 접속 중 바뀌면 서버에 알린다.
  function setMyEndpoint(endpoint) {
    window.__duriPushEndpoint = endpoint || null;
    if (typeof ws !== "undefined" && ws && ws.readyState === 1) {
      ws.send(JSON.stringify({ type: "presence-endpoint", endpoint: window.__duriPushEndpoint }));
    }
  }

  async function enable() {
    if ((await Notification.requestPermission()) !== "granted") {
      showToast("브라우저 설정에서 알림을 허용해야 받을 수 있어요.");
      return false;
    }
    const subscription = await registration.pushManager.subscribe({
      userVisibleOnly: true, applicationServerKey: vapidKeyBytes(vapidPublicKey),
    });
    const res = await api("POST", { subscription });
    if (!res.ok) { await subscription.unsubscribe().catch(() => {}); throw new Error("subscribe failed"); }
    setMyEndpoint(subscription.endpoint);
    return true;
  }
  async function disable() {
    const subscription = await registration.pushManager.getSubscription();
    if (subscription) {
      await api("DELETE", { endpoint: subscription.endpoint }).catch(() => {});
      await subscription.unsubscribe().catch(() => {});
    }
    setMyEndpoint(null);
    return false;
  }

  const PREF_KEY = "duri:pushPref"; // "on"|"off" — 미설정이면 기본 켜짐. 명시적 off 는 존중.

  btn.addEventListener("click", async () => {
    if (busy || !vapidPublicKey || !registration) return;
    busy = true;
    const turningOn = btn.getAttribute("aria-checked") !== "true";
    try {
      const on = turningOn ? await enable() : await disable();
      localStorage.setItem(PREF_KEY, on ? "on" : "off"); // 사용자의 명시적 선택 기억
      setState(on);
      showToast(on ? "🔔 푸시 알림을 켰어요" : "푸시 알림을 껐어요");
    } catch {
      showToast("알림 설정에 실패했어요. 잠시 후 다시 시도해주세요.");
    } finally {
      busy = false;
      closeMenu();
    }
  });

  // 자가진단: 내 기기로 테스트 알림을 쏴 어디서 막히는지 알려준다.
  const testBtn = $("push-test");
  testBtn?.addEventListener("click", async () => {
    if (busy || !registration) return;
    busy = true;
    try {
      const sub = await registration.pushManager.getSubscription();
      if (!sub) {

          const bar = evBar(ev, onDate);
          bar.style.gridColumn = `${startCol + 1} / ${endCol + 2}`;
          bar.style.gridRow = String(li + 1);
          bars.appendChild(bar);
        });
      });
      if (lanes.length > MAX_LANES) {
        const perDayHidden = new Array(7).fill(0);
        lanes.slice(MAX_LANES).forEach((lane) => lane.forEach(({ startCol, endCol }) => {
          for (let c = startCol; c <= endCol; c++) perDayHidden[c] += 1;
        }));
        perDayHidden.forEach((n, c) => {
          if (!n) return;
          const m = document.createElement("div"); m.className = "cal-bar-more"; m.textContent = `+${n}`;
          m.style.gridColumn = `${c + 1} / ${c + 2}`; m.style.gridRow = String(MAX_LANES + 1);
          bars.appendChild(m);
        });
      }
      weekRow.appendChild(bars);
    }

}
